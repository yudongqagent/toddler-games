<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>♞ Chess — Toddler Games</title>
<style>
  :root{
    --bg0:#0f1420; --bg1:#182233;
    --panel:#1e2a40; --panel2:#24334e;
    --ink:#eef3ff; --muted:#9fb0cc;
    --accent:#4fc3f7; --good:#69db7c; --bad:#ff8787; --gold:#ffd43b;
    --sq-light:#f0d9b5; --sq-dark:#b58863;
    --sq: 44px;
    color-scheme: dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    min-height:100dvh;
    background:radial-gradient(1200px 800px at 20% -10%, #24365c 0%, var(--bg0) 55%) fixed;
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{width:100%; max-width:1060px; padding:12px 14px 28px;}
  header.top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  header.top .logo{font-size:26px; font-weight:800; letter-spacing:.3px;}
  header.top .logo .sub{font-size:12px; font-weight:500; color:var(--muted); display:block; letter-spacing:.2px;}
  .spacer{flex:1;}
  select, button{
    font:inherit; color:var(--ink); background:var(--panel2);
    border:1px solid #33465f; border-radius:10px; padding:8px 10px; cursor:pointer;
  }
  select:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  button:hover{background:#2c3f5e;}
  button:disabled{opacity:.45; cursor:default;}
  button.primary{background:#1971c2; border-color:#1971c2; font-weight:700;}
  button.primary:hover{background:#1864ab;}
  button.ghost{background:transparent;}
  main{display:grid; grid-template-columns:auto 300px; gap:16px; justify-content:center; align-items:start;}
  @media (max-width:760px){ main{grid-template-columns:1fr;} }
  .board-col{display:flex; flex-direction:column; align-items:center; gap:10px; min-width:0;}
  .board-frame{display:flex; gap:10px; align-items:stretch;}
  #evalbar{
    width:26px; border-radius:8px; background:#2b3a55; position:relative; overflow:hidden;
    border:1px solid #33465f; min-height:200px;
  }
  #evalfill{
    position:absolute; bottom:0; left:0; right:0; height:50%;
    background:linear-gradient(to top,#f5f0e6,#cfc6b4);
    transition:height .5s ease;
  }
  #evalnum{
    position:absolute; left:0; right:0; bottom:4px; text-align:center;
    font-size:10px; font-weight:700; color:#333; mix-blend-mode:normal; pointer-events:none;
  }
  #boardWrap{position:relative; width:calc(var(--sq)*8); height:calc(var(--sq)*8); touch-action:none;}
  #board{
    display:grid; grid-template-columns:repeat(8, var(--sq)); grid-template-rows:repeat(8, var(--sq));
    border-radius:10px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.5);
    border:3px solid #6d4c33; user-select:none; -webkit-user-select:none;
  }
  .sq{position:relative; display:flex; align-items:center; justify-content:center;}
  .sq.light{background:var(--sq-light);} .sq.dark{background:var(--sq-dark);}
  .sq .coord{
    position:absolute; font-size:calc(var(--sq)*0.22); font-weight:700; opacity:.85; pointer-events:none;
  }
  .sq.light .coord{color:#a5714f;} .sq.dark .coord{color:#ecdcb9;}
  .coord.file{right:3px; bottom:2px;} .coord.rank{left:3px; top:2px;}
  .piece{
    font-size:calc(var(--sq)*0.74); line-height:1; cursor:grab; z-index:2;
    font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols",serif;
  }
  .piece.w{color:#fafafa; text-shadow:0 0 2px #000, 0 2px 3px rgba(0,0,0,.65), -1px 0 1px #222, 1px 0 1px #222, 0 -1px 1px #222;}
  .piece.b{color:#161616; text-shadow:0 1px 1px rgba(255,255,255,.35), 0 2px 3px rgba(0,0,0,.4);}
  .sq.sel{outline:3px solid var(--gold); outline-offset:-3px;}
  .sq.last::after{content:""; position:absolute; inset:0; background:rgba(105,219,124,.42); pointer-events:none;}
  .sq.check::after{content:""; position:absolute; inset:0; background:radial-gradient(circle, rgba(255,80,80,.75) 30%, rgba(255,80,80,0) 70%); pointer-events:none;}
  .sq .dot{
    position:absolute; width:calc(var(--sq)*0.28); height:calc(var(--sq)*0.28);
    border-radius:50%; background:rgba(20,40,20,.35); pointer-events:none; z-index:1;
  }
  .sq .ring{
    position:absolute; inset:6%; border-radius:50%;
    border:calc(var(--sq)*0.07) solid rgba(20,40,20,.4); pointer-events:none; z-index:1;
  }
  .sq.hintfrom{outline:3px solid var(--accent); outline-offset:-3px;}
  #arrowLayer{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:3;}
  #ghost{
    position:fixed; z-index:50; pointer-events:none; display:none;
    font-size:calc(var(--sq)*0.74); line-height:1;
    font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols",serif;
    transform:translate(-50%,-60%);
  }
  #status{
    font-size:15px; font-weight:600; min-height:22px; text-align:center; padding:0 8px;
  }
  #coach{
    width:100%; max-width:calc(var(--sq)*8);
    background:var(--panel); border:1px solid #33465f; border-radius:12px;
    padding:10px 12px; font-size:14px; line-height:1.45; color:var(--ink);
  }
  #coach .coach-tag{color:var(--accent); font-weight:700; margin-right:6px;}
  #coach:empty{display:none;}
  aside.panel{
    background:var(--panel); border:1px solid #33465f; border-radius:14px;
    padding:12px; display:flex; flex-direction:column; gap:10px; min-width:0;
  }
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .row label{font-size:12px; color:var(--muted);}
  .tray{display:flex; flex-wrap:wrap; gap:2px; min-height:26px; align-items:center; font-size:20px;}
  .tray .pw{color:#fafafa; text-shadow:0 0 2px #000;} .tray .pb{color:#111; text-shadow:0 1px 1px rgba(255,255,255,.3);}
  .tray .mdiff{font-size:12px; color:var(--muted); margin-left:6px;}
  #moves{
    height:190px; overflow-y:auto; background:var(--bg1); border-radius:10px;
    padding:8px 10px; font-size:13.5px; line-height:1.7; margin:0; list-style:none;
    font-variant-numeric:tabular-nums;
  }
  #moves li{display:flex; gap:6px;}
  #moves .n{color:var(--muted); min-width:34px; text-align:right;}
  #moves .m{flex:1; border-radius:6px; padding:0 6px;}
  #moves .m.cur{background:#2c3f5e; font-weight:700;}
  .think{display:inline-block; width:12px; height:12px; border:2px solid var(--muted); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:-1px; margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .think{animation:none;} #evalfill{transition:none;} }
  .modal{
    position:fixed; inset:0; background:rgba(5,10,20,.7); display:none;
    align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal.open{display:flex;}
  .modal .card{
    background:var(--panel2); border:1px solid #3d5478; border-radius:16px;
    padding:22px; max-width:420px; width:100%; text-align:center;
  }
  .modal .card h2{margin:0 0 8px; font-size:22px;}
  .modal .card p{color:var(--muted); font-size:14px; margin:0 0 14px;}
  .promo-pick{display:flex; gap:10px; justify-content:center;}
  .promo-pick button{font-size:44px; padding:6px 14px; line-height:1;}
  footer{margin-top:18px; text-align:center; color:var(--muted); font-size:12px;}
  footer a{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">♞ Chess<span class="sub">Toddler Games arcade · learn as you play</span></div>
    <div class="spacer"></div>
    <label class="row" style="gap:6px;"><span style="font-size:12px;color:var(--muted)">Level</span>
      <select id="diffSel" aria-label="AI difficulty">
        <option value="0">🌱 Learning</option>
        <option value="1" selected>🙂 Friendly</option>
        <option value="2">🧠 Sharp</option>
        <option value="3">♞ Grandmaster</option>
      </select>
    </label>
    <label class="row" style="gap:6px;"><span style="font-size:12px;color:var(--muted)">You play</span>
      <select id="sideSel" aria-label="Your color">
        <option value="1" selected>White</option>
        <option value="-1">Black</option>
        <option value="0">Random</option>
      </select>
    </label>
    <button id="soundBtn" class="ghost" aria-label="Toggle sound">🔊</button>
    <button id="flipBtn" class="ghost" aria-label="Flip board">🔄</button>
    <button id="newBtn" class="primary">New game</button>
  </header>

  <main>
    <div class="board-col">
      <div class="board-frame">
        <div id="evalbar" title="Who's ahead"><div id="evalfill"></div><div id="evalnum"></div></div>
        <div id="boardWrap">
          <div id="board" role="grid" aria-label="Chess board"></div>
          <svg id="arrowLayer" viewBox="0 0 8 8" preserveAspectRatio="none"></svg>
        </div>
      </div>
      <div id="status" aria-live="polite"></div>
      <div id="coach" aria-live="polite"></div>
    </div>
    <aside class="panel">
      <div class="row">
        <button id="hintBtn">💡 Hint</button>
        <button id="undoBtn">↩ Undo</button>
        <button id="resignBtn" class="ghost">🏳 Resign</button>
      </div>
      <div>
        <div class="row" style="margin-bottom:4px;"><label>Captured by you</label></div>
        <div class="tray" id="capByYou"></div>
        <div class="row" style="margin:6px 0 4px;"><label>Captured by AI</label></div>
        <div class="tray" id="capByAI"></div>
      </div>
      <div>
        <div class="row" style="margin-bottom:4px;"><label>Moves</label></div>
        <ol id="moves"></ol>
      </div>
      <div style="font-size:12px;color:var(--muted);line-height:1.5;">
        💡 <b>Hint</b> shows the best move and explains <i>why</i>.<br>
        The coach also warns you when a piece is hanging.
      </div>
    </aside>
  </main>

  <footer><a href="../../">← Toddler Games</a> · progress saves on this device</footer>
</div>

<div class="modal" id="promoModal">
  <div class="card">
    <h2>Promote to…</h2>
    <p>Your pawn reached the last rank. Pick a piece.</p>
    <div class="promo-pick" id="promoPick"></div>
  </div>
</div>

<div class="modal" id="overModal">
  <div class="card">
    <h2 id="overTitle">Game over</h2>
    <p id="overText"></p>
    <div class="row" style="justify-content:center;">
      <button id="againBtn" class="primary">Play again</button>
    </div>
  </div>
</div>

<div id="ghost" aria-hidden="true"></div>

<script>
/* ============================================================================
   CHESS ENGINE — dependency-free, offline. 0x88 board, alpha-beta + quiescence
   + transposition table + null-move pruning + LMR + tapered eval.
   No DOM access in this section (testable under node).
   ========================================================================== */
'use strict';

const WHITE = 1, BLACK = -1;
const EMPTY = 0, PAWN = 1, KNIGHT = 2, BISHOP = 3, ROOK = 4, QUEEN = 5, KING = 6;
const VAL = [0, 100, 320, 330, 500, 900, 20000];
const PIECE_LETTER = ['', '', 'N', 'B', 'R', 'Q', 'K'];
const PIECE_NAME = ['', 'pawn', 'knight', 'bishop', 'rook', 'queen', 'king'];
const GLYPH = ['', '♟', '♞', '♝', '♜', '♛', '♚'];

// move flags
const F_DBL = 1, F_EP = 2, F_CK = 4, F_CQ = 8;
// move int: from(7) | to(14) | piece(18) | captured(22) | promo(25) | flags(28)
const mvFrom = m => m & 127;
const mvTo = m => (m >> 7) & 127;
const mvPiece = m => ((m >> 14) & 15) - 8;          // signed piece
const mvCap = m => { const c = (m >> 18) & 15; return c ? c - 8 : 0; }; // 0 = no capture
const mvPromo = m => (m >> 22) & 7;
const mvFlags = m => (m >> 26) & 15;
const isCap = m => ((m >> 18) & 15) !== 0;
const encP = p => (p + 8) & 15;

const KNIGHT_OFF = [-18, -33, -31, -14, 14, 31, 33, 18];
const KING_OFF = [-17, -16, -15, -1, 1, 15, 16, 17];
const BISHOP_OFF = [-17, -15, 15, 17];
const ROOK_OFF = [-16, -1, 1, 16];

function sqName(s) { return 'abcdefgh'[s & 7] + (1 + (s >> 4)); }
function sqFromName(n) { return 'abcdefgh'.indexOf(n[0]) + (parseInt(n[1], 10) - 1) * 16; }
function uciOfMove(m) {
  let s = sqName(mvFrom(m)) + sqName(mvTo(m));
  const p = mvPromo(m);
  if (p) s += ({ 5: 'q', 4: 'r', 3: 'b', 2: 'n' })[p];
  return s;
}

// ---- zobrist (32-bit mix is plenty for a game engine) ----
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return (t ^ t >>> 14) >>> 0;
  };
}
const _rng = mulberry32(0x9E3779B9);
const ZP = []; // ZP[piece+6][sq]
for (let i = 0; i < 13; i++) { ZP.push(new Uint32Array(128)); for (let s = 0; s < 128; s++) ZP[i][s] = _rng(); }
const ZC = new Uint32Array(16); for (let i = 0; i < 16; i++) ZC[i] = _rng();
const ZE = new Uint32Array(8); for (let i = 0; i < 8; i++) ZE[i] = _rng();
const ZS = _rng();

function newPosition() {
  const b = new Int8Array(128);
  const back = [ROOK, KNIGHT, BISHOP, QUEEN, KING, BISHOP, KNIGHT, ROOK];
  for (let f = 0; f < 8; f++) {
    b[16 + f] = PAWN; b[96 + f] = -PAWN;
    b[f] = back[f]; b[112 + f] = -back[f];
  }
  const st = { b, turn: WHITE, castle: 15, ep: -1, half: 0, full: 1, key: 0 };
  st.key = computeKey(st);
  return st;
}
function computeKey(st) {
  let k = 0;
  for (let s = 0; s < 128; s++) {
    if (s & 0x88) continue;
    const p = st.b[s];
    if (p) k ^= ZP[p + 6][s];
  }
  k ^= ZC[st.castle];
  if (st.ep >= 0) k ^= ZE[st.ep & 7];
  if (st.turn === BLACK) k ^= ZS;
  return k >>> 0;
}

function kingSq(b, color) {
  const k = color * KING;
  for (let s = 0; s < 128; s++) { if (!(s & 0x88) && b[s] === k) return s; }
  return -1;
}
function isAttacked(b, sq, by) {
  // pawns
  if (by === WHITE) {
    if (!((sq - 15) & 0x88) && b[sq - 15] === PAWN) return true;
    if (!((sq - 17) & 0x88) && b[sq - 17] === PAWN) return true;
  } else {
    if (!((sq + 15) & 0x88) && b[sq + 15] === -PAWN) return true;
    if (!((sq + 17) & 0x88) && b[sq + 17] === -PAWN) return true;
  }
  for (const o of KNIGHT_OFF) { const t = sq + o; if (!(t & 0x88) && b[t] === by * KNIGHT) return true; }
  for (const o of KING_OFF) { const t = sq + o; if (!(t & 0x88) && b[t] === by * KING) return true; }
  for (const o of BISHOP_OFF) {
    let t = sq + o;
    while (!(t & 0x88)) { const p = b[t]; if (p) { if (p === by * BISHOP || p === by * QUEEN) return true; break; } t += o; }
  }
  for (const o of ROOK_OFF) {
    let t = sq + o;
    while (!(t & 0x88)) { const p = b[t]; if (p) { if (p === by * ROOK || p === by * QUEEN) return true; break; } t += o; }
  }
  return false;
}
function inCheck(st, color) {
  return isAttacked(st.b, kingSq(st.b, color), -color);
}

function pushPawnMove(out, st, from, to, flags, promoRank) {
  const piece = st.turn * PAWN;
  const capBits = st.b[to] ? encP(st.b[to]) : 0;
  if (promoRank) {
    for (const pr of [QUEEN, ROOK, BISHOP, KNIGHT])
      out.push(from | (to << 7) | (encP(piece) << 14) | (capBits << 18) | (pr << 22));
  } else {
    out.push(from | (to << 7) | (encP(piece) << 14) | (capBits << 18) | (flags << 26));
  }
}

// pseudo-legal moves; capsOnly for quiescence
function genMoves(st, capsOnly) {
  const b = st.b, turn = st.turn, out = [];
  const dir = turn === WHITE ? 16 : -16;
  const startRank = turn === WHITE ? 1 : 6;
  const promoRank = turn === WHITE ? 6 : 1;
  for (let s = 0; s < 128; s++) {
    if (s & 0x88) continue;
    const p = b[s];
    if (!p || Math.sign(p) !== turn) continue;
    const pt = Math.abs(p);
    if (pt === PAWN) {
      const r = s >> 4;
      const one = s + dir;
      if (!((one) & 0x88) && !b[one] && !capsOnly) {
        pushPawnMove(out, st, s, one, 0, r === promoRank);
        const two = s + dir * 2;
        if (r === startRank && !b[two]) pushPawnMove(out, st, s, two, F_DBL, false);
      }
      for (const o of [dir - 1, dir + 1]) {
        const t = s + o;
        if (t & 0x88) continue;
        if (b[t] && Math.sign(b[t]) !== turn) {
          pushPawnMove(out, st, s, t, 0, r === promoRank);
        } else if (t === st.ep) {
          out.push(s | (t << 7) | (encP(p) << 14) | (encP(-turn * PAWN) << 18) | (F_EP << 26));
        }
      }
    } else if (pt === KNIGHT || pt === KING) {
      const offs = pt === KNIGHT ? KNIGHT_OFF : KING_OFF;
      for (const o of offs) {
        const t = s + o;
        if (t & 0x88) continue;
        const q = b[t];
        if (!q) { if (!capsOnly) out.push(s | (t << 7) | (encP(p) << 14)); }
        else if (Math.sign(q) !== turn) out.push(s | (t << 7) | (encP(p) << 14) | (encP(q) << 18));
      }
    } else {
      const offs = pt === BISHOP ? BISHOP_OFF : pt === ROOK ? ROOK_OFF : KING_OFF;
      for (const o of offs) {
        let t = s + o;
        while (!(t & 0x88)) {
          const q = b[t];
          if (!q) { if (!capsOnly) out.push(s | (t << 7) | (encP(p) << 14)); }
          else { if (Math.sign(q) !== turn) out.push(s | (t << 7) | (encP(p) << 14) | (encP(q) << 18)); break; }
          t += o;
        }
      }
    }
  }
  // castling
  if (!capsOnly && !inCheck(st, turn)) {
    if (turn === WHITE) {
      if ((st.castle & 1) && !b[5] && !b[6] && !isAttacked(b, 5, BLACK) && !isAttacked(b, 6, BLACK))
        out.push(4 | (6 << 7) | (encP(KING) << 14) | (F_CK << 26));
      if ((st.castle & 2) && !b[3] && !b[2] && !b[1] && !isAttacked(b, 3, BLACK) && !isAttacked(b, 2, BLACK))
        out.push(4 | (2 << 7) | (encP(KING) << 14) | (F_CQ << 26));
    } else {
      if ((st.castle & 4) && !b[117] && !b[118] && !isAttacked(b, 117, WHITE) && !isAttacked(b, 118, WHITE))
        out.push(116 | (118 << 7) | (encP(-KING) << 14) | (F_CK << 26));
      if ((st.castle & 8) && !b[115] && !b[114] && !b[113] && !isAttacked(b, 115, WHITE) && !isAttacked(b, 114, WHITE))
        out.push(116 | (114 << 7) | (encP(-KING) << 14) | (F_CQ << 26));
    }
  }
  return out;
}

// castle-rights masks: which rights survive when a square is vacated/occupied
const CASTLE_MASK = new Uint8Array(128).fill(15);
(function () {
  const zap = (sq, bits) => { CASTLE_MASK[sq] &= ~bits; };
  zap(4, 3); zap(7, 1); zap(0, 2);       // white K, KR, QR
  zap(116, 12); zap(119, 4); zap(112, 8); // black K, KR, QR
})();

function make(st, m) {
  const from = mvFrom(m), to = mvTo(m), piece = mvPiece(m), cap = mvCap(m);
  const promo = mvPromo(m), flags = mvFlags(m), turn = st.turn;
  const b = st.b;
  const undo = { cap, castle: st.castle, ep: st.ep, half: st.half, key: st.key, capSq: to };
  // zobrist: remove piece from 'from'
  st.key ^= ZP[piece + 6][from];
  st.key ^= ZC[st.castle];
  if (st.ep >= 0) st.key ^= ZE[st.ep & 7];
  b[from] = EMPTY;
  let captured = cap;
  if (flags & F_EP) {
    const csq = to + (turn === WHITE ? -16 : 16);
    undo.capSq = csq;
    captured = b[csq]; b[csq] = EMPTY;
    st.key ^= ZP[captured + 6][csq];
  } else if (captured) {
    st.key ^= ZP[captured + 6][to];
  }
  const placed = promo ? turn * promo : piece;
  b[to] = placed;
  st.key ^= ZP[placed + 6][to];
  // castling rook
  if (flags & F_CK) {
    if (turn === WHITE) { b[7] = EMPTY; b[5] = turn * ROOK; st.key ^= ZP[turn * ROOK + 6][7] ^ ZP[turn * ROOK + 6][5]; }
    else { b[119] = EMPTY; b[117] = turn * ROOK; st.key ^= ZP[turn * ROOK + 6][119] ^ ZP[turn * ROOK + 6][117]; }
  } else if (flags & F_CQ) {

    game.selected = sq;
    game.legalFor = C.legalMoves(game.st, false).filter(m => C.mvFrom(m) === sq);
    sfx.select();
    render();
  }
  const wrap = $('boardWrap');
  wrap.addEventListener('pointerdown', e => {
    if (!canHumanMove()) return;
    const sq = sqFromEvent(e);
    if (sq < 0) return;
    const p = game.st.b[sq];
    downPos = { x: e.clientX, y: e.clientY };
    if (p && Math.sign(p) === game.human) {
      select(sq);
      dragSq = sq; dragging = false;
      e.preventDefault();
    }
  });
  window.addEventListener('pointermove', e => {
    if (dragSq < 0 || !downPos) return;
    if (!dragging && Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 8) {
      dragging = true;
      const p = game.st.b[dragSq];
      ghostEl.innerHTML = '<span class="' + (p > 0 ? 'piece w' : 'piece b') + '">' + C.GLYPH[Math.abs(p)] + '</span>';
      ghostEl.style.display = 'block';
    }
    if (dragging) { ghostEl.style.left = e.clientX + 'px'; ghostEl.style.top = e.clientY + 'px'; }
  });
  window.addEventListener('pointerup', e => {
    if (dragSq < 0) return;
    const wasDrag = dragging;
    ghostEl.style.display = 'none';
    dragging = false; downPos = null;
    const from = dragSq; dragSq = -1;
    if (!canHumanMove()) { game.selected = -1; game.legalFor = []; render(); return; }
    const to = sqFromEvent(e);
    if (wasDrag && to >= 0 && to !== from) {
      if (!humanMove(from, to)) { game.selected = -1; game.legalFor = []; render(); }
    } else if (!wasDrag && to === from) {
      // plain click on own piece: keep selection (already selected)
    } else if (!wasDrag && to >= 0 && game.selected >= 0 && to !== game.selected) {
      if (!humanMove(game.selected, to)) {
        const p = game.st.b[to];
        if (p && Math.sign(p) === game.human) select(to);
        else { game.selected = -1; game.legalFor = []; render(); }
      }
    }
  });

  /* ---------- controls ---------- */
  function newGame() {
    const side = $('sideSel').value;
    game.human = side === '0' ? (Math.random() < 0.5 ? C.WHITE : C.BLACK) : +side;
    game.diff = +$('diffSel').value;
    game.st = C.newPosition();
    // deep link: #fen=<fen>
    if (location.hash.startsWith('#fen=')) {
      try { game.st = C.parseFEN(decodeURIComponent(location.hash.slice(5))); } catch (e) { /* ignore */ }
    }
    game.uci = []; game.sans = []; game.keys = [game.st.key];
    game.selected = -1; game.legalFor = []; game.over = null; game.thinking = false;
    clearArrow();
    $('overModal').classList.remove('open');
    coachSay('Welcome! <b>💡 Hint</b> explains the best move — a great way to learn. ' +
      (game.human === C.WHITE ? 'You are <b>White</b>; you move first.' : 'You are <b>Black</b>; the AI opens.'));
    save();
    render();
    updateStatus();
    if (game.st.turn !== game.human) { game.thinking = true; updateStatus(); setTimeout(aiMove, 400); }
  }
  $('newBtn').onclick = newGame;
  $('againBtn').onclick = () => { $('overModal').classList.remove('open'); newGame(); };
  $('hintBtn').onclick = hint;
  $('undoBtn').onclick = () => {
    if (game.thinking || game.over) return;
    let n = game.uci.length && game.st.turn !== game.human ? 1 : 2;
    // pop until it's the human's turn again (or start)
    while (n-- > 0 && game.uci.length) {
      const u = game.uci.pop();
      C.unmake(game.st, u.move);
      game.sans.pop(); game.keys.pop();
    }
    // if AI already replied, take back its reply too so human moves again
    while (game.uci.length && game.st.turn !== game.human) {
      const u = game.uci.pop();
      C.unmake(game.st, u.move);
      game.sans.pop(); game.keys.pop();
    }
    clearArrow();
    $('overModal').classList.remove('open');
    game.over = null;
    save(); render(); updateStatus();
    coachSay('Move taken back. Try a different idea!');
    if (game.st.turn !== game.human) { game.thinking = true; updateStatus(); setTimeout(aiMove, 400); }
  };
  $('resignBtn').onclick = () => {
    if (game.over || game.thinking) return;
    endGame('l', 'You resigned. The AI takes this one — rematch?');
  };
  $('flipBtn').onclick = () => { game.flip = !game.flip; buildBoard(); render(); save(); };
  $('soundBtn').onclick = () => {
    try { localStorage.setItem(LS_SOUND, soundOn() ? '0' : '1'); } catch (e) { /* ignore */ }
    refreshSoundBtn(); sfx.select();
  };
  $('diffSel').onchange = () => { game.diff = +$('diffSel').value; save(); updateStatus(); };

  /* ---------- boot ---------- */
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(LS_SAVE) || 'null');
      if (s && s.uci) {
        $('diffSel').value = String(s.diff != null ? s.diff : 1);
        if (s.side) $('sideSel').value = s.side;
        game.diff = +$('diffSel').value;
        game.human = s.human || C.WHITE;
        game.flip = !!s.flip;
        game.st = C.newPosition();
        game.uci = []; game.sans = []; game.keys = [game.st.key];
        let ok = true;
        for (const u of s.uci) {
          const m = C.legalMoves(game.st, false).find(x => C.uciOfMove(x) === u);
          if (!m) { ok = false; break; }
          game.sans.push(C.toSAN(game.st, m));
          C.make(game.st, m);
          game.uci.push({ uci: u, move: m });
          game.keys.push(game.st.key);
        }
        if (ok && !checkEndSilent()) {
          render(); updateStatus();
          coachSay('Welcome back — your saved game is restored. <b>💡 Hint</b> is there whenever you want a lesson.');
          if (game.st.turn !== game.human) { game.thinking = true; updateStatus(); setTimeout(aiMove, 500); }
          refreshSoundBtn();
          return;
        }
      }
    } catch (e) { /* fall through to new game */ }
    newGame();
  }
  function checkEndSilent() {
    const t = game.st.turn;
    const moves = C.legalMoves(game.st, false);
    if (moves.length === 0 || C.insufficientMaterial(game.st) || game.st.half >= 100) return true;
    let reps = 0;
    for (const k of game.keys) if (k === game.st.key) reps++;
    return reps >= 3;
  }
  refreshSoundBtn();
  buildBoard();
  load();
})();
</script>
</body>
</html>
