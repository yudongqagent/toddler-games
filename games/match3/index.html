<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ff6f91">
<title>Fruit Pop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍓</text></svg>">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden;
    touch-action:manipulation;
    user-select:none; -webkit-user-select:none;
    font-family:-apple-system-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", "Comic Sans MS", sans-serif;
  }
  body {
    background:linear-gradient(160deg,#ffb37a 0%,#ff8fa8 45%,#c98bff 100%);
    display:flex; flex-direction:column; align-items:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .bub {
    position:fixed; border-radius:50%; z-index:0; pointer-events:none;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.5), rgba(255,255,255,.08) 70%);
    animation:drift ease-in-out infinite alternate;
  }
  @keyframes drift { from{transform:translate(0,0) scale(1)} to{transform:translate(4vw,-6vh) scale(1.12)} }

  .screen {
    position:absolute; inset:0; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:min(2.4vh,16px);
    padding:max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
    transition:opacity .25s, transform .25s;
  }
  .screen.hidden { opacity:0; pointer-events:none; transform:scale(.96); }

  /* ---------------- MENU ---------------- */
  #menu { overflow-y:auto; justify-content:flex-start; }
  #menu > * { flex-shrink:0; }
  #menu > :first-child { margin-top:auto; }
  #menu > :last-child { margin-bottom:auto; }
  #menu h1 {
    font-size:clamp(30px,8vw,56px); color:#fff; text-align:center;
    text-shadow:0 3px 0 rgba(170,60,90,.35);
    animation:bob 2.5s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  #menu .subtitle { font-size:clamp(15px,4vw,22px); color:#ffffffdd; font-weight:700; margin-top:-6px; }

  .levels {
    display:grid; grid-template-columns:repeat(2, minmax(140px,220px));
    gap:min(3vw,16px); width:min(92vw,500px);
  }
  @media (max-width:360px){ .levels{grid-template-columns:1fr;} }
  .level-btn {
    border:none; cursor:pointer; border-radius:26px;
    padding:min(2.4vh,18px) 10px;
    font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    box-shadow:0 6px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.55);
    transition:transform .1s, box-shadow .1s;
  }
  .level-btn:active { transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.55); }
  .level-btn .emoji { font-size:clamp(30px,7.5vw,46px); filter:drop-shadow(0 3px 3px rgba(0,0,0,.15)); }
  .level-btn .name { font-size:clamp(17px,4.4vw,23px); font-weight:800; color:#4a2800; }
  .level-btn .desc { font-size:clamp(11px,2.9vw,14px); font-weight:700; color:#4a280099; }
  .level-btn .stars { font-size:clamp(12px,3vw,16px); min-height:1.3em; letter-spacing:1px; }
  .l1{background:linear-gradient(#ffd9a8,#ffb35c);} .l2{background:linear-gradient(#fff0a0,#ffd93d);}
  .l3{background:linear-gradient(#b8f0b0,#72dd68);} .l4{background:linear-gradient(#c9c2ff,#9d8bff);}
  .l5{background:linear-gradient(#a8ead8,#45c5a4);} .l6{background:linear-gradient(#ffc6da,#ff8bb0);}
  .free-btn {
    grid-column:1 / -1;
    background:linear-gradient(100deg,#ff7a8a,#ffb347 35%,#7ddf8a 70%,#6bb8ff);
  }
  .free-btn .name { color:#fff; text-shadow:0 2px 0 rgba(120,40,70,.45); }
  .free-btn .desc { color:#fff2; color:#ffffffdd; }

  .menu-links { display:flex; gap:10px; }
  .chip-link {
    border:none; cursor:pointer; font-family:inherit; font-weight:800;
    font-size:clamp(13px,3.4vw,16px);
    padding:9px 18px; border-radius:999px;
    background:rgba(255,255,255,.35); color:#fff;
    display:flex; align-items:center; gap:6px;
  }
  .chip-link:active { transform:scale(.95); }

  /* ---------------- GAME ---------------- */
  #game { justify-content:center; gap:min(2.6vh,18px); }
  #game .side { display:flex; flex-direction:column; align-items:center; gap:min(1.8vh,12px); width:min(94vw,560px); }
  .topbar {
    width:min(94vw,560px);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .icon-btn {
    border:none; cursor:pointer; flex:none;
    width:clamp(40px,10vw,50px); height:clamp(40px,10vw,50px);
    border-radius:50%; background:rgba(255,255,255,.4); color:#fff;
    font-size:clamp(19px,5vw,24px); display:grid; place-items:center;
    box-shadow:0 3px 0 rgba(0,0,0,.14);
  }
  .icon-btn:active { transform:translateY(3px); box-shadow:none; }
  .title-wrap { text-align:center; flex:1; min-width:0; }
  .title-wrap .lv { font-size:clamp(17px,4.6vw,24px); font-weight:800; color:#fff; text-shadow:0 2px 0 rgba(170,60,90,.3); }
  .title-wrap .sc { font-size:clamp(12px,3.2vw,15px); font-weight:800; color:#ffffffcc; }

  .moves {
    flex:none; min-width:clamp(56px,15vw,74px);
    background:rgba(255,255,255,.92); border-radius:18px;
    padding:5px 10px; text-align:center;
    box-shadow:0 3px 0 rgba(0,0,0,.14);
  }
  .moves .n { font-size:clamp(20px,5.4vw,27px); font-weight:800; color:#c2410c; line-height:1; }
  .moves .l { font-size:clamp(9px,2.4vw,11px); font-weight:800; color:#c2410c99; letter-spacing:.5px; }
  .moves.low { animation:lowpulse 1.1s ease-in-out infinite; }
  @keyframes lowpulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
  .moves.bump { animation:mbump .3s ease; }
  @keyframes mbump { 50%{transform:scale(1.22)} }

  /* goal chips */
  .goals { display:flex; gap:min(2.4vw,12px); flex-wrap:wrap; justify-content:center; }
  .goal {
    display:flex; align-items:center; gap:7px;
    background:rgba(255,255,255,.9); border-radius:999px;
    padding:5px 13px 5px 6px;
    box-shadow:0 3px 0 rgba(0,0,0,.13);
    transition:transform .18s, background .25s;
  }
  .goal .mini { position:relative; width:clamp(26px,7vw,34px); height:clamp(26px,7vw,34px); flex:none; }
  .goal .mini .shape { position:absolute; inset:0; }
  .goal .mini .face { position:absolute; inset:0; display:grid; place-items:center; font-size:clamp(15px,4vw,20px); }
  .goal .num { font-size:clamp(14px,3.8vw,19px); font-weight:800; color:#4a2800; white-space:nowrap; }
  .goal.pulse { animation:gpulse .35s ease; }
  @keyframes gpulse { 40%{transform:scale(1.18) rotate(-3deg)} }
  .goal.done { background:linear-gradient(#fff0a8,#ffd94d); }
  .goal.done .num { color:#7a5200; }

  /* board */
  #board-wrap { position:relative; }
  #board-wrap.shake { animation:bshake .34s cubic-bezier(.36,.07,.19,.97); }
  @keyframes bshake {
    10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-6px)} 40%,60%{transform:translateX(6px)}
  }
  #board {
    position:relative;
    width:calc(var(--cols) * var(--cell));
    height:calc(var(--rows) * var(--cell));
    background:rgba(255,255,255,.22);
    border-radius:clamp(16px,4vw,26px);
    box-shadow:inset 0 2px 10px rgba(120,40,80,.18), 0 8px 22px rgba(120,40,80,.2);
    padding:0;
    overflow:hidden;
  }
  /* faint checkerboard so the grid reads even between tiles */
  #board::before {
    content:''; position:absolute; inset:0; opacity:.13; pointer-events:none;
    background-image:
      linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%),
      linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%);
    background-size:calc(var(--cell)*2) calc(var(--cell)*2);
    background-position:0 0, var(--cell) var(--cell);
  }

  .tile {
    position:absolute; left:0; top:0;
    width:var(--cell); height:var(--cell);
    padding:calc(var(--cell) * .06);
    transform:translate3d(calc(var(--tc) * var(--cell)), calc(var(--tr) * var(--cell)), 0);
    transition:transform .18s cubic-bezier(.3,.9,.4,1);
    cursor:pointer; z-index:2;
  }
  .tile .inner {
    position:relative; width:100%; height:100%;
    transition:transform .15s ease;
  }
  /* One glossy sweet for every fruit. There used to be a different geometric
     backdrop per kind as a colour-blind fallback, but the fruit emoji is
     already a distinct silhouette — the polygons were a redundant third
     channel that made the board look busy. Gloss and depth instead. */
  .tile .shape {
    position:absolute; inset:0;
    border-radius:30%;
    box-shadow:
      inset 0 calc(var(--cell)*.07) 0 rgba(255,255,255,.28),
      inset 0 calc(var(--cell)*-.09) 0 rgba(0,0,0,.22),
      inset 0 0 0 calc(var(--cell)*.022) rgba(255,255,255,.38),
      0 calc(var(--cell)*.045) calc(var(--cell)*.08) rgba(90,40,80,.26);
  }
  /* the specular blob that sells it as something shiny you'd want to eat */
  .tile .shape::after {
    content:''; position:absolute; left:13%; top:7%; width:46%; height:31%;
    border-radius:50%;
    background:linear-gradient(165deg, rgba(255,255,255,.82), rgba(255,255,255,0) 72%);
    pointer-events:none;
  }
  .tile .face {
    position:absolute; inset:0; display:grid; place-items:center;
    font-size:calc(var(--cell) * .56);
    filter:drop-shadow(0 calc(var(--cell)*.022) calc(var(--cell)*.028) rgba(60,20,50,.38));
    pointer-events:none;
  }
  .tile .crown {
    position:absolute; inset:0; display:none; place-items:center;
    pointer-events:none;
  }

  .tile.sel .inner { transform:scale(1.12); animation:wiggle .5s ease-in-out infinite; }
  @keyframes wiggle { 0%,100%{rotate:-4deg} 50%{rotate:4deg} }
  .tile.sel .shape { box-shadow:0 0 0 calc(var(--cell)*.055) #fff, 0 0 calc(var(--cell)*.2) rgba(255,255,255,.9); }
  .tile.nudge .inner { animation:nudge 1s ease-in-out infinite; }
  @keyframes nudge { 0%,100%{transform:scale(1)} 40%{transform:scale(1.16)} }
  .tile.nope .inner { animation:nope .34s ease; }
  @keyframes nope { 25%{transform:translateX(-9%) rotate(-7deg)} 75%{transform:translateX(9%) rotate(7deg)} }
  .tile.land .inner { animation:land .22s cubic-bezier(.3,1.6,.5,1); }
  @keyframes land { 0%{transform:scaleY(.78) scaleX(1.12)} 100%{transform:none} }
  .tile.pop { z-index:5; }
  .tile.pop .inner { animation:pop .3s cubic-bezier(.4,0,.6,1) forwards; }
  @keyframes pop {
    0%{transform:scale(1)} 35%{transform:scale(1.35) rotate(9deg)} 100%{transform:scale(0) rotate(-24deg); opacity:0}
  }
  .tile.born .inner { animation:born .3s cubic-bezier(.3,1.5,.5,1); }
  @keyframes born { 0%{transform:scale(.4); opacity:.4} 100%{transform:scale(1); opacity:1} }

  /* ---------------- boosters ----------------
     A booster has to answer three questions at a glance: what am I, what will
     I clear, and how do I go off. The star wears four arrows pointing at the
     four directions it blasts (they pump outward, so the intent reads even
     without words) and keeps its fruit visible in the middle so it can still
     be matched normally. */
  @keyframes spin { to{rotate:360deg} }

  .tile.sp1 .crown { display:block; }
  .tile.sp1 .crown i {
    position:absolute; width:24%; height:24%;
    background:#fff;
    clip-path:polygon(50% 0%, 100% 100%, 0% 100%);
    filter:drop-shadow(0 0 calc(var(--cell)*.05) #ffb703);
    animation:arrowPump 1.15s ease-in-out infinite;
  }
  .tile.sp1 .crown i:nth-child(1){ top:1%;  left:38%; --ax:0px; --ay:calc(var(--cell)*-.07); }
  .tile.sp1 .crown i:nth-child(2){ bottom:1%; left:38%; rotate:180deg; --ax:0px; --ay:calc(var(--cell)*.07); }
  .tile.sp1 .crown i:nth-child(3){ left:1%;  top:38%; rotate:-90deg; --ax:calc(var(--cell)*-.07); --ay:0px; }
  .tile.sp1 .crown i:nth-child(4){ right:1%; top:38%; rotate:90deg;  --ax:calc(var(--cell)*.07);  --ay:0px; }
  @keyframes arrowPump {
    0%,100% { translate:0 0; opacity:.9; }
    50%     { translate:var(--ax) var(--ay); opacity:1; }
  }
  .tile.sp1 .shape {
    box-shadow:inset 0 0 0 calc(var(--cell)*.05) #fff8c4,
               inset 0 calc(var(--cell)*-.06) 0 rgba(0,0,0,.16),
               0 0 calc(var(--cell)*.16) #ffd94d;
    animation:starGlow 1.15s ease-in-out infinite;
  }
  @keyframes starGlow {
    0%,100% { filter:brightness(1); }
    50%     { filter:brightness(1.18); }
  }
  .tile.sp1 .face { font-size:calc(var(--cell)*.33); }

  .tile.sp2 .shape {
    background:conic-gradient(#ff3b5c,#ffcc00,#28d76a,#00a8ff,#8b4ae8,#ff3b5c) !important;
    border-radius:50%;
    animation:spin 4s linear infinite;
    box-shadow:inset 0 0 0 calc(var(--cell)*.035) rgba(255,255,255,.9),
               inset 0 calc(var(--cell)*-.07) calc(var(--cell)*.1) rgba(0,0,0,.25),
               0 0 calc(var(--cell)*.13) rgba(255,255,255,.75);
  }
  /* keep the orb saturated — the full-size gloss blob washed it grey */
  .tile.sp2 .shape::after {
    left:17%; top:11%; width:34%; height:22%;
    background:linear-gradient(165deg, rgba(255,255,255,.7), rgba(255,255,255,0) 70%);
  }
  .tile.sp2 .crown {
    display:block; border-radius:50%;
    box-shadow:0 0 0 calc(var(--cell)*.04) #ffffffcc;
    animation:rainRing 1.2s ease-out infinite;
  }
  @keyframes rainRing {
    0%   { transform:scale(.82); opacity:.9; }
    100% { transform:scale(1.15); opacity:0; }
  }
  .tile.sp2 .face { font-size:calc(var(--cell)*.44); }

  /* "tap again and THIS is what goes" — shown while a booster is selected */
  .tile.aim .inner { animation:aimPulse .75s ease-in-out infinite; }
  @keyframes aimPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.11)} }
  .tile.aim .shape {
    box-shadow:0 0 0 calc(var(--cell)*.045) #fff, 0 0 calc(var(--cell)*.18) rgba(255,255,255,.95);
    filter:brightness(1.22);
  }

  /* the blast itself: a bar of light sweeping the row and column it takes out */
  .beam {
    position:absolute; z-index:6; pointer-events:none; border-radius:999px;
    background:linear-gradient(var(--dir), transparent, #fff 18%, #ffe98a 50%, #fff 82%, transparent);
    animation:beamGo .4s cubic-bezier(.2,.85,.3,1) forwards;
  }
  @keyframes beamGo {
    0%   { transform:scale(var(--sx0), var(--sy0)); opacity:1; }
    55%  { opacity:.95; }
    100% { transform:scale(1,1); opacity:0; }
  }
  /* rainbow's blast: a ring washing outward over the whole board */
  .shock {
    position:absolute; z-index:6; pointer-events:none; border-radius:50%;
    border:calc(var(--cell)*.09) solid #fff;
    animation:shockGo .55s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes shockGo {
    0%   { transform:translate(-50%,-50%) scale(.05); opacity:1; }
    100% { transform:translate(-50%,-50%) scale(1); opacity:0; }
  }

  /* ---- leaf covers: they belong to CELLS, not tiles, so they sit in their
     own layer above the fruit and stay put while fruit falls past them ---- */
  #covers { position:absolute; inset:0; z-index:4; pointer-events:none; }
  .cover {
    position:absolute; left:0; top:0;
    width:var(--cell); height:var(--cell);
    padding:calc(var(--cell)*.045);
    transform:translate3d(calc(var(--cc) * var(--cell)), calc(var(--cr) * var(--cell)), 0);
  }
  /* Translucent on purpose: you have to be able to read the fruit underneath
     to aim a match at it. A solid leaf made the patch unplayable. */
  .cover b {
    position:relative; display:block; width:100%; height:100%;
    border-radius:26%;
    background:rgba(150,220,100,.24);
    box-shadow:inset 0 0 0 calc(var(--cell)*.055) rgba(104,190,60,.95),
               inset 0 0 0 calc(var(--cell)*.085) rgba(255,255,255,.65);
  }
  .cover b::after {
    content:'🍃'; position:absolute; right:4%; top:2%;
    font-size:calc(var(--cell)*.28);
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));
  }
  .cover.gone b { animation:coverGone .42s cubic-bezier(.3,1.4,.5,1) forwards; }
  @keyframes coverGone {
    0%   { transform:scale(1) rotate(0); opacity:1; }
    35%  { transform:scale(1.2) rotate(-12deg); opacity:1; }
    100% { transform:scale(.2) rotate(40deg) translateY(40%); opacity:0; }
  }

  /* the nudge/tutorial finger — shows WHICH two tiles to trade, not just that
     something is possible */
  .hand {
    position:absolute; z-index:22; pointer-events:none;
    width:var(--cell); height:var(--cell);
    display:grid; place-items:center;
    font-size:calc(var(--cell)*.62);
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));
    animation:handGo 1.9s ease-in-out infinite;
  }
  @keyframes handGo {
    0%,12%  { transform:translate3d(var(--hx0), var(--hy0), 0) scale(1); }
    45%,55% { transform:translate3d(var(--hx1), var(--hy1), 0) scale(.9); }
    88%,100%{ transform:translate3d(var(--hx0), var(--hy0), 0) scale(1); }
  }

  /* particles + score pops */
  .pt { position:fixed; z-index:60; border-radius:50%; pointer-events:none;
        animation:pt .58s cubic-bezier(.2,.7,.4,1) forwards; }
  @keyframes pt {
    0%{transform:translate(-50%,-50%) scale(1); opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.2); opacity:0}
  }
  .pop-score {
    position:fixed; z-index:61; pointer-events:none;
    font-weight:800; color:#fff; text-shadow:0 2px 4px rgba(150,50,80,.6);
    animation:popscore .8s ease-out forwards;
  }
  @keyframes popscore {
    0%{transform:translate(-50%,-50%) scale(.5); opacity:0}
    25%{transform:translate(-50%,-70%) scale(1.1); opacity:1}
    100%{transform:translate(-50%,-160%) scale(1); opacity:0}
  }
  .fly { position:fixed; z-index:62; pointer-events:none; display:grid; place-items:center;
         transition:transform .55s cubic-bezier(.5,-0.3,.4,1), opacity .55s; }

  .toast {
    position:fixed; z-index:63; left:50%; top:34%;
    transform:translate(-50%,-50%);
    font-size:clamp(26px,8vw,48px); font-weight:800; color:#fff;
    text-shadow:0 3px 0 rgba(170,60,90,.5), 0 0 22px rgba(255,255,255,.6);
    pointer-events:none; animation:toast 1.05s cubic-bezier(.2,1.3,.4,1) forwards;
  }
  @keyframes toast {
    0%{opacity:0; transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}
    22%{opacity:1; transform:translate(-50%,-50%) scale(1.1) rotate(3deg)}
    70%{opacity:1; transform:translate(-50%,-58%) scale(1)}
    100%{opacity:0; transform:translate(-50%,-85%) scale(.9)}
  }

  .footnote {
    font-size:clamp(12px,3.2vw,16px); font-weight:700; color:#ffffffdd;
    text-align:center; min-height:1.4em; padding:0 10px;
  }

  /* ---------------- overlays ---------------- */
  .overlay {
    position:fixed; inset:0; z-index:70;
    background:rgba(90,30,60,.42); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:18px;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .overlay.show { opacity:1; pointer-events:auto; }
  .panel {
    background:linear-gradient(#fff,#ffeef4);
    border-radius:30px; padding:clamp(18px,4vw,30px);
    width:min(92vw,420px); text-align:center;
    box-shadow:0 14px 40px rgba(90,30,60,.4);
    transform:scale(.85); transition:transform .3s cubic-bezier(.3,1.5,.5,1);
    max-height:92vh; overflow-y:auto;
  }
  .overlay.show .panel { transform:scale(1); }
  .panel h2 { font-size:clamp(24px,6.5vw,34px); color:#c2410c; }
  .panel p { font-size:clamp(14px,3.8vw,18px); font-weight:700; color:#8a5a3c; margin-top:6px; }
  .big-btn {
    border:none; cursor:pointer; font-family:inherit; font-weight:800;
    font-size:clamp(16px,4.4vw,21px); color:#fff;
    padding:14px 22px; border-radius:20px; width:100%;
    background:linear-gradient(#ff9a62,#ff6f91);
    box-shadow:0 5px 0 rgba(0,0,0,.18);
    margin-top:10px;
  }
  .big-btn.alt { background:linear-gradient(#9fd8ff,#6bb8ff); }
  .big-btn.ghost { background:rgba(0,0,0,.08); color:#8a5a3c; box-shadow:0 4px 0 rgba(0,0,0,.1); }
  .big-btn:active { transform:translateY(4px); box-shadow:none; }
  .btn-row { display:flex; gap:10px; margin-top:10px; }
  .btn-row .big-btn { margin-top:0; }

  .starrow { display:flex; justify-content:center; gap:min(3vw,14px); margin:10px 0 4px; }
  .starrow span {
    font-size:clamp(38px,11vw,60px); opacity:.22; filter:grayscale(1);
    transition:opacity .3s;
  }
  .starrow span.on { opacity:1; filter:none; animation:starpop .5s cubic-bezier(.3,1.7,.5,1); }
  @keyframes starpop { 0%{transform:scale(0) rotate(-60deg)} 60%{transform:scale(1.35) rotate(10deg)} 100%{transform:scale(1)} }

  .win-mascot { font-size:clamp(48px,14vw,78px); animation:bob 1.2s ease-in-out infinite; }

  .set-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 4px; font-size:clamp(15px,4vw,19px); font-weight:800; color:#8a5a3c;
    border-bottom:1px solid rgba(0,0,0,.07);
  }
  .toggle {
    border:none; cursor:pointer; font-family:inherit; font-weight:800;
    font-size:clamp(14px,3.6vw,17px); color:#fff;
    padding:8px 18px; border-radius:999px; min-width:88px;

  }
  .toggle.off { background:#c9bdb6; }
  .toggle:active { transform:translateY(3px); box-shadow:none; }

  /* confetti */
  .confetti { position:fixed; top:-20px; z-index:80; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(105vh) rotate(720deg); } }
  .cann-x { position:fixed; bottom:6vh; z-index:80; pointer-events:none;
            animation:cannx 1.1s cubic-bezier(.15,.6,.5,1) forwards; }
  @keyframes cannx { to { transform:translateX(var(--tx)); } }
  .cann-y { display:block; animation:canny 1.1s cubic-bezier(.1,.85,.5,1) forwards; }
  @keyframes canny { 45%{transform:translateY(var(--rise))} 100%{transform:translateY(14vh)} }
  .cann-p { display:block; animation:spin .5s linear infinite; }

  /* ---------------- landscape: board left, panel right ---------------- */
  @media (orientation:landscape) and (max-height:560px) {
    #game { flex-direction:row; align-items:center; justify-content:center; gap:min(3vw,22px); }
    #game .side {
      display:flex; flex-direction:column; gap:10px;
      width:min(40vw,300px); align-items:stretch;
    }
    .topbar { width:100%; }
    .goals { flex-direction:column; align-items:stretch; }
    .goal { justify-content:flex-start; }
    .footnote { text-align:left; padding:0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bub, .win-mascot, #menu h1, .tile.sel .inner, .tile.sp1 .crown i, .tile.sp1 .shape,
    .tile.sp2 .shape, .tile.sp2 .crown, .tile.aim .inner, .hand,
    .moves.low, .cann-p { animation:none !important; }
    /* the aim ring still has to read without the pulse */
    .tile.aim .shape { box-shadow:0 0 0 calc(var(--cell)*.05) #fff; }
  }
</style>
</head>
<body>

<script>
/* =======================================================================
   Fruit Pop — a match-3 for very small people.
   One file, no dependencies, no build step. See ../../README.md.
   ======================================================================= */

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- background bubbles ---------------- */
for (let i = 0; i < 8; i++) {
  const b = document.createElement('div');
  b.className = 'bub';
  const s = 40 + Math.random() * 120;
  b.style.width = b.style.height = s + 'px';
  b.style.left = Math.random() * 100 + 'vw';
  b.style.top = Math.random() * 100 + 'vh';
  b.style.animationDuration = (5 + Math.random() * 6) + 's';
  b.style.animationDelay = (-Math.random() * 6) + 's';
  document.body.appendChild(b);
}

/* ---------------- fruit ----------------
   The fruit emoji is the identity: it is a distinct silhouette as well as a
   distinct colour, so nothing here depends on colour vision alone.
   Each fruit also owns a note of the pentatonic scale, so clearing a colour
   always sounds like that colour — the board becomes a little instrument.    */
const KINDS = [
  { emoji:'🍓', name:'strawberry',  from:'#ff8494', to:'#e01235', note:0 },
  { emoji:'🍌', name:'banana',      from:'#ffdd4d', to:'#eea100', note:1 },
  { emoji:'🍇', name:'grapes',      from:'#bb8cff', to:'#6d22dd', note:2 },
  { emoji:'🍏', name:'green apple', from:'#89ea8a', to:'#1f9e30', note:3 },
  { emoji:'🍊', name:'orange',      from:'#ffb85e', to:'#ef6606', note:4 },
  { emoji:'🫐', name:'blueberry',   from:'#6dc2ff', to:'#0d68cf', note:5 },
];
const SP_NONE = 0, SP_STAR = 1, SP_RAIN = 2;

/* ---------------- levels ----------------
   The curve: board grows, fruit variety grows (so matches get rarer), and the
   goal asks for more kinds at once. Move budgets are deliberately loose — a
   toddler should finish every level; the stars are what reward efficiency.
   Levels 3 and 5 introduce and then combine the leaf covers, so the curve adds
   a NEW IDEA rather than just more of the same board.                        */
const LEVELS = [
  { name:'Berry Patch',   emoji:'🍓', rows:5, cols:5, kinds:4, moves:18, goals:[[0,10]] },
  { name:'Fruit Basket',  emoji:'🍌', rows:6, cols:6, kinds:4, moves:22, goals:[[1,12],[2,12]] },
  { name:'Leafy Hollow',  emoji:'🍃', rows:6, cols:6, kinds:4, moves:20, goals:[], covers:10 },
  { name:'Orchard',       emoji:'🍏', rows:6, cols:6, kinds:5, moves:24, goals:[[3,14],[4,14]] },
  { name:'Hidden Grove',  emoji:'🌿', rows:7, cols:7, kinds:5, moves:26, goals:[[0,12]], covers:16 },
  { name:'Rainbow Grove', emoji:'🌈', rows:7, cols:7, kinds:6, moves:30, goals:[[0,16],[2,16],[5,16]] },
];
const FREE = { name:'Free Play', emoji:'🎈', rows:6, cols:6, kinds:5, moves:0, goals:[] };
// 3 stars if you finish inside par, 2 inside the stretch, 1 for finishing at all.
// Tuned against measured play: budgets stay generous enough that every level is
// finishable by a child swapping more or less at random, but at 0.75 that same
// random play also three-starred the late levels, which made the stars
// meaningless. The budget is the safety net; par is the actual challenge.
const par3 = L => Math.round(L.moves * 0.62);
const par2 = L => Math.round(L.moves * 0.85);

/* ---------------- storage (all keys namespaced match3-) ---------------- */
function stars() {
  try { return JSON.parse(localStorage.getItem('match3-stars') || '{}') || {}; }
  catch (e) { return {}; }
}
function setStar(idx, n) {
  const s = stars();
  if ((s[idx] || 0) < n) { s[idx] = n; localStorage.setItem('match3-stars', JSON.stringify(s)); }
}
function saveGame() {
  // Nothing worth restoring until a move has been made — and writing anyway
  // would let a level you merely opened overwrite a half-played one.
  if (!L || freePlay || over || !movesUsed) return;
  try {
    localStorage.setItem('match3-save', JSON.stringify({
      lv: levelIdx, score, movesLeft, used: movesUsed, helped: usedHelp,
      got: goalGot,
      cov: covers.map(row => row.slice()),
      grid: grid.map(row => row.map(t => t ? [t.k, t.sp] : null)),
    }));
  } catch (e) {}
}
function loadSave() {
  try { return JSON.parse(localStorage.getItem('match3-save') || 'null'); }
  catch (e) { return null; }
}
function clearSave() { localStorage.removeItem('match3-save'); }
// A save is only usable for this level if its board matches the level's shape
// and the goal isn't already finished.
function validSave(sv, i) {
  const lv = LEVELS[i];
  if (!sv || sv.lv !== i) return false;
  if (!Array.isArray(sv.grid) || sv.grid.length !== lv.rows) return false;
  if (!sv.grid.every(row => Array.isArray(row) && row.length === lv.cols)) return false;
  if (!Array.isArray(sv.got) || sv.got.length !== lv.goals.length) return false;
  // Don't offer to resume something already finished. Note a covers level can
  // have no fruit goals at all, so "every goal met" alone isn't the test.
  const fruitDone = lv.goals.every((g, k) => (sv.got[k] || 0) >= g[1]);
  const covLeft = lv.covers
    ? (Array.isArray(sv.cov) ? sv.cov.reduce((a, row) => a + (row || []).filter(Boolean).length, 0) : lv.covers)
    : 0;
  return !(fruitDone && covLeft === 0);
}

/* ---------------- sound (WebAudio, no assets) ---------------- */
let soundOn = localStorage.getItem('match3-sound') !== 'off';
let vibeOn  = localStorage.getItem('match3-vibe')  !== 'off';
let actx = null;
function ac() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, t0, dur, type = 'triangle', vol = .16) {
  const ctx = ac(), o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, ctx.currentTime + t0);
  g.gain.linearRampToValueAtTime(vol, ctx.currentTime + t0 + .012);
  g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t0 + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(ctx.currentTime + t0); o.stop(ctx.currentTime + t0 + dur + .05);
}
function noise(t0, dur, vol = .1, hz = 1400) {
  const ctx = ac(), n = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = hz;
  const g = ctx.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(ctx.destination);
  src.start(ctx.currentTime + t0);
}
// Major pentatonic — every cascade step lands on a consonant note.
const PENTA = [1, 9/8, 5/4, 3/2, 5/3, 2, 9/4, 5/2, 3];
function sfx(name, n = 0, notes) {
  if (!soundOn) return;
  try {
    if (name === 'tap')   tone(560, 0, .07, 'triangle', .1);
    if (name === 'swap')  { tone(430, 0, .07, 'sine', .1); tone(560, .05, .09, 'sine', .1); }
    if (name === 'nope')  { tone(250, 0, .1, 'sine', .09); tone(205, .08, .13, 'sine', .09); }
    if (name === 'pop') {
      // The cascade sets the octave; the fruit sets the note. Clearing three
      // bananas always sounds like bananas, one octave up per chain step.
      const oct = Math.pow(2, Math.min(n, 3) / 2);
      const uniq = [...new Set(notes || [])].slice(0, 4);
      if (uniq.length) {
        uniq.forEach((note, i) => tone(523 * PENTA[note] * oct, i * .035, .16, 'triangle', .13));
      } else {
        tone(523 * oct, 0, .1, 'triangle', .15);
      }
      noise(0, .07, .05, 2200);
    }
    if (name === 'land')  noise(0, .05, .035, 700);
    if (name === 'leaf')  { noise(0, .16, .07, 3200); tone(300, 0, .1, 'sine', .05); }
    if (name === 'make')  [784, 988, 1319, 1568].forEach((f, i) => tone(f, i * .06, .18, 'triangle', .13));
    if (name === 'lucky') [523, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i * .05, .22, 'triangle', .14));
    if (name === 'blast') { noise(0, .3, .1, 900); [660, 520, 400].forEach((f, i) => tone(f, i * .05, .2, 'sawtooth', .07)); }
    if (name === 'goal')  { tone(880, 0, .09, 'sine', .12); tone(1319, .07, .14, 'sine', .1); }
    if (name === 'mix')   { for (let i = 0; i < 6; i++) tone(400 + i * 90, i * .04, .1, 'sine', .07); }
    if (name === 'win')   [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .12, .28, 'triangle', .16));
    if (name === 'star')  tone(880 * Math.pow(2, n / 12 * 4), 0, .3, 'triangle', .16);
  } catch (e) {}
}
function buzz(ms) { if (vibeOn && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} }

/* ---------------- game state ---------------- */
let L = null, levelIdx = 0, freePlay = false;
let R = 0, C = 0, KN = 4;
let grid = [];               // grid[r][c] = tile | null
let score = 0, movesLeft = 0, movesUsed = 0, usedHelp = false;
let goalGot = [];            // parallel to L.goals
let covers = [], coversLeft = 0;
let busy = false, sel = null, over = false;
let idleTimer = null, nudged = [], handEl = null;
// Moves since the last booster. Boosters are the best part of the game, and a
// 4-in-a-row is rare on a big board — measured at 1.7 per 30 moves on the 7x7,
// which means most children would never see one. After PITY boosterless moves
// the next match, however small, becomes a star. See scratchpad sim numbers.
let sinceBooster = 0;
// Both knobs scale with how sparse the board is. A 5x5 with four fruit is
// already dense enough to throw off boosters on its own (measured 9 per 30
// moves with no help at all) — pushing it further turned early levels into a
// firework show that ended in four moves. The 7x7 with six fruit is the board
// that actually needs rescuing.
const PITY = () => (KN <= 4 ? 8 : 5);
const REFILL_BIAS = () => (KN <= 4 ? 0.15 : 0.25);

const board = $('board');

/* ---------------- tiles ---------------- */
function makeTile(k, r, c, sp = SP_NONE) {
  const el = document.createElement('div');
  el.className = 'tile';
  const inner = document.createElement('div'); inner.className = 'inner';
  const shape = document.createElement('div'); shape.className = 'shape';
  const face  = document.createElement('div'); face.className  = 'face';
  const crown = document.createElement('div'); crown.className = 'crown';
  crown.innerHTML = '<i></i><i></i><i></i><i></i>';   // the star's four blast arrows
  inner.append(shape, face, crown);
  el.appendChild(inner);
  const t = { k, sp, r, c, el, shape, face };
  paint(t);
  // Append before placing: place(…, true) forces a reflow to pin the starting
  // position, and a detached element has no layout to flush.
  board.appendChild(el);
  place(t, r, c, true);
  return t;
}
function paint(t) {
  const el = t.el;
  el.classList.remove('sp1', 'sp2');
  if (t.sp === SP_RAIN) {
    t.shape.className = 'shape';
    t.shape.style.background = '';
    t.face.textContent = '🌈';
    el.classList.add('sp2');
    el.setAttribute('aria-label', 'rainbow');
  } else {
    const K = KINDS[t.k];
    t.shape.className = 'shape';
    t.shape.style.background = 'linear-gradient(160deg,' + K.from + ',' + K.to + ')';
    t.face.textContent = K.emoji;
    if (t.sp === SP_STAR) { el.classList.add('sp1'); el.setAttribute('aria-label', K.name + ' star'); }
    else el.setAttribute('aria-label', K.name);
  }
}
function place(t, r, c, instant) {
  t.r = r; t.c = c;
  if (instant) t.el.style.transitionDuration = '0s';
  t.el.style.setProperty('--tr', r);
  t.el.style.setProperty('--tc', c);
  if (instant) { void t.el.offsetWidth; t.el.style.transitionDuration = ''; }
}
function isRain(t) { return t && t.sp === SP_RAIN; }

/* ---------------- layout ---------------- */
function layout() {
  if (!L) return;
  const land = window.innerWidth > window.innerHeight && window.innerHeight <= 560;
  const availW = land ? window.innerWidth * 0.52 : window.innerWidth * 0.94;
  const availH = land ? window.innerHeight * 0.88 : window.innerHeight * 0.60;
  const cell = Math.max(34, Math.floor(Math.min(availW / C, availH / R, 96)));
  board.style.setProperty('--cell', cell + 'px');
  board.style.setProperty('--rows', R);
  board.style.setProperty('--cols', C);
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 120));

/* ---------------- board generation ---------------- */
const rnd = n => Math.floor(Math.random() * n);
// Fruit accelerates as it falls rather than easing in and out — floaty tiles
// were the single biggest thing making the board feel unphysical.
const FALL_EASE = 'cubic-bezier(.38,0,.72,.36)';

// Refilled fruit sometimes copies a neighbour. That seeds the near-misses that
// turn into cascades and 4-in-a-rows, which is what makes the board feel alive
// instead of random. 0.25 measured best: plenty of chains without the board
// resolving itself for ten seconds.
function refillKind(r, c) {
  if (Math.random() < REFILL_BIAS()) {
    const nb = [];
    for (const [dr, dc] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < R && cc >= 0 && cc < C && grid[rr] && grid[rr][cc] && grid[rr][cc].k >= 0)
        nb.push(grid[rr][cc].k);
    }
    if (nb.length) return nb[rnd(nb.length)];
  }
  return rnd(KN);
}

function runsOn(g) {
  // Every horizontal/vertical run of 3+ of the same kind. Rainbows (k<0) never match.
  const out = [];
  for (let r = 0; r < R; r++) {
    let c = 0;
    while (c < C) {
      const t = g[r][c];
      if (!t || t.k < 0) { c++; continue; }
      let e = c + 1;
      while (e < C && g[r][e] && g[r][e].k === t.k) e++;
      if (e - c >= 3) { const cells = []; for (let i = c; i < e; i++) cells.push([r, i]); out.push({ k: t.k, cells, dir: 'h' }); }
      c = e;
    }
  }
  for (let c = 0; c < C; c++) {
    let r = 0;
    while (r < R) {
      const t = g[r][c];
      if (!t || t.k < 0) { r++; continue; }
      let e = r + 1;
      while (e < R && g[e][c] && g[e][c].k === t.k) e++;
      if (e - r >= 3) { const cells = []; for (let i = r; i < e; i++) cells.push([i, c]); out.push({ k: t.k, cells, dir: 'v' }); }
      r = e;
    }
  }
  return out;
}

// Merge runs that share a cell, so an L or T becomes one group.
function groups() {
  const runs = runsOn(grid);
  if (!runs.length) return [];
  const parent = runs.map((_, i) => i);
  const find = x => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  const seen = new Map();
  runs.forEach((run, i) => {
    run.cells.forEach(([r, c]) => {
      const key = r * C + c;
      if (seen.has(key)) { const a = find(seen.get(key)), b = find(i); if (a !== b) parent[a] = b; }
      else seen.set(key, i);
    });
  });
  const byRoot = new Map();
  runs.forEach((run, i) => {
    const root = find(i);
    if (!byRoot.has(root)) byRoot.set(root, { k: run.k, cells: new Map(), lines: 0, maxRun: 0 });
    const g = byRoot.get(root);
    g.lines++;
    g.maxRun = Math.max(g.maxRun, run.cells.length);
    run.cells.forEach(([r, c]) => g.cells.set(r * C + c, [r, c]));
  });
  return [...byRoot.values()].map(g => ({ k: g.k, lines: g.lines, maxRun: g.maxRun, cells: [...g.cells.values()] }));
}

function anyMove() {
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    if (isRain(grid[r][c])) return [[r, c], [r, c + 1 < C ? c + 1 : c - 1]];
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const r2 = r + dr, c2 = c + dc;
      if (r2 >= R || c2 >= C) continue;
      if (isRain(grid[r2][c2])) return [[r, c], [r2, c2]];
      const a = grid[r][c], b = grid[r2][c2];
      grid[r][c] = b; grid[r2][c2] = a;
      const hit = runsOn(grid).length > 0;
      grid[r][c] = a; grid[r2][c2] = b;
      if (hit) return [[r, c], [r2, c2]];
    }
  }
  return null;
}

// Only the fruit are torn down — the covers live in their own layer.
function clearTiles() {
  board.querySelectorAll('.tile').forEach(el => el.remove());
}

/* ---------------- leaf covers ----------------
   A cover sits on a CELL. Clear the fruit standing on it and the leaf is swept
   away; fruit falling through afterwards passes underneath, so a cover can
   only ever be removed by a match made right on top of it. */
function makeCovers(n) {
  covers = [];
  coversLeft = 0;
  for (let r = 0; r < R; r++) { covers[r] = []; for (let c = 0; c < C; c++) covers[r][c] = 0; }
  if (!n) { paintCovers(); return; }
  // Take the n cells nearest the middle, so the patch always reads as a
  // deliberate shape (a diamond) rather than scattered noise.
  const mid = [(R - 1) / 2, (C - 1) / 2];
  const cells = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++)
    cells.push([Math.abs(r - mid[0]) + Math.abs(c - mid[1]), r, c]);
  cells.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
  cells.slice(0, Math.min(n, R * C)).forEach(([, r, c]) => { covers[r][c] = 1; coversLeft++; });
  paintCovers();
}
function paintCovers() {
  const host = $('covers');
  host.innerHTML = '';
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    if (!covers[r] || !covers[r][c]) continue;
    const d = document.createElement('div');
    d.className = 'cover';
    d.style.setProperty('--cr', r);
    d.style.setProperty('--cc', c);
    d.dataset.rc = r + ',' + c;
    d.innerHTML = '<b>🍃</b>';
    host.appendChild(d);
  }
}
function restoreCovers(cov) {
  if (!L.covers) { makeCovers(0); return; }
  const ok = Array.isArray(cov) && cov.length === R && cov.every(row => Array.isArray(row) && row.length === C);
  if (!ok) { makeCovers(L.covers); return; }
  covers = cov.map(row => row.slice());
  coversLeft = covers.reduce((a, row) => a + row.reduce((x, v) => x + (v ? 1 : 0), 0), 0);
  paintCovers();
}
function sweepCover(r, c) {
  if (!covers[r] || !covers[r][c]) return false;
  covers[r][c] = 0; coversLeft--;
  const d = $('covers').querySelector('.cover[data-rc="' + r + ',' + c + '"]');
  if (d) { d.classList.add('gone'); setTimeout(() => d.remove(), 460); }
  return true;
}

function buildBoard() {
  clearTiles();
  grid = [];
  for (let r = 0; r < R; r++) { grid[r] = []; for (let c = 0; c < C; c++) grid[r][c] = null; }
  // Deal a board with no free matches — the first pop should be the player's.
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    const banned = new Set();
    if (c >= 2 && grid[r][c - 1].k === grid[r][c - 2].k) banned.add(grid[r][c - 1].k);
    if (r >= 2 && grid[r - 1][c].k === grid[r - 2][c].k) banned.add(grid[r - 1][c].k);
    let k; do { k = rnd(KN); } while (banned.has(k));
    grid[r][c] = makeTile(k, r, c);
  }
  if (!anyMove()) buildBoard();
}

function restoreBoard(saved) {
  clearTiles();
  grid = [];
  for (let r = 0; r < R; r++) {
    grid[r] = [];
    for (let c = 0; c < C; c++) {
      const s = saved[r] && saved[r][c];
      grid[r][c] = s ? makeTile(s[0], r, c, s[1]) : makeTile(rnd(KN), r, c);
    }
  }
}

/* ---------------- effects ---------------- */
function cellCentre(r, c) {
  const box = board.getBoundingClientRect();
  const cell = board.clientWidth / C;
  return { x: box.left + (c + .5) * cell, y: box.top + (r + .5) * cell };
}
function particles(r, c, kind) {
  if (REDUCED) return;
  const p = cellCentre(r, c);
  const col = kind == null ? '#fff' : KINDS[kind].from;
  for (let i = 0; i < 7; i++) {
    const s = document.createElement('span');
    s.className = 'pt';
    const size = 5 + Math.random() * 8;
    s.style.width = s.style.height = size + 'px';
    s.style.background = i % 3 === 0 ? '#fff' : col;
    s.style.left = p.x + 'px'; s.style.top = p.y + 'px';
    const a = Math.random() * Math.PI * 2, d = 22 + Math.random() * 46;
    s.style.setProperty('--dx', Math.cos(a) * d + 'px');
    s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    s.style.animationDelay = (Math.random() * .06) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 700);
  }
}
// Particles that fly INWARD — the visual grammar of something being created
// rather than destroyed.
function converge(r, c, kind) {
  if (REDUCED) return;
  const p = cellCentre(r, c);
  const col = kind == null ? '#fff' : KINDS[kind].from;
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('span');
    s.className = 'pt';
    const size = 5 + Math.random() * 7;
    s.style.width = s.style.height = size + 'px';
    s.style.background = i % 3 === 0 ? '#fff' : col;
    const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 48;
    // start out at the rim, then animate back to the middle
    s.style.left = (p.x + Math.cos(a) * d) + 'px';
    s.style.top = (p.y + Math.sin(a) * d) + 'px';
    s.style.setProperty('--dx', (-Math.cos(a) * d) + 'px');
    s.style.setProperty('--dy', (-Math.sin(a) * d) + 'px');
    s.style.animationDelay = (Math.random() * .08) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 750);
  }
}
function scorePop(r, c, n) {
  const p = cellCentre(r, c);
  const el = document.createElement('div');
  el.className = 'pop-score';
  el.textContent = '+' + n;
  el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
  el.style.fontSize = Math.min(34, 16 + n / 60) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 850);
}
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}
// A collected fruit flies from the board to its goal chip — the clearest
// possible "that one counted" signal for a kid who can't read the number yet.
function flyToGoal(r, c, gi) {
  const chip = document.querySelector('#goals .goal[data-i="' + gi + '"] .mini');
  if (!chip || REDUCED) return;
  const from = cellCentre(r, c), to = chip.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'fly';
  el.textContent = KINDS[L.goals[gi][0]].emoji;
  const size = Math.max(20, board.clientWidth / C * .45);
  el.style.font = size + 'px/1 sans-serif';
  el.style.left = (from.x - size / 2) + 'px';
  el.style.top = (from.y - size / 2) + 'px';
  el.style.width = el.style.height = size + 'px';
  document.body.appendChild(el);
  requestAnimationFrame(() => {
    el.style.transform = 'translate(' + (to.left + to.width / 2 - from.x) + 'px,'
                                      + (to.top + to.height / 2 - from.y) + 'px) scale(.55)';
    el.style.opacity = '.2';
  });
  setTimeout(() => el.remove(), 620);
}

// A bar of light down the row and the column the star is about to take out.
function starBeams(r, c) {
  if (REDUCED) return;
  const cell = board.clientWidth / C;
  for (const dir of ['h', 'v']) {
    const b = document.createElement('div');
    b.className = 'beam';
    if (dir === 'h') {
      b.style.cssText = 'left:0;width:100%;height:' + (cell * .5) + 'px;top:' + ((r + .5) * cell - cell * .25) + 'px';
      b.style.setProperty('--dir', '90deg');
      b.style.setProperty('--sx0', '0'); b.style.setProperty('--sy0', '1');
      b.style.transformOrigin = ((c + .5) * cell) + 'px center';
    } else {
      b.style.cssText = 'top:0;height:100%;width:' + (cell * .5) + 'px;left:' + ((c + .5) * cell - cell * .25) + 'px';
      b.style.setProperty('--dir', '180deg');
      b.style.setProperty('--sx0', '1'); b.style.setProperty('--sy0', '0');
      b.style.transformOrigin = 'center ' + ((r + .5) * cell) + 'px';
    }
    board.appendChild(b);
    setTimeout(() => b.remove(), 450);
  }
}
// The rainbow's reach is the whole board, so its tell is a ring washing over it.
function shockwave(r, c) {
  if (REDUCED) return;
  const cell = board.clientWidth / C;
  const size = Math.max(R, C) * cell * 2.2;
  const s = document.createElement('div');
  s.className = 'shock';
  s.style.width = s.style.height = size + 'px';
  s.style.left = ((c + .5) * cell) + 'px';
  s.style.top = ((r + .5) * cell) + 'px';
  board.appendChild(s);
  setTimeout(() => s.remove(), 600);
}

/* ---------------- the resolve loop ---------------- */
function blastCells(r, c, sp, k, out) {
  if (sp === SP_STAR) {
    for (let i = 0; i < C; i++) out.add(r * C + i);
    for (let i = 0; i < R; i++) out.add(i * C + c);
  } else if (sp === SP_RAIN) {
    for (let rr = 0; rr < R; rr++) for (let cc = 0; cc < C; cc++)
      if (grid[rr][cc] && grid[rr][cc].k === k) out.add(rr * C + cc);
  }
}
// A booster caught in a clear fires, and whatever it hits can fire too.
function expand(set) {
  const queue = [...set];
  let fired = null;
  while (queue.length) {
    const key = queue.pop();
    const t = grid[Math.floor(key / C)][key % C];
    if (!t || t.sp === SP_NONE || t.fired) continue;
    t.fired = true;
    // Show every booster going off, including ones set off by other boosters —
    // otherwise a chain reaction just looks like the board erasing itself.
    if (t.sp === SP_STAR) starBeams(t.r, t.c); else shockwave(t.r, t.c);
    if (!fired) fired = [t.r, t.c];
    const add = new Set();
    blastCells(t.r, t.c, t.sp, t.sp === SP_RAIN ? -1 : t.k, add);
    add.forEach(x => { if (!set.has(x)) { set.add(x); queue.push(x); } });
  }
  return fired;
}

// `from` is the cell a blast radiated out of, if any. Popping outward from it
// in waves is what makes a booster legible: you can see the blast travel, so
// you can see which fruit it took.
async function clearCells(keys, cascade, from) {
  const gained = keys.size * 60 * Math.min(cascade, 5);
  score += gained;
  let goalHits = 0, coverHits = 0, notes = [];
  const flyBudget = { n: 0 };

  keys.forEach(key => {
    const r = Math.floor(key / C), c = key % C;
    const t = grid[r][c];
    if (!t) return;
    // credit the goal
    if (L.goals.length && t.sp !== SP_RAIN) {
      const gi = L.goals.findIndex(g => g[0] === t.k);
      if (gi >= 0 && goalGot[gi] < L.goals[gi][1]) {
        goalGot[gi]++; goalHits++;
        if (flyBudget.n++ < 6) flyToGoal(r, c, gi);
      }
    }
    if (sweepCover(r, c)) coverHits++;
    if (t.k >= 0) notes.push(KINDS[t.k].note);
    const delay = from ? Math.min(260, (Math.abs(r - from[0]) + Math.abs(c - from[1])) * 42) : 0;
    const el = t.el;
    if (delay) {
      el.style.transitionDelay = delay + 'ms';
      setTimeout(() => { particles(r, c, t.sp === SP_RAIN ? null : t.k); el.classList.add('pop'); }, delay);
    } else {
      particles(r, c, t.sp === SP_RAIN ? null : t.k);
      el.classList.add('pop');
    }
    setTimeout(() => el.remove(), 340 + delay);
    grid[r][c] = null;
  });

  sfx('pop', cascade - 1, notes);
  buzz(cascade > 1 ? 22 : 14);
  if (coverHits) { sfx('leaf'); paintGoals(true); }
  if (goalHits) { paintGoals(true); sfx('goal'); }
  const mid = [...keys][Math.floor(keys.size / 2)];
  scorePop(Math.floor(mid / C), mid % C, gained);
  paintHud();
  // A blast needs long enough for its last wave to actually be seen.
  await sleep(REDUCED ? 60 : (from ? 420 : 260));
}

async function gravity() {
  let maxDrop = 0, landed = [];
  for (let c = 0; c < C; c++) {
    let write = R - 1;
    for (let r = R - 1; r >= 0; r--) {
      const t = grid[r][c];
      if (!t) continue;
      if (write !== r) {
        grid[write][c] = t; grid[r][c] = null;
        const dist = write - r;
        maxDrop = Math.max(maxDrop, dist);
        t.el.style.transitionDuration = Math.min(430, 130 + dist * 55) + 'ms';
        t.el.style.transitionTimingFunction = FALL_EASE;
        place(t, write, c);
        landed.push(t);
      }
      write--;
    }
    // refill from above the ceiling
    let above = 1;
    for (let r = write; r >= 0; r--) {
      // Born above the ceiling, then walked down to its slot in the same tick —
      // makeTile has already flushed layout, so the transition still animates,
      // and the model never sees a tile parked at a negative row.
      const t = makeTile(refillKind(r, c), -above, c);
      grid[r][c] = t;
      const dist = r + above;
      maxDrop = Math.max(maxDrop, dist);
      t.el.style.transitionDuration = Math.min(430, 130 + dist * 55) + 'ms';
      t.el.style.transitionTimingFunction = 'cubic-bezier(.45,.05,.55,1)';
      place(t, r, c);
      landed.push(t);
      above++;
    }
  }
  if (!landed.length) return;
  const dur = REDUCED ? 30 : Math.min(430, 130 + maxDrop * 55);
  await sleep(dur);
  sfx('land');
  landed.forEach(t => {
    t.el.style.transitionDuration = '';
    t.el.style.transitionTimingFunction = '';
    t.el.classList.add('land');
    setTimeout(() => t.el.classList.remove('land'), 240);
  });
  await sleep(REDUCED ? 10 : 60);
}

// Toddlers can't read these, so each one carries an emoji that says the same
// thing — the word is for the grown-up reading over their shoulder.
const CHEERS = [['Nice!', '✨'], ['Wow!', '🌟'], ['Amazing!', '🎉'], ['Incredible!', '🏆'], ['Fruit-tastic!', '🤩']];

// Runs matches → boosters → clears → gravity, over and over until it settles.
async function resolve(origins) {
  let cascade = 0, madeBooster = false, lucky = false;
  for (;;) {
    const gs = groups();
    if (!gs.length) break;
    cascade++;

    const keys = new Set();
    const spawns = [];   // [key, spKind, fruitKind]
    for (const g of gs) {
      // A rainbow is the prize for a deliberate straight five. Corners and Ts —
      // which are easy to make by accident — give the (still lovely) star.
      let sp = SP_NONE;
      if (g.maxRun >= 5) sp = SP_RAIN;
      else if (g.lines >= 2 || g.cells.length >= 4) sp = SP_STAR;
      // Gone too long without one? Quietly turn this match into a star. The
      // child only ever sees a gift arriving, never a rule being bent.
      else if (cascade === 1 && sinceBooster >= PITY()) { sp = SP_STAR; lucky = true; }

      let spawnKey = null;
      if (sp) {
        // Prefer the tile the player actually moved — that's where they're looking.
        const hit = (origins || []).find(o => g.cells.some(([r, c]) => r === o[0] && c === o[1]));
        const cell = hit || g.cells[Math.floor(g.cells.length / 2)];
        spawnKey = cell[0] * C + cell[1];
        spawns.push([spawnKey, sp, g.k]);
      }
      g.cells.forEach(([r, c]) => { const key = r * C + c; if (key !== spawnKey) keys.add(key); });
    }
    origins = null;

    const blastFrom = expand(keys);
    if (blastFrom) { sfx('blast'); shake(); }
    spawns.forEach(([key]) => keys.delete(key));

    if (cascade >= 2 && !REDUCED) {
      const [word, icon] = CHEERS[Math.min(cascade - 2, CHEERS.length - 1)];
      toast(icon + ' ' + word);
    }
    if (cascade >= 3) shake();

    await clearCells(keys, cascade, blastFrom);

    // promote the spawn tiles into boosters
    for (const [key, sp, k] of spawns) {
      const r = Math.floor(key / C), c = key % C;
      const t = grid[r][c];
      if (!t) continue;
      t.sp = sp; if (sp === SP_RAIN) t.k = -1; else t.k = k;
      t.fired = false;
      paint(t);
      // Sparks rushing IN, so a booster looks assembled out of the fruit that
      // just vanished rather than teleported in from nowhere.
      converge(r, c, sp === SP_RAIN ? null : k);
      t.el.classList.add('born');
      setTimeout(() => t.el.classList.remove('born'), 320);
    }
    if (spawns.length) {
      madeBooster = true;
      sfx(lucky ? 'lucky' : 'make'); buzz(30);
      if (lucky) toast('⭐ Lucky!');
      await sleep(REDUCED ? 20 : 260);   // let the new booster be seen
    }

    await gravity();
  }
  if (madeBooster) sinceBooster = 0; else if (cascade) sinceBooster++;
  return cascade;
}

function shake() {
  if (REDUCED) return;
  const w = $('board-wrap');
  w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
  setTimeout(() => w.classList.remove('shake'), 360);
}

async function reshuffle() {
  toast('Let\'s mix! 🌀');
  sfx('mix');
  const flat = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (grid[r][c].sp === SP_NONE) flat.push(grid[r][c]);
  for (let tries = 0; tries < 80; tries++) {
    const ks = flat.map(t => t.k);
    for (let i = ks.length - 1; i > 0; i--) { const j = rnd(i + 1); [ks[i], ks[j]] = [ks[j], ks[i]]; }
    flat.forEach((t, i) => { t.k = ks[i]; });
    if (!runsOn(grid).length && anyMove()) break;
  }
  flat.forEach(t => { paint(t); t.el.classList.add('born'); });
  await sleep(360);
  flat.forEach(t => t.el.classList.remove('born'));
}

/* ---------------- interaction ---------------- */
function adjacent(a, b) { return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1; }

// Whichever fruit the rainbow would take if you set it off where it stands.
// activate() and the preview must agree, so they share this.
function commonKind() {
  const count = new Array(KINDS.length).fill(0);
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++)
    if (grid[r][c] && grid[r][c].k >= 0) count[grid[r][c].k]++;
  let best = 0; count.forEach((n, i) => { if (n > count[best]) best = i; });
  return best;
}
function clearAim() { board.querySelectorAll('.tile.aim').forEach(el => el.classList.remove('aim')); }
// Selecting a booster lights up exactly the fruit it would clear. This is the
// whole answer to "what does this thing do" — you see it before you commit,
// and nothing is spent finding out.
function showAim(t) {
  clearAim();
  if (!t || t.sp === SP_NONE) return;
  const keys = new Set();
  blastCells(t.r, t.c, t.sp, t.sp === SP_RAIN ? commonKind() : t.k, keys);
  keys.forEach(key => {
    const x = grid[Math.floor(key / C)][key % C];
    if (x && x !== t) x.el.classList.add('aim');
  });
}
function select(t) {
  clearNudge();
  if (sel) sel.el.classList.remove('sel');
  sel = t;
  if (t) { t.el.classList.add('sel'); sfx('tap'); }
  showAim(t);
  setFoot(t && t.sp !== SP_NONE ? 'Tap it again to set it off! 💥' : null);
}

async function activate(t) {
  // Tapping an already-selected booster sets it off. Costs a move.
  if (busy || over) return;
  busy = true;
  const at = [t.r, t.c];
  select(null);
  spendMove();
  const keys = new Set([t.r * C + t.c]);
  if (t.sp === SP_RAIN) {
    blastCells(t.r, t.c, SP_RAIN, commonKind(), keys);
    shockwave(at[0], at[1]);
  } else {
    blastCells(t.r, t.c, SP_STAR, t.k, keys);
    starBeams(at[0], at[1]);
  }
  t.fired = true;
  expand(keys);
  sfx('blast'); shake(); buzz(40);
  await clearCells(keys, 2, at);
  await gravity();
  await resolve(null);
  await settle();
}

async function trySwap(a, b) {
  if (busy || over) return;
  busy = true;
  select(null);
  clearNudge();
  sfx('swap');

  // visual swap
  const ar = a.r, ac2 = a.c, br = b.r, bc = b.c;
  place(a, br, bc); place(b, ar, ac2);
  grid[br][bc] = a; grid[ar][ac2] = b;
  await sleep(REDUCED ? 20 : 190);

  const rainbow = isRain(a) || isRain(b);
  if (rainbow) {
    spendMove();
    const rb = isRain(a) ? a : b;
    const at = [rb.r, rb.c];
    const keys = new Set([a.r * C + a.c, b.r * C + b.c]);
    if (isRain(a) && isRain(b)) {
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) keys.add(r * C + c);
      toast('💥 BOOM!');
    } else {
      const other = isRain(a) ? b : a;
      blastCells(other.r, other.c, SP_RAIN, other.k, keys);
    }
    shockwave(at[0], at[1]);
    a.fired = b.fired = true;
    expand(keys);
    sfx('blast'); shake(); buzz(45);
    await clearCells(keys, 2, at);
    await gravity();
    await resolve(null);
    return settle();
  }

  if (!groups().length) {
    // Not a match — no penalty, no scolding, just a little "nope" wobble.
    place(a, ar, ac2); place(b, br, bc);
    grid[ar][ac2] = a; grid[br][bc] = b;
    a.el.classList.add('nope'); b.el.classList.add('nope');
    sfx('nope');
    setTimeout(() => { a.el.classList.remove('nope'); b.el.classList.remove('nope'); }, 360);
    await sleep(REDUCED ? 20 : 300);
    busy = false;
    armIdle();
    return;
  }

  spendMove();
  await resolve([[a.r, a.c], [b.r, b.c]]);
  await settle();
}

async function settle() {
  if (!anyMove()) await reshuffle();
  busy = false;
  paintHud();
  if (checkWin()) return;
  if (!freePlay && movesLeft <= 0) { $('more').classList.add('show'); return; }
  saveGame();
  armIdle();
}

board.addEventListener('pointerdown', ev => {
  const el = ev.target.closest('.tile');
  if (!el || busy || over) return;
  ac();                                     // unlock audio on first touch
  const t = tileFromEl(el);
  if (!t) return;
  drag = { t, x: ev.clientX, y: ev.clientY, done: false };
  if (sel && sel !== t && adjacent(sel, t)) { const s = sel; drag.done = true; trySwap(s, t); return; }
  if (sel === t) { drag.done = true; if (t.sp !== SP_NONE) activate(t); else select(null); return; }
  select(t);
});
let drag = null;
board.addEventListener('pointermove', ev => {
  if (!drag || drag.done || busy) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  const cell = board.clientWidth / C;
  if (Math.hypot(dx, dy) < cell * .42) return;
  drag.done = true;
  const [dr, dc] = Math.abs(dx) > Math.abs(dy) ? [0, Math.sign(dx)] : [Math.sign(dy), 0];
  const r2 = drag.t.r + dr, c2 = drag.t.c + dc;
  if (r2 < 0 || r2 >= R || c2 < 0 || c2 >= C) return;
  trySwap(drag.t, grid[r2][c2]);
});
board.addEventListener('pointerup', () => { drag = null; });
board.addEventListener('pointercancel', () => { drag = null; });

function tileFromEl(el) {
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (grid[r][c] && grid[r][c].el === el) return grid[r][c];
  return null;
}

/* ---------------- gentle nudge instead of a timer ---------------- */
function clearNudge() {
  nudged.forEach(t => t.el.classList.remove('nudge'));
  nudged = [];
  if (handEl) { handEl.remove(); handEl = null; }
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
}
// A finger that actually travels from one tile to the other. Pulsing two tiles
// said "look here"; this says "trade these two", which is the thing a child who
// can't read the footnote needs to be told.
function showHand(a, b) {
  if (REDUCED) return;
  const cell = board.clientWidth / C;
  handEl = document.createElement('div');
  handEl.className = 'hand';
  handEl.textContent = '👆';
  handEl.style.setProperty('--hx0', (a[1] * cell) + 'px');
  handEl.style.setProperty('--hy0', (a[0] * cell) + 'px');
  handEl.style.setProperty('--hx1', (b[1] * cell) + 'px');
  handEl.style.setProperty('--hy1', (b[0] * cell) + 'px');
  board.appendChild(handEl);
}
// `fast` is the first-run tutorial: on a brand-new save the hand shows up in a
// couple of seconds instead of six, so nobody has to be told how to play.
function armIdle(fast) {
  clearNudge();
  idleTimer = setTimeout(() => {
    if (busy || over || sel) { armIdle(); return; }
    const mv = anyMove();
    if (!mv) return;
    nudged = mv.map(([r, c]) => grid[r][c]).filter(Boolean);
    nudged.forEach(t => t.el.classList.add('nudge'));
    showHand(mv[0], mv[1]);
    idleTimer = setTimeout(() => { clearNudge(); armIdle(); }, 5200);
  }, fast ? 2200 : 6000);
}

/* ---------------- HUD ---------------- */
function spendMove() {
  if (freePlay) return;
  movesLeft--; movesUsed++;
  const box = $('moves-box');
  box.classList.remove('bump'); void box.offsetWidth; box.classList.add('bump');
  paintHud();
}
let footBase = '';
function setFoot(msg) { $('foot').textContent = msg || footBase; }
function paintHud() {
  $('score').textContent = score.toLocaleString() + ' points';
  $('moves-n').textContent = freePlay ? '∞' : Math.max(0, movesLeft);
  $('moves-box').classList.toggle('low', !freePlay && movesLeft <= 3);
}
function miniTile(k) {
  const K = KINDS[k];
  return '<span class="mini"><span class="shape" style="border-radius:30%;background:linear-gradient(160deg,'
       + K.from + ',' + K.to + ')"></span><span class="face">' + K.emoji + '</span></span>';
}
let goalSig = '';
function paintGoals(animate) {
  const host = $('goals');
  const n = L.goals.length + (L.covers ? 1 : 0);
  // Rebuild on the actual goal set, not the chip count — two levels can want
  // the same NUMBER of chips but different ones, which used to leave the
  // previous level's chip sitting there showing this level's numbers.
  const sig = L.name + '|' + L.goals.map(g => g.join(':')).join(',') + '|' + (L.covers || 0);
  if (!n) { host.innerHTML = ''; goalSig = sig; return; }
  if (sig !== goalSig) {
    goalSig = sig;
    let html = L.goals.map((g, i) =>
      '<div class="goal" data-i="' + i + '" aria-label="collect ' + g[1] + ' ' + KINDS[g[0]].name + '">'
      + miniTile(g[0]) + '<span class="num"></span></div>').join('');
    if (L.covers) {
      html += '<div class="goal" data-i="cov" aria-label="sweep away all the leaves">'
        + '<span class="mini"><span class="shape" style="border-radius:26%;background:linear-gradient(160deg,#d6f5b0,#7cc94e)"></span>'
        + '<span class="face">🍃</span></span><span class="num"></span></div>';
    }
    host.innerHTML = html;
  }
  L.goals.forEach((g, i) => {
    const chip = host.children[i];
    const done = goalGot[i] >= g[1];
    chip.querySelector('.num').textContent = done ? '✓' : (goalGot[i] + '/' + g[1]);
    chip.classList.toggle('done', done);
    if (animate) { chip.classList.remove('pulse'); void chip.offsetWidth; chip.classList.add('pulse'); }
  });
  if (L.covers) {
    const chip = host.children[L.goals.length];
    const done = coversLeft <= 0;
    chip.querySelector('.num').textContent = done ? '✓' : ((L.covers - coversLeft) + '/' + L.covers);
    chip.classList.toggle('done', done);
    if (animate) { chip.classList.remove('pulse'); void chip.offsetWidth; chip.classList.add('pulse'); }
  }
}
function goalMet() {
  return L.goals.every((g, i) => goalGot[i] >= g[1]) && (!L.covers || coversLeft <= 0);
}

/* ---------------- win ---------------- */
function checkWin() {
  if (freePlay || over || !goalMet()) return false;
  over = true;
  clearNudge();
  clearSave();
  let n = 3;
  if (usedHelp) n = 1;
  else if (movesUsed > par2(L)) n = 1;
  else if (movesUsed > par3(L)) n = 2;
  setStar(levelIdx, n);
  paintMenu();
  sfx('win'); buzz([80, 60, 80, 60, 160]);
  confettiBurst(); cannon('left'); cannon('right');
  setTimeout(() => { if ($('win').classList.contains('show')) { cannon('left'); cannon('right'); } }, 850);
  $('win-title').textContent = n === 3 ? 'Perfect!' : n === 2 ? 'Great job!' : 'You did it!';
  $('win-sub').textContent = score.toLocaleString() + ' points · ' + movesUsed + ' moves';
  $('win-mascot').textContent = ['🐻', '🐰', '🦊', '🐸', '🐨'][rnd(5)];
  const row = $('starrow').children;
  for (let i = 0; i < 3; i++) row[i].classList.remove('on');
  $('next-btn').style.display = levelIdx < LEVELS.length - 1 ? '' : 'none';
  setTimeout(() => $('win').classList.add('show'), 260);
  for (let i = 0; i < n; i++) setTimeout(() => { row[i].classList.add('on'); sfx('star', i); }, 700 + i * 340);
  return true;
}

const CONF = ['#ffd34d', '#ff9d5c', '#ff8fb2', '#54c452', '#4aa3ff', '#a394ff', '#7df5b9'];
function confPiece(k) {
  const w = 7 + Math.random() * 9, round = Math.random() < .5;
  const p = document.createElement('span');
  p.style.width = w + 'px';
  p.style.height = (round ? w : w * (.4 + Math.random() * .55)) + 'px';
  p.style.background = CONF[k % CONF.length];
  p.style.borderRadius = round ? '50%' : '2px';
  return p;
}
function confettiBurst() {
  if (REDUCED) return;
  for (let k = 0; k < 70; k++) {
    const s = confPiece(k);
    s.className = 'confetti';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (2.2 + Math.random() * 2.5) + 's';
    s.style.animationDelay = (Math.random() * .8) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 6000);
  }
}
function cannon(side) {
  if (REDUCED) return;
  const dir = side === 'left' ? 1 : -1;
  for (let k = 0; k < 26; k++) {
    const outer = document.createElement('span');
    outer.className = 'cann-x';
    outer.style.left = side === 'left' ? '3vw' : '97vw';
    outer.style.setProperty('--tx', (dir * (12 + Math.random() * 62)) + 'vw');
    const inner = document.createElement('span');
    inner.className = 'cann-y';
    inner.style.setProperty('--rise', -(34 + Math.random() * 42) + 'vh');
    const p = confPiece(k);
    p.className = 'cann-p';
    p.style.animationDuration = (.35 + Math.random() * .4) + 's';
    inner.appendChild(p); outer.appendChild(inner);
    document.body.appendChild(outer);
    setTimeout(() => outer.remove(), 2600);
  }
}

/* ---------------- screens & routing ---------------- */
function paintMenu() {
  const s = stars();
  $('levels').innerHTML = LEVELS.map((lv, i) => {
    const n = s[i] || 0;
    const bits = lv.goals.map(g => g[1] + KINDS[g[0]].emoji);
    if (lv.covers) bits.push(lv.covers + '🍃');
    const goalTxt = bits.join(' ');
    return '<button class="level-btn l' + (i + 1) + '" data-i="' + i + '">'
      + '<span class="emoji">' + lv.emoji + '</span>'
      + '<span class="name">' + lv.name + '</span>'
      + '<span class="desc">' + goalTxt + ' · ' + lv.moves + ' moves</span>'
      + '<span class="stars">' + (n ? '⭐'.repeat(n) : '') + '</span></button>';
  }).join('')
  + '<button class="level-btn free-btn" data-i="free">'
  + '<span class="emoji">🎈</span><span class="name">Free Play</span>'
  + '<span class="desc">No goals, no counting — just pop!</span>'
  + '<span class="stars"></span></button>';
}
$('levels').addEventListener('click', ev => {
  const b = ev.target.closest('.level-btn');
  if (!b) return;
  ac(); sfx('tap');
  location.hash = b.dataset.i === 'free' ? '#free' : '#lvl-' + (Number(b.dataset.i) + 1);
});

function showMenu() {
  over = true; busy = false;
  clearNudge();
  $('menu').classList.remove('hidden');
  $('game').classList.add('hidden');
  $('win').classList.remove('show');
  $('more').classList.remove('show');
  $('resume').classList.remove('show');
  paintMenu();
}

function start(idx, resume) {
  freePlay = idx === 'free';
  levelIdx = freePlay ? -1 : idx;
  L = freePlay ? FREE : LEVELS[idx];
  R = L.rows; C = L.cols; KN = L.kinds;
  score = 0; movesLeft = L.moves; movesUsed = 0; usedHelp = false; over = false; busy = false; sel = null;
  goalGot = L.goals.map(() => 0);
  sinceBooster = 0;

  if (resume) {
    score = resume.score; movesLeft = resume.movesLeft; movesUsed = resume.used;
    usedHelp = !!resume.helped; goalGot = resume.got.slice();
  }

  $('menu').classList.add('hidden');
  $('game').classList.remove('hidden');
  $('win').classList.remove('show');
  $('more').classList.remove('show');
  $('resume').classList.remove('show');
  $('lv-name').textContent = L.name;
  footBase = freePlay ? 'Pop as much as you like. 🎈'
    : L.covers ? 'Pop the fruit sitting on the leaves 🍃'
    : 'Tap a fruit, then the one next to it.';
  setFoot(null);

  layout();
  if (resume) {
    restoreBoard(resume.grid);
    restoreCovers(resume.cov);
    // Saves are only ever written from a settled board, so a run here means a
    // stale or hand-edited save — deal a fresh board rather than gift a match.
    if (runsOn(grid).length) { buildBoard(); makeCovers(L.covers || 0); }
  } else {
    buildBoard();
    makeCovers(L.covers || 0);
  }
  paintGoals(false);
  paintHud();
  // If a restored board happens to be dead, mix it before the child touches it.
  if (!anyMove()) reshuffle();
  // First ever game? Bring the pointing hand in early — that's the tutorial.
  armIdle(!freePlay && levelIdx === 0 && !Object.keys(stars()).length);
}

function applyRoute() {
  const h = location.hash;
  if (h === '#free') { start('free'); return; }
  const m = /^#lvl-(\d+)$/.exec(h);
  if (m) {
    const i = Number(m[1]) - 1;
    if (i >= 0 && i < LEVELS.length) {
      const sv = loadSave();
      const ok = validSave(sv, i);
      start(i, ok ? sv : null);
      // Only ask when there's progress worth keeping — a level opened and left
      // untouched has nothing to decide about.
      if (ok && sv.used > 0) { clearNudge(); $('resume').classList.add('show'); }
      return;
    }
  }
  showMenu();
}
window.addEventListener('hashchange', applyRoute);

/* ---------------- buttons ---------------- */
$('back-btn').onclick  = () => { saveGame(); location.hash = ''; };
$('menu-btn').onclick  = () => { location.hash = ''; };
$('again-btn').onclick = () => { clearSave(); start(freePlay ? 'free' : levelIdx); };
$('next-btn').onclick  = () => { clearSave(); location.hash = '#lvl-' + (levelIdx + 2); };
$('home-btn').onclick  = () => { location.href = '../../'; };
$('more-btn').onclick  = () => {
  usedHelp = true; movesLeft += 5;
  $('more').classList.remove('show');
  paintHud(); saveGame(); armIdle();
  sfx('make');
};
$('more-quit').onclick = () => { $('more').classList.remove('show'); location.hash = ''; };
$('resume-yes').onclick = () => { sfx('tap'); $('resume').classList.remove('show'); armIdle(); };
$('resume-new').onclick = () => {
  sfx('tap'); $('resume').classList.remove('show');
  clearSave(); start(levelIdx);
};

$('set-btn').onclick   = () => $('settings').classList.add('show');
$('set-close').onclick = () => $('settings').classList.remove('show');
$('settings').addEventListener('click', ev => { if (ev.target === $('settings')) $('settings').classList.remove('show'); });
function paintToggles() {
  $('t-sound').textContent = soundOn ? 'ON' : 'OFF';
  $('t-sound').classList.toggle('off', !soundOn);
  $('t-vibe').textContent = vibeOn ? 'ON' : 'OFF';
  $('t-vibe').classList.toggle('off', !vibeOn);
}
$('t-sound').onclick = () => { soundOn = !soundOn; localStorage.setItem('match3-sound', soundOn ? 'on' : 'off'); paintToggles(); if (soundOn) sfx('pop', 0); };
$('t-vibe').onclick  = () => { vibeOn = !vibeOn; localStorage.setItem('match3-vibe', vibeOn ? 'on' : 'off'); paintToggles(); if (vibeOn) buzz(30); };
// iOS has no Vibration API at all — don't offer a switch that does nothing.
if (!navigator.vibrate) $('vibe-row').style.display = 'none';
paintToggles();

window.addEventListener('pagehide', saveGame);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });

applyRoute();
</script>
</body>
</html>
