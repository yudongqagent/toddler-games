// The orb swells and flares before it starts firing — the beat that says
// something big is about to happen.
async function windUp(t) {
  if (REDUCED || !t || !t.el) return;
  t.el.classList.add('firing');
  sfx('windup');
  await sleep(380);
  t.el.classList.remove('firing');
}

// Fruit around a newborn booster flinch away from it — the little shove that
// makes the birth feel like it displaced something.
function pushNeighbours(r, c) {
  if (REDUCED) return;
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (!dr && !dc) continue;
    const t = grid[r + dr] && grid[r + dr][c + dc];
    if (!t) continue;
    t.el.style.setProperty('--px', (dc * 14) + '%');
    t.el.style.setProperty('--py', (dr * 14) + '%');
    t.el.classList.remove('push'); void t.el.offsetWidth; t.el.classList.add('push');
    setTimeout(() => t.el.classList.remove('push'), 460);
  }
}

// A bolt of light from the rainbow to one doomed fruit.
function zap(fr, fc, tr, tc) {
  if (fr === tr && fc === tc) return;
  fxBolt(fr, fc, tr, tc);
  fxFlash(tr, tc, 1.5, 'rgba(200,230,255,');
}

/* ---------------- the resolve loop ---------------- */
// The shape of the match becomes the shape of the blast — a line match blasts
// lines, a corner match blasts a blob, a long match takes a whole colour. That
// mapping is the thing that makes boosters guessable instead of memorised.
function blastCells(r, c, sp, k, out, radius) {
  if (sp === SP_STAR) {
    for (let i = 0; i < C; i++) out.add(r * C + i);
    for (let i = 0; i < R; i++) out.add(i * C + c);
  } else if (sp === SP_BOMB) {
    const rad = radius || 1;
    for (let rr = r - rad; rr <= r + rad; rr++) for (let cc = c - rad; cc <= c + rad; cc++)
      if (rr >= 0 && rr < R && cc >= 0 && cc < C) out.add(rr * C + cc);
  } else if (sp === SP_RAIN) {
    for (let rr = 0; rr < R; rr++) for (let cc = 0; cc < C; cc++)
      if (grid[rr][cc] && grid[rr][cc].k === k) out.add(rr * C + cc);
  }
}
/* A bomb goes off TWICE, and it is the bomb ITSELF that goes off twice — it
   survives its own first blast. It clears everything around it, then falls into
   the hole it just made, and detonates a second time from wherever it lands.
   That is the part worth watching: the bomb drops through the gap it opened and
   blows again somewhere new, so the second blast hits a different patch of board
   rather than the same one refilled.

   `twice` is the extra life, spent the first time it fires, so the second blast
   consumes it like any other booster. A bomb caught in the second blast gets its
   own extra life, so chains keep working and still terminate. */
let bombAgain = [];
async function fireBombAgain() {
  // Only the ones still sitting where we left them: a surviving bomb can be
  // taken by something else first — the board reshuffling out from under it, or
  // a cascade landing on it.
  const shots = bombAgain.filter(t => grid[t.r] && grid[t.r][t.c] === t);
  bombAgain = [];
  if (!shots.length) return false;
  const keys = new Set();
  shots.forEach(t => { t.fired = false; keys.add(t.r * C + t.c); });
  const chain = expand(keys);              // draws the blast and claims the area
  if (!chain) return false;
  sfx('blast', 1); buzz(34); shake();
  await sleep(REDUCED ? 0 : 95);
  await clearCells(keys, 2, [shots[0].r, shots[0].c], null, null, chain);
  await gravity();
  return true;
}

// One link of a chain reaction to the next.
const CHAIN_STEP = 125;
// A booster caught in a clear fires, and whatever it hits can fire too — but a
// chain is a sequence of events, not one event. This walks it breadth-first so
// every booster knows its DEPTH in the chain: link 0 goes off now, link 1 a
// beat later, link 2 a beat after that. Each cell also remembers which booster
// claimed it and at what depth, so the fruit pop when their blast actually
// reaches them rather than all at once at the start.
function expand(set) {
  let frontier = [...set];
  const depthOf = new Map();     // cell -> chain depth at which it is destroyed
  const srcOf = new Map();       // cell -> the booster that claimed it
  const survive = [];            // bombs holding themselves back for blast two
  frontier.forEach(k => depthOf.set(k, 0));
  let depth = 0, first = null, links = 0, maxDepth = 0;

  while (frontier.length) {
    const next = [];
    for (const key of frontier) {
      const t = grid[Math.floor(key / C)][key % C];
      if (!t || t.sp === SP_NONE || t.fired) continue;
      t.fired = true;
      links++;
      if (!first) first = [t.r, t.c];
      maxDepth = Math.max(maxDepth, depth);
      const at = [t.r, t.c], sp = t.sp, rad = t.radius, d = depth;
      // A bomb keeps ITSELF out of its own first blast, so it is still standing
      // when gravity runs and drops it into the hole. It goes off again from
      // there. One extra life each, spent here.
      if (sp === SP_BOMB && !t.twice) { t.twice = true; survive.push(t); bombAgain.push(t); }
      // A rainbow set off by something else has to be TOLD which colour to hunt.
      // It used to be handed -1 here, which is the rainbow's own kind, so it
      // swept the board looking for other rainbows, found none, and vanished
      // having done nothing at all — a star's line blast could swallow your
      // rainbow for free. It takes the most common colour now, the same one it
      // takes when you tap it, so a rainbow does the same thing however it goes
      // off.
      const hunt = sp === SP_RAIN ? commonKind() : t.k;
      const add = new Set();
      blastCells(at[0], at[1], sp, hunt, add, rad);

      // The visual and the sound fire when the chain actually arrives here.
      const go = () => {
        if (sp === SP_STAR) starBeams(at[0], at[1]);
        else if (sp === SP_BOMB) bombBlast(at[0], at[1], 2 * (rad || 1) + 1);
        else {
          // Bolts, one per target, are what a rainbow LOOKS like in this game.
          // A bare shockwave gave a chained one the same anonymous ring as
          // anything else, so even once it started working you couldn't tell it
          // had. Staggered to match the order the fruit actually pop in.
          shockwave(at[0], at[1]);
          let i = 0;
          add.forEach(x => {
            const rr = Math.floor(x / C), cc = x % C;
            if (rr === at[0] && cc === at[1]) return;
            const n = i++;
            setTimeout(() => { zap(at[0], at[1], rr, cc); if (n < 6) sfx('zap'); }, n * 42);
          });
        }
        sfx('blast', Math.min(d, 4));
        buzz(d ? 16 : 30);
        if (d) shake();
      };
      if (d === 0 || REDUCED) go(); else setTimeout(go, d * CHAIN_STEP);

      add.forEach(x => {
        if (!set.has(x)) { set.add(x); next.push(x); }
        // Claimed at THIS link's depth; a booster among them detonates one
        // link later, which is what the next loop pass does.
        if (!depthOf.has(x) || depthOf.get(x) > d) { depthOf.set(x, d); srcOf.set(x, at); }
      });
    }
    frontier = next;
    depth++;
  }
  // Pull the surviving bombs back out of the clear set — done last, because a
  // later link of the chain may well have added the same cell again.
  survive.forEach(t => set.delete(t.r * C + t.c));
  return links ? { first, depthOf, srcOf, maxDepth, links } : null;
}

// `from` is the cell a blast radiated out of, if any. Popping outward from it
// in waves is what makes a booster legible: you can see the blast travel, so
// you can see which fruit it took.
// `zapFrom` switches from the radial wave to the rainbow's one-at-a-time hunt:
// targets are taken in order of distance, each getting its own bolt, with the
// cadence tightened for big sets so the whole show still lands in about a
// second whether it's eight fruit or the entire board.
// `suckTo` maps a doomed cell to the cell a booster is forming in. Those fruit
// travel into it and shrink out on arrival instead of popping where they stand,
// which is what stitches the clear and the creation into one motion.
async function clearCells(keys, cascade, from, zapFrom, suckTo, chain) {
  const gained = keys.size * 60 * Math.min(cascade, 5);
  score += gained;
  let goalHits = 0, coverHits = 0, notes = [];
  const flyBudget = { n: 0 };
  iceHitThisClear = new Set();
  blockHitThisClear = new Set();
  // Which of these cells were blocks when the clear began. This has to be a
  // snapshot: a gift opens into a BOOSTER, and if a neighbour of it happens to
  // be processed first — which a blast makes likely, since it sweeps the gift
  // and its neighbours together — then by the time the loop reaches the gift's
  // own cell it is no longer a block, falls through to the ordinary pop path,
  // and the booster the player just earned is destroyed by the very blast that
  // freed it. Measured before the fix: a star over a gift opened it and left
  // zero boosters on the board.
  const wasBlock = new Set();
  keys.forEach(k => { const b = grid[Math.floor(k / C)][k % C]; if (b && b.block) wasBlock.add(k); });
  let order = null, step = 0, lastDelay = 0;
  /* A cascade match has no `from` and no chain, so every cell got a delay of
     zero and the whole run vanished on one frame — the one case where a line of
     five reads as tiles blinking out rather than as a line being cleared. Fall
     back to the run's OWN long axis: take the bounding box of the cells and
     stagger along whichever side is longer, so the pop travels down the line and
     you can read which way the match ran. */
  let selfAxis = null;
  if (!order && !chain && !from && keys.size > 1) {
    let minR = 99, maxR = -1, minC = 99, maxC = -1;
    keys.forEach(k => { const r = Math.floor(k / C), c = k % C;
      if (r < minR) minR = r; if (r > maxR) maxR = r;
      if (c < minC) minC = c; if (c > maxC) maxC = c; });
    selfAxis = (maxC - minC) >= (maxR - minR) ? { by: 'c', min: minC } : { by: 'r', min: minR };
    lastDelay = Math.max(lastDelay, Math.max(maxC - minC, maxR - minR) * 42);
  }
  if (zapFrom) {
    const d = k => Math.hypot(Math.floor(k / C) - zapFrom[0], (k % C) - zapFrom[1]);
    order = new Map();
    [...keys].sort((a, b) => d(a) - d(b)).forEach((k, i) => order.set(k, i));
    step = keys.size > 24 ? 26 : keys.size > 12 ? 48 : 78;
    lastDelay = (keys.size - 1) * step;
  }
  // When a chain is running, a fruit waits for ITS link to arrive and then for
  // the blast to travel out to it — so the destruction follows the chain the
  // same way the calculation does.
  const chainDelay = key => {
    const d = chain.depthOf.get(key) || 0;
    const src = chain.srcOf.get(key);
    const away = src ? Math.abs(Math.floor(key / C) - src[0]) + Math.abs(key % C - src[1]) : 0;
    return d * CHAIN_STEP + Math.min(135, away * 27);
  };
  if (chain) keys.forEach(k => { lastDelay = Math.max(lastDelay, chainDelay(k)); });

  // A beat where the doomed fruit flare white before they go. Without it the
  // board just loses tiles; with it you can see WHICH ones matched.
  if (!REDUCED) {
    keys.forEach(key => {
      const t = grid[Math.floor(key / C)][key % C];
      // Only the fruit that are actually going. The pop loop below early-returns
      // for frost and blockers, so charging them both told a lie — the flash
      // means "this one is about to burst" — and leaked, because the removal
      // lives past that return. A frozen tile kept brightness(2.1) scale(1.22)
      // for the rest of the level, since paint() has no reason to strip it.
      if (t && !t.block && !t.ice) t.el.classList.add('charge');
    });
    await sleep(125);
  }

  keys.forEach(key => {
    const r = Math.floor(key / C), c = key % C;
    const t = grid[r][c];
    if (!t) return;
    // Neither a blocker nor frozen fruit is ever popped. A duckling leaves by
    // reaching the floor; frost takes a hit and hands the fruit back once the
    // last layer goes.
    if (t.block || wasBlock.has(key)) {
      // A block only lands in `keys` because a booster's blast swept it in, and
      // srcOf holds exactly the cells a booster claimed — so this is the honest
      // test for "was it blasted", and the one thing a coconut listens to.
      if (t.block && chain && chain.srcOf.has(key)) hitBlock(r, c, true);
      return;
    }
    // Chipped explicitly rather than left to the adjacency rule below, which
    // would miss a frozen fruit at the far end of a long run — in
    // [frozen, frozen, free, frozen, frozen] the outer two are part of the match
    // but are not next to the one cell that actually clears.
    if (t.jelly) { hitJelly(r, c); return; }
    if (t.ice) { hitIce(r, c); return; }
    // credit the goal
    if (t.sp !== SP_RAIN) {
      const gi = L.goals.findIndex(g => g.t === 'fruit' && g.k === t.k);
      if (gi >= 0 && goalGot[gi] < L.goals[gi].need) {
        goalGot[gi]++; goalHits++;
        if (flyBudget.n++ < 6) flyToGoal(r, c, gi);
      }
    }
    if (sweepCover(r, c)) coverHits++;
    if (t.k >= 0) notes.push(KINDS[t.k].note);
    // Ice next to a clear takes a hit. Done before the pop so a fruit that is
    // itself about to vanish still counts as "a match happened here".
    for (const [dr, dc] of [[0,1],[0,-1],[1,0],[-1,0]]) {
      hitIce(r + dr, c + dc);
      hitJelly(r + dr, c + dc);
      // Gifts open from a match beside them, the same as frost. Coconuts sit
      // here unmoved — hitBlock turns an ordinary knock away for them.
      hitBlock(r + dr, c + dc, false);
    }
    // Pops travel outward from wherever this clear started — the tile you moved,
    // or the booster that went off — so the burst reads as a consequence of it.
    const delay = order ? order.get(key) * step
                : chain ? chainDelay(key)
                : from  ? Math.min(210, (Math.abs(r - from[0]) + Math.abs(c - from[1])) * 33)
                : selfAxis ? (selfAxis.by === 'c' ? c - selfAxis.min : r - selfAxis.min) * 42
                : 0;
    const el = t.el;
    const kind = t.sp === SP_RAIN ? null : t.k;
    // Drop .charge as .pop goes on: both style .inner and .charge is defined
    // later in the sheet, so leaving it would win the cascade and the tile
    // would sit there flashing instead of bursting. Pop opens on charge's end
    // state, so the handover is invisible.
    const target = suckTo && suckTo.get(key);
    const fire = target ? () => {
      // Rush into the cell the booster is forming in. Riding the tile's own
      // --tr/--tc transform means this uses the same movement path as gravity,
      // so it reads as the fruit physically being drawn in.
      el.classList.remove('charge');
      el.style.transitionDuration = '215ms';
      el.style.transitionTimingFunction = 'cubic-bezier(.45,0,.7,.35)';
      el.classList.add('suck');
      place(t, target[0], target[1]);
      fxSparks(r, c, kind == null ? '#fff' : KINDS[kind].from, 6, .55);
    } : () => {
      el.classList.remove('charge');
      if (zapFrom) { zap(zapFrom[0], zapFrom[1], r, c); sfx('zap'); }
      // Thrown away from wherever this clear started — the tile you moved, or
      // the booster that went off.
      particles(r, c, kind, cascade - 1, zapFrom || from); ring(r, c, cascade - 1);
      el.classList.add('pop');
    };
    if (delay) { setTimeout(fire, delay); } else fire();
    setTimeout(() => el.remove(), (target ? 250 : 305) + delay);
    grid[r][c] = null;
  });

  sfx('pop', cascade - 1, notes);
  buzz(cascade > 1 ? 22 : 14);
  if (coverHits) { sfx('leaf'); paintGoals(true); }
  if (goalHits) { paintGoals(true); sfx('goal'); }
  // A score goal has no "hit" to react to — it moves on every clear, so it has
  // to be refreshed here or the chip sits at 0 for the whole level.
  if (L.goals.some(g => g.t === 'score')) paintGoals(true);
  const mid = [...keys][Math.floor(keys.size / 2)];
  scorePop(Math.floor(mid / C), mid % C, gained);
  paintHud();
  /* The tail. This is the gap you feel after a pop: the clear used to sit here
     until the last burst had completely finished before handing over, so gravity
     could not start until every popped tile had gone. It only ever needed to
     wait long enough for the last wave to be READ, not to end — the cells are
     already null, so the fall is free to begin underneath the tail of the
     animation. Overlapping the two is what removes the dead beat, and it costs
     nothing because a popping tile is shrinking out of the way as it happens. */
  await sleep(REDUCED ? 50 : lastDelay + (zapFrom ? 340 : from ? 330 : 250));
}

async function gravity() {
  let maxDrop = 0, landed = [];
  for (let c = 0; c < C; c++) {
    // Fall only within this column's span — the holes above and below it are
    // not part of the board. A machine at the top of the column is furniture:
    // it is not part of the falling region at all, so nothing tries to drop it
    // and nothing refills over it.
    const gen = grid[colTop[c]][c] && grid[colTop[c]][c].block === 'gen'
              ? grid[colTop[c]][c] : null;
    const top = gen ? colTop[c] + 1 : colTop[c];
    let write = colBot[c];
    for (let r = colBot[c]; r >= top; r--) {
      const t = grid[r][c];
      if (!t) continue;
      if (write !== r) {
        grid[write][c] = t; grid[r][c] = null;
        const dist = write - r;
        maxDrop = Math.max(maxDrop, dist);
        t.el.style.transitionDuration = Math.min(330, 95 + dist * 42) + 'ms';
        t.el.style.transitionTimingFunction = FALL_EASE;
        place(t, write, c);
        landed.push(t);
      }
      write--;
    }
    // refill from above the ceiling
    let above = 1;
    // The machine gets one attempt per fall, at the cell right under its mouth,
    // so its output visibly comes OUT of it rather than materialising anywhere
    // in the column.
    let emit = gen && write >= top && Math.random() < gen.rate ? gen.next : null;
    for (let r = write; r >= top; r--) {
      // Born above the ceiling, then walked down to its slot in the same tick —
      // makeTile has already flushed layout, so the transition still animates,
      // and the model never sees a tile parked at a negative row.
      const t = makeTile(refillKind(r, c), -above, c);
      // A gift opens from a single knock, so a boardful of them is opened by the
      // first cascade — measured, four gifts and a goal of two finished on move
      // ONE. They arrive over the course of the level instead, which makes
      // "open five gifts" a real errand while each individual gift stays the
      // quick treat it is meant to be. Capped so the board never fills with them.
      if (L.giftDrip && Math.random() < L.giftDrip
          && grid.flat().filter(x => x && x.block === 'gift').length < 3) {
        t.block = 'gift'; t.k = BLOCK_K; t.hits = BLOCKS.gift.hits; paint(t);
      }
      if (emit && r === write) {
        applyEmit(t, emit);
        emit = null;
        gen.next = gen.makes[Math.floor(Math.random() * gen.makes.length)];
        paint(gen);
        gen.el.classList.remove('firing'); void gen.el.offsetWidth;
        gen.el.classList.add('firing');
        setTimeout(() => gen.el.classList.remove('firing'), 460);
      }
      grid[r][c] = t;
      const dist = r + above;
      maxDrop = Math.max(maxDrop, dist);
      t.el.style.transitionDuration = Math.min(330, 95 + dist * 42) + 'ms';
      t.el.style.transitionTimingFunction = 'cubic-bezier(.45,.05,.55,1)';
      place(t, r, c);
      landed.push(t);
      above++;
    }
  }
  if (!landed.length) return;
  const dur = REDUCED ? 30 : Math.min(330, 95 + maxDrop * 42);
  await sleep(dur);
  landed.forEach(t => {
    t.el.style.transitionDuration = '';
    t.el.style.transitionTimingFunction = '';
    t.el.classList.add('land');
    setTimeout(() => t.el.classList.remove('land'), 240);
  });
  // A puff under the fruit that sits on the floor of each column — one per
  // column, so a full refill doesn't spray forty puffs at once.
  const bottoms = new Set();
  landed.forEach(t => { if (!bottoms.has(t.c) && (t.r === R - 1 || (grid[t.r + 1] && grid[t.r + 1][t.c] && !landed.includes(grid[t.r + 1][t.c])))) { bottoms.add(t.c); dust(t.r, t.c); } });
  await sleep(REDUCED ? 10 : 80);
  // Anything that reached the floor this fall is home. Checked after the fall
  // settles so a duckling that lands is collected on the same beat it arrives.
  paintJellyLinks();
  if (collectDucks()) {
    await sleep(REDUCED ? 10 : 235);
    // A collected duckling leaves a hole ON THE FLOOR, and this was the end of
    // the fall — nothing else was ever going to come along and close it, so the
    // column sat with a gap under it until some unrelated move happened to
    // trigger another pass. Fall again. This terminates because every pass
    // consumes at least one duckling and a level has finitely many.
    await gravity();
  }
}

// Toddlers can't read these, so each one carries an emoji that says the same
// thing — the word is for the grown-up reading over their shoulder.
const CHEERS = [['Nice!', '✨'], ['Wow!', '🌟'], ['Amazing!', '🎉'], ['Incredible!', '🏆'], ['Fruit-tastic!', '🤩']];

// Runs matches → boosters → clears → gravity, over and over until it settles.
async function resolve(origins) {
  let cascade = 0, madeBooster = false, lucky = false;
  // Remember where the player actually touched, so the very first burst can
  // radiate out from their own move.
  const touched = origins && origins.length ? origins[0] : null;
  // Every pass either clears at least one tile or chips at least one layer of
  // ice, and both are bounded by the size of the board, so this does terminate —
  // even now that a group can be mostly frozen fruit and clear almost nothing.
  // The cap is there because "almost certainly terminates" is not good enough
  // for a toddler's game: a hung board is worse than a cascade cut short, and
  // 400 is far past any legitimate one (a full board plus every ice layer on it
  // is under 200).
  for (let guard = 0; guard < 400; guard++) {
    // Bombs that survived a blast have now fallen; let them go off again before
    // anything else. Every path that detonates anything — tap, match, chain,
    // hammer, combine — reaches gravity and then resolve, so doing it here
    // covers all of them from one place. It has to come BEFORE groups(), or a
    // cascade could match the surviving bomb away and its second blast would be
    // silently lost. Each shot leaves the list before it fires and each bomb has
    // exactly one extra life, so this terminates.
    if (bombAgain.length && await fireBombAgain()) continue;
    const gs = groups();
    if (!gs.length) break;
    cascade++;

    const keys = new Set();
    const spawns = [];              // [key, spKind, fruitKind, cell]
    const suckTo = new Map();       // doomed cell -> cell its booster forms in
    for (const g of gs) {
      // A rainbow is the prize for a deliberate straight five. Corners and Ts —
      // which are easy to make by accident — give the (still lovely) star.
      let sp = SP_NONE;
      if (g.maxRun >= 5) sp = SP_RAIN;
      else if (g.lines >= 2) sp = SP_BOMB;     // a corner or T — blasts a blob
      else if (g.cells.length >= 4) sp = SP_STAR;
      // Gone too long without one? Quietly turn this match into a star. The
      // child only ever sees a gift arriving, never a rule being bent.
      else if (cascade === 1 && sinceBooster >= PITY()) { sp = SP_STAR; lucky = true; }

      let spawnKey = null;
      if (sp) {
        // The new booster may NOT be planted on a cell that already holds one.
        // It used to prefer the tile the player moved, and if that tile was
        // itself a star or bomb it got excluded from the clear set, never
        // fired, and was then overwritten — the player's booster vanished with
        // no blast at all. Plain fruit only; nearest the player's move first.
        // Not onto a frozen cell either, now that frozen fruit join runs — a
        // booster sealed under ice is one you can't see, can't tap and can't
        // swap, so it would just quietly go to waste.
        const plain = ([r, c]) => { const x = grid[r][c]; return x && x.sp === SP_NONE && !x.ice && !x.block; };
        const hit = (origins || []).find(o => g.cells.some(([r, c]) => r === o[0] && c === o[1]) && plain(o));
        const cell = hit || g.cells.filter(plain)[Math.floor(g.cells.filter(plain).length / 2)];
        // If every cell in the group is already a booster there's nowhere to
        // put a new one — they simply all go off, which is the better show.
        if (cell) {
          spawnKey = cell[0] * C + cell[1];
          spawns.push([spawnKey, sp, g.k, cell]);
        }
      }
      g.cells.forEach(([r, c]) => {
        const key = r * C + c;
        if (key !== spawnKey) {
          keys.add(key);
          // Everything in a group that's forming a booster gets drawn into it.
          if (spawnKey !== null) suckTo.set(key, [Math.floor(spawnKey / C), spawnKey % C]);
        }
      });
    }
    origins = null;

    const chain = expand(keys);
    const blastFrom = chain && chain.first;
    // Let the beam or the ring actually arrive before the fruit it's hitting
    // disappears — firing both on the same frame read as "everything vanished".
    if (chain) { shake(); await sleep(REDUCED ? 0 : 95); }
    spawns.forEach(([key]) => keys.delete(key));

    if (cascade >= 2 && !REDUCED) {
      const [word, icon] = CHEERS[Math.min(cascade - 2, CHEERS.length - 1)];
      toast(icon + ' ' + word);
    }
    if (cascade >= 3) shake();

    // The booster is born WHILE its fruit are still travelling into it, not
    // after the whole clear has finished. Firing it afterwards was what made
    // creation feel like a separate, disconnected second animation.
    let promoted = false;
    const promote = () => {
      if (promoted) return;
      promoted = true;
      for (const [key, sp, k] of spawns) {
        const r = Math.floor(key / C), c = key % C;
        const t = grid[r][c];
        if (!t) continue;
        t.sp = sp; if (sp === SP_RAIN) t.k = -1; else t.k = k;
        t.fired = false;
        t.twice = false;        // a fresh bomb gets a fresh second blast
        paint(t);
        converge(r, c, sp === SP_RAIN ? null : k);
        pushNeighbours(r, c);
        t.el.classList.add('born');
        setTimeout(() => t.el.classList.remove('born'), 320);
      }
      madeBooster = true;
      spawns.forEach(([, sp]) => { boostMade[sp] = (boostMade[sp] || 0) + 1; });
      if (L.goals.some(g => g.t === 'boost')) paintGoals(true);
      sfx(lucky ? 'lucky' : 'make'); buzz(30);
      if (lucky) toast('⭐ Lucky!');
    };
    // 150ms of charge, then ~180ms of travel — the booster lands as they arrive.
    let promoteTimer = null;
    if (spawns.length) promoteTimer = setTimeout(promote, REDUCED ? 0 : 225);

    await clearCells(keys, cascade, blastFrom || (cascade === 1 ? touched : null), null, suckTo, chain);

    // Guarantee it happened before gravity, whatever the timer did.
    if (spawns.length) { clearTimeout(promoteTimer); promote(); }

    await gravity();
  }
  if (madeBooster) sinceBooster = 0; else if (cascade) sinceBooster++;
  // A clear that kept going three times over. Counted per MOVE, not per pass,
  // so one spectacular cascade is one chain rather than several.
  if (cascade >= 3) {
    bigChains++;
    if (L.goals.some(g => g.t === 'chain')) paintGoals(true);
  }
  return cascade;
}

/* ---------------- level intro / outro ----------------
   A level should arrive and leave, not blink in and out. */
async function playIntro(showCard) {
  if (REDUCED) { busy = false; return; }
  const tiles = grid.flat().filter(Boolean);
  // Hold the fruit off-stage so the card lands on an empty board and the wave
  // is the payoff — running both at once meant the board quietly finished
  // assembling behind the card and then nothing happened for a second.
  tiles.forEach(t => { t.el.style.visibility = 'hidden'; });

  if (showCard) {
    const card = $('levelcard');
    card.querySelector('.lc-n').textContent = L.name;
    card.querySelector('.lc-goals').textContent = goalSummary(L).join('  ');
    card.classList.remove('out'); card.classList.add('show');
    sfx('level');
    await sleep(780);
    card.classList.add('out');
    await sleep(330);
    card.classList.remove('show', 'out');
  }

  tiles.forEach(t => { t.el.style.visibility = ''; t.el.classList.add('dropin'); });
  // longest delay is the far corner of the wave, plus the animation itself
  await sleep(((R - 1) + (C - 1)) * 42 + 520);
  tiles.forEach(t => t.el.classList.remove('dropin'));
  paintJellyLinks();
  busy = false;
}

async function playOutro() {
  if (REDUCED) return;
  const tiles = grid.flat().filter(Boolean);
  tiles.forEach(t => t.el.classList.add('sweepout'));
  await sleep(((R - 1 + C - 1) * 32) + 500);
  tiles.forEach(t => { t.el.classList.remove('sweepout'); t.el.style.opacity = '0'; });
}

// Was a screen shake. Jolting the whole board is unpleasant to look at and
// worse on a device held close to a small face, so the board flares instead —
// same "that was big" beat, none of the motion.
function shake() {
  if (REDUCED) return;
  const w = $('board-wrap');
  w.classList.remove('flash'); void w.offsetWidth; w.classList.add('flash');
  setTimeout(() => w.classList.remove('flash'), 440);
}

// `silent` is the mix tool driving it: that path has its own tumble animation
// and toast, so the automatic dead-board version's presentation is skipped.
async function reshuffle(silent) {
  if (!silent) { toast('🌀 Let\'s mix!'); sfx('mix'); }
  const flat = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++)
    if (grid[r][c] && grid[r][c].sp === SP_NONE && !grid[r][c].block && !grid[r][c].ice) flat.push(grid[r][c]);
  for (let tries = 0; tries < 80; tries++) {
    const ks = flat.map(t => t.k);
    for (let i = ks.length - 1; i > 0; i--) { const j = rnd(i + 1); [ks[i], ks[j]] = [ks[j], ks[i]]; }
    flat.forEach((t, i) => { t.k = ks[i]; });
    if (!runsOn(grid).length && anyMove()) break;
  }
  if (silent) { flat.forEach(t => paint(t)); return; }
  flat.forEach(t => { paint(t); t.el.classList.add('born'); });
  await sleep(360);
  flat.forEach(t => t.el.classList.remove('born'));
}

/* ---------------- interaction ---------------- */
function adjacent(a, b) { return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1; }

// Whichever fruit the rainbow would take if you set it off where it stands.
// activate() and the preview must agree, so they share this.
function commonKind() {
  const count = new Array(KINDS.length).fill(0);
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++)
    if (grid[r][c] && grid[r][c].k >= 0) count[grid[r][c].k]++;
  let best = 0; count.forEach((n, i) => { if (n > count[best]) best = i; });
  return best;
}
function clearAim() { board.querySelectorAll('.tile.aim').forEach(el => el.classList.remove('aim')); }
// Selecting a booster lights up exactly the fruit it would clear. This is the
// whole answer to "what does this thing do" — you see it before you commit,
// and nothing is spent finding out.
function showAim(t) {
  clearAim();
  if (!t || t.sp === SP_NONE) return;
  const keys = new Set();
  blastCells(t.r, t.c, t.sp, t.sp === SP_RAIN ? commonKind() : t.k, keys, t.radius);
  keys.forEach(key => {
    const x = grid[Math.floor(key / C)][key % C];
    if (x && x !== t) x.el.classList.add('aim');
  });
}
function select(t) {
  clearNudge();
  if (sel) sel.el.classList.remove('sel');
  sel = t;
  if (t) { t.el.classList.add('sel'); sfx('tap'); }
  showAim(t);
  setFoot(t && t.sp !== SP_NONE ? 'Tap it again to set it off! 💥' : null);
}

async function activate(t) {
  // Tapping an already-selected booster sets it off. Costs a move.
  if (busy || over) return;
  busy = true;
  const at = [t.r, t.c];
  select(null);
  spendMove();
  const keys = new Set([t.r * C + t.c]);
  if (t.sp === SP_RAIN) {
    blastCells(t.r, t.c, SP_RAIN, commonKind(), keys);
    await windUp(t);
    shockwave(at[0], at[1]);
    t.fired = true;
    const chain = expand(keys);
    buzz(40); shake();
    await sleep(REDUCED ? 0 : 95);
    await clearCells(keys, 2, at, at, null, chain);      // one bolt per fruit, in turn
    await gravity();
    await resolve(null);
    return settle();
  }
  // A tapped star or bomb detonates through expand() and nowhere else. `keys`
  // already holds this tile, and expand is the one place that knows how each
  // booster goes off — draws its blast, claims its area, and hands a bomb the
  // extra life that lets it fall and fire again. This used to do the first
  // blast here as WELL, and mark the tile fired so expand would skip it: two
  // copies of the same rule, which is how a tapped bomb once ended up clearing
  // nothing but itself when one copy lost a line, and which would silently
  // swallow the second blast now.
  t.fired = false;
  const chain = expand(keys);
  sfx('blast'); shake(); buzz(40);
  await sleep(REDUCED ? 0 : 95);
  await clearCells(keys, 2, at, null, null, chain);
  await gravity();
  await resolve(null);
  await settle();
}

/* ---------------- tool use ---------------- */
function paintTools() {
  const t = tools();
  document.querySelectorAll('#tools .tool').forEach(btn => {
    const id = btn.dataset.t, n = t[id] || 0;
    btn.querySelector('.ct').textContent = n;
    btn.classList.toggle('empty', n === 0);
    btn.classList.toggle('armed', armed === id);
    btn.setAttribute('aria-label', { hammer: 'hammer, pop any fruit', swap: 'swap any two fruit', mix: 'mix the board' }[id] + ', ' + n + ' left');
  });
  board.classList.toggle('picking', !!armed);
}
function armTool(id) {
  if (busy || over) return;
  const t = tools();
  if (!t[id]) { sfx('nope'); return; }
  armed = (armed === id) ? null : id;
  toolPick = null;
  select(null);
  clearNudge();
  sfx('tap');
  paintTools();
  setFoot(armed === 'hammer' ? 'Tap any fruit to pop it! 🔨'
        : armed === 'swap'   ? 'Tap two fruit next to each other 🔄'
        : armed === 'mix'    ? 'Tap the board to mix it up 🌀' : null);
}
function disarm() { armed = null; toolPick = null; paintTools(); setFoot(null); }

// A hammer swinging down onto the tile, landing, then lifting away.
function smash(r, c) {
  if (REDUCED) return;
  const cell = board.clientWidth / C;
  const el = document.createElement('div');
  el.className = 'smash';
  el.textContent = '🔨';
  el.style.left = (c * cell) + 'px';
  el.style.top = (r * cell) + 'px';
  // Into the WRAP, not the board: the swing starts 1.4 cells above the target,
  // which the board's overflow:hidden would slice off for anything on the top
  // row. The wrap shares the board's origin, so the coordinates are unchanged.
  $('board-wrap').appendChild(el);
  setTimeout(() => el.remove(), 440);
}

async function useHammer(t) {
  if (busy || over) return;
  busy = true;
  const at = [t.r, t.c];
  // Both of these used to charge you a hammer and then do nothing at all,
  // because clearCells refuses to pop a blocker or frozen fruit and the tool
  // was already spent by then. A duckling is refused outright — it has to reach
  // the floor, so smashing it would undo the goal you're spending the tool on —
  // and the tool stays armed for another tile. Frost is fair game: a hammer
  // taking the whole block off in one swing is what a hammer is for.
  // A duckling is refused outright — it has to reach the floor, so smashing it
  // would undo the goal you are spending the tool on. A gift or a coconut is
  // fair game: the hammer is a blast, and for a coconut it is the most reliable
  // blast a player can aim.
  if (t.block && !t.hits) { sfx('nope'); busy = false; return; }
  if (t.block) {
    if (!spendTool('hammer')) { busy = false; return; }
    disarm();
    smash(t.r, t.c); sfx('swing');
    await sleep(REDUCED ? 10 : 190);
    blockHitThisClear = new Set();
    hitBlock(t.r, t.c, true);
    await sleep(REDUCED ? 0 : 220);
    await gravity();
    await resolve(null);
    return settle();
  }
  if (t.ice) {
    if (!spendTool('hammer')) { busy = false; return; }
    disarm();
    smash(at[0], at[1]); sfx('swing');
    await sleep(REDUCED ? 10 : 190);
    iceHitThisClear = new Set();
    while (t.ice) { iceHitThisClear.clear(); hitIce(t.r, t.c); }
    await sleep(REDUCED ? 0 : 220);
    await gravity();
    await resolve(null);
    return settle();
  }
  if (!spendTool('hammer')) { busy = false; return; }
  disarm();
  // let the hammer actually fall before anything breaks
  smash(at[0], at[1]);
  sfx('swing');
  await sleep(REDUCED ? 10 : 190);
  const keys = new Set([at[0] * C + at[1]]);
  // A rainbow needs to be told which colour to hunt, so it is fired by hand. A
  // star or a bomb goes through expand() like everywhere else, which is what
  // gives a hammered bomb its second blast too.
  if (t.sp === SP_RAIN) {
    t.fired = true;
    blastCells(t.r, t.c, SP_RAIN, commonKind(), keys);
  } else if (t.sp !== SP_NONE) {
    t.fired = false;
  }
  const chain = expand(keys);
  sfx('blast'); buzz(45); shake();
  await sleep(REDUCED ? 0 : 95);
  await clearCells(keys, 1, at, null, null, chain);
  await gravity();
  await resolve(null);
  await settle();
}

async function useSwap(a, b) {
  if (busy || over) return;
  busy = true;
  if (!spendTool('swap')) { busy = false; return; }
  disarm();
  sfx('swap');
  const ar = a.r, ac2 = a.c, br = b.r, bc = b.c;
  a.el.classList.add('swapping'); b.el.classList.add('swapping');
  place(a, br, bc); place(b, ar, ac2);
  grid[br][bc] = a; grid[ar][ac2] = b;
  await sleep(REDUCED ? 20 : 200);
  a.el.classList.remove('swapping'); b.el.classList.remove('swapping');
  // The whole point is that it sticks even with no match — no revert here.
  if (groups().length) await resolve([[a.r, a.c], [b.r, b.c]]);
  await settle();
}

async function useMix() {
  if (busy || over) return;
  busy = true;
  if (!spendTool('mix')) { busy = false; return; }
  disarm();
  // Spin the whole board through a tumble; the re-deal happens at the midpoint
  // where every tile is small and blurred, so the swap itself is invisible.
  const tiles = grid.flat().filter(Boolean);
  if (!REDUCED) {
    tiles.forEach(t => t.el.classList.add('mixing'));
    sfx('mix');
    await sleep(320);
  }
  await reshuffle(true);
  if (!REDUCED) {
    await sleep(380);
    tiles.forEach(t => t.el.classList.remove('mixing'));
  }
  await resolve(null);
  await settle();
}

async function trySwap(a, b) {
  if (busy || over) return;
  // A duckling CAN be swapped. It still can't match — its kind is one the
  // matcher skips — so the move only stands if the fruit taking its place makes
  // a run, exactly like any other swap. That keeps the "every move is a match"
  // rule intact while letting you walk a duckling out of a column you can't
  // clear, which is the situation that used to leave the level down to luck.
  // Frost stays immovable: it is scenery until you break it.
  // One of the two has to be movable. Frost, gifts and coconuts are scenery
  // until they break; only a duckling can be shoved sideways.
  if (!a || !b) return;
  if (!canMove(a) || !canMove(b)) return;
  if (a.block && b.block) return;                  // two blockers, nothing to match
  busy = true;
  select(null);
  clearNudge();
  sfx('swap');

  // visual swap — both tiles lift and swell as they trade places
  const ar = a.r, ac2 = a.c, br = b.r, bc = b.c;
  a.el.classList.add('swapping'); b.el.classList.add('swapping');
  place(a, br, bc); place(b, ar, ac2);
  grid[br][bc] = a; grid[ar][ac2] = b;
  await sleep(REDUCED ? 20 : 200);
  a.el.classList.remove('swapping'); b.el.classList.remove('swapping');

  // Two boosters swapped together combine into something bigger than either.
  // This is the biggest reward in the game, so it gets a name and a toast.
  if (a.sp !== SP_NONE && b.sp !== SP_NONE) {
    spendMove();
    combosMade++;
    if (L.goals.some(g => g.t === 'combo')) paintGoals(true);
    const at = [b.r, b.c];
    const keys = new Set([a.r * C + a.c, b.r * C + b.c]);
    const pair = [a.sp, b.sp].sort().join('');
    let zapFrom = null;

    if (pair === String(SP_RAIN) + String(SP_RAIN)) {
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) keys.add(r * C + c);
      toast('🌈 EVERYTHING!');
      await windUp(isRain(a) ? a : b);
      shockwave(at[0], at[1]);
      zapFrom = at;                          // bolt every last fruit off the board
    } else if (a.sp === SP_RAIN || b.sp === SP_RAIN) {
      // Rainbow + booster: every fruit of that colour BECOMES that booster and
      // goes off. The showiest thing in the game.
      const other = isRain(a) ? b : a;
      const rb = isRain(a) ? a : b;
      const changed = [];
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
        const t = grid[r][c];
        if (t && t.k === other.k && t.sp === SP_NONE) {
          t.sp = other.sp; t.radius = other.radius; t.fired = false;
          changed.push(t);
        }
      }
      rb.fired = true;
      keys.add(rb.r * C + rb.c);
      // EVERY transformed tile has to go into the clear set. Without this only
      // the ones that happened to sit in the original booster's blast ever
      // fired, so most of the board it had just converted did nothing at all.
      changed.forEach(t => keys.add(t.r * C + t.c));
      toast(other.sp === SP_BOMB ? '💣 x' + changed.length + '!' : '⭐ x' + changed.length + '!');
      await windUp(rb);
      shockwave(at[0], at[1]);
      // Convert them one at a time, nearest first, so you watch the rainbow
      // seed the whole board before any of it goes off.
      if (!REDUCED) {
        changed.sort((p, q) => (Math.hypot(p.r - at[0], p.c - at[1]) - Math.hypot(q.r - at[0], q.c - at[1])));
        const step = changed.length > 12 ? 38 : 62;
        changed.forEach((t, i) => setTimeout(() => {
          paint(t); zap(at[0], at[1], t.r, t.c); converge(t.r, t.c, t.k); sfx('zap');
        }, i * step));
        await sleep(changed.length * step + 260);
      } else {
        changed.forEach(t => paint(t));
      }
    } else if (pair === String(SP_BOMB) + String(SP_BOMB)) {
      a.radius = 2; a.fired = false;         // one big 5x5 instead of two 3x3s
      b.sp = SP_NONE;
      keys.add(a.r * C + a.c);
      toast('💣 BIG BOOM!');
    } else if (pair === String(SP_STAR) + String(SP_BOMB)) {
      // A fat cross: three rows and three columns.
      const bomb = a.sp === SP_BOMB ? a : b, star = a.sp === SP_BOMB ? b : a;
      for (let d = -1; d <= 1; d++) {
        const rr = star.r + d, cc = star.c + d;
        if (rr >= 0 && rr < R) for (let i = 0; i < C; i++) keys.add(rr * C + i);
        if (cc >= 0 && cc < C) for (let i = 0; i < R; i++) keys.add(i * C + cc);
      }
      bomb.fired = star.fired = true;
      toast('⭐ MEGA CROSS!');
      fxMegaCross(star.r, star.c);
    } else {
      toast('⭐ DOUBLE!');                    // star + star: both crosses fire
    }

    const chain = expand(keys);
    sfx('blast'); shake(); buzz(60);
    await sleep(REDUCED ? 0 : 95);
    await clearCells(keys, 3, at, zapFrom, null, chain);
    await gravity();
    await resolve(null);
    return settle();
  }

  const rainbow = isRain(a) || isRain(b);
  if (rainbow) {
    spendMove();
    const rb = isRain(a) ? a : b;
    const at = [rb.r, rb.c];
    const keys = new Set([a.r * C + a.c, b.r * C + b.c]);
    const other = isRain(a) ? b : a;
    blastCells(other.r, other.c, SP_RAIN, other.k, keys);
    await windUp(rb);
    shockwave(at[0], at[1]);
    a.fired = b.fired = true;
    const chain = expand(keys);
    sfx('blast'); shake(); buzz(45);
    await sleep(REDUCED ? 0 : 95);
    await clearCells(keys, 2, at, at, null, chain);      // hunt the colour down one by one
    await gravity();
    await resolve(null);
    return settle();
  }

  if (!groups().length) {
    // Not a match — no penalty, no scolding, just a little "nope" wobble.
    place(a, ar, ac2); place(b, br, bc);
    grid[ar][ac2] = a; grid[br][bc] = b;
    a.el.classList.add('nope'); b.el.classList.add('nope');
    sfx('nope');
    setTimeout(() => { a.el.classList.remove('nope'); b.el.classList.remove('nope'); }, 360);
    await sleep(REDUCED ? 20 : 300);
    busy = false;
    armIdle();
    return;
  }

  spendMove();
  await resolve([[a.r, a.c], [b.r, b.c]]);
  await settle();
}

// Every one of these classes belongs to an animation that runs DURING a
// cascade, and every removal is conditional on some code path reaching it — an
// early return, a rejected promise, a tile that turned out not to pop. When one
// is missed the tile keeps the class forever, because paint() only knows about
// the classes that describe what a tile IS, not what it is doing. That is how a
// frozen fruit ended up stuck scaled-up and bleached until a reload. Sweeping
// them at rest costs one querySelectorAll per move and makes the whole family
// of leaks self-healing instead of permanent.
// Deliberately NOT swept: `born`, `land` and `push` all pair their add with an
// unconditional timer and may still be mid-flight here; `sel`, `aim` and
// `nudge` are meant to persist while the board is idle.
const FX_TRANSIENT = ['charge', 'suck', 'swapping', 'firing', 'mixing', 'dropin', 'sweepout'];
function fxSweep() {
  board.querySelectorAll('.tile.' + FX_TRANSIENT.join(',.tile.')).forEach(el => {
    el.classList.remove(...FX_TRANSIENT);
    el.style.transitionDuration = '';
    el.style.transitionTimingFunction = '';
  });
}

/* Jelly grows. Once per settled move each blob may copy itself onto ONE
   neighbouring plain fruit, which is what gives jelly the only real urgency in
   the game — every other element waits patiently to be dealt with.

   Three things keep it from ever becoming a fail state, which this game does not
   have and must not acquire by accident:
     · a hard cap on blobs, so it can crowd you but never take the board
     · only one new blob per move however many are sitting there, so it cannot
       outrun a player who is actually clearing them
     · never onto a leaf, a blocker or frozen fruit — a blob on a leaf would
       strand the leaf goal, since a leaf is swept by popping the fruit standing
       on it and a blocker is never popped. */
async function spreadJelly() {
  const blobs = grid.flat().filter(t => t && t.jelly);
  if (!blobs.length || blobs.length >= JELLY_CAP) return;
  const from = blobs[Math.floor(Math.random() * blobs.length)];
  const spots = [[0,1],[0,-1],[1,0],[-1,0]]
    .map(([dr, dc]) => [from.r + dr, from.c + dc])
    .filter(([r, c]) => cellOk(r, c) && grid[r][c] && !grid[r][c].block
                     && !grid[r][c].ice && !grid[r][c].jelly
                     && grid[r][c].sp === SP_NONE && !(covers[r] && covers[r][c]));
  if (!spots.length) return;
  const [r, c] = spots[Math.floor(Math.random() * spots.length)];
  const b = grid[r][c];
  b.jelly = 1; paint(b); paintJellyLinks();
  b.el.classList.remove('born'); void b.el.offsetWidth; b.el.classList.add('born');
  setTimeout(() => b.el.classList.remove('born'), 340);
  fxSparks(r, c, '#ff9de0', 10, .9);
  sfx('nope');
}

async function settle() {
  if (jellySpreads) { jellySpreads = false; await spreadJelly(); }
  paintJellyLinks();
  if (!anyMove()) await reshuffle();
  fxSweep();
  busy = false;
  paintHud();
  if (checkWin()) return;
  if (!freePlay && movesLeft <= 0) { $('more').classList.add('show'); return; }
  saveGame();
  armIdle();
}

board.addEventListener('pointerdown', ev => {
  if (busy || over) return;
  ac();                                     // unlock audio on first touch
  // A primed tool takes over the board entirely — no selecting, no dragging.
  if (armed === 'mix') { useMix(); return; }
  const el = ev.target.closest('.tile');
  if (!el) return;
  const t = tileFromEl(el);
  if (!t) return;
  // Frozen fruit isn't yours to move — it's scenery until you chip it off. A
  // duckling is, though: it can't match, but it can be shoved sideways.
  if (!canMove(t) && !armed) { sfx('nope'); return; }
  if (armed === 'hammer') { useHammer(t); return; }
  if (armed === 'swap') {
    if (!toolPick) { toolPick = t; t.el.classList.add('sel'); sfx('tap'); setFoot('Now tap the one next to it 🔄'); return; }
    if (toolPick === t) { toolPick.el.classList.remove('sel'); toolPick = null; setFoot('Tap two fruit next to each other 🔄'); return; }
    if (!adjacent(toolPick, t)) { sfx('nope'); return; }
    const a = toolPick;
    a.el.classList.remove('sel');
    useSwap(a, t);
    return;
  }
  drag = { t, x: ev.clientX, y: ev.clientY, done: false };
  if (sel && sel !== t && adjacent(sel, t)) { const s = sel; drag.done = true; trySwap(s, t); return; }
  if (sel === t) { drag.done = true; if (t.sp !== SP_NONE) activate(t); else select(null); return; }
  select(t);
});
let drag = null;
board.addEventListener('pointermove', ev => {
  if (!drag || drag.done || busy || armed) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  const cell = board.clientWidth / C;
  if (Math.hypot(dx, dy) < cell * .42) return;
  drag.done = true;
  const [dr, dc] = Math.abs(dx) > Math.abs(dy) ? [0, Math.sign(dx)] : [Math.sign(dy), 0];
  const r2 = drag.t.r + dr, c2 = drag.t.c + dc;
  if (r2 < 0 || r2 >= R || c2 < 0 || c2 >= C) return;
  const target = grid[r2][c2];
  // The tap path refused frozen fruit; the DRAG path did not, so you could
  // swipe a fruit straight into a block of ice.
  if (!target) { sfx('nope'); return; }
  if (drag.t.block && target.block) { sfx('nope'); return; }
  if (!canMove(drag.t) || !canMove(target)) { sfx('nope'); return; }
  trySwap(drag.t, target);
});
board.addEventListener('pointerup', () => { drag = null; });
board.addEventListener('pointercancel', () => { drag = null; });

function tileFromEl(el) {
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (grid[r][c] && grid[r][c].el === el) return grid[r][c];
  return null;
}

/* ---------------- gentle nudge instead of a timer ---------------- */
function clearNudge() {
  nudged.forEach(t => t.el.classList.remove('nudge'));
  nudged = [];
  if (handEl) { handEl.remove(); handEl = null; }
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
}
// A finger that actually travels from one tile to the other. Pulsing two tiles
// said "look here"; this says "trade these two", which is the thing a child who
// can't read the footnote needs to be told.
function showHand(a, b) {
  if (REDUCED) return;
  const cell = board.clientWidth / C;
  handEl = document.createElement('div');
  handEl.className = 'hand';
  handEl.textContent = '👆';
  handEl.style.setProperty('--hx0', (a[1] * cell) + 'px');
  handEl.style.setProperty('--hy0', (a[0] * cell) + 'px');
  handEl.style.setProperty('--hx1', (b[1] * cell) + 'px');
  handEl.style.setProperty('--hy1', (b[0] * cell) + 'px');
  board.appendChild(handEl);
}
// `fast` is the first-run tutorial: on a brand-new save the hand shows up in a
// couple of seconds instead of six, so nobody has to be told how to play.
function armIdle(fast) {
  clearNudge();
  idleTimer = setTimeout(() => {
    if (busy || over || sel) { armIdle(); return; }
    const mv = hintMove();
    if (!mv) return;
    nudged = mv.map(([r, c]) => grid[r][c]).filter(Boolean);
    nudged.forEach(t => t.el.classList.add('nudge'));
    showHand(mv[0], mv[1]);
    idleTimer = setTimeout(() => { clearNudge(); armIdle(); }, 5200);
  }, fast ? 2200 : 6000);
}

/* ---------------- HUD ---------------- */
function spendMove() {
  jellySpreads = true;
  if (freePlay) return;
  movesLeft--; movesUsed++;
  const box = $('moves-box');
  box.classList.remove('bump'); void box.offsetWidth; box.classList.add('bump');
  paintHud();
}
let footBase = '';
function setFoot(msg) { $('foot').textContent = msg || footBase; }
function paintHud() {
  $('score').textContent = score.toLocaleString() + ' points';
  $('moves-n').textContent = freePlay ? '∞' : Math.max(0, movesLeft);
  $('moves-box').classList.toggle('low', !freePlay && movesLeft <= 3);
}
function miniTile(k) {
  const K = KINDS[k];
  return '<span class="mini"><span class="shape" style="border-radius:30%;background:linear-gradient(160deg,'
       + K.from + ',' + K.to + ')"></span><span class="face">' + K.emoji + '</span></span>';
}
let goalSig = '';
// One chip per goal, whatever kind it is.
function goalChip(g) {
  if (g.t === 'fruit') return miniTile(g.k);
  // The ice chip is a miniature of the block itself, not a 🧊 glyph — the chip
  // should look like the thing you're being asked to break.
  const face = g.t === 'leaf' ? '🍃'
             : g.t === 'score' ? '🏆'
             : g.t === 'drop' ? '🐤'
             : g.t === 'gift' ? '🎁'
             : g.t === 'jelly' ? ''
             : g.t === 'combo' ? '💥'
             : g.t === 'chain' ? '🔥'
             : g.t === 'ice' ? ''
             : '✨';
  const bg = g.t === 'leaf' ? 'linear-gradient(160deg,#d6f5b0,#7cc94e)'
           : g.t === 'score' ? 'linear-gradient(160deg,#ffe08a,#f5a524)'
           : g.t === 'drop' ? 'linear-gradient(160deg,#fff2c4,#ffd469)'
           : g.t === 'gift' ? 'linear-gradient(160deg,#ffd9ee,#ff7fbe)'
           // The same blob as on the board: round, glossy, pink. A chip should be
           // a picture of the thing it is asking about.
           : g.t === 'jelly' ? 'radial-gradient(115% 115% at 38% 28%,#ffd2f2,#ff7bd5 45%,#b81f9c)'
           : g.t === 'combo' ? 'linear-gradient(160deg,#ffd0a0,#ff7a3c)'
           : g.t === 'chain' ? 'linear-gradient(160deg,#ffcf7a,#f2542d)'
           // Same rim-and-window build as the block on the board, but with the
           // window pulled in tight. At 24px a wide clear centre leaves nothing
           // but a pale blob — there is no fruit behind the chip for it to be a
           // window ONTO, so the collar has to carry the whole read.
           : g.t === 'ice' ? 'radial-gradient(115% 115% at 46% 32%,#f2fcff 0 14%,#8fd2f5 44%,#3f9ad8 100%)'
           : 'linear-gradient(160deg,#cfe4ff,#7aa8ff)';
  if (g.t === 'jelly') return '<span class="mini"><span class="shape" style="border-radius:48% 52% 52% 48% / 50% 48% 52% 50%'
    + ';background:radial-gradient(115% 115% at 38% 28%,#ffd2f2,#ff7bd5 45%,#b81f9c)'
    + ';box-shadow:inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(120,10,95,.4)"></span></span>';
  const extra = g.t === 'ice'
    ? ';box-shadow:inset 0 0 0 1px rgba(245,253,255,.95), inset 0 0 0 3px rgba(78,166,220,.75),'
      + ' inset 0 -3px 4px rgba(12,74,128,.4)' : '';
  return '<span class="mini"><span class="shape" style="border-radius:26%;background:' + bg + extra
       + '"></span><span class="face">' + face + '</span></span>';
}
// Short "12🍓 6🍃" style summary, used on the level card and the menu.
function goalSummary(lv) {
  return lv.goals.map(g =>
      g.t === 'fruit' ? g.need + KINDS[g.k].emoji
    : g.t === 'leaf'  ? g.need + '🍃'
    : g.t === 'score' ? g.need.toLocaleString() + '🏆'
    : g.t === 'drop'  ? g.need + '🐤'
    : g.t === 'ice'   ? g.need + '🧊'
    : g.t === 'gift'  ? g.need + '🎁'
    : g.t === 'jelly' ? g.need + '🫧'
    : g.t === 'combo' ? g.need + '💥'
    : g.t === 'chain' ? g.need + '🔥'
    : g.need + '✨');
}
function goalLabel(g) {
  // Most levels want several of a thing, but plenty want exactly one duckling,
  // and "bring 1 ducklings down" is the sort of thing a parent reads aloud.
  const q = (one, many) => g.need + ' ' + (g.need === 1 ? one : many);
  return g.t === 'fruit' ? 'collect ' + q(KINDS[g.k].name, plural(g.k))
       : g.t === 'leaf'  ? 'sweep ' + q('leaf', 'leaves')
       : g.t === 'score' ? 'score ' + g.need.toLocaleString() + ' points'
       : g.t === 'drop'  ? 'bring ' + q('duckling', 'ducklings') + ' down'
       : g.t === 'ice'   ? 'break ' + q('ice block', 'ice blocks')
       : g.t === 'gift'  ? 'open ' + q('gift', 'gifts')
       : g.t === 'jelly' ? 'clear the board of bubblegum'
       : g.t === 'combo' ? 'combine ' + q('pair of boosters', 'pairs of boosters')
       : g.t === 'chain' ? 'set off ' + q('big chain', 'big chains')
       : 'make ' + q('booster', 'boosters');
}
// What the chip is asking for, as a title — "Break 8 ice blocks".
function goalTitle(g) {
  const s = goalLabel(g);
  return s[0].toUpperCase() + s.slice(1);
}
// ...and HOW you do it, in one sentence. Every one of these names the action,
// because knowing a level wants ice is useless if you don't know that ice
// breaks from a match BESIDE it rather than on it.
// "grapes" is already plural; the rest just take an s.
function plural(k) { const n = KINDS[k].name; return n.endsWith('s') ? n : n + 's'; }
function goalHow(g) {
  return g.t === 'fruit' ? 'Line up 3 or more ' + plural(g.k) + ' to pop them.'
       : g.t === 'leaf'  ? 'Pop the fruit sitting on a leaf and the leaf goes with it.'
       : g.t === 'score' ? 'Every pop scores. Bigger matches are worth more.'
       // The swap is the part nobody discovers on their own, and it's the
       // difference between a stuck column and a solvable one.
       : g.t === 'drop'  ? 'Clear the fruit under a duckling so it falls. You can slide a duckling sideways too.'
       : g.t === 'ice'   ? 'Match the frozen fruit itself, or any fruit right beside it.'
       : g.t === 'gift'  ? 'Match fruit right beside a gift to knock it open. A booster pops out!'
       : g.t === 'jelly' ? 'Match beside the bubblegum to unstick it. Be quick — it spreads!'
       : g.t === 'combo' ? 'Swap one booster straight onto another one.'
       : g.t === 'chain' ? 'One clear that keeps going three times over. Big matches start them.'
       : 'Match 4 or 5 at once instead of 3 to make one.';
}

/* A tooltip, because the chips can only ever be pictures and a number — there
   is no room to say what a duckling wants. Tap to open, tap anywhere to close,
   and it times out on its own so it can't be left covering the board. */
let tipEl = null, tipTimer = null, tipFor = -1;
function hideTip() {
  if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
  tipFor = -1;
  if (!tipEl) return;
  const el = tipEl; tipEl = null;
  el.classList.remove('show');
  setTimeout(() => el.remove(), 220);
}
function showTip(chip, g, i) {
  hideTip();
  tipFor = i;
  const el = document.createElement('div');
  el.className = 'tip';
  el.setAttribute('role', 'status');
  el.innerHTML = '<b></b><span></span>';
  el.querySelector('b').textContent = goalTitle(g);
  el.querySelector('span').textContent = goalHow(g);
  document.body.appendChild(el);
  const r = chip.getBoundingClientRect(), w = el.offsetWidth;
  // Centre on the chip, then pull back inside the screen and point the arrow at
  // where the chip actually is — on a narrow phone an edge chip's bubble has to
  // slide across, and an arrow left at 50% would then point at nothing.
  const cx = r.left + r.width / 2;
  const left = Math.max(8, Math.min(cx - w / 2, window.innerWidth - w - 8));
  el.style.left = left + 'px';
  el.style.top = (r.bottom + 9) + 'px';
  el.style.setProperty('--ax', Math.max(12, Math.min(cx - left, w - 12)) + 'px');
  requestAnimationFrame(() => el.classList.add('show'));
  tipEl = el;
  tipTimer = setTimeout(hideTip, 5000);
}
// Anything else the player does puts it away.
document.addEventListener('pointerdown', ev => {
  if (tipEl && !ev.target.closest('.goal')) hideTip();
}, true);

// How far along a goal is, and what it needs.
function goalProgress(g, i) {
  if (g.t === 'leaf')  return Math.max(0, g.need - coversLeft);
  if (g.t === 'score') return Math.min(g.need, score);
  if (g.t === 'boost') return Object.values(boostMade).reduce((a, b) => a + b, 0);
  if (g.t === 'drop')  return ducksHome;
  if (g.t === 'ice')   return g.need - iceLeft;
  if (g.t === 'gift')  return giftsOpened;
  if (g.t === 'jelly') return Math.max(0, g.need - jellyOn());
  if (g.t === 'combo') return combosMade;
  if (g.t === 'chain') return bigChains;
  return goalGot[i] || 0;
}
function paintGoals(animate) {
  const host = $('goals');
  // Rebuild on the actual goal set, not the chip count — two levels can want
  // the same NUMBER of chips but different ones, which used to leave the
  // previous level's chip sitting there showing this level's numbers.
  const sig = L.name + '|' + L.goals.map(g => [g.t, g.k, g.sp, g.need].join(':')).join(',');
  if (!L.goals.length) { host.innerHTML = ''; goalSig = sig; hideTip(); return; }
  if (sig !== goalSig) {
    goalSig = sig;
    hideTip();
    host.innerHTML = L.goals.map((g, i) =>
      '<button type="button" class="goal" data-i="' + i + '" aria-label="'
      + goalTitle(g) + '. ' + goalHow(g) + '">'
      + '<span class="fill"></span>' + goalChip(g) + '<span class="num"></span></button>').join('');
    [...host.children].forEach((chip, i) => {
      chip.onclick = () => {
        sfx('tap');
        // Tapping the open one closes it, so a chip is a toggle rather than a
        // thing you can only dismiss by poking elsewhere.
        if (tipFor === i) { hideTip(); return; }
        showTip(chip, L.goals[i], i);
      };
    });
  }
  L.goals.forEach((g, i) => {
    const chip = host.children[i];
    const got = goalProgress(g, i);
    const done = got >= g.need;
    chip.querySelector('.num').textContent = done ? '✓'
      : (g.t === 'score' ? got.toLocaleString() + '/' + g.need.toLocaleString() : got + '/' + g.need);
    chip.querySelector('.fill').style.width = Math.min(100, got / g.need * 100) + '%';
    chip.classList.toggle('done', done);
    if (animate) { chip.classList.remove('pulse'); void chip.offsetWidth; chip.classList.add('pulse'); }
  });
}
function goalMet() { return L.goals.every((g, i) => goalProgress(g, i) >= g.need); }

/* ---------------- win ---------------- */
function checkWin() {
  if (freePlay || over || !goalMet()) return false;
  over = true;
  clearNudge();
  clearSave();
  let n = 3;
  if (usedHelp) n = 1;
  else if (movesUsed > par2(L)) n = 1;
  else if (movesUsed > par3(L)) n = 2;
  setStar(levelNo, n);
  addTotal(score);              // points are kept forever
  unlockLevel(levelNo + 1);     // there is always a next level
  // Every level pays out a tool, rotating so the stock stays balanced, plus a
  // bonus one for three stars. This is the only way to get them — no shop.
  const won1 = TOOL_IDS[levelNo % TOOL_IDS.length];
  grantTool(won1);
  const won2 = n === 3 ? TOOL_IDS[(levelNo + 1) % TOOL_IDS.length] : null;
  if (won2) grantTool(won2);
  $('win-prize').textContent = won2
    ? 'You won ' + TOOL_ICON[won1] + ' and ' + TOOL_ICON[won2] + '!'
    : 'You won a ' + TOOL_ICON[won1] + '!';
  paintMenu();
  sfx('win'); buzz([80, 60, 80, 60, 160]);
  $('win-title').textContent = n === 3 ? 'Perfect!' : n === 2 ? 'Great job!' : 'You did it!';
  $('win-sub').textContent = score.toLocaleString() + ' points · 🏆 ' + totalScore().toLocaleString() + ' total';
  $('win-mascot').textContent = ['🐻', '🐰', '🦊', '🐸', '🐨'][rnd(5)];
  const row = $('starrow').children;
  for (let i = 0; i < 3; i++) row[i].classList.remove('on');
  $('next-btn').textContent = 'Level ' + (levelNo + 1) + ' ▸';
  // Clear the board away first — the celebration lands on an empty stage
  // instead of covering up a board still full of fruit.
  (async () => {
    await playOutro();
    confettiBurst(); cannon('left'); cannon('right');
    $('win').classList.add('show');
    setTimeout(() => { if ($('win').classList.contains('show')) { cannon('left'); cannon('right'); } }, 850);
    for (let i = 0; i < n; i++) setTimeout(() => { row[i].classList.add('on'); sfx('star', i); }, 420 + i * 340);
  })();
  return true;
}

const CONF = ['#ffd34d', '#ff9d5c', '#ff8fb2', '#54c452', '#4aa3ff', '#a394ff', '#7df5b9'];
function confPiece(k) {
  const w = 7 + Math.random() * 9, round = Math.random() < .5;
  const p = document.createElement('span');
  p.style.width = w + 'px';
  p.style.height = (round ? w : w * (.4 + Math.random() * .55)) + 'px';
  p.style.background = CONF[k % CONF.length];
  p.style.borderRadius = round ? '50%' : '2px';
  return p;
}
function confettiBurst() {
  if (REDUCED) return;
  for (let k = 0; k < 70; k++) {
    const s = confPiece(k);
    s.className = 'confetti';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (2.2 + Math.random() * 2.5) + 's';
    s.style.animationDelay = (Math.random() * .8) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 6000);
  }
}
function cannon(side) {
  if (REDUCED) return;
  const dir = side === 'left' ? 1 : -1;
  for (let k = 0; k < 26; k++) {
    const outer = document.createElement('span');
    outer.className = 'cann-x';
    outer.style.left = side === 'left' ? '3vw' : '97vw';
    outer.style.setProperty('--tx', (dir * (12 + Math.random() * 62)) + 'vw');
    const inner = document.createElement('span');
    inner.className = 'cann-y';
    inner.style.setProperty('--rise', -(34 + Math.random() * 42) + 'vh');
    const p = confPiece(k);
    p.className = 'cann-p';
    p.style.animationDuration = (.35 + Math.random() * .4) + 's';
    inner.appendChild(p); outer.appendChild(inner);
    document.body.appendChild(outer);
    setTimeout(() => outer.remove(), 2600);
  }
}

/* ---------------- screens & routing ---------------- */
function paintMenu() {
  const s = stars();
  const mx = maxLevel();
  $('totals').innerHTML =
      '<span class="tot" aria-label="stars earned">⭐ ' + totalStars() + '</span>'
    + '<span class="tot" aria-label="total points">🏆 ' + totalScore().toLocaleString() + '</span>';

  // Continue on the first level not yet beaten, else the newest one unlocked.
  let next = mx;
  for (let i = 1; i <= mx; i++) if (!s[i]) { next = i; break; }
  const play = $('play-btn');
  play.textContent = '▶ Level ' + next;
  play.dataset.n = next;

  let html = '';
  for (let i = 1; i <= mx; i++) {
    const st = s[i] || 0;
    html += '<button class="lvl-chip' + (i === next ? ' cur' : '') + '" data-n="' + i + '"'
      + ' aria-label="Level ' + i + (st ? ', ' + st + ' stars' : '') + '">'
      + '<span class="n">' + i + '</span>'
      + '<span class="s">' + (st ? '⭐'.repeat(st) : '') + '</span></button>';
  }
  // A grid holding one chip just looks broken — there's nothing to pick yet.
  $('levels').style.display = mx > 1 ? '' : 'none';
  $('levels').innerHTML = html;
  const cur = $('levels').querySelector('.cur');
  if (cur) cur.scrollIntoView({ block: 'nearest' });
}

function start(idx, resume, quiet) {
  freePlay = idx === 'free';
  levelNo = freePlay ? 0 : idx;
  setTheme(levelNo);
  L = freePlay ? FREE : levelFor(idx);
  R = L.rows; C = L.cols; KN = L.kinds;
  score = 0; movesLeft = L.moves; movesUsed = 0; usedHelp = false; over = false; busy = false; sel = null;
  goalGot = L.goals.map(() => 0);
  boostMade = {}; ducksHome = 0; iceLeft = 0;
  giftsOpened = 0; jellyCleared = 0; combosMade = 0; bigChains = 0;
  bombAgain = [];               // never carry a pending blast into a new level
  hideTip();
  sinceBooster = 0;

  if (resume) {
    score = resume.score; movesLeft = resume.movesLeft; movesUsed = resume.used;
    usedHelp = !!resume.helped; goalGot = resume.got.slice();
    boostMade = resume.made || {};
    ducksHome = resume.home || 0;
    giftsOpened = resume.gift || 0; jellyCleared = resume.jel || 0;
    combosMade = resume.combo || 0; bigChains = resume.chain || 0;
  }

  $('menu').classList.add('hidden');
  $('game').classList.remove('hidden');
  document.documentElement.classList.add('in-game');   // reveals the header's middle
  $('win').classList.remove('show');
  $('more').classList.remove('show');
  $('resume').classList.remove('show');
  $('lv-name').textContent = L.name;
  footBase = freePlay ? 'Pop as much as you like. 🎈'
    : L.covers ? 'Pop the fruit sitting on the leaves 🍃'
    : 'Tap a fruit, then the one next to it.';
  setFoot(null);

  // Free Play should feel fresh every time; a numbered level must not.
  levelRng = freePlay ? Math.random : mulberry32(((idx * 2246822519) ^ 0x9E3779B9) >>> 0);
  setShape(L.shape || 'full');   // must precede any board build — it defines the cells
  layout();
  if (resume) {
    restoreBoard(resume.grid);
    restoreCovers(resume.cov);
    // Saves are only ever written from a settled board, so a run here means a
    // stale or hand-edited save — deal a fresh board rather than gift a match.
    if (runsOn(grid).length) {
      buildBoard();
      makeCovers(L.covers || 0, L.pattern);
      placeBlocks(L.ducks || 0, L.ice || 0, mulberry32(((levelNo || 1) * 40503) >>> 0), L.thickIce || 0,
                L.gifts || 0, L.jelly || 0, L.gen);
    } else restoreBlocks(resume.blk);
  } else {
    buildBoard();
    makeCovers(L.covers || 0, L.pattern);
    placeBlocks(L.ducks || 0, L.ice || 0, mulberry32(((levelNo || 1) * 40503) >>> 0), L.thickIce || 0,
                L.gifts || 0, L.jelly || 0, L.gen);
  }
  paintJellyLinks();
  paintGoals(false);
  paintHud();
  armed = null; toolPick = null;
  paintTools();
  // If a restored board happens to be dead, mix it before the child touches it.
  if (!anyMove()) reshuffle();

  // Play the arrival, and hold input until the board has finished landing.
  // Resuming skips the card — the "welcome back" dialog is already the intro.
  busy = true;
  playIntro(!quiet && !resume).then(() => {
    // First ever game? Bring the pointing hand in early — that's the tutorial.
    armIdle(!freePlay && levelNo === 1 && !Object.keys(stars()).length);
  });
}

function applyRoute() {
  const h = location.hash;
  if (h === '#free') { start('free'); return; }
  const m = /^#lvl-(\d+)$/.exec(h);
  if (m) {
    const i = Number(m[1]);
    // Levels never run out, but you can't skip ahead to one you haven't reached.
    if (i >= 1 && i <= maxLevel()) {
      const sv = loadSave();
      const ok = validSave(sv, i);
      start(i, ok ? sv : null);
      // Only ask when there's progress worth keeping — a level opened and left
      // untouched has nothing to decide about.
      if (ok && sv.used > 0) { clearNudge(); $('resume').classList.add('show'); }
      return;
    }
  }
  showMenu();
}
window.addEventListener('hashchange', applyRoute);

  $('t-vibe').classList.toggle('off', !vibeOn);
}
$('t-sound').onclick = () => { soundOn = !soundOn; localStorage.setItem('match3-sound', soundOn ? 'on' : 'off'); paintToggles(); if (soundOn) sfx('pop', 0); };
$('t-vibe').onclick  = () => { vibeOn = !vibeOn; localStorage.setItem('match3-vibe', vibeOn ? 'on' : 'off'); paintToggles(); if (vibeOn) buzz(30); };
// iOS has no Vibration API at all — don't offer a switch that does nothing.
if (!navigator.vibrate) $('vibe-row').style.display = 'none';
paintToggles();

/* ---------------- no zooming ----------------
   Tapping an already-selected booster to set it off IS a double tap, so the
   browser's double-tap-to-zoom actively fights the game. touch-action already
   asks for this, but iOS Safari ignores user-scalable, so the gestures are
   swallowed explicitly too. */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
let lastTap = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  // Only the *second* tap of a quick pair is cancelled, so ordinary taps and
  // scrolling are untouched.
  if (now - lastTap <= 320) e.preventDefault();
  lastTap = now;
}, { passive: false });

window.addEventListener('pagehide', saveGame);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });

applyRoute();
</script>
</body>
</html>
