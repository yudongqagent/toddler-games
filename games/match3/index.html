<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ff6f91">
<title>Fruit Pop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍓</text></svg>">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  /* ---------- shared outer shell (identical in every game) ----------------
     Safe-area insets go through variables so the whole app reads them from
     one place — and so they can be overridden to rehearse a notch/Dynamic
     Island on a device that doesn't have one. */
  :root {
    --sat:env(safe-area-inset-top, 0px);
    --sar:env(safe-area-inset-right, 0px);
    --sab:env(safe-area-inset-bottom, 0px);
    --sal:env(safe-area-inset-left, 0px);
    --chrome:clamp(44px,10vw,54px);   /* corner button size */
    --cgap:10px;                      /* its margin from the safe edge */
    --appbar-h:calc(var(--sat) + var(--chrome) + var(--cgap) * 2);
  }
  /* The gradient lives on <html>, not <body>: the root background is painted
     over the whole canvas, so it reaches under the home indicator instead of
     stopping at the body box and leaving a white strip when installed. */
  /* Every level was the same sunset. Board SHAPES were tried as the source of
     variety and rejected — a clipped board is a smaller board — so variety has
     to come from behind the board instead, where it costs nothing and takes
     nothing away from the play area.
     The gradient is driven by three custom properties, so a theme is three
     colours and the transition between levels is free. */
  html {
    background:linear-gradient(160deg, var(--bg1,#ffb37a) 0%, var(--bg2,#ff8fa8) 45%, var(--bg3,#c98bff) 100%);
    background-attachment:fixed;
    transition:--bg1 .6s linear, --bg2 .6s linear, --bg3 .6s linear;
  }
  html, body {
    height:100%; overflow:hidden;
    touch-action:manipulation;
    user-select:none; -webkit-user-select:none;
    font-family:-apple-system-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", "Comic Sans MS", sans-serif;
  }
  body {
    background:none;
    display:flex; flex-direction:column; align-items:center;
  }

  /* One header row on every screen of every game: back on the left, settings
     on the right, and whatever that game needs in between. Nothing else may
     live up here, and nothing else may overlap it. */
  .appbar {
    position:fixed; top:0; left:0; right:0; z-index:60;
    height:var(--appbar-h);
    display:flex; align-items:center; gap:10px;
    padding:calc(var(--sat) + var(--cgap)) calc(var(--sar) + var(--cgap))
            var(--cgap) calc(var(--sal) + var(--cgap));
    pointer-events:none;              /* taps fall through the empty middle */
  }
  .appbar > * { pointer-events:auto; }
  .appbar-mid {
    flex:1; min-width:0;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  html:not(.in-game) .appbar-mid { visibility:hidden; }
  .chrome-btn {
    flex:none;
    width:var(--chrome); height:var(--chrome);
    border:none; cursor:pointer; border-radius:50%;
    background:#ffffffee; color:#ff6f91;
    display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--chrome) * .46); font-weight:800; font-family:inherit;
    box-shadow:0 4px 0 rgba(0,0,0,.15), inset 0 2px 0 rgba(255,255,255,.9);
    transition:transform .1s;
  }
  .chrome-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.15); }
  .chrome-btn[hidden] { visibility:hidden; }
  /* A custom property built from env() can't be read back resolved, so park
     the four insets on a probe's padding — computed padding IS in pixels. */
  #safe-probe {
    position:fixed; left:0; top:0; width:0; height:0;
    visibility:hidden; pointer-events:none;
    padding:var(--sat) var(--sar) var(--sab) var(--sal);
  }

  .bub {
    position:fixed; border-radius:50%; z-index:0; pointer-events:none;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.5), rgba(255,255,255,.08) 70%);
    animation:drift ease-in-out infinite alternate;
  }
  @keyframes drift { from{transform:translate(0,0) scale(1)} to{transform:translate(4vw,-6vh) scale(1.12)} }

  .screen {
    position:absolute; inset:0; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:min(2.4vh,16px);
    /* every screen sits below the chrome row, so the corner buttons never
       land on content and the Dynamic Island never lands on either */
    padding:var(--appbar-h) max(12px, var(--sar))
            max(10px, var(--sab)) max(12px, var(--sal));
    transition:opacity .32s cubic-bezier(.4,0,.2,1), transform .32s cubic-bezier(.4,0,.2,1);
  }
  .screen.hidden { opacity:0; pointer-events:none; transform:scale(.92) translateY(16px); }
  /* A short landscape screen has no vertical room to spare — the board, the
     topbar, the goals and the pinned tool bar already fill it. So pay for the
     back button out of the left margin instead of off the top. */
  /* a short landscape screen has no height to spare — shrink the header so the
     board keeps as much of it as possible, but still give it its own row */
  @media (orientation:landscape) and (max-height:560px) {
    :root { --chrome:44px; --cgap:6px; }
    .screen {
      padding:var(--appbar-h) max(12px,var(--sar))
              max(8px,var(--sab)) max(12px,var(--sal));
    }
  }

  /* ---------------- MENU ---------------- */
  #menu { overflow-y:auto; justify-content:flex-start; }
  #menu > * { flex-shrink:0; }
  #menu > :first-child { margin-top:auto; }
  #menu > :last-child { margin-bottom:auto; }
  #menu h1 {
    font-size:clamp(30px,8vw,56px); color:#fff; text-align:center;
    text-shadow:0 3px 0 rgba(170,60,90,.35);
    animation:bob 2.5s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  #menu .subtitle { font-size:clamp(15px,4vw,22px); color:#ffffffdd; font-weight:700; margin-top:-6px; }

  .levels {
    display:grid; grid-template-columns:repeat(2, minmax(140px,220px));
    gap:min(3vw,16px); width:min(92vw,500px);
  }
  @media (max-width:360px){ .levels{grid-template-columns:1fr;} }
  .level-btn {
    border:none; cursor:pointer; border-radius:26px;
    padding:min(2.4vh,18px) 10px;
    font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    box-shadow:0 6px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.55);
    transition:transform .1s, box-shadow .1s;
  }
  .level-btn:active { transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.55); }
  .level-btn .emoji { font-size:clamp(30px,7.5vw,46px); filter:drop-shadow(0 3px 3px rgba(0,0,0,.15)); }
  .level-btn .name { font-size:clamp(17px,4.4vw,23px); font-weight:800; color:#4a2800; }
  .level-btn .desc { font-size:clamp(11px,2.9vw,14px); font-weight:700; color:#4a280099; }
  .level-btn .stars { font-size:clamp(12px,3vw,16px); min-height:1.3em; letter-spacing:1px; }
  .l1{background:linear-gradient(#ffd9a8,#ffb35c);} .l2{background:linear-gradient(#fff0a0,#ffd93d);}
  .l3{background:linear-gradient(#b8f0b0,#72dd68);} .l4{background:linear-gradient(#c9c2ff,#9d8bff);}
  .l5{background:linear-gradient(#a8ead8,#45c5a4);} .l6{background:linear-gradient(#ffc6da,#ff8bb0);}
  .free-btn {
    grid-column:1 / -1;
    background:linear-gradient(100deg,#ff7a8a,#ffb347 35%,#7ddf8a 70%,#6bb8ff);
  }
  .free-btn .name { color:#fff; text-shadow:0 2px 0 rgba(120,40,70,.45); }
  .free-btn .desc { color:#fff2; color:#ffffffdd; }

  /* totals that never reset — the number that always goes up */
  .totals { display:flex; gap:10px; }
  .tot {
    background:rgba(255,255,255,.92); border-radius:999px;
    padding:6px 16px; font-weight:800; color:#c2410c;
    font-size:clamp(14px,3.8vw,18px);
    box-shadow:0 3px 0 rgba(0,0,0,.13);
  }
  .play-btn {
    border:none; cursor:pointer; font-family:inherit; font-weight:800; color:#fff;
    background:linear-gradient(#ff9a62,#ff6f91);
    border-radius:26px; padding:min(2.2vh,16px) 34px;
    font-size:clamp(20px,5.6vw,28px);
    box-shadow:0 6px 0 rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.35);
    text-shadow:0 2px 0 rgba(150,40,70,.35);
  }
  .play-btn:active { transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.35); }

  /* every level you've unlocked, forever */
  .lvl-grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(clamp(52px,13vw,64px), 1fr));
    gap:min(2vw,9px); width:min(92vw,500px);
    max-height:32vh; overflow-y:auto;
    padding:4px; border-radius:18px;
    background:rgba(255,255,255,.16);
  }
  .lvl-chip {
    border:none; cursor:pointer; font-family:inherit;
    border-radius:16px; padding:7px 2px 5px;
    background:linear-gradient(#fff,#ffe4cf);
    box-shadow:0 3px 0 rgba(0,0,0,.16);
    display:flex; flex-direction:column; align-items:center; gap:1px;
  }
  .lvl-chip:active { transform:translateY(3px); box-shadow:none; }
  .lvl-chip .n { font-size:clamp(15px,4vw,19px); font-weight:800; color:#c2410c; line-height:1.1; }
  .lvl-chip .s { font-size:9px; letter-spacing:-2px; min-height:1.1em; }
  .lvl-chip.cur {
    background:linear-gradient(#ffd08a,#ff9f43);
    box-shadow:0 3px 0 rgba(0,0,0,.16), 0 0 0 3px #fff;
  }
  .lvl-chip.cur .n { color:#7a3300; }


  /* ---------------- GAME ---------------- */
  /* room at the foot for the pinned tool bar */
  #game { justify-content:center; gap:min(2.6vh,18px); padding-bottom:clamp(84px,14vh,112px); }
  #game .side { display:flex; flex-direction:column; align-items:center; gap:min(1.8vh,12px); width:min(94vw,560px); }
  .icon-btn {
    border:none; cursor:pointer; flex:none;
    width:clamp(40px,10vw,50px); height:clamp(40px,10vw,50px);
    border-radius:50%; background:rgba(255,255,255,.4); color:#fff;
    font-size:clamp(19px,5vw,24px); display:grid; place-items:center;
    box-shadow:0 3px 0 rgba(0,0,0,.14);
  }
  .icon-btn:active { transform:translateY(3px); box-shadow:none; }
  /* one line, not two — it lives in the header row now, which is the height of
     a button, and a stacked title overflows it and rides up under the notch */
  .title-wrap {
    flex:1; min-width:0;
    display:flex; align-items:baseline; justify-content:center; gap:8px;
    white-space:nowrap;
  }
  .title-wrap .lv {
    font-size:clamp(15px,4.2vw,22px); font-weight:800; color:#fff;
    text-shadow:0 2px 0 rgba(170,60,90,.3);
    overflow:hidden; text-overflow:ellipsis; min-width:0;
  }
  .title-wrap .sc { font-size:clamp(11px,3vw,14px); font-weight:800; color:#ffffffcc; flex:none; }
  .title-wrap .sc.bump { animation:scoreBump .32s cubic-bezier(.3,1.7,.5,1); }
  @keyframes scoreBump { 50% { transform:scale(1.35); color:#fff; } }

  .moves {
    flex:none; min-width:clamp(56px,15vw,74px);
    background:rgba(255,255,255,.92); border-radius:18px;
    padding:5px 10px; text-align:center;
    box-shadow:0 3px 0 rgba(0,0,0,.14);
  }
  .moves .n { font-size:clamp(20px,5.4vw,27px); font-weight:800; color:#c2410c; line-height:1; }
  .moves .l { font-size:clamp(9px,2.4vw,11px); font-weight:800; color:#c2410c99; letter-spacing:.5px; }
  .moves.low { animation:lowpulse 1.1s ease-in-out infinite; }
  @keyframes lowpulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
  .moves.bump { animation:mbump .3s ease; }
  @keyframes mbump { 50%{transform:scale(1.22)} }

  /* goal chips */
  .goals { display:flex; gap:min(2.4vw,12px); flex-wrap:wrap; justify-content:center; }
  .goal {
    position:relative; overflow:hidden;
    display:flex; align-items:center; gap:7px;
    background:rgba(255,255,255,.92); border-radius:999px;
    border:none; font-family:inherit; cursor:pointer;
    padding:5px 13px 5px 6px;
    box-shadow:0 3px 0 rgba(0,0,0,.13), inset 0 1px 0 rgba(255,255,255,.95);
    transition:transform .18s, background .25s, box-shadow .12s;
  }
  .goal:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.13); }
  .goal:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  /* Progress as something you can SEE filling, not only a fraction to read.
     Most of the people playing this cannot read "7/10" yet. */
  .goal .fill {
    position:absolute; left:0; top:0; bottom:0; width:0;
    background:linear-gradient(90deg, rgba(255,205,84,.45), rgba(255,169,64,.7));
    transition:width .5s cubic-bezier(.25,1.15,.45,1);
  }
  .goal .mini, .goal .num { position:relative; }
  .goal .mini {
    width:clamp(26px,7vw,34px); height:clamp(26px,7vw,34px); flex:none;
    filter:drop-shadow(0 1px 1px rgba(60,30,10,.22));
  }
  .goal .mini .shape { position:absolute; inset:0; }
  .goal .mini .face { position:absolute; inset:0; display:grid; place-items:center; font-size:clamp(15px,4vw,20px); }
  .goal .num { font-size:clamp(14px,3.8vw,19px); font-weight:800; color:#4a2800; white-space:nowrap; }
  .goal.pulse { animation:gpulse .35s ease; }
  @keyframes gpulse { 40%{transform:scale(1.18) rotate(-3deg)} }
  .goal.done { background:linear-gradient(#fff3b0,#ffcf3d); box-shadow:0 3px 0 rgba(150,100,0,.25), inset 0 1px 0 rgba(255,255,255,.9); }
  .goal.done .fill { width:100% !important; background:none; }
  .goal.done .num { color:#6b4700; }
  .goal.done .mini { animation:goalWin .5s cubic-bezier(.3,1.5,.5,1); }
  @keyframes goalWin { 40%{transform:scale(1.3) rotate(8deg)} }

  /* tap a chip and it tells you, in one line, what it wants and how to get it */
  .tip {
    position:fixed; z-index:70; pointer-events:none;
    max-width:min(80vw,340px);
    background:linear-gradient(#4b3a72,#3a2b5c); color:#fff;
    padding:10px 14px; border-radius:16px;
    box-shadow:0 10px 26px rgba(40,20,90,.4);
    opacity:0; transform:translateY(-7px) scale(.92); transform-origin:top center;
    transition:opacity .18s ease, transform .2s cubic-bezier(.3,1.4,.5,1);
  }
  .tip.show { opacity:1; transform:translateY(0) scale(1); }
  .tip b { display:block; font-size:clamp(14px,3.9vw,17px); font-weight:800; }
  .tip span { display:block; margin-top:2px; font-size:clamp(12px,3.4vw,15px); font-weight:700; color:#ffffffc4; line-height:1.35; }
  .tip::before {
    content:''; position:absolute; top:-7px; left:var(--ax,50%); transform:translateX(-50%);
    border-left:8px solid transparent; border-right:8px solid transparent;
    border-bottom:8px solid #4b3a72;
  }

  /* ---- helper tools: a bar pinned to the bottom of the screen ---- */
  .tools {
    position:fixed; z-index:30;
    left:50%; transform:translateX(-50%);
    bottom:max(10px, var(--sab));
    display:flex; gap:min(3.5vw,16px); justify-content:center;
    padding:9px 14px; border-radius:26px;
    background:rgba(255,255,255,.24);
    box-shadow:0 6px 20px rgba(120,40,80,.18);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  .tool {
    position:relative; border:none; cursor:pointer; font-family:inherit;
    width:clamp(50px,13vw,62px); height:clamp(50px,13vw,62px);
    border-radius:20px;
    background:linear-gradient(#fff,#ffe6d2);
    box-shadow:0 4px 0 rgba(0,0,0,.17), inset 0 2px 0 rgba(255,255,255,.9);
    display:grid; place-items:center;
    transition:transform .12s, box-shadow .12s, filter .2s;
  }
  .tool .ic { font-size:clamp(24px,6.4vw,31px); filter:drop-shadow(0 2px 2px rgba(0,0,0,.18)); }
  .tool .ct {
    position:absolute; right:-4px; top:-5px;
    min-width:21px; height:21px; padding:0 5px;
    border-radius:999px; background:#ff6f91; color:#fff;
    font-size:12px; font-weight:800; line-height:21px;
    box-shadow:0 2px 0 rgba(0,0,0,.2);
  }
  .tool:active { transform:translateY(4px); box-shadow:none; }
  .tool.armed {
    background:linear-gradient(#ffd08a,#ff9f43);
    box-shadow:0 4px 0 rgba(0,0,0,.17), 0 0 0 3px #fff, 0 0 18px 4px rgba(255,214,120,.95);
    animation:toolArmed .85s ease-in-out infinite;
  }
  @keyframes toolArmed {
    0%,100% { transform:translateY(0) scale(1) rotate(0); }
    50%     { transform:translateY(-6px) scale(1.12) rotate(-4deg); }
  }
  /* a ring that keeps pulsing off an armed tool, so it reads as "live" */
  .tool.armed::after {
    content:''; position:absolute; inset:-4px;
    border-radius:24px; border:3px solid #fff;
    animation:toolRing 1.1s ease-out infinite; pointer-events:none;
  }
  @keyframes toolRing {
    0%   { transform:scale(.86); opacity:.9; }
    100% { transform:scale(1.35); opacity:0; }
  }
  /* the moment it's spent */
  .tool.spent { animation:toolSpent .45s cubic-bezier(.3,1.5,.5,1); }
  @keyframes toolSpent {
    0%   { transform:scale(1); filter:brightness(2.4); }
    45%  { transform:scale(.82); }
    100% { transform:scale(1); filter:brightness(1); }
  }
  .tool .ct { transition:transform .2s cubic-bezier(.3,1.6,.5,1); }
  .tool.spent .ct { transform:scale(1.5); }
  .tool.empty { filter:grayscale(1) opacity(.45); }
  .tool.empty .ct { background:#b9aca6; }
  /* every tile is a target while a tool is armed */
  #board.picking .tile .inner { animation:pickPulse 1.1s ease-in-out infinite; }
  @keyframes pickPulse { 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.05) } }

  /* hammer impact */
  .smash {
    position:absolute; z-index:20; pointer-events:none;
    display:grid; place-items:center;
    width:var(--cell); height:var(--cell);
    font-size:calc(var(--cell)*.8);
    animation:smashDrop .4s cubic-bezier(.5,0,.75,0) forwards;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));
  }
  @keyframes smashDrop {
    0%   { transform:translate(calc(var(--cell)*.5), calc(var(--cell)*-1.4)) rotate(-70deg); opacity:0; }
    45%  { transform:translate(0,0) rotate(8deg); opacity:1; }
    70%  { transform:translate(0,0) rotate(0deg); opacity:1; }
    100% { transform:translate(0, calc(var(--cell)*-.3)) rotate(-24deg); opacity:0; }
  }
  /* whole-board shuffle for the mix tool */
  .tile.mixing .inner { animation:mixSpin .7s cubic-bezier(.5,0,.5,1); }
  @keyframes mixSpin {
    0%   { transform:scale(1) rotate(0); }
    45%  { transform:scale(.35) rotate(200deg); opacity:.55; }
    100% { transform:scale(1) rotate(360deg); }
  }
  /* neighbours flinch away from a booster being born */
  .tile.push .inner { animation:pushOut .42s cubic-bezier(.3,1.3,.5,1); }
  @keyframes pushOut {
    0%   { transform:scale(1); }
    35%  { transform:scale(.86) translate(var(--px), var(--py)); }
    100% { transform:scale(1); }
  }
  /* (An ambient glint used to live here. Its sliding highlight was a child of
     .shape, which has no overflow clipping, so the band slid clear of the tile
     and read as a white bar flashing next to the board. Ambient decoration
     isn't worth that, so it's gone rather than patched.) */

  /* board */
  #board-wrap { position:relative; }
  /* All the blast work happens here: one canvas, one frame loop, no DOM churn.
     It sits ABOVE the tiles and spills past the board edge so sparks can leave
     the playfield. */
  #fx { position:absolute; inset:-26px; z-index:12; pointer-events:none; }
  /* Emphasis without motion. The board used to jolt on a big clear, which is
     unpleasant to look at and worse on a small screen you're holding close —
     it flares instead. */
  #board-wrap.flash #board { animation:boardFlash .42s ease-out; }
  @keyframes boardFlash {
    0%   { box-shadow:inset 0 2px 10px rgba(120,40,80,.18), 0 8px 22px rgba(120,40,80,.2); }
    25%  { box-shadow:inset 0 0 0 3px rgba(255,255,255,.9), 0 0 34px 8px rgba(255,245,200,.85); }
    100% { box-shadow:inset 0 2px 10px rgba(120,40,80,.18), 0 8px 22px rgba(120,40,80,.2); }
  }
  /* The board itself is transparent — its shape comes from the cell backings,
     so a hole is genuinely absent instead of a gap painted on a rectangle. */
  /* The board sits in a tray. It went missing when levels briefly had cut-out
     SHAPES — a rectangular tray would have shown through the holes, so per-cell
     backings replaced it — and when the shapes were dropped again the tray was
     never put back, leaving the fruit floating on the page gradient with the
     cell backings almost entirely hidden underneath them.
     `overflow:hidden` earns its place twice over: it rounds the tray's corners
     against the tiles, and it hides the refill fruit, which are born a row or
     two above the ceiling and walked down. Without it you watch them wink into
     existence in mid-air above the board instead of rising out from behind the
     tray's edge. */
  #board {
    position:relative;
    width:calc(var(--cols) * var(--cell));
    height:calc(var(--rows) * var(--cell));
    background:rgba(255,255,255,.2);
    border-radius:clamp(16px,4vw,26px);
    box-shadow:inset 0 2px 10px rgba(120,40,80,.18), 0 8px 22px rgba(120,40,80,.2);
    padding:0;
    overflow:hidden;
  }
  #cells { position:absolute; inset:0; z-index:0; pointer-events:none; }
  .cellbg {
    position:absolute; left:0; top:0;
    width:var(--cell); height:var(--cell);
    transform:translate3d(calc(var(--cc) * var(--cell)), calc(var(--cr) * var(--cell)), 0);
    padding:calc(var(--cell) * .035);
  }
  .cellbg::after {
    content:''; display:block; width:100%; height:100%;
    border-radius:26%;
    background:rgba(255,255,255,.20);
    box-shadow:inset 0 2px 6px rgba(120,40,80,.16);
  }

  .tile {
    position:absolute; left:0; top:0;
    width:var(--cell); height:var(--cell);
    padding:calc(var(--cell) * .06);
    transform:translate3d(calc(var(--tc) * var(--cell)), calc(var(--tr) * var(--cell)), 0);
    /* The curve is the original one, with its little overshoot on arrival —
       that bounce is most of the character of the movement, and flattening it
       into a hard accelerate/decelerate made everything feel businesslike. Only
       the DURATION is shortened. */
    transition:transform .21s cubic-bezier(.34,1.2,.5,1);
    cursor:pointer; z-index:2;
  }
  .tile .inner {
    position:relative; width:100%; height:100%;
    transition:transform .12s ease;
  }
  /* One glossy sweet for every fruit. There used to be a different geometric
     backdrop per kind as a colour-blind fallback, but the fruit emoji is
     already a distinct silhouette — the polygons were a redundant third
     channel that made the board look busy. Gloss and depth instead. */
  /* ---- one silhouette per fruit ----
     Every piece used to be the same rounded square with a different emoji on it,
     so the board leaned on hue and a glyph — the two cues the eye resolves
     LAST. Shape is the one it resolves first, which is why every match-3 worth
     copying gives each colour its own outline. It also fixes colour-blind
     readability, which hue can never do on its own.

     Done with border-radius rather than clip-path on purpose: clip-path would
     take the candy bevel with it, since box-shadow is clipped away along with
     everything else outside the path. Six radii, all keeping their bevel. */
  /* Three rules hold this set together, and the first attempt broke all three.
     ECHO: each outline is the silhouette of the fruit standing on it, so the
     shape is a reason rather than a decoration. SYMMETRY: every one is mirrored
     on at least one axis, so it sits square in the grid — the diagonal petal in
     the first attempt fought the grid and read as a rendering fault. FAMILY: all
     six are drawn from one vocabulary of squares, pastilles and domes, so the
     board looks like an assortment of sweets rather than six unrelated outlines.

       🍓 tapers to a point   → round-bottomed dome
       🍌 long                → wide pastille
       🍇 a bunch, hanging    → round-topped dome
       🍏 blocky and solid    → rounded square
       🍊 perfectly round     → circle
       🫐 small and tall      → upright pastille                             */
  .tile.k0 .shape { border-radius:30% 30% 48% 48%; }   /* strawberry */
  .tile.k1 .shape { border-radius:50% / 34%; }         /* banana */
  .tile.k2 .shape { border-radius:48% 48% 30% 30%; }   /* grapes */
  .tile.k3 .shape { border-radius:26%; }               /* green apple */
  .tile.k4 .shape { border-radius:50%; }               /* orange */
  .tile.k5 .shape { border-radius:34% / 50%; }         /* blueberry */
  /* A circle of the same box reads SMALLER than a square — it loses the four
     corners. The round ones are grown a touch so the set has even optical
     weight, which is the difference between a designed assortment and six
     shapes that merely have the same bounding box. */
  .tile.k4 .shape { inset:-3%; }
  .tile.k1 .shape, .tile.k5 .shape { inset:-1.5%; }
  /* Blockers, frozen fruit and gum keep the plain square, so a piece that is
     STUCK never also changes shape — one signal per idea. */
  .tile.blk .shape, .tile.ice .shape, .tile.jelly .shape { border-radius:30% !important; }

  .tile .shape {
    position:absolute; inset:0;
    border-radius:30%;
    box-shadow:
      inset 0 calc(var(--cell)*.07) 0 rgba(255,255,255,.28),
      inset 0 calc(var(--cell)*-.09) 0 rgba(0,0,0,.22),
      inset 0 0 0 calc(var(--cell)*.022) rgba(255,255,255,.38),
      0 calc(var(--cell)*.045) calc(var(--cell)*.08) rgba(90,40,80,.26);
  }
  /* the specular blob that sells it as something shiny you'd want to eat */
  .tile .shape::after {
    content:''; position:absolute; left:13%; top:7%; width:46%; height:31%;
    border-radius:50%;
    background:linear-gradient(165deg, rgba(255,255,255,.82), rgba(255,255,255,0) 72%);
    pointer-events:none;
  }
  .tile .face {
    position:absolute; inset:0; display:grid; place-items:center;
    font-size:calc(var(--cell) * .56);
    filter:drop-shadow(0 calc(var(--cell)*.022) calc(var(--cell)*.028) rgba(60,20,50,.38));
    pointer-events:none;
  }
  .tile .crown {
    position:absolute; inset:0; display:none; place-items:center;
    pointer-events:none;
  }
  .tile.jelly .face { position:relative; z-index:1; }

  .tile.sel .inner { transform:scale(1.12); animation:wiggle .5s ease-in-out infinite; }
  @keyframes wiggle { 0%,100%{rotate:-4deg} 50%{rotate:4deg} }
  .tile.sel .shape { box-shadow:0 0 0 calc(var(--cell)*.055) #fff, 0 0 calc(var(--cell)*.2) rgba(255,255,255,.9); }
  .tile.nudge .inner { animation:nudge 1s ease-in-out infinite; }
  @keyframes nudge { 0%,100%{transform:scale(1)} 40%{transform:scale(1.16)} }
  .tile.nope .inner { animation:nope .34s ease; }
  @keyframes nope { 25%{transform:translateX(-9%) rotate(-7deg)} 75%{transform:translateX(9%) rotate(7deg)} }
  .tile.land .inner { animation:land .22s cubic-bezier(.25,1.5,.4,1); }
  @keyframes land {
    0%{transform:scaleY(.72) scaleX(1.16)} 55%{transform:scaleY(1.07) scaleX(.95)} 100%{transform:none}
  }
  .tile.pop { z-index:6; }
  /* picks up exactly where .charge left off, so the flash and the burst are one
     continuous motion rather than two animations fighting */
  /* A matched fruit used to scale up, spin and shrink to nothing — one object
     vanishing, which reads as DELETED rather than destroyed. It comes apart now:
     the candy shell bursts outward like a popped bubble while the fruit inside
     squashes and goes, and there is a genuine wind-up before either. Three
     things carry that:

       · ANTICIPATION — a squash frame before the burst. A burst with no wind-up
         has no weight, and the white flare we had is a colour change, not a
         movement.
       · SEPARATION — .shape and .face animate independently. One div scaling to
         zero is the giveaway that this is a rectangle and not a sweet.
       · A FLASH FRAME — two frames of blown-out silhouette at the moment of
         destruction, which is what sells impact in every action game there is. */
  .tile.pop .inner { animation:pop .28s cubic-bezier(.35,0,.5,1) forwards; }
  .tile.pop .shape { animation:shellBurst .28s cubic-bezier(.2,.7,.4,1) forwards; }
  .tile.pop .face  { animation:fruitPop .28s cubic-bezier(.35,0,.5,1) forwards; }
  @keyframes shellBurst {
    0%   { transform:scale(1); opacity:1; filter:brightness(1); }
    14%  { transform:scaleX(1.14) scaleY(.82); filter:brightness(2.6) saturate(.2); }
    100% { transform:scale(1.55); opacity:0; filter:brightness(1.6); }
  }
  @keyframes fruitPop {
    0%   { transform:scale(1) translateY(0); }
    14%  { transform:scaleX(1.18) scaleY(.78) translateY(6%); }   /* squash: the wind-up */
    34%  { transform:scale(1.24) translateY(-8%); }               /* and the release */
    100% { transform:scale(0) rotate(-28deg); opacity:0; }
  }
  /* The inner now only carries the shared lift — the shell and the fruit do
     their own thing on top of it. */
  @keyframes pop {
    0%   { transform:scale(1.14); }
    14%  { transform:scale(1.02); }
    34%  { transform:scale(1.2); }
    100% { transform:scale(1.06); opacity:0; }
  }
  .tile.born .inner { animation:born .24s cubic-bezier(.3,1.5,.5,1); }
  @keyframes born { 0%{transform:scale(.4); opacity:.4} 100%{transform:scale(1); opacity:1} }

  /* ---------------- boosters ----------------
     A booster still has to answer what am I, what will I clear, and how do I
     go off — but it should look like charged fruit, not like fruit with UI
     stuck on it. The star used to wear four flat white triangles and the bomb
     a white dashed circle; both read as debug overlay. They're light now:
     the star is lit along both axes, the bomb pulses a halo outward. The
     markings sit BEHIND the fruit so the fruit stays the identity. */
  @keyframes spin { to{rotate:360deg} }

  /* STAR — a soft luminous cross running through the tile */
  .tile.sp1 .crown { display:block; z-index:0; }
  /* Bright at the four edges and clear through the middle, so the tile reads as
     charged along both axes without a solid bar sitting over the fruit. */
  .tile.sp1 .crown::before,
  .tile.sp1 .crown::after {
    content:''; position:absolute; left:50%; top:50%;
    border-radius:999px;
    transform:translate(-50%,-50%);
    background:linear-gradient(var(--g),
      rgba(255,236,170,0) 0%, #fff 9%, #ffe6a0 22%, rgba(255,230,160,0) 36%,
      rgba(255,230,160,0) 64%, #ffe6a0 78%, #fff 91%, rgba(255,236,170,0) 100%);
    filter:drop-shadow(0 0 calc(var(--cell)*.07) rgba(255,190,60,.95));
    animation:starCross 1.3s ease-in-out infinite;
  }
  .tile.sp1 .crown::before { --g:90deg;  width:104%; height:13%; }
  .tile.sp1 .crown::after  { --g:180deg; width:13%;  height:104%; }
  @keyframes starCross {
    0%,100% { opacity:.7; }
    50%     { opacity:1; }
  }
  .tile.sp1 .shape {
    box-shadow:inset 0 0 0 calc(var(--cell)*.045) #ffeaa7,
               inset 0 calc(var(--cell)*-.085) 0 rgba(0,0,0,.2),
               0 0 calc(var(--cell)*.2) rgba(255,198,64,.9);
    animation:starGlow 1.3s ease-in-out infinite;
  }
  @keyframes starGlow {
    0%,100% { filter:brightness(1); }
    50%     { filter:brightness(1.16); }
  }
  /* the fruit rides on top of its own glow, so it stays the thing you read */
  .tile.sp1 .face {
    z-index:1; font-size:calc(var(--cell)*.42);
    filter:drop-shadow(0 0 calc(var(--cell)*.07) rgba(255,176,40,.95))
           drop-shadow(0 calc(var(--cell)*.022) calc(var(--cell)*.028) rgba(60,20,50,.4));
  }

  .tile.sp2 .shape {
    background:conic-gradient(#ff3b5c,#ffcc00,#28d76a,#00a8ff,#8b4ae8,#ff3b5c) !important;
    border-radius:50%;
    animation:spin 4s linear infinite;
    box-shadow:inset 0 0 0 calc(var(--cell)*.035) rgba(255,255,255,.9),
               inset 0 calc(var(--cell)*-.07) calc(var(--cell)*.1) rgba(0,0,0,.25),
               0 0 calc(var(--cell)*.13) rgba(255,255,255,.75);
  }
  /* keep the orb saturated — the full-size gloss blob washed it grey */
  .tile.sp2 .shape::after {
    left:17%; top:11%; width:34%; height:22%;
    background:linear-gradient(165deg, rgba(255,255,255,.7), rgba(255,255,255,0) 70%);
  }
  /* a soft halo breathing off the orb, not a hard white outline */
  .tile.sp2 .crown {
    display:block; border-radius:50%; z-index:0;
    box-shadow:0 0 calc(var(--cell)*.22) calc(var(--cell)*.04) rgba(255,255,255,.85);
    animation:rainRing 1.5s ease-out infinite;
  }
  @keyframes rainRing {
    0%   { transform:scale(.8);  opacity:.85; }
    100% { transform:scale(1.22); opacity:0; }
  }
  .tile.sp2 .face { font-size:calc(var(--cell)*.44); }

  /* BOMB — a halo pulsing outward. Still says "everything around me", but as
     light rather than as a dashed circle drawn on top of the fruit. */
  .tile.sp3 .crown { display:block; z-index:0; }
  .tile.sp3 .crown::before {          /* steady rim, hollow so the fruit shows */
    content:''; position:absolute; inset:17%;
    border-radius:50%;
    border:calc(var(--cell)*.028) solid rgba(255,228,170,.92);
    box-shadow:0 0 calc(var(--cell)*.11) rgba(255,150,45,.9),
               inset 0 0 calc(var(--cell)*.09) rgba(255,170,60,.55);
    animation:bombCore 1.2s ease-in-out infinite;
  }
  .tile.sp3 .crown::after {           /* the ring travelling out */
    content:''; position:absolute; inset:12%;
    border-radius:50%;
    border:calc(var(--cell)*.032) solid rgba(255,226,170,.95);
    box-shadow:0 0 calc(var(--cell)*.1) rgba(255,160,50,.9);
    animation:bombPing 1.2s cubic-bezier(.2,.7,.4,1) infinite;
  }
  @keyframes bombCore { 0%,100%{opacity:.65} 50%{opacity:1} }
  @keyframes bombPing {
    0%   { transform:scale(.5);  opacity:.95; }
    100% { transform:scale(1.3); opacity:0; }
  }
  .tile.sp3 .shape {
    box-shadow:inset 0 0 0 calc(var(--cell)*.045) #ffd9a0,
               inset 0 calc(var(--cell)*-.085) 0 rgba(0,0,0,.22),
               0 0 calc(var(--cell)*.2) rgba(255,150,50,.9);
    animation:starGlow 1.2s ease-in-out infinite;
  }
  .tile.sp3 .face {
    z-index:1; font-size:calc(var(--cell)*.42);
    filter:drop-shadow(0 0 calc(var(--cell)*.07) rgba(255,140,30,.95))
           drop-shadow(0 calc(var(--cell)*.022) calc(var(--cell)*.028) rgba(60,20,50,.4));
  }

  /* ---- special tiles: neither of these is fruit and neither can be matched,
     so both are visually set apart from the sweets ---- */
  .tile.blk .shape { border-radius:30%; }
  .tile.blk .shape::after { display:none; }        /* no candy gloss on these */
  .tile.blk .face { font-size:calc(var(--cell)*.56); }

  .tile.duck .shape {
    background:linear-gradient(160deg,#fff2c4,#ffd469) !important;
    box-shadow:inset 0 0 0 calc(var(--cell)*.035) rgba(255,255,255,.85),
               inset 0 calc(var(--cell)*-.08) 0 rgba(150,90,0,.2),
               0 0 calc(var(--cell)*.13) rgba(255,205,80,.75);
  }
  /* a duckling bobs, so you can tell at a glance it wants to go somewhere */
  .tile.duck .face { animation:duckBob 1.5s ease-in-out infinite; }
  @keyframes duckBob { 0%,100%{transform:translateY(0) rotate(-4deg)} 50%{transform:translateY(-8%) rotate(4deg)} }

  /* ---- gift: the one blocker you are PLEASED to see. It pays out a booster,
     so it shakes with impatience rather than sitting there like scenery. ---- */
  .tile.gift .shape {
    background:linear-gradient(160deg,#ffd9ee,#ff7fbe) !important;
    box-shadow:inset 0 0 0 calc(var(--cell)*.035) rgba(255,255,255,.9),
               inset 0 calc(var(--cell)*-.08) 0 rgba(150,20,80,.22),
               0 0 calc(var(--cell)*.14) rgba(255,140,200,.7);
  }
  .tile.gift .face { animation:giftShake 2.2s ease-in-out infinite; }
  @keyframes giftShake {
    0%,72%,100% { transform:rotate(0) scale(1); }
    78% { transform:rotate(-7deg) scale(1.07); }
    84% { transform:rotate(7deg)  scale(1.07); }
    90% { transform:rotate(-4deg) scale(1.03); }
  }



  /* ---- bubblegum. The gum IS the tile's backing, and that backing is exactly
     the same box as every other tile's — same inset, same radius, same bevel
     language. That matters twice: the fruit sits at its normal size against it
     rather than being dwarfed by an oversized square, and a piece of gum is the
     same SHAPE whether or not it has neighbours.

     Bleeding the backing to the full cell so neighbours could touch was the
     wrong trade. It shrank the fruit against a bigger square and forced the
     corners to square off when joined, so gum changed shape depending on what
     happened to be beside it. The join is drawn as a NECK across the gap
     instead, which leaves the tiles themselves completely alone. ---- */
  .tile.jelly .shape {
    background:linear-gradient(176deg, #ffb3e2 0%, #ff7ecb 42%, #e64bab 78%, #c8318f 100%) !important;
    box-shadow:
      inset 0 calc(var(--cell)*.075) 0 rgba(255,255,255,.5),
      inset 0 calc(var(--cell)*-.09) 0 rgba(150,15,95,.34),
      inset 0 0 0 calc(var(--cell)*.022) rgba(255,220,242,.6),
      0 calc(var(--cell)*.045) calc(var(--cell)*.08) rgba(140,30,100,.3);
  }
  /* Softer than a boiled sweet: gum has a wide diffuse sheen, not a hard glint. */
  .tile.jelly .shape::after {
    inset:12% 16% auto 16% !important; height:26% !important;
    border-radius:50% !important;
    background:radial-gradient(closest-side ellipse, rgba(255,255,255,.62), transparent 76%) !important;
    opacity:1 !important;
  }

  /* The necks. Each tile draws only its RIGHT and DOWN join, so every connection
     is drawn exactly once, by the upper-left of the pair — two pseudo-elements
     between them cover all four directions. They reach across the whole gap
     (.12 cell of padding) with a hair to spare. */
  .tile.jelly .crown { display:block; }
  .tile.jelly.j-r .crown::before,
  .tile.jelly.j-d .crown::after {
    content:''; position:absolute;
    background:linear-gradient(176deg, #ff8ed3, #ee5cb6 70%, #d93ea0);
    box-shadow:inset 0 calc(var(--cell)*.03) 0 rgba(255,255,255,.4);
  }
  .tile.jelly.j-r .crown::before {
    right:calc(var(--cell) * -.13); width:calc(var(--cell) * .14);
    top:27%; bottom:27%;
    border-radius:calc(var(--cell) * .05);
  }
  .tile.jelly.j-d .crown::after {
    bottom:calc(var(--cell) * -.13); height:calc(var(--cell) * .14);
    left:27%; right:27%;
    border-radius:calc(var(--cell) * .05);
  }

  /* ---- the machine. Built as a HOUSING with a lit window and a chute, which
     is the shape language of every dispenser a child has ever seen. The earlier
     version tried to be a gumball machine using a soft gradient for the dome,
     and at 48px a soft gradient is just a smudge — the parts have to be hard
     edged to survive being small. ---- */
  .tile.gen .shape {
    background:linear-gradient(168deg,#ffb454,#f0762a 52%,#c9491a) !important;
    box-shadow:
      inset 0 0 0 calc(var(--cell)*.032) rgba(255,232,195,.95),
      inset 0 calc(var(--cell)*-.09) 0 rgba(110,40,8,.5),
      0 0 calc(var(--cell)*.13) rgba(255,160,70,.5);
  }
  .tile.gen .shape::after { display:none; }
  /* The window the item sits in, and the chute it leaves by. Hard-edged stops so
     both survive at tile size. */
  .tile.gen .crown {
    display:block; border-radius:30%;
    background:
      /* chute: a dark slot centred on the base */
      linear-gradient(90deg, transparent 30%, #3a1405 30% 70%, transparent 70%),
      /* window: a bright pane filling the top two thirds */
      linear-gradient(180deg, rgba(255,252,245,.96) 0 50%, transparent 50%);
    /* The window has to leave a real frame of housing around it, or the machine
       reads as a white tile with a bar on it — which is what a 78%-wide pane
       did. Two thirds wide, half tall, and the orange does the rest. */
    background-size:100% 15%, 62% 100%;
    background-position:50% 90%, 50% 6%;
    background-repeat:no-repeat;
  }
  /* a glass glint across the window, so it reads as a pane rather than a hole */
  .tile.gen .crown::after {
    content:''; position:absolute; left:19%; top:8%; width:62%; height:44%;
    background:linear-gradient(142deg, rgba(255,255,255,.95) 0 24%, transparent 24.5%);
  }
  /* Above the glass, not behind it. .crown is appended after .face, so the
     window pane was painting straight over the very item it exists to show. */
  .tile.gen .face { font-size:calc(var(--cell)*.32); transform:translateY(-19%);
                    position:relative; z-index:3; }

  /* Emitting. The item drops out of the window, through the chute and away, and
     the housing kicks back — you watch the thing LEAVE. Fast in, fast out: the
     whole gesture is under a third of a second. */
  .tile.gen.firing .face { animation:genDrop .34s cubic-bezier(.4,0,.7,1); }
  @keyframes genDrop {
    0%   { transform:translateY(-14%) scale(1); opacity:1; }
    46%  { transform:translateY(26%) scale(.5); opacity:.95; }
    60%  { transform:translateY(44%) scale(.28); opacity:0; }
    61%  { transform:translateY(-44%) scale(.55); opacity:0; }
    100% { transform:translateY(-14%) scale(1); opacity:1; }
  }
  .tile.gen.firing .shape { animation:genRecoil .34s cubic-bezier(.3,1.4,.5,1); }
  @keyframes genRecoil {
    0%,100% { transform:translateY(0) scaleY(1); }
    38%     { transform:translateY(5%) scaleY(.9); }
    68%     { transform:translateY(-2%) scaleY(1.04); }
  }
  .tile.gen.firing .crown { animation:genFlash .34s ease-out; }
  @keyframes genFlash {
    0%, 34% { filter:none; }
    50%     { filter:brightness(1.9) drop-shadow(0 0 5px rgba(255,220,150,.95)); }
    100%    { filter:none; }
  }
    55%     { filter:brightness(2.1) drop-shadow(0 0 6px rgba(255,230,180,.9)); }
    100%    { filter:none; }
  }

  /* One hit taken, for either of them: a fracture across the face. Blocks never
     carry booster or frost markings, so .crown is free to be the damage layer. */
  .tile.blk.hit1 .crown {
    display:block; border-radius:30%;
    background:
      linear-gradient(64deg,  transparent 45%, rgba(255,255,255,.9) 48%, transparent 51%),
      linear-gradient(-28deg, transparent 56%, rgba(255,255,255,.55) 58.5%, transparent 61%);
  }
  .tile.blk.hit1 .face { transform:scale(.94) rotate(-5deg); }

  /* ---- frost: a layer OVER the fruit, in two thicknesses ----
     Drawn on .crown, which sits above .face, so the fruit stays visible through
     it: you can always see what you are about to win.

     ARCHITECTURE, because two earlier attempts here both failed the same way.
     A stack of translucent gradients takes its final colour from whatever is
     underneath, and underneath is one of six saturated tile colours. The same
     frost then came out grey on a blueberry, lavender on grapes and khaki on a
     banana — six different results, none of which read as "ice", and no amount
     of tuning alphas fixes that because the input varies. Nor is blur available
     to unify them: backdrop-filter needs the -webkit- prefix on iOS Safari and
     its wash is what made frozen fruit look flat white on an iPhone.

     So the frost is built as a RIM plus a WINDOW. The rim is nearly opaque, so
     its colour is fixed no matter what it covers, and it carries the whole
     identity of the material — that is the part your eye reads as ice. The
     window in the middle is only lightly veiled, so the fruit shows through
     sharp and in its own colour. Thickness is then a real, legible variable:
     how far the rim intrudes and how much the window is veiled. Both states are
     obviously the same substance, which the old white-X-over-grey-wash pair
     never were. */
  .tile.ice .crown { display:block; border-radius:30%; }

  /* The collar is BLUE and the white is a specular edge on top of it, one thin
     ring wide. Stacked inset shadows paint front-to-back, so a narrow white
     spread listed first sits over a wider blue spread and the two read as a lit
     edge on a blue body. Doing it the other way round — a wide near-white rim —
     is how the frost came out looking bleached on a phone. */

  /* Thick: a heavy collar, fruit veiled but readable behind it. */
  .tile.ice2 .crown {
    background:
      radial-gradient(112% 112% at 50% 40%,
        rgba(198,238,255,.2) 0 28%,
        rgba(116,194,240,.62) 58%,
        rgba(48,142,206,.94)  100%);
    box-shadow:
      inset 0 0 0 calc(var(--cell)*.024) rgba(240,252,255,.92),
      inset 0 0 0 calc(var(--cell)*.085) rgba(60,155,214,.9),
      inset 0 0 calc(var(--cell)*.13) calc(var(--cell)*.085) rgba(126,203,244,.5),
      inset 0 calc(var(--cell)*-.07) calc(var(--cell)*.09) rgba(12,74,128,.45),
      0 0 calc(var(--cell)*.07) rgba(130,210,255,.55);
  }
  /* Thin: the collar has retreated to a narrow edge and the window is nearly
     clear, so "one more match" is something you can see rather than count. */
  .tile.ice1 .crown {
    inset:5%;
    background:
      radial-gradient(110% 110% at 50% 40%,
        rgba(214,244,255,.07) 0 44%,
        rgba(126,199,241,.34) 72%,
        rgba(70,163,219,.7)   100%);
    box-shadow:
      inset 0 0 0 calc(var(--cell)*.014) rgba(240,252,255,.85),
      inset 0 0 0 calc(var(--cell)*.042) rgba(70,163,219,.72),
      inset 0 calc(var(--cell)*-.04) calc(var(--cell)*.06) rgba(12,74,128,.28);
  }

  /* Facets. Corner wedges, not lines across the middle: a crystal catches the
     light on its bevelled faces, and the previous three crossing white lines
     landed as a struck-through "cancelled" mark straight over the fruit. */
  .tile.ice .crown::before {
    content:''; position:absolute; inset:0; border-radius:30%;
    background:
      linear-gradient(141deg, rgba(255,255,255,.62) 0 11%, transparent 11.4%),
      linear-gradient(321deg, rgba(214,243,255,.3)  0 8%,  transparent 8.4%);
  }
  .tile.ice1 .crown::before { background:
      linear-gradient(141deg, rgba(255,255,255,.5)  0 8%, transparent 8.4%),
      linear-gradient(321deg, rgba(214,243,255,.22) 0 5%, transparent 5.4%); }

  /* A single fracture running in from one corner and dying out — masked so it
     fades rather than terminating in mid-air. Only the thin state gets it: a
     crack is the tell that this block is one hit from gone. */
  .tile.ice1 .crown::after {
    content:''; position:absolute; inset:0; border-radius:30%;
    background:
      linear-gradient(69deg,  transparent 47.2%, rgba(255,255,255,.85) 48.6%, transparent 50%),
      linear-gradient(-21deg, transparent 55%,   rgba(255,255,255,.6)  56.4%, transparent 57.8%);
    -webkit-mask-image:radial-gradient(circle at 74% 26%, #000 0 40%, transparent 68%);
    mask-image:radial-gradient(circle at 74% 26%, #000 0 40%, transparent 68%);
  }

  /* "tap again and THIS is what goes" — shown while a booster is selected */
  .tile.aim .inner { animation:aimPulse .75s ease-in-out infinite; }
  @keyframes aimPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.11)} }
  .tile.aim .shape {
    box-shadow:0 0 0 calc(var(--cell)*.045) #fff, 0 0 calc(var(--cell)*.18) rgba(255,255,255,.95);
    filter:brightness(1.22);
  }

  /* the orb winding up before it fires */
  .tile.firing { z-index:9; }
  .tile.firing .inner { animation:rbFire .45s cubic-bezier(.3,1.4,.5,1); }
  @keyframes rbFire {
    0%   { transform:scale(1); }
    35%  { transform:scale(1.5); filter:brightness(1.8); }
    100% { transform:scale(1.18); }
  }


  /* ---- leaf covers: they belong to CELLS, not tiles, so they sit in their
     own layer above the fruit and stay put while fruit falls past them ---- */
  #covers { position:absolute; inset:0; z-index:4; pointer-events:none; }
  .cover {
    position:absolute; left:0; top:0;
    width:var(--cell); height:var(--cell);
    padding:calc(var(--cell)*.045);
    transform:translate3d(calc(var(--cc) * var(--cell)), calc(var(--cr) * var(--cell)), 0);
  }
  /* Translucent on purpose: you have to be able to read the fruit underneath
     to aim a match at it. A solid leaf made the patch unplayable. */
  .cover b {
    position:relative; display:block; width:100%; height:100%;
    border-radius:26%;
    background:rgba(150,220,100,.24);
    box-shadow:inset 0 0 0 calc(var(--cell)*.055) rgba(104,190,60,.95),
               inset 0 0 0 calc(var(--cell)*.085) rgba(255,255,255,.65);
  }
  .cover b::after {
    content:'🍃'; position:absolute; right:4%; top:2%;
    font-size:calc(var(--cell)*.28);
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));
  }
  .cover.gone b { animation:coverGone .42s cubic-bezier(.3,1.4,.5,1) forwards; }
  @keyframes coverGone {
    0%   { transform:scale(1) rotate(0); opacity:1; }
    35%  { transform:scale(1.2) rotate(-12deg); opacity:1; }
    100% { transform:scale(.2) rotate(40deg) translateY(40%); opacity:0; }
  }

  /* the nudge/tutorial finger — shows WHICH two tiles to trade, not just that
     something is possible */
  .hand {
    position:absolute; z-index:22; pointer-events:none;
    width:var(--cell); height:var(--cell);
    display:grid; place-items:center;
    font-size:calc(var(--cell)*.62);
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));
    animation:handGo 1.9s ease-in-out infinite;
  }
  @keyframes handGo {
    0%,12%  { transform:translate3d(var(--hx0), var(--hy0), 0) scale(1); }
    45%,55% { transform:translate3d(var(--hx1), var(--hy1), 0) scale(.9); }
    88%,100%{ transform:translate3d(var(--hx0), var(--hy0), 0) scale(1); }
  }

  /* ---------------- level transitions ----------------
     A level should arrive, not appear. The card announces it, then the fruit
     rains in along a diagonal so the board assembles itself in front of you. */
  #levelcard {
    position:fixed; inset:0; z-index:64;
    display:grid; place-items:center;
    pointer-events:none; opacity:0;
  }
  #levelcard.show { opacity:1; }
  #levelcard .lc-in {
    background:linear-gradient(150deg,#fff,#ffe9f0);
    border-radius:28px; padding:clamp(16px,3.5vw,26px) clamp(26px,7vw,48px);
    text-align:center;
    box-shadow:0 14px 40px rgba(120,40,80,.35), inset 0 2px 0 #fff;
    transform:scale(.5) translateY(30px); opacity:0;
  }
  #levelcard.show .lc-in { animation:lcIn .42s cubic-bezier(.25,1.5,.45,1) forwards; }
  #levelcard.out  .lc-in { animation:lcOut .34s cubic-bezier(.5,0,.75,0) forwards; }
  @keyframes lcIn  { to { transform:scale(1) translateY(0); opacity:1; } }
  @keyframes lcOut { from { transform:scale(1); opacity:1; } to { transform:scale(1.25) translateY(-24px); opacity:0; } }
  #levelcard .lc-n {
    font-size:clamp(28px,8vw,46px); font-weight:800; color:#c2410c;
    text-shadow:0 2px 0 rgba(255,255,255,.9);
  }
  #levelcard .lc-goals { font-size:clamp(18px,5vw,26px); font-weight:800; color:#8a5a3c; margin-top:4px; }

  /* fruit raining in on a diagonal — delay is a pure function of the cell, so
     the wave sweeps from the top-left corner without any JS bookkeeping */
  .tile.dropin .inner {
    animation:dropIn .52s cubic-bezier(.28,1.35,.5,1) backwards;
    animation-delay:calc((var(--tr) + var(--tc)) * 42ms);
  }
  @keyframes dropIn {
    0%   { transform:translateY(calc(var(--cell) * -5.5)) scale(.6) rotate(-14deg); opacity:0; }
    55%  { opacity:1; }
    100% { transform:none; }
  }
  /* and sweeping out the same way when the level is done */
  .tile.sweepout .inner {
    animation:sweepOut .5s cubic-bezier(.45,0,.75,.2) forwards;
    animation-delay:calc((var(--tr) + var(--tc)) * 32ms);
  }
  @keyframes sweepOut {
    0%   { transform:none; opacity:1; }
    25%  { transform:scale(1.18) rotate(6deg); }
    100% { transform:translateY(calc(var(--cell) * 6)) scale(.35) rotate(38deg); opacity:0; }
  }

  /* Fruit that are about to become a booster don't pop where they stand — they
     rush into the cell the booster is forming in and shrink out as they arrive,
     so the creation is one motion instead of "everything vanishes, pause, a
     booster appears". The travel itself rides the tile's own --tr/--tc
     transform, so it uses the same movement system as gravity. */
  .tile.suck { z-index:7; }
  .tile.suck .inner { animation:suckIn .3s cubic-bezier(.45,0,.7,.35) forwards; }
  @keyframes suckIn {
    0%   { transform:scale(1.18); filter:brightness(2) saturate(.4); }
    100% { transform:scale(.12) rotate(120deg); opacity:0; filter:brightness(1.4); }
  }

  /* the beat before a match pops — says "these ones" before they go */
  .tile.charge .inner { animation:charge .12s ease-out forwards; }
  @keyframes charge {
    0%   { filter:brightness(1); transform:scale(1); }
    100% { filter:brightness(2.1) saturate(.35); transform:scale(1.22); }
  }
  .tile.swapping { z-index:5; }
  .tile.swapping .inner { animation:swapPulse .26s ease-in-out; }
  @keyframes swapPulse { 50% { transform:scale(1.16); } }

  /* particles + score pops */
  .pop-score {
    position:fixed; z-index:61; pointer-events:none;
    font-weight:800; color:#fff; text-shadow:0 2px 4px rgba(150,50,80,.6);
    animation:popscore .8s ease-out forwards;
  }
  @keyframes popscore {
    0%{transform:translate(-50%,-50%) scale(.5); opacity:0}
    25%{transform:translate(-50%,-70%) scale(1.1); opacity:1}
    100%{transform:translate(-50%,-160%) scale(1); opacity:0}
  }
  .fly { position:fixed; z-index:62; pointer-events:none; display:grid; place-items:center;
         transition:transform .55s cubic-bezier(.5,-0.3,.4,1), opacity .55s; }

  .toast {
    position:fixed; z-index:63; left:50%; top:34%;
    transform:translate(-50%,-50%);
    font-size:clamp(26px,8vw,48px); font-weight:800; color:#fff;
    text-shadow:0 3px 0 rgba(170,60,90,.5), 0 0 22px rgba(255,255,255,.6);
    pointer-events:none; animation:toast 1.05s cubic-bezier(.2,1.3,.4,1) forwards;
  }
  @keyframes toast {
    0%{opacity:0; transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}
    22%{opacity:1; transform:translate(-50%,-50%) scale(1.1) rotate(3deg)}
    70%{opacity:1; transform:translate(-50%,-58%) scale(1)}
    100%{opacity:0; transform:translate(-50%,-85%) scale(.9)}
  }

  .footnote {
    font-size:clamp(12px,3.2vw,16px); font-weight:700; color:#ffffffdd;
    text-align:center; min-height:1.4em; padding:0 10px;
  }

  /* ---------------- overlays ---------------- */
  .overlay {
    position:fixed; inset:0; z-index:70;
    background:rgba(90,30,60,.42); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:18px;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .overlay.show { opacity:1; pointer-events:auto; }
  .panel {
    background:linear-gradient(#fff,#ffeef4);
    border-radius:30px; padding:clamp(18px,4vw,30px);
    width:min(92vw,420px); text-align:center;
    box-shadow:0 14px 40px rgba(90,30,60,.4);
    transform:scale(.85); transition:transform .3s cubic-bezier(.3,1.5,.5,1);
    max-height:92vh; overflow-y:auto;
  }
  .overlay.show .panel { transform:scale(1); }
  .panel h2 { font-size:clamp(24px,6.5vw,34px); color:#c2410c; }
  .panel p { font-size:clamp(14px,3.8vw,18px); font-weight:700; color:#8a5a3c; margin-top:6px; }
  .big-btn {
    border:none; cursor:pointer; font-family:inherit; font-weight:800;
    font-size:clamp(16px,4.4vw,21px); color:#fff;
    padding:14px 22px; border-radius:20px; width:100%;
    background:linear-gradient(#ff9a62,#ff6f91);
    box-shadow:0 5px 0 rgba(0,0,0,.18);
    margin-top:10px;
  }
  .big-btn.alt { background:linear-gradient(#9fd8ff,#6bb8ff); }
  .big-btn.ghost { background:rgba(0,0,0,.08); color:#8a5a3c; box-shadow:0 4px 0 rgba(0,0,0,.1); }
  .big-btn:active { transform:translateY(4px); box-shadow:none; }
  .btn-row { display:flex; gap:10px; margin-top:10px; }
  .btn-row .big-btn { margin-top:0; }

  .starrow { display:flex; justify-content:center; gap:min(3vw,14px); margin:10px 0 4px; }
  .starrow span {
    font-size:clamp(38px,11vw,60px); opacity:.22; filter:grayscale(1);
    transition:opacity .3s;
  }
  .starrow span.on { opacity:1; filter:none; animation:starpop .5s cubic-bezier(.3,1.7,.5,1); }
  @keyframes starpop { 0%{transform:scale(0) rotate(-60deg)} 60%{transform:scale(1.35) rotate(10deg)} 100%{transform:scale(1)} }

  .win-mascot { font-size:clamp(48px,14vw,78px); animation:bob 1.2s ease-in-out infinite; }

  .set-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 4px; font-size:clamp(15px,4vw,19px); font-weight:800; color:#8a5a3c;
    border-bottom:1px solid rgba(0,0,0,.07);
  }
  .toggle {
    border:none; cursor:pointer; font-family:inherit; font-weight:800;
    font-size:clamp(14px,3.6vw,17px); color:#fff;
    padding:8px 18px; border-radius:999px; min-width:88px;
    background:#6bd97a; box-shadow:0 3px 0 rgba(0,0,0,.15);
  }
  .toggle.off { background:#c9bdb6; }
  .toggle:active { transform:translateY(3px); box-shadow:none; }

  /* confetti */
  .confetti { position:fixed; top:-20px; z-index:80; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(105vh) rotate(720deg); } }
  .cann-x { position:fixed; bottom:6vh; z-index:80; pointer-events:none;
            animation:cannx 1.1s cubic-bezier(.15,.6,.5,1) forwards; }
  @keyframes cannx { to { transform:translateX(var(--tx)); } }
  .cann-y { display:block; animation:canny 1.1s cubic-bezier(.1,.85,.5,1) forwards; }
  @keyframes canny { 45%{transform:translateY(var(--rise))} 100%{transform:translateY(14vh)} }
  .cann-p { display:block; animation:spin .5s linear infinite; }

  /* ---------------- landscape: board left, panel right ---------------- */
  @media (orientation:landscape) and (max-height:560px) {
    #game { flex-direction:row; align-items:center; justify-content:center; gap:min(3vw,22px); padding-bottom:max(8px,var(--sab)); }
    /* wide screens have room in the side column, so the bar goes back in flow */
    .tools {
      position:static; transform:none; padding:0;
      background:none; box-shadow:none; -webkit-backdrop-filter:none; backdrop-filter:none;
    }
    #game .side {
      display:flex; flex-direction:column; gap:10px;
      width:min(40vw,300px); align-items:stretch;
    }
    .goals { flex-direction:column; align-items:stretch; }
    .goal { justify-content:flex-start; }
    .footnote { text-align:left; padding:0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bub, .win-mascot, #menu h1, .tile.sel .inner, .tile.sp1 .shape,
    .tile.sp1 .crown::before, .tile.sp1 .crown::after,
    .tile.sp3 .shape, .tile.sp3 .crown::before, .tile.sp3 .crown::after,
    .tile.sp2 .shape, .tile.sp2 .crown, .tile.aim .inner, .hand,
    .tile.dropin .inner, .tile.sweepout .inner, .tile.charge .inner,
    .tile.swapping .inner, #levelcard .lc-in,
    .tile.mixing .inner, .tile.push .inner,
    .smash, .tile.firing .inner, .tool.armed, .tool.armed::after, .tool.spent,
    .moves.low, .cann-p { animation:none !important; }
    /* the aim ring still has to read without the pulse */
    .tile.aim .shape { box-shadow:0 0 0 calc(var(--cell)*.05) #fff; }
  }
</style>
</head>
<body>

<!-- ---------------- MENU ---------------- -->
<div class="screen" id="menu">
  <h1>🍓 Fruit Pop</h1>
  <div class="totals" id="totals"></div>
  <button class="play-btn" id="play-btn"></button>
  <div class="lvl-grid" id="levels"></div>
  <button class="level-btn free-btn" id="free-btn">
    <span class="emoji">🎈</span><span class="name">Free Play</span>
    <span class="desc">No goals, no counting — just pop!</span>
  </button>
</div>

<!-- ---------------- GAME ---------------- -->
<div class="screen hidden" id="game">
  <div class="side">
    <div class="goals" id="goals"></div>
    <div class="tools" id="tools">
      <button class="tool" data-t="hammer"><span class="ic">🔨</span><span class="ct"></span></button>
      <button class="tool" data-t="swap"><span class="ic">🔄</span><span class="ct"></span></button>
      <button class="tool" data-t="mix"><span class="ic">🌀</span><span class="ct"></span></button>
    </div>
  </div>
  <div id="board-wrap"><canvas id="fx"></canvas><div id="board"><div id="cells"></div><div id="covers"></div></div></div>
  <div id="levelcard"><div class="lc-in"><div class="lc-n"></div><div class="lc-goals"></div></div></div>
  <p class="footnote" id="foot">Tap a fruit, then tap the one next to it.</p>
</div>

<!-- ---------------- overlays ---------------- -->
<div class="overlay" id="win">
  <div class="panel">
    <div class="win-mascot" id="win-mascot">🐻</div>
    <h2 id="win-title">Yay! You did it!</h2>
    <div class="starrow" id="starrow"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <p id="win-sub">3200 points</p>
    <p id="win-prize"></p>
    <button class="big-btn" id="next-btn">Next game ▸</button>
    <div class="btn-row">
      <button class="big-btn alt" id="again-btn">↺ Again</button>
      <button class="big-btn ghost" id="menu-btn">🏠 Levels</button>
    </div>
  </div>
</div>

<div class="overlay" id="more">
  <div class="panel">
    <div class="win-mascot">🎈</div>
    <h2>Need more moves?</h2>
    <p>No problem — here are five more!</p>
    <button class="big-btn" id="more-btn">Yes please! +5</button>
    <button class="big-btn ghost" id="more-quit">🏠 Levels</button>
  </div>
</div>

<div class="overlay" id="resume">
  <div class="panel">
    <div class="win-mascot">👋</div>
    <h2>Welcome back!</h2>
    <p>Keep going, or start this level fresh?</p>
    <button class="big-btn" id="resume-yes">▸ Keep going</button>
    <button class="big-btn alt" id="resume-new">↺ New game</button>
  </div>
</div>

<div id="safe-probe" aria-hidden="true"></div>
<header class="appbar">
  <button id="chrome-back" class="chrome-btn chrome-back" aria-label="Back">‹</button>
  <div class="appbar-mid" id="appbar-mid">
    <div class="title-wrap">
      <div class="lv" id="lv-name">Berry Patch</div>
      <div class="sc" id="score">0 points</div>
    </div>
    <div class="moves" id="moves-box">
      <div class="n" id="moves-n">20</div>
      <div class="l">MOVES</div>
    </div>
  </div>
  <button id="set-btn" class="chrome-btn chrome-set" aria-label="Settings">⚙</button>
</header>

<div class="overlay" id="settings">
  <div class="panel">
    <h2>⚙️ Settings</h2>
    <div class="set-row"><span>🔊 Sound</span><button class="toggle" id="t-sound">ON</button></div>
    <div class="set-row" id="vibe-row"><span>📳 Buzz</span><button class="toggle" id="t-vibe">ON</button></div>
    <button class="big-btn" id="set-close">Done</button>
  </div>
</div>

<script>
/* =======================================================================
   Fruit Pop — a match-3 for very small people.
   One file, no dependencies, no build step. See ../../README.md.
   ======================================================================= */

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- background bubbles ---------------- */
for (let i = 0; i < 8; i++) {
  const b = document.createElement('div');
  b.className = 'bub';
  const s = 40 + Math.random() * 120;
  b.style.width = b.style.height = s + 'px';
  b.style.left = Math.random() * 100 + 'vw';
  b.style.top = Math.random() * 100 + 'vh';
  b.style.animationDuration = (5 + Math.random() * 6) + 's';
  b.style.animationDelay = (-Math.random() * 6) + 's';
  document.body.appendChild(b);
}

/* ---------------- fruit ----------------
   The fruit emoji is the identity: it is a distinct silhouette as well as a
   distinct colour, so nothing here depends on colour vision alone.
   Each fruit also owns a note of the pentatonic scale, so clearing a colour
   always sounds like that colour — the board becomes a little instrument.    */
const KINDS = [
  { emoji:'🍓', name:'strawberry',  from:'#ff8494', to:'#e01235', note:0 },
  { emoji:'🍌', name:'banana',      from:'#ffdd4d', to:'#eea100', note:1 },
  { emoji:'🍇', name:'grapes',      from:'#bb8cff', to:'#6d22dd', note:2 },
  { emoji:'🍏', name:'green apple', from:'#89ea8a', to:'#1f9e30', note:3 },
  { emoji:'🍊', name:'orange',      from:'#ffb85e', to:'#ef6606', note:4 },
  { emoji:'🫐', name:'blueberry',   from:'#6dc2ff', to:'#0d68cf', note:5 },
];
const SP_NONE = 0, SP_STAR = 1, SP_RAIN = 2, SP_BOMB = 3;

/* ---------------- levels ----------------
   One board size everywhere — the big one. A 7x7 gives room for chains and
   boosters to actually do something, and a single size means the game never
   feels like it shrank.

   Levels are generated, not authored, so they never run out. Everything is a
   pure function of the level number, so Level 34 is the same board every time
   you replay it.

   The move budget comes from measured throughput rather than taste: naive play
   clears ~6.2 tiles per move on this board, so a goal of `per` fruit of one
   kind out of `kinds` takes about per*kinds/6.2 moves, and leaves come off at
   about one per move. Budget is 1.6x the binding constraint — a safety net wide
   enough that a child swapping at random still finishes.                      */
// A bigger board is simply a better board: more room for chains, bigger blasts,
// more chances that a move does something you didn't plan. 8x8 it is, and it
// fills as much of the screen as the goal chips and tool bar allow.
const ROWS = 8, COLS = 8;

/* Cutting cells out of the board was tried and rejected: a clipped board is a
   SMALLER board, and small is the opposite of fun here. Levels get their
   identity from what's ON the board instead. The per-column span machinery is
   kept because gravity is written against it and it's well tested — every
   column simply runs the full height. */
function spanFor(_shape, _c) { return [0, ROWS - 1]; }
// All four measured from real play, and all four are what the move budget is
// derived from — see cost() in levelFor.
const TILES_PER_MOVE    = 6.2;   // fruit cleared per move, naive play
const COVERS_PER_MOVE   = 0.45;  // leaves come off far slower than fruit
const BOOSTERS_PER_MOVE = 0.25;  // ~8 boosters per 30 moves, measured
const POINTS_PER_MOVE   = 900;   // ~15.5k over 14 moves, measured, kept pessimistic
const DROPS_PER_MOVE    = 0.045; // measured, and it is genuinely this slow
// With a machine feeding the column, ducklings arrive far faster than one that
// has to be dug out from wherever it was placed.
const DROPS_PER_MOVE_GEN = 0.16;
const ICE_PER_MOVE      = 0.5;
// Gifts open from a match beside them, like frost, but there are only ever one
// or two on a board so they arrive far more slowly than ice does.
const GIFTS_PER_MOVE    = 0.28;
// Jelly clears from any match beside it but keeps making more of itself, so
// what this really prices is net progress against the spread.
const JELLY_PER_MOVE    = 0.5;
// Combining needs two boosters alive AND adjacent, which essentially never
// happens by accident: measured, zero in 132 moves of bot play. This is the same
// shape of mistake as the old "make 3 bombs" goal, and it has the same fix — the
// hint has to steer at it, exactly as it already steers at leaves, ice and
// ducklings. Priced after re-measuring with that steering in place.
const COMBOS_PER_MOVE   = 0.09;
// Chains turned out more than twice as common as first guessed — 0.23/move
// measured, against an estimate of 0.10 — so a chain goal was finishing in about
// four moves against a budget built for thirty.
const CHAINS_PER_MOVE   = 0.22;   // ice only breaks from a match right beside it
const LEVEL_EMOJI = ['🍓','🍌','🍇','🍏','🍊','🫐','🍃','🌿','🌈','⭐','💣','🎀'];
// Centre-weighted only. Ring and scatter patterns looked nicer but stranded
// leaves on cold edge cells that almost never get matched, so the last two
// took longer than the whole rest of the level — a miserable tail for a child.
const COVER_PATTERNS = ['diamond', 'block'];

// A small deterministic PRNG. Levels are generated from a seed made of the
// level number, which is the important distinction from just calling Math.random:
// a level is genuinely varied, but Level 34 deals the SAME board every time, so
// "Again" replays what you just failed at and the stars you earned mean
// something. Rolling fresh on every visit would quietly break both.
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function levelFor(n) {
  // Ramps faster than it used to, and the helper tools are what pays for it.
  const kinds     = n < 3 ? 4 : n < 6 ? 5 : 6;
  const goalCount = n < 2 ? 1 : n < 5 ? 2 : 3;
  // Both plateau, around level 20. Past that the challenge holds steady and the
  // variety comes from which fruit and which leaf pattern — a toddler game
  // should not get harder forever.
  // Caps keep the longest level around 32 moves. Left uncapped this reached 43,
  // which is a long sit for a three-year-old.
  const per    = Math.min(24, 8 + n);
  // Leaves grow slowly and cap low. Measured, they come off at under half a
  // leaf per move — far slower than fruit — so a big patch quietly becomes the
  // binding constraint and blows the budget. Eight keeps them a real objective
  // without turning the level into a hunt for the last stubborn one.
  const leaves = Math.min(8, 1 + n);

  // Everything below is drawn from a stream seeded by the level number, so the
  // mix is genuinely varied instead of a visible five-step rotation — and still
  // identical every time you play Level n.
  const rng = mulberry32((n * 2654435761) >>> 0);
  const pick = a => a[Math.floor(rng() * a.length)];
  const shuffled = a => { const x = a.slice();
    for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; }
    return x; };

  // Whether this level will get a machine has to be known BEFORE the goals are
  // priced, because a machine changes what a goal is worth.
  const hasGen = n >= 25;
  const order = shuffled(Array.from({ length: kinds }, (_, i) => i));
  const fruit = i => ({ t: 'fruit', k: order[i % kinds], need: per });
  const leaf  = () => ({ t: 'leaf',  need: leaves });
  // ANY booster counts. Asking specifically for bombs meant asking a three-
  // year-old to engineer an L-shape on purpose; measured, that was 1 bomb in
  // 27 moves against a goal of 3, i.e. unfinishable.
  const boost = () => ({ t: 'boost', need: Math.min(6, 2 + Math.floor(n / 5)) });
  // Priced in moves, not in points — a flat "2500 + n*450" was worth about four
  // moves against a twelve move budget, i.e. already won.
  const score = () => ({ t: 'score', need: Math.round(POINTS_PER_MOVE * Math.min(20, 6 + n) / 100) * 100 });
  // ONE duckling per level, and priced at 0.045 per move, which looks harsh
  // until you measure it: a duckling only descends when its OWN column clears
  // beneath it, and the final row is a specific single cell that comes up
  // about once in eleven moves. Two of them lost more level-9 runs than they
  // won even with the hint steering hard toward them. One is a clear, focused
  // errand; two is a hunt.
  // One duckling is the right ask when the only one you get is placed at the
  // start. A machine feeding a stream of them makes that trivial, so a level
  // with a machine asks for three — and gets costed at the machine's rate, not
  // at the lonely-duckling rate.
  const drop  = () => ({ t: 'drop',  need: hasGen ? 3 : 1 });
  const ice   = () => ({ t: 'ice',   need: Math.min(10, 2 + Math.floor(n / 2)) });
  // The late-game set. Deliberately small numbers: each one is a scarce event,
  // and the budget is priced off measured throughput rather than off hope.
  // One knock opens a gift now, so a single one is not an objective — it is a
  // thing that happens on move two. The goal is opening SEVERAL, which is also
  // truer to what a gift is: a treat you go collecting.
  const gift  = () => ({ t: 'gift',  need: 4 + (n >= 45 ? 1 : 0) + (n >= 80 ? 1 : 0) });
  // "Clear the board of jelly." The number is how many it starts with, and
  // progress is how many fewer are on the board than that — so a blob spreading
  // pushes you BACK, and the goal is met only at zero. A fixed quota would have
  // been meaningless against something that makes more of itself.
  const jelly = () => ({ t: 'jelly', need: Math.min(6, 2 + Math.floor(n / 20)) });
  const combo = () => ({ t: 'combo', need: 1 });
  const chain = () => ({ t: 'chain', need: Math.min(4, 2 + Math.floor((n - 50) / 25)) });

  // Objective kinds unlock gradually so a new idea always arrives alone.
  const menu = ['fruit', 'fruit'];
  if (n >= 3)  menu.push('leaf');
  if (n >= 4)  menu.push('score');
  if (n >= 5)  menu.push('boost');
  if (n >= 6)  menu.push('drop');
  if (n >= 8)  menu.push('ice');
  if (n >= 20) menu.push('gift');
  if (n >= 30) menu.push('jelly');
  if (n >= 40) menu.push('combo');
  if (n >= 50) menu.push('chain');

  let goals;
  if (n === 1) goals = [fruit(0)];
  else if (n === 2) goals = [fruit(0), fruit(1)];
  else {
    // Pick distinct objective kinds (fruit may repeat, with different fruit).
    const chosen = [];
    for (let i = 0; i < goalCount; i++) {
      let t, guard = 0;
      do { t = pick(menu); } while (t !== 'fruit' && chosen.includes(t) && guard++ < 24);
      chosen.push(t);
    }
    let fi = 0;
    goals = chosen.map(t =>
        t === 'fruit' ? fruit(fi++)
      : t === 'leaf'  ? leaf()
      : t === 'score' ? score()
      : t === 'boost' ? boost()
      : t === 'drop'  ? drop()
      : t === 'gift'  ? gift()
      : t === 'jelly' ? jelly()
      : t === 'combo' ? combo()
      : t === 'chain' ? chain()
      : ice());
  }

  // Every goal type gets costed in moves from measured throughput, and the
  // budget follows whichever is slowest — otherwise a "make 4 bombs" level
  // would inherit a fruit level's budget and be impossible.
  const cost = g =>
      g.t === 'fruit' ? g.need * kinds / TILES_PER_MOVE
    : g.t === 'leaf'  ? g.need / COVERS_PER_MOVE
    : g.t === 'boost' ? g.need / BOOSTERS_PER_MOVE
    : g.t === 'score' ? g.need / POINTS_PER_MOVE
    : g.t === 'drop'  ? g.need / (hasGen ? DROPS_PER_MOVE_GEN : DROPS_PER_MOVE)
    : g.t === 'ice'   ? g.need / ICE_PER_MOVE
    : g.t === 'gift'  ? g.need / GIFTS_PER_MOVE
    : g.t === 'jelly' ? g.need / JELLY_PER_MOVE
    : g.t === 'combo' ? g.need / COMBOS_PER_MOVE
    : g.t === 'chain' ? g.need / CHAINS_PER_MOVE
    : 0;
  // 1.5x the binding constraint — tighter than it was, which is most of what
  // makes these levels harder. Still a safety net, and the "+5 moves" offer is
  // still there behind it, so nobody gets stuck.
  const moves = Math.max(12, Math.ceil(Math.max(...goals.map(cost)) * 1.5));

  return {
    n, name: 'Level ' + n,
    emoji: LEVEL_EMOJI[(n - 1) % LEVEL_EMOJI.length],
    rows: ROWS, cols: COLS, kinds, moves, goals,
    covers: (goals.find(g => g.t === 'leaf') || {}).need || 0,
    ducks:  (goals.find(g => g.t === 'drop') || {}).need || 0,
    ice:    (goals.find(g => g.t === 'ice')  || {}).need || 0,
    // One spare of each beyond what the goal asks for, so a level is never lost
    // to a single unlucky placement — and so they show up as scenery on levels
    // that did not ask for them at all, once you are deep enough to know them.
    // Two spare beyond the ask, since gifts are finite — nothing respawns them,
    // so the goal can never exceed what is placed. They are cheap to have around
    // now that one is swappable and opens on a single knock.
    // Two to start with; the rest arrive from the machine, or from the drip on
    // levels that have no machine.
    gifts:  (goals.find(g => g.t === 'gift') ? 2 : (n >= 20 ? 1 : 0)),
    giftDrip: (goals.find(g => g.t === 'gift') && n < 25) ? 0.035 : 0,
    // A machine makes what the level is ASKING for, so it is never decoration —
    // it is the level telling you where to work. No goal it can help with means
    // no machine, which is why it doesn't appear on score or leaf levels.
    gen: n < 25 ? null : (() => {
      const m = [];
      goals.forEach(g => {
        if (g.t === 'fruit') m.push({ t: 'fruit', k: g.k });
        if (g.t === 'gift')  m.push({ t: 'gift' });
        if (g.t === 'drop')  m.push({ t: 'duck' });
      });
      return m.length ? { makes: m, rate: .5 } : null;
    })(),
    // Three coconuts when the level asks for one, so a blast landing near ANY of
    // them counts. Measured with two on the board it took 31 moves of a 38-move
    // budget to crack one — finishable, but a long errand for a three-year-old,
    // and the fix is more targets rather than a longer level.
    jelly:  (goals.find(g => g.t === 'jelly') || {}).need || 0,
    pattern: pick(COVER_PATTERNS),
    // Single-layer frost early; thick blocks creep in later for texture.
    thickIce: Math.min(0.5, Math.max(0, (n - 10) * 0.05)),
  };
}
const FREE = { name:'Free Play', emoji:'🎈', rows:ROWS, cols:COLS, kinds:5, moves:0, goals:[], covers:0, shape:'full' };
// 3 stars if you finish inside par, 2 inside the stretch, 1 for finishing at all.
// Tuned against measured play: budgets stay generous enough that every level is
// finishable by a child swapping more or less at random, but at 0.75 that same
// random play also three-starred the late levels, which made the stars
// meaningless. The budget is the safety net; par is the actual challenge.
const par3 = L => Math.round(L.moves * 0.62);
const par2 = L => Math.round(L.moves * 0.85);

/* ---------------- storage (all keys namespaced match3-) ---------------- */
function stars() {
  try { return JSON.parse(localStorage.getItem('match3-stars') || '{}') || {}; }
  catch (e) { return {}; }
}
function setStar(lvl, n) {
  const s = stars();
  if ((s[lvl] || 0) < n) { s[lvl] = n; localStorage.setItem('match3-stars', JSON.stringify(s)); }
}
// Points are kept forever across every level, so there's always a number going
// up even on a level you've already three-starred.
function totalScore() { const v = +(localStorage.getItem('match3-total') || 0); return isFinite(v) ? v : 0; }
function addTotal(n) { try { localStorage.setItem('match3-total', String(totalScore() + n)); } catch (e) {} }
function totalStars() { return Object.values(stars()).reduce((a, b) => a + (b || 0), 0); }
// Highest level opened up. Beating level n unlocks n+1, forever.
function maxLevel() { const v = +(localStorage.getItem('match3-max') || 1); return isFinite(v) && v >= 1 ? Math.floor(v) : 1; }
function unlockLevel(n) { if (n > maxLevel()) { try { localStorage.setItem('match3-max', String(n)); } catch (e) {} } }

/* ---------------- helper tools ----------------
   🔨 pops any one fruit, 🔄 trades any two neighbours even with no match, and
   🌀 mixes the board. They cost no move on purpose — they're a treat, not a
   currency, and nothing here is for sale. You earn them by finishing levels. */
const TOOL_IDS = ['hammer', 'swap', 'mix'];
const TOOL_ICON = { hammer: '🔨', swap: '🔄', mix: '🌀' };
const TOOL_CAP = 9;
function tools() {
  let t;
  try { t = JSON.parse(localStorage.getItem('match3-tools') || 'null'); } catch (e) { t = null; }
  if (!t || typeof t !== 'object') t = { hammer: 2, swap: 2, mix: 1 };   // a starter set
  TOOL_IDS.forEach(k => { const v = +t[k]; t[k] = isFinite(v) && v > 0 ? Math.min(TOOL_CAP, Math.floor(v)) : 0; });
  return t;
}
function saveTools(t) { try { localStorage.setItem('match3-tools', JSON.stringify(t)); } catch (e) {} }
function grantTool(id, n) {
  const t = tools();
  t[id] = Math.min(TOOL_CAP, (t[id] || 0) + (n || 1));
  saveTools(t);
  return t[id];
}
function spendTool(id) {
  const t = tools();
  if (!t[id]) return false;
  t[id]--; saveTools(t); paintTools();
  const btn = document.querySelector('#tools .tool[data-t="' + id + '"]');
  if (btn) { btn.classList.remove('spent'); void btn.offsetWidth; btn.classList.add('spent');
             setTimeout(() => btn.classList.remove('spent'), 480); }
  return true;
}
function saveGame() {
  // Nothing worth restoring until a move has been made — and writing anyway
  // would let a level you merely opened overwrite a half-played one.
  if (!L || freePlay || over || !movesUsed) return;
  try {
    localStorage.setItem('match3-save', JSON.stringify({
