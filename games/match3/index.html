      lv: levelNo, score, movesLeft, used: movesUsed, helped: usedHelp,
      got: goalGot, made: boostMade, home: ducksHome,
      gift: giftsOpened, jel: jellyCleared, combo: combosMade, chain: bigChains,
      cov: covers.map(row => row.slice()),
      blk: (() => { const o = []; for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
              const t = grid[r][c];
              if (t && t.block) o.push([r, c, t.block, t.hits || 0,
                    t.block === 'gen' ? [t.makes, t.rate, t.next] : 0]);
              else if (t && t.ice) o.push([r, c, 'ice', t.ice]);
              else if (t && t.jelly) o.push([r, c, 'jel', 1]); } return o; })(),
      grid: grid.map(row => row.map(t => t ? [t.k, t.sp] : null)),
    }));
  } catch (e) {}
}
function loadSave() {
  try { return JSON.parse(localStorage.getItem('match3-save') || 'null'); }
  catch (e) { return null; }
}
function clearSave() { localStorage.removeItem('match3-save'); }
// A save is only usable for this level if its board matches the level's shape
// and the goal isn't already finished.
function validSave(sv, i) {
  const lv = levelFor(i);
  if (!sv || sv.lv !== i) return false;
  if (!Array.isArray(sv.grid) || sv.grid.length !== lv.rows) return false;
  if (!sv.grid.every(row => Array.isArray(row) && row.length === lv.cols)) return false;
  if (!Array.isArray(sv.got) || sv.got.length !== lv.goals.length) return false;
  // Don't offer to resume a level that's already finished — checked against
  // whatever kinds of goal it actually has.
  const covLeft = Array.isArray(sv.cov)
    ? sv.cov.reduce((a, row) => a + (row || []).filter(Boolean).length, 0) : lv.covers;
  const made = sv.made || {};
  const allDone = lv.goals.every((g, k) =>
      g.t === 'leaf'  ? covLeft === 0
    : g.t === 'score' ? (sv.score || 0) >= g.need
    : g.t === 'boost' ? Object.values(made).reduce((x, y) => x + y, 0) >= g.need
    : (sv.got[k] || 0) >= g.need);
  return !allDone;
}

/* ---------------- sound (WebAudio, no assets) ---------------- */
let soundOn = localStorage.getItem('match3-sound') !== 'off';
let vibeOn  = localStorage.getItem('match3-vibe')  !== 'off';
/* ---------------- sound ----------------
   Everything is synthesised — no audio files, so the whole game stays one file
   that works offline.

   THE BUS. Every voice used to connect straight to ctx.destination, which is
   fine for one beep and wrong for this game: a five-deep cascade fires twenty
   voices inside a second, they sum past 1.0, and a phone speaker turns that into
   crackle exactly when the game is at its most exciting. Voices now go through a
   master gain into a limiter, so a big moment gets LOUDER rather than dirtier.

   Everything also has a little room around it. A short synthetic reverb — noise
   with an exponential decay, generated once — is most of the difference between
   sounds that read as a designed soundscape and sounds that read as beeps. It is
   on a send, so each voice picks how wet it is: pops stay close and dry, big
   blasts bloom.

   Everything is in C major pentatonic, so no two sounds that happen to overlap
   can ever be dissonant. That matters more here than in most games, because
   cascades routinely play six things at once. */
let actx = null, busDry = null, busWet = null, master = null, limiter = null;
function ac() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = .9;
    // A limiter, not a compressor: hard ratio, fast attack, so peaks are caught
    // and nothing below the threshold is squashed.
    const lim = actx.createDynamicsCompressor();
    lim.threshold.value = -8; lim.knee.value = 0; lim.ratio.value = 20;
    lim.attack.value = .003; lim.release.value = .25;
    master.connect(lim); lim.connect(actx.destination);
    limiter = lim;                       // exposed so its gain reduction is measurable

    busDry = actx.createGain(); busDry.gain.value = 1;
    busDry.connect(master);

    const rev = actx.createConvolver();
    const len = Math.floor(actx.sampleRate * .9);
    const ir = actx.createBuffer(2, len, actx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        // Slight pre-delay by starting quiet, then an exponential tail.
        const t = i / len;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.6) * Math.min(1, t * 40);
      }
    }
    rev.buffer = ir;
    busWet = actx.createGain(); busWet.gain.value = .34;
    busWet.connect(rev); rev.connect(master);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
// Route one voice to the dry bus and, optionally, to the reverb send.
function out(node, send) {
  node.connect(busDry);
  if (send) { const s = ac().createGain(); s.gain.value = send; node.connect(s); s.connect(busWet); }
}
/* A pitched voice. Two oscillators a few cents apart give it width and stop it
   sounding like a test tone, and the attack is 2ms rather than 12ms so there is
   an audible edge on the front — that edge is most of what makes a pop read as a
   pop rather than as a note. `bend` slides the pitch over the note, which is what
   turns a tone into a "boing", a "zap" or a "thud" depending on the direction. */
function blip(freq, t0, dur, o = {}) {
  const ctx = ac(), T = ctx.currentTime + t0;
  const vol = o.vol == null ? .16 : o.vol;
  const g = ctx.createGain();
  g.gain.setValueAtTime(.0001, T);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002, vol), T + (o.attack || .002));
  g.gain.exponentialRampToValueAtTime(.0001, T + dur);
  const oscs = [];
  for (const cents of (o.detune == null ? [-5, 5] : [0])) {
    const osc = ctx.createOscillator();
    osc.type = o.type || 'triangle';
    osc.detune.value = cents + (o.detune || 0);
    osc.frequency.setValueAtTime(freq, T);
    if (o.bend) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * o.bend), T + dur);
    osc.connect(g); osc.start(T); osc.stop(T + dur + .05);
    oscs.push(osc);
  }
  out(g, o.send);
}
// Filtered noise. `q` high enough makes it ring, which is how you get a woody

function noise(t0, dur, vol = .1, hz = 1400, o = {}) {
  const ctx = ac(), n = Math.max(1, Math.floor(ctx.sampleRate * dur));
  const buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
  const curve = o.curve || 1;
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, curve);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const f = ctx.createBiquadFilter();
  f.type = o.type || 'bandpass'; f.frequency.value = hz; f.Q.value = o.q || 1;
  if (o.hz2) f.frequency.exponentialRampToValueAtTime(o.hz2, ctx.currentTime + t0 + dur);
  const g = ctx.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g);

function thud(t0, freq = 150, dur = .18, vol = .22, send) {

// Major pentatonic — every cascade step lands on a consonant note.
const PENTA = [1, 9/8, 5/4, 3/2, 5/3, 2, 9/4, 5/2, 3];
// The cascade ladder, and the single most satisfying thing in the genre: each
// step of a chain comes back a little higher than the last. The old one capped
// after three steps and jumped a half-octave at a time, so it ran out of ladder
// exactly when the cascade got impressive. Ten steps up the pentatonic scale
// instead, which keeps climbing for as long as the board keeps giving.
const rung = n => PENTA[Math.min(n, PENTA.length - 1)];
// A touch of pitch variance so the hundredth pop of a session doesn't land on
// exactly the same frequency as the first.
const hum = () => 1 + (Math.random() - .5) * .012;

    // should sound like one thing travelling, not two things happening.

    }

    if (name === 'pop') {
      // The fruit picks the note, the cascade picks how far up the scale it
      // sits, so clearing three bananas always sounds like bananas — just
      // brighter the deeper the chain runs.
      const step = rung(n);
      const uniq = [...new Set(notes || [])].slice(0, 4);
      click(0, .06 + Math.min(n, 6) * .012, 3200);
      const send = .12 + Math.min(n, 8) * .035;
      if (uniq.length) {
        uniq.forEach((note, i) => blip(C4 * PENTA[note] * step * hum(), i * .032, .19,
          { vol: .12, bend: 1.01, send }));
      } else {
        blip(C4 * step * hum(), 0, .15, { vol: .13, send });
      }
      noise(0, .09, .045, 2400, { q: .8, send });
      // A chain that has run a few deep earns some weight underneath it.
      if (n >= 2) thud(0, 110 + n * 12, .16, .1 + Math.min(n, 6) * .015, .2);
    }

    if (name === 'leaf') {
      noise(0, .2, .06, 2600, { hz2: 5200, q: .8, send: .3 });
      blip(392 * hum(), .01, .16, { type: 'sine', vol: .05, send: .25 });
    }

    // A booster being born: a rising figure that lands on the octave, with a
    // shimmer over the top. It should sound like a reward, not like a match.
    if (name === 'make') {
      [0, 2, 4, 5].forEach((i, k) => blip(C4 * PENTA[i] * 1.5, k * .055, .3,
        { vol: .12, send: .3 }));
      blip(C4 * 4, .16, .5, { type: 'sine', vol: .05, send: .5 });
      click(0, .05, 4000);
    }
    if (name === 'lucky') {
      [0, 2, 4, 5, 7].forEach((i, k) => blip(C4 * PENTA[i] * 1.5, k * .05, .34,
        { vol: .13, send: .34 }));
      blip(C4 * 6, .2, .6, { type: 'sine', vol: .05, send: .55 });
    }

    // Gift opening — bright, bell-like, unmistakably a present.
    if (name === 'gift') {
      [0, 4, 7].forEach((i, k) => {
        const f = C4 * PENTA[i] * 2;
        blip(f, k * .05, .5, { type: 'sine', vol: .11, send: .45 });
        blip(f * 2.76, k * .05, .3, { type: 'sine', vol: .03, send: .5 });   // bell partial
      });
      click(0, .06, 5000);
    }
    // Coconut cracking — a woody snap. High-Q noise is what makes it read as
    // something splitting rather than something exploding.
    if (name === 'crack') {
      click(0, .13, 2200);
      noise(0, .12, .13, 380, { q: 7, curve: 2.4, send: .2 });
      noise(.02, .22, .07, 1500, { hz2: 500, q: 2.5, send: .25 });
      thud(0, 90, .18, .14, .2);
    }

    if (name === 'level') {
      [0, 2, 4, 5].forEach((i, k) => blip(C4 * PENTA[i], k * .09, .45, { vol: .12, send: .4 }));
      noise(.05, .35, .025, 1400, { hz2: 4000, send: .4 });
    }

    // The orb winding up: one continuous rise, not a staircase of pings.
    if (name === 'windup') {
      blip(220, 0, .42, { type: 'sawtooth', vol: .07, bend: 5.2, send: .3 });
      noise(0, .42, .05, 500, { hz2: 6000, q: 1.2, send: .35 });
    }

    if (name === 'swing') { noise(0, .14, .07, 1200, { hz2: 300, q: 1.4 }); thud(.1, 190, .14, .12, .15); }

    if (name === 'zap') {
      blip((1400 + Math.random() * 900), 0, .09, { type: 'sine', vol: .08, bend: .55, send: .3 });
      click(0, .05, 5200);
    }

    // The big one. Sub thump for the chest, a noise burst for the air, and a
    // falling saw for the body — layered, because one oscillator can never
    // sound like an explosion.
    if (name === 'blast') {
      const deep = Math.min(n, 4);
      thud(0, 150 - deep * 12, .38, .26, .3);
      noise(0, .38, .11, 1100, { hz2: 260, q: .7, curve: 1.5, send: .4 });
      [0, 2, 4].forEach((i, k) => blip(C4 * PENTA[i] / 2, k * .045, .3,
        { type: 'sawtooth', vol: .06, bend: .7, send: .35 }));
      click(0, .1, 2600);
    }

    if (name === 'goal') {
      const f = C4 * 2;
      blip(f, 0, .4, { type: 'sine', vol: .11, send: .4 });
      blip(f * 2.76, 0, .22, { type: 'sine', vol: .035, send: .45 });
      blip(f * 1.5, .07, .45, { type: 'sine', vol: .07, send: .45 });
    }

    if (name === 'mix') {
      noise(0, .5, .06, 400, { hz2: 5000, q: 1.2, send: .35 });
      for (let i = 0; i < 6; i++) blip(C4 * PENTA[i] * hum(), i * .05, .22, { vol: .06, send: .3 });
    }

    // A real phrase with a bass note under it, rather than a run up the scale.
    if (name === 'win') {
      [[0,0],[2,.11],[4,.22],[7,.33],[5,.46],[7,.58]].forEach(([i, t]) =>
        blip(C4 * PENTA[i], t, .5, { vol: .14, send: .45 }));
      blip(C4 / 2, 0, .9, { type: 'sine', vol: .1, send: .3 });
      blip(C4 * PENTA[4] / 2, .46, .8, { type: 'sine', vol: .09, send: .3 });
      noise(0, .5, .02, 2000, { hz2: 6000, send: .5 });
    }

    // One star, then the next a step higher.
    if (name === 'star') {
      const f = C4 * PENTA[n * 2] * 2;
      blip(f, 0, .55, { type: 'sine', vol: .15, send: .5 });
      blip(f * 2.76, 0, .3, { type: 'sine', vol: .04, send: .5 });
      click(0, .05, 6000);
    }

}

/* ---------------- game state ---------------- */
let L = null, levelNo = 0, freePlay = false;

const THEMES = [
  ['#ffb37a', '#ff8fa8', '#c98bff'],   // sunset — the original
  ['#8fd4ff', '#7fb0ff', '#b58cff'],   // morning sky
  ['#ffd98a', '#ffa86b', '#ff7fa6'],   // orchard
  ['#9be8c8', '#5fc9b0', '#4f9ed8'],   // meadow
  ['#c7a7ff', '#9d7df0', '#5f6bd8'],   // dusk
  ['#ffc2d6', '#ff9ec4', '#c489ff'],   // blossom

function setTheme(n) {

let R = 0, C = 0, KN = 4;
let grid = [];               // grid[r][c] = tile | null
// The board's silhouette: rows [colTop[c] .. colBot[c]] exist in column c, the rest

// this board" — cellOk is the authority on which.
let colTop = [], colBot = [];
const cellOk = (r, c) => c >= 0 && c < C && r >= colTop[c] && r <= colBot[c];
let score = 0, movesLeft = 0, movesUsed = 0, usedHelp = false;
let goalGot = [];            // parallel to L.goals (fruit counts)
let boostMade = {};          // boosters created this level, by kind
let covers = [], coversLeft = 0;
let ducksHome = 0, iceLeft = 0;
// Gifts opened, coconuts cracked, booster pairs combined, and how many moves
// have set off a cascade of three or more.
let giftsOpened = 0, jellyCleared = 0, combosMade = 0, bigChains = 0;
// Set when a move is spent, so jelly grows once per MOVE rather than once per

let jellySpreads = false;
let busy = false, sel = null, over = false;
let armed = null, toolPick = null;   // which helper tool is primed, and its first pick
let idleTimer = null, nudged = [], handEl = null;
// Moves since the last booster. Boosters are the best part of the game, and a
// 4-in-a-row is rare on a big board — measured at 1.7 per 30 moves on the 7x7,

const PITY = () => (KN <= 4 ? 8 : 5);
const REFILL_BIAS = () => (KN <= 4 ? 0.15 : 0.25);

const board = $('board');

/* ---------------- tiles ---------------- */
function makeTile(k, r, c, sp = SP_NONE) {
  const el = document.createElement('div');
  el.className = 'tile';
  const inner = document.createElement('div'); inner.className = 'inner';
  const shape = document.createElement('div'); shape.className = 'shape';
  const face  = document.createElement('div'); face.className  = 'face';
  // The booster markings are drawn entirely with pseudo-elements on .crown, so
  // it needs no children of its own.
  const crown = document.createElement('div'); crown.className = 'crown';
  inner.append(shape, face, crown);
  el.appendChild(inner);
  const t = { k, sp, r, c, el, shape, face, crown };
  paint(t);
  // Append before placing: place(…, true) forces a reflow to pin the starting
  // position, and a detached element has no layout to flush.
  board.appendChild(el);
  place(t, r, c, true);
  return t;
}
function paint(t) {
  const el = t.el;
  el.classList.remove('sp1', 'sp2', 'sp3', 'blk', 'duck', 'gift', 'gen', 'hit1',
                      'ice', 'ice1', 'ice2', 'jelly', 'j-u', 'j-d', 'j-l', 'j-r',
                      'k0', 'k1', 'k2', 'k3', 'k4', 'k5');
  // The fruit's own outline. Rainbows (k < 0) and blockers have no kind shape.
  if (t.k >= 0 && t.k < KINDS.length) el.classList.add('k' + t.k);
  t.crown.textContent = '';
  if (t.block) {
    t.shape.className = 'shape';
    t.shape.style.background = '';
    el.classList.add('blk', t.block);
    if (t.hits && t.hits < BLOCKS[t.block].hits) el.classList.add('hit1');
    t.face.textContent = t.block === 'gen' ? genFace(t) : BLOCKS[t.block].emoji;
    el.setAttribute('aria-label', BLOCKS[t.block].say(t));
    return;
  }
  if (t.sp === SP_RAIN) {
    t.shape.className = 'shape';
    t.shape.style.background = '';
    t.face.textContent = '🌈';
    el.classList.add('sp2');
    el.setAttribute('aria-label', 'rainbow');
  } else {
    const K = KINDS[t.k];
    t.shape.className = 'shape';
    t.shape.style.background = 'linear-gradient(160deg,' + K.from + ',' + K.to + ')';
    t.face.textContent = K.emoji;
    if (t.sp === SP_STAR)      { el.classList.add('sp1'); el.setAttribute('aria-label', K.name + ' star'); }
    else if (t.sp === SP_BOMB) { el.classList.add('sp3'); el.setAttribute('aria-label', K.name + ' bomb'); }
    else el.setAttribute('aria-label', K.name);
  }
  // Frost sits OVER the fruit rather than replacing it: you can see what you're
  // going to free, and it can never read as a blank white square.
  if (t.jelly) {
    el.classList.add('jelly');
    el.setAttribute('aria-label', KINDS[t.k].name + ' stuck in bubblegum, match beside it to free it');
  }
  if (t.ice > 0) {
    el.classList.add('ice', t.ice > 1 ? 'ice2' : 'ice1');
    el.setAttribute('aria-label', KINDS[t.k].name

      + ', can be matched but not moved');
  }
}
function place(t, r, c, instant) {
  t.r = r; t.c = c;
  if (instant) t.el.style.transitionDuration = '0s';
  t.el.style.setProperty('--tr', r);
  t.el.style.setProperty('--tc', c);
  if (instant) { void t.el.offsetWidth; t.el.style.transitionDuration = ''; }
}
function isRain(t) { return t && t.sp === SP_RAIN; }

/* ---------------- special tiles ----------------
   Two kinds of thing sit on the board that are NOT fruit, share one rule —
   they can never be matched and can never be popped — and differ in how you
   get rid of them:

     🐤 duckling  falls with everything else and leaves at the bottom row, so
                  you have to empty the column underneath it

   It uses k = BLOCK_K, which runsOn already skips.

   A duckling IS swappable, though — it just can't match. Swap one with a
   neighbouring fruit and the move stands only if that fruit makes a run in the
   duckling's old cell, so the "every move is a match" rule holds and you still
   get to steer the duckling out of a column you have no way to clear. That
   column was the whole reason drop levels came down to luck.

   Frozen fruit is deliberately NOT one of these. Ice is a layer ON a fruit
   (t.ice = how many layers are left), so the board never loses a cell to it,
   you can see which fruit you're about to free, and it can't render as a blank
   white square. Chip the last layer off and the fruit is simply yours. */
const BLOCK_K = -2;
const isBlock = t => !!t && t.block;

/* The three things on the board that are not fruit. They share one rule — never
   matched, never popped — and differ in every other way, which is the point:
   each one asks for a different kind of move.

   `hits`    how many knocks it takes, 0 meaning it isn't broken at all
   `blastOnly` ignores ordinary matches entirely; only a booster going off over

             one dial that makes an element care about boosters.
   `move`    only a duckling can be shoved sideways. Frost, gifts and coconuts

const BLOCKS = {
  duck: { emoji:'🐤', hits:0, blastOnly:false, move:true,
          say:() => 'duckling, can be moved but not matched' },
  gift: { emoji:'🎁', hits:1, blastOnly:false, move:true,
          say:() => 'gift box, match beside it to open it — it can also be moved' },
  // A machine. Never moves, never matches, never breaks — it is furniture, and
  // it makes the thing this level is asking for.
  gen:  { emoji:'🎰', hits:0, blastOnly:false, move:false,
          say:t => 'machine making ' + genLabel(t) },
};
// What a generator is about to drop, as an emoji and as words.
function genFace(t) {
  const m = t.next;
  return !m ? '❓' : m.t === 'fruit' ? KINDS[m.k].emoji : m.t === 'gift' ? '🎁' : '🐤';
}
function genLabel(t) {
  const m = t.next;

// Only a duckling may be swapped. Everything else stays put until it breaks.

const canMove = t => !!t && (!t.block || BLOCKS[t.block].move) && !t.ice && !t.jelly;

function makeBlock(kind, r, c) {
  const t = makeTile(0, r, c);
  t.k = BLOCK_K; t.block = kind;
  t.hits = BLOCKS[kind].hits;

}

/* ---------------- layout ---------------- */
// The four safe-area insets, in pixels, read off the probe's resolved padding.
function safeInsets() {
  const s = getComputedStyle($('safe-probe'));
  return { t: parseFloat(s.paddingTop) || 0,    r: parseFloat(s.paddingRight) || 0,
           b: parseFloat(s.paddingBottom) || 0, l: parseFloat(s.paddingLeft) || 0 };
}
function layout() {
  if (!L) return;
  // Give the board as much of the screen as the chrome allows — it's the thing
  // you're actually looking at, and a bigger board is a better board.
  const ins = safeInsets();
  const land = window.innerWidth > window.innerHeight && window.innerHeight <= 560;
  const wideW = window.innerWidth - Math.max(12, ins.l) - Math.max(12, ins.r);
  const availW = wideW * (land ? 0.56 : 0.99);
  const availH = land
    ? (window.innerHeight - Math.max(8, ins.t) - Math.max(8, ins.b)) * 0.94
    : window.innerHeight * 0.66;
  let cell = Math.max(30, Math.floor(Math.min(availW / C, availH / R, 96)));
  const apply = c => {
    board.style.setProperty('--cell', c + 'px');
    board.style.setProperty('--rows', R);
    board.style.setProperty('--cols', C);
  };
  apply(cell);
  // The chrome row, the topbar and the goal chips all draw from the same
  // column. Rather than guess their heights, lay out once and hand back
  // whatever overflowed — a board running under the corner buttons is worse
  // than a slightly smaller one. Measure the in-flow children: the tool bar is
  // pinned, and .side holds only the topbar, so neither alone tells the story.
  const g = $('game');
  for (let i = 0; g && i < 5 && cell > 30; i++) {
    const flow = [...g.children].filter(el =>
      getComputedStyle(el).position !== 'fixed' && el.getBoundingClientRect().height > 0);
    if (!flow.length) break;
    const rects = flow.map(el => el.getBoundingClientRect());
    const contentH = Math.max(...rects.map(r => r.bottom)) - Math.min(...rects.map(r => r.top));
    const gs = getComputedStyle(g);
    const box = g.clientHeight - parseFloat(gs.paddingTop) - parseFloat(gs.paddingBottom);
    const over = contentH - box;
    if (over <= 0.5) break;
    cell = Math.max(30, cell - Math.ceil(over / R));
    apply(cell);
  }
  fxResize();
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 120));

/* ---------------- board generation ---------------- */
const rnd = n => Math.floor(Math.random() * n);
// The opening deal is seeded by the level number, so Level 34 lays out the same
// board every time and "Again" really does replay what you just failed. Only
// the OPENING deal: refills during play stay properly random, or a level would
// be a fixed script you could memorise rather than a puzzle.
let levelRng = Math.random;
const rndL = n => Math.floor(levelRng() * n);
// Fruit accelerates as it falls rather than easing in and out — floaty tiles
// were the single biggest thing making the board feel unphysical.
const FALL_EASE = 'cubic-bezier(.38,0,.72,.36)';

// Refilled fruit sometimes copies a neighbour. That seeds the near-misses that
// turn into cascades and 4-in-a-rows, which is what makes the board feel alive
// instead of random. 0.25 measured best: plenty of chains without the board
// resolving itself for ten seconds.
function refillKind(r, c) {
  if (Math.random() < REFILL_BIAS()) {
    const nb = [];
    for (const [dr, dc] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < R && cc >= 0 && cc < C && grid[rr] && grid[rr][cc] && grid[rr][cc].k >= 0)
        nb.push(grid[rr][cc].k);
    }
    if (nb.length) return nb[rnd(nb.length)];
  }
  return rnd(KN);
}

function runsOn(g) {
  // Every horizontal/vertical run of 3+ of the same kind. Rainbows (k<0) never
  // match.
  //
  // Frozen fruit DO count towards a run: the fruit is still there and still has
  // a colour, so you can break frost head-on by matching what's inside it
  // instead of only nibbling at it from beside. It doesn't pop — it takes a hit
  // on the ice and the free fruit in the run pop around it.
  //
  // A run must contain at least one UNFROZEN fruit to count, though. Three
  // frozen fruit in a line would clear nothing whatsoever, and resolve() loops
  // until the board stops producing groups — so it would spin on that same
  // group forever.
  const out = [];
  // ...and a run needs at least one fruit that is neither frozen nor jellied,
  // for the same reason: a run of nothing but coated fruit clears nothing at all
  // and resolve() would spin on it forever.
  const push = (cells, k, dir) => {
    if (cells.some(([r, c]) => !g[r][c].ice && !g[r][c].jelly)) out.push({ k, cells, dir });
  };
  for (let r = 0; r < R; r++) {
    let c = 0;
    while (c < C) {
      const t = g[r][c];
      if (!t || t.k < 0) { c++; continue; }
      let e = c + 1;
      while (e < C && g[r][e] && g[r][e].k === t.k) e++;
      if (e - c >= 3) { const cells = []; for (let i = c; i < e; i++) cells.push([r, i]); push(cells, t.k, 'h'); }
      c = e;
    }
  }
  for (let c = 0; c < C; c++) {
    let r = 0;
    while (r < R) {
      const t = g[r][c];
      if (!t || t.k < 0) { r++; continue; }
      let e = r + 1;
      while (e < R && g[e][c] && g[e][c].k === t.k) e++;
      if (e - r >= 3) { const cells = []; for (let i = r; i < e; i++) cells.push([i, c]); push(cells, t.k, 'v'); }
      r = e;
    }
  }
  return out;
}

// Merge runs that share a cell, so an L or T becomes one group.
function groups() {
  const runs = runsOn(grid);
  if (!runs.length) return [];
  const parent = runs.map((_, i) => i);
  const find = x => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  const seen = new Map();
  runs.forEach((run, i) => {
    run.cells.forEach(([r, c]) => {
      const key = r * C + c;
      if (seen.has(key)) { const a = find(seen.get(key)), b = find(i); if (a !== b) parent[a] = b; }
      else seen.set(key, i);
    });
  });
  const byRoot = new Map();
  runs.forEach((run, i) => {
    const root = find(i);
    if (!byRoot.has(root)) byRoot.set(root, { k: run.k, cells: new Map(), lines: 0, maxRun: 0 });
    const g = byRoot.get(root);
    g.lines++;
    g.maxRun = Math.max(g.maxRun, run.cells.length);
    run.cells.forEach(([r, c]) => g.cells.set(r * C + c, [r, c]));
  });
  return [...byRoot.values()].map(g => ({ k: g.k, lines: g.lines, maxRun: g.maxRun, cells: [...g.cells.values()] }));
}

// The move the hint should point at. Same search as anyMove, but a swap that
// clears a leaf wins — otherwise the last stubborn leaf can outlast the whole
// budget, since nothing else on the board steers you towards it.
function hintMove() {
  let fallback = null, best = -1;
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const r2 = r + dr, c2 = c + dc;
      if (r2 >= R || c2 >= C) continue;
      const a = grid[r][c], b = grid[r2][c2];
      // Ducklings are swappable, so a duckling swap is a real candidate here —
      // runsOn decides, and it can only ever come back true for the fruit that
      // lands in the duckling's cell, which is exactly the rule.
      // A swap moves BOTH tiles, so both have to be movable — and one of them
      // has to be able to match, since two blockers together could never make a
      // run.
      if (!a || !b || (a.block && b.block)) continue;
      if (!canMove(a) || !canMove(b)) continue;
      // Only a rainbow (or two boosters together) goes off regardless. A star
      // or bomb swapped against a plain fruit still has to make a match, so it
      // must be tested like any other swap — pointing the finger at one that
      // doesn't match teaches a child that the hint lies.
      if (isRain(a) || isRain(b) || (a.sp !== SP_NONE && b.sp !== SP_NONE)) {
        // Two boosters side by side, on a level that is asking you to combine
        // two boosters: that IS the answer, so point straight at it rather than
        // filing it as a fallback behind every ordinary match on the board.
        if (a.sp !== SP_NONE && b.sp !== SP_NONE
            && L.goals.some((g, gi) => g.t === 'combo' && goalProgress(g, gi) < g.need))

      const gs = groups();
      // Score the move by how much it advances whatever this level still wants.
      // Without this the finger points at any old match, and objectives that
      // need a SPECIFIC cell cleared — a duckling's column, a block of ice —
      // essentially never progress: measured, one duckling home in 25 moves.
      let sc = 0;
      for (const g of gs) for (const [gr, gc] of g.cells) {
        if (covers[gr] && covers[gr][gc]) sc += 3;
        // A match that takes in frozen fruit chips them directly, which beats
        // hoping a neighbour happens to be next to one.
        if (grid[gr][gc] && grid[gr][gc].ice) sc += 4;
        for (let up = gr - 1; up >= 0; up--) {           // a duckling above this cell
          const d = grid[up][gc];
          if (d && d.block === 'duck') { sc += 5; break; }
          if (d && d.block) break;
        }
        for (const [dr, dc] of [[0,1],[0,-1],[1,0],[-1,0]]) {
          const nb = grid[gr + dr] && grid[gr + dr][gc + dc];
          if (nb && nb.ice) sc += 3;
          // A gift opens from a match beside it, so it is worth steering to. A
          // coconut is not: nothing an ordinary match does touches it.
          if (nb && nb.block === 'gift') sc += 4;
        }
        sc += 0.1;
      }
      grid[r][c] = a; grid[r2][c2] = b;
      if (gs.length && sc > best) { best = sc; fallback = [[r, c], [r2, c2]]; }
    }
  }
  return fallback;
}

function anyMove() {
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    const a0 = grid[r][c];
    if (!a0) continue;
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const r2 = r + dr, c2 = c + dc;
      if (r2 >= R || c2 >= C) continue;
      const b0 = grid[r2][c2];
      if (!b0 || (a0.block && b0.block)) continue;
      if (!canMove(a0) || !canMove(b0)) continue;
      const a = grid[r][c], b = grid[r2][c2];
      if (isRain(a) || isRain(b)) return [[r, c], [r2, c2]];
      grid[r][c] = b; grid[r2][c2] = a;
      const hit = runsOn(grid).length > 0;
      grid[r][c] = a; grid[r2][c2] = b;
      if (hit) return [[r, c], [r2, c2]];
    }
  }
  return null;
}

// Only the fruit are torn down — the covers live in their own layer.
function clearTiles() {
  board.querySelectorAll('.tile').forEach(el => el.remove());
}

/* ---------------- leaf covers ----------------
   A cover sits on a CELL. Clear the fruit standing on it and the leaf is swept
   away; fruit falling through afterwards passes underneath, so a cover can
   only ever be removed by a match made right on top of it. */
function makeCovers(n, pattern) {
  covers = [];
  coversLeft = 0;
  for (let r = 0; r < R; r++) { covers[r] = []; for (let c = 0; c < C; c++) covers[r][c] = 0; }
  if (!n) { paintCovers(); return; }
  // Rank every cell, take the best n. Each pattern is a different ranking, so
  // the patch always reads as a deliberate shape rather than scattered noise —
  // and later levels get a different silhouette instead of the same blob.
  const mid = [(R - 1) / 2, (C - 1) / 2];
  const rank = (r, c) => {
    const man = Math.abs(r - mid[0]) + Math.abs(c - mid[1]);
    const che = Math.max(Math.abs(r - mid[0]), Math.abs(c - mid[1]));
    if (pattern === 'ring')    return Math.abs(man - Math.round(R / 2));
    if (pattern === 'block')   return che;
    if (pattern === 'scatter') return (r * 7 + c * 13) % 11;
    return man;                                     // diamond
  };
  const cells = [];
  // Only cells that exist on this board — a leaf on a hole could never be swept.
  for (let c = 0; c < C; c++) for (let r = colTop[c]; r <= colBot[c]; r++) cells.push([rank(r, c), r, c]);
  cells.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
  cells.slice(0, Math.min(n, cells.length)).forEach(([, r, c]) => { covers[r][c] = 1; coversLeft++; });
  paintCovers();
}
function paintCovers() {
  const host = $('covers');
  host.innerHTML = '';
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    if (!covers[r] || !covers[r][c]) continue;
    const d = document.createElement('div');
    d.className = 'cover';
    d.style.setProperty('--cr', r);
    d.style.setProperty('--cc', c);
    d.dataset.rc = r + ',' + c;
    d.innerHTML = '<b>🍃</b>';
    host.appendChild(d);
  }
}
// Ice takes two hits from matches beside it, then shatters. `iceHitThisClear`
// keeps one clear from counting as four hits just because four of its fruit
// happened to touch the same block.
let iceHitThisClear = new Set();
function hitIce(r, c) {
  const t = grid[r] && grid[r][c];
  if (!t || !t.ice) return;
  const key = r * C + c;
  if (iceHitThisClear.has(key)) return;
  iceHitThisClear.add(key);
  t.ice--;
  paint(t);
  if (t.ice > 0) { sfx('leaf'); fxSparks(r, c, '#cfefff', 9, .8); return; }
  // Last layer gone: the fruit underneath is free, and stays on the board.
  iceLeft--;
  fxSparks(r, c, '#dff3ff', 20, 1.4); fxShards(r, c, '#bfe6ff', 9);
  fxRing(r, c, 2.2, 'rgba(220,245,255,.95)', 480);
  sfx('pop', 1, []);
  t.el.classList.remove('born'); void t.el.offsetWidth; t.el.classList.add('born');
  setTimeout(() => t.el.classList.remove('born'), 340);
  paintGoals(true);
}

// becoming a fail state: it can crowd the board, it can never take it.
const JELLY_CAP = 7;
const jellyOn = () => grid.flat().filter(t => t && t.jelly).length;

   joined on its left last move may be alone this one, and a stale seam is
   immediately visible. Sixty-four cheap class toggles is nothing next to getting
   that wrong. */
function paintJellyLinks() {
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    const t = grid[r][c];
    if (!t) continue;
    const has = (rr, cc) => cellOk(rr, cc) && grid[rr][cc] && grid[rr][cc].jelly;
    // The !! is load-bearing. has() returns undefined when a neighbour simply has
    // no jelly property, and classList.toggle(name, undefined) TOGGLES rather
    // than forcing — so those cells flipped their seam on every single call.
    t.el.classList.toggle('j-u', !!(t.jelly && has(r - 1, c)));
    t.el.classList.toggle('j-d', !!(t.jelly && has(r + 1, c)));

  fxRing(r, c, 1.9, 'rgba(255,157,224,.9)', 420);
  sfx('leaf');
  t.el.classList.remove('born'); void t.el.offsetWidth; t.el.classList.add('born');

  paintGoals(true);
}

// Stamp a machine's output onto a tile that has just been made for the refill.
// Capped per kind so a machine can never bury its own column.
function applyEmit(t, m) {
  const count = k => grid.flat().filter(x => x && x.block === k).length;
  if (m.t === 'fruit') { t.k = m.k; paint(t); return; }
  if (m.t === 'gift' && count('gift') >= 3) return;
  if (m.t === 'duck' && count('duck') >= 3) return;
  t.block = m.t; t.k = BLOCK_K; t.hits = BLOCKS[m.t].hits;

// Blockers are stored alongside the grid, since they are not fruit and can't be
// rebuilt from a kind alone.
function restoreBlocks(blk) {
  iceLeft = 0;                 // ducksHome comes from the save, don't reset it
  if (!Array.isArray(blk)) return;
  blk.forEach(([r, c, kind, lvl, extra]) => {
    if (!cellOk(r, c) || !grid[r][c]) return;
    if (kind === 'ice') { grid[r][c].ice = lvl; iceLeft++; paint(grid[r][c]); return; }
    if (kind === 'jel') { grid[r][c].jelly = 1; paint(grid[r][c]); return; }
    grid[r][c].el.remove();
    grid[r][c] = makeBlock(kind, r, c);
    const t = grid[r][c];
    // A half coconut has to come back a half, and a machine has to come back
    // making the same thing — otherwise a save quietly repairs the whole board.
    if (BLOCKS[kind].hits) { t.hits = lvl; }
    if (kind === 'gen' && Array.isArray(extra)) { t.makes = extra[0]; t.rate = extra[1]; t.next = extra[2]; }
    paint(t);
  });
}

// A duckling that reaches the floor of its column is home.
function collectDucks() {
  let got = 0;
  for (let c = 0; c < C; c++) {
    const t = grid[colBot[c]][c];
    if (t && t.block === 'duck') {
      grid[colBot[c]][c] = null;
      ducksHome++; got++;
      fxSparks(t.r, t.c, '#ffe08a', 20, 1.4); fxRing(t.r, t.c, 2.4, 'rgba(255,230,150,.95)', 520);
      const el = t.el;
      el.classList.add('pop');
      setTimeout(() => el.remove(), 470);
    }
  }
  if (got) { sfx('goal'); buzz(30); paintGoals(true); toast('🐤 ' + (got > 1 ? 'Safe!' : 'Home!')); }
  return got;
}

function restoreCovers(cov) {
  if (!L.covers) { makeCovers(0); return; }
  const ok = Array.isArray(cov) && cov.length === R && cov.every(row => Array.isArray(row) && row.length === C);
  if (!ok) { makeCovers(L.covers, L.pattern); return; }
  covers = cov.map(row => row.slice());
  coversLeft = covers.reduce((a, row) => a + row.reduce((x, v) => x + (v ? 1 : 0), 0), 0);
  paintCovers();
}
function sweepCover(r, c) {
  if (!covers[r] || !covers[r][c]) return false;
  covers[r][c] = 0; coversLeft--;
  const d = $('covers').querySelector('.cover[data-rc="' + r + ',' + c + '"]');
  if (d) { d.classList.add('gone'); setTimeout(() => d.remove(), 460); }
  return true;
}

// The board's silhouette gets its own layer of cell backings, so a hole is
// genuinely absent rather than a gap painted onto a rectangle.
function paintCells() {
  const host = $('cells');
  let html = '';
  for (let c = 0; c < C; c++) for (let r = colTop[c]; r <= colBot[c]; r++)
    html += '<div class="cellbg" style="--cr:' + r + ';--cc:' + c + '"></div>';
  host.innerHTML = html;
}
// Ducklings start high (they have to travel) and ice starts low and central
// (it has to be dug out). Both replace a fruit rather than adding a cell.
function placeBlocks(nDucks, nIce, rng, thickChance, nGift, nJelly, gen) {
  ducksHome = 0; iceLeft = 0;
  giftsOpened = 0; jellyCleared = 0;
  // The machine goes at the very top of a column, which is the one place it can
  // live without breaking anything: its output falls down that column, and it
  // never has to sit in the middle of a stack splitting it into two halves that
  // can never reach each other.
  if (gen) {
    const gc = Math.floor(rng() * C);
    const old = grid[colTop[gc]][gc];
    if (old) {
      old.el.remove();
      const t = makeBlock('gen', colTop[gc], gc);
      t.makes = gen.makes; t.rate = gen.rate;
      t.next = t.makes[Math.floor(rng() * t.makes.length)];
      paint(t);
      grid[colTop[gc]][gc] = t;
    }

  const swap = (r, c, kind) => {
    const old = grid[r][c];

    // Never on a leaf. A blocker is never popped, and a leaf is only swept by
    // popping the fruit standing on it — so a leaf under ice could never be
    // cleared at all, and the level's leaf goal would be unwinnable.
    if (covers[r] && covers[r][c]) return false;
    old.el.remove();
    grid[r][c] = makeBlock(kind, r, c);
    return true;
  };
  const cols = Array.from({ length: C }, (_, i) => i);
  for (let i = cols.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [cols[i], cols[j]] = [cols[j], cols[i]]; }
  let placed = 0;
  for (const c of cols) {
    if (placed >= nDucks) break;
    // Start mid-board. Measured: from the top a duckling needs about five
    // separate clears in its own column and the last one never arrived — one
    // home in 25 moves. Three rows of travel is a journey you can finish.
    if (swap(colBot[c] - 3 - Math.floor(rng() * 2), c, 'duck')) placed++;
  }
  // Gifts and jelly go anywhere with room around them, spread across different
  // columns. Both replace a fruit, so the board keeps every cell.
  const free = [];
  for (let c = 0; c < C; c++) for (let r = colTop[c] + 1; r <= colBot[c] - 1; r++) free.push([r, c]);
  for (let i = free.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [free[i], free[j]] = [free[j], free[i]]; }

  for (const kind of [].concat(Array(nGift || 0).fill('gift'))) {

      if (put) break;

        if (pass === 0 && usedCol.has(c)) continue;
        if (swap(r, c, kind)) { usedCol.add(c); put = true; break; }
      }
    }
  }

  const spots = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++)
    spots.push([Math.abs(r - mid - 1) + Math.abs(c - midc) + rng() * 1.5, r, c]);
  spots.sort((a, b) => a[0] - b[0]);

  for (const [, r, c] of spots) {
    if (ic >= nIce) break;

    // cell, and breaking the frost hands the player a fruit back.
    if (!t || t.block || t.ice || (covers[r] && covers[r][c])) continue;

    // most are a single layer you can free in one match, with a growing
    // minority of thick ones for texture.

  // spreading thing wants somewhere to spread FROM — a lone blob in a corner
  // just sits there.

  for (const [, r, c] of spots) {
    if (jc >= (nJelly || 0)) break;

}

function setShape(shape) {
  colTop = []; colBot = [];
  for (let c = 0; c < C; c++) { const [t, b] = spanFor(shape, c); colTop[c] = t; colBot[c] = b; }
  paintCells();
}

function buildBoard() {
  clearTiles();
  grid = [];
  for (let r = 0; r < R; r++) { grid[r] = []; for (let c = 0; c < C; c++) grid[r][c] = null; }
  // Deal a board with no free matches — the first pop should be the player's.
  for (let c = 0; c < C; c++) for (let r = colTop[c]; r <= colBot[c]; r++) {
    const banned = new Set();
    const l1 = grid[r][c - 1], l2 = grid[r][c - 2];
    if (l1 && l2 && l1.k === l2.k) banned.add(l1.k);
    const u1 = grid[r - 1] && grid[r - 1][c], u2 = grid[r - 2] && grid[r - 2][c];
    if (u1 && u2 && u1.k === u2.k) banned.add(u1.k);
    let k, guard = 0; do { k = rndL(KN); } while (banned.has(k) && guard++ < 40);
    grid[r][c] = makeTile(k, r, c);
  }
  if (!anyMove()) buildBoard();
}

function restoreBoard(saved) {
  clearTiles();
  grid = [];
  for (let r = 0; r < R; r++) { grid[r] = []; for (let c = 0; c < C; c++) grid[r][c] = null; }
  for (let c = 0; c < C; c++) for (let r = colTop[c]; r <= colBot[c]; r++) {
    const s = saved[r] && saved[r][c];
    // A blocker was stored with k = BLOCK_K, which is not an index into KINDS —
    // feeding it straight to makeTile threw and aborted the rest of level
    // setup. Lay a placeholder fruit; restoreBlocks puts the real thing back.
    const k = (!s || s[0] === BLOCK_K) ? rnd(KN) : s[0];
    grid[r][c] = makeTile(k, r, c, s ? s[1] : SP_NONE);
  }
}

/* ---------------- the effects engine ----------------
   Every blast, spark, ring and bolt is drawn on ONE canvas by ONE rAF loop.

   Why not WebGL: the board is 49 sprites and a few hundred particles — nowhere
   near fill-rate or geometry bound, so a shader pipeline would buy nothing but
   code. What actually hurt was creating and destroying a DOM node per particle
   (a big combo churned hundreds inside a second) and driving every effect off
   its own CSS keyframe clock, so nothing could share a timeline. A single
   canvas with additive blending fixes both, keeps the file dependency-free,
   and leaves the tiles as real DOM elements — which is what makes the ordinary
   moves smooth and keeps the board readable to a screen reader. */

const fxCanvas = $('fx');
const fxCtx = fxCanvas.getContext('2d');

function fxResize() {
  const b = board.getBoundingClientRect();
  fxW = b.width + FX_PAD * 2;
  fxH = b.height + FX_PAD * 2;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  fxCanvas.width = Math.max(1, Math.round(fxW * dpr));
  fxCanvas.height = Math.max(1, Math.round(fxH * dpr));

  // it, so with width:auto it falls back to its attribute size — it was being
  // laid out at the device-pixel backing size (2x) and drawn mostly off-board.
  // The CSS size has to be set explicitly alongside the backing size.
  fxCanvas.style.width = fxW + 'px';
  fxCanvas.style.height = fxH + 'px';
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
// board-local pixel centre of a cell, in canvas space
function fxAt(r, c) {
  const cell = board.clientWidth / C;
  return { x: FX_PAD + (c + .5) * cell, y: FX_PAD + (r + .5) * cell, cell };
}
// Expiry is decided by the clock, never by whether a frame happened. A hidden
// tab gets no rAF at all — this leaked to 239 stale effects in testing, which
// would then all dump onto the screen at once on the way back.
function fxPrune(now) { fxItems = fxItems.filter(it => (now - it.t0) < it.dur); }

}

  for (const it of fxItems) {
    fxCtx.save();
    it.draw(fxCtx, Math.max(0, Math.min(1, (now - it.t0) / it.dur)));

  }

}
const easeOut = p => 1 - Math.pow(1 - p, 3);

// --- primitives ---------------------------------------------------------

// speed; single dots just look like static confetti.
function fxSparks(r, c, colour, n, power) {
  const { x, y, cell } = fxAt(r, c);
  const seeds = [];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = (0.5 + Math.random()) * cell * (power || 1) * 3.4;
    seeds.push({ a, sp, size: cell * (0.05 + Math.random() * 0.07), white: Math.random() < .35 });
  }
  fxPush(620, (g, p) => {
    const e = easeOut(p), fade = 1 - p;
    for (const s of seeds) {
      const d = s.sp * e / 3.4;
      const px = x + Math.cos(s.a) * d;
      const py = y + Math.sin(s.a) * d + cell * 1.5 * p * p;   // gravity
      const tx = x + Math.cos(s.a) * d * 0.82;
      const ty = y + Math.sin(s.a) * d * 0.82 + cell * 1.5 * p * p * 0.82;
      g.globalAlpha = fade;
      g.strokeStyle = s.white ? '#fff' : colour;
      g.lineWidth = s.size * fade;
      g.lineCap = 'round';
      g.beginPath(); g.moveTo(tx, ty); g.lineTo(px, py); g.stroke();
    }
  });
}
// Chunky rotating shards — gives a pop physical debris instead of only dust.
/* `away` is a cell the debris should be thrown AWAY from — the tile you moved,
   or the centre of the blast. Shards used to spray in a perfect circle, which is
   the same picture whichever way the match ran; biasing them along the actual
   direction of destruction is what makes a row read as a row and a blast read as
   coming from somewhere. */
function fxShards(r, c, colour, n, away) {
  const { x, y, cell } = fxAt(r, c);
  const seeds = [];
  let bias = null;
  if (away && (away[0] !== r || away[1] !== c)) bias = Math.atan2(r - away[0], c - away[1]);
  for (let i = 0; i < (n || 5); i++) {
    // Two thirds of a turn of spread around the bias, so it still scatters —
    // debris that all flies the same way looks like a sprite, not a shatter.
    const a = bias == null ? Math.random() * Math.PI * 2
                           : bias + (Math.random() - .5) * 2.1;
    seeds.push({ a, sp: (.6 + Math.random()) * cell * (bias == null ? 1.9 : 2.4),
                 rot: (Math.random() - .5) * 12, s: cell * (.1 + Math.random() * .1) });
  }
  fxPush(620, (g, p) => {
    const e = easeOut(p), fade = 1 - p * p;
    g.globalAlpha = fade;
    g.fillStyle = colour;
    for (const s of seeds) {
      const px = x + Math.cos(s.a) * s.sp * e;
      const py = y + Math.sin(s.a) * s.sp * e + cell * 1.8 * p * p;
      g.save(); g.translate(px, py); g.rotate(s.rot * p);
      g.fillRect(-s.s / 2, -s.s / 2, s.s, s.s * .7);
      g.restore();
    }
  });
}
// Expanding ring. `span` is in cells, so a bomb's ring stops at its blast
// radius and the rainbow's washes the board — the size is information.
function fxRing(r, c, span, colour, dur) {
  const { x, y, cell } = fxAt(r, c);
  const rMax = span * cell * .5;
  fxPush(dur || 520, (g, p) => {
    const e = easeOut(p);
    g.globalAlpha = (1 - p) * .95;
    g.strokeStyle = colour || '#fff';
    g.lineWidth = Math.max(1, cell * .16 * (1 - p));
    g.beginPath(); g.arc(x, y, Math.max(0.1, rMax * e), 0, Math.PI * 2); g.stroke();
  });
}
// Soft radial bloom at the heart of a blast.
function fxFlash(r, c, span, colour) {
  const { x, y, cell } = fxAt(r, c);
  const rMax = span * cell * .5;
  fxPush(400, (g, p) => {
    const rr = Math.max(0.1, rMax * (.35 + easeOut(p) * .65));
    const grd = g.createRadialGradient(x, y, 0, x, y, rr);
    const a = (1 - p) * .85;
    grd.addColorStop(0, 'rgba(255,255,255,' + a + ')');
    grd.addColorStop(.45, (colour || 'rgba(255,225,140,') + (a * .6) + ')');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(x, y, rr, 0, Math.PI * 2); g.fill();
  });
}
// A blade of light shooting out along one axis, bright core inside a glow.
// A comet of light, not a bar. Three tapered blades stacked — a wide soft
// glow, a warm body and a hot white core — narrowing to a point, with a bloom
// riding the advancing tip and sparks shedding off it. A flat capsule of even
// width is what made this read as a UI divider.
function fxBeam(r, c, dr, dc) {
  const { x, y, cell } = fxAt(r, c);
  // Stop at the board edge. Using the full row length overshot by half a board
  // and the blades ran off the sides of the screen.
  const len = dc > 0 ? (C - c - .5) * cell : dc < 0 ? (c + .5) * cell
            : dr > 0 ? (R - r - .5) * cell : (r + .5) * cell;
  const ang = Math.atan2(dr, dc);
  // sparks thrown off the tip as it travels
  const shed = [];
  for (let i = 0; i < 5; i++)
    shed.push({ at: .18 + Math.random() * .5, off: (Math.random() - .5) * cell * .9,
                sp: cell * (.5 + Math.random()) });
  // one tapered lens from the origin out to the tip
  const blade = (g, L, w0, w1, style) => {
    g.beginPath();
    g.moveTo(0, -w0 / 2);
    g.quadraticCurveTo(L * .5, -w1 * 1.1, L, -w1 / 2);
    g.lineTo(L, w1 / 2);
    g.quadraticCurveTo(L * .5, w1 * 1.1, 0, w0 / 2);
    g.closePath();
    g.fillStyle = style; g.fill();
  };
  fxPush(520, (g, p) => {
    const e = easeOut(Math.min(1, p * 1.45));
    const fade = 1 - Math.max(0, (p - .4) / .6);
    const L = Math.max(1, len * e);
    g.globalAlpha = fade;
    g.translate(x, y);
    g.rotate(ang);
    // wide underglow → warm body → hot core, each narrower and brighter
    blade(g, L, cell * .95, cell * .18, 'rgba(255,170,40,' + (.30 * fade) + ')');
    blade(g, L, cell * .54, cell * .10, 'rgba(255,224,120,' + (.62 * fade) + ')');
    blade(g, L, cell * .22, cell * .04, 'rgba(255,255,255,' + (.95 * fade) + ')');
    // bloom riding the leading edge
    const tipR = cell * .5 * fade;
    if (tipR > .5) {
      const grd = g.createRadialGradient(L, 0, 0, L, 0, tipR);
      grd.addColorStop(0, 'rgba(255,255,255,' + (.95 * fade) + ')');
      grd.addColorStop(.5, 'rgba(255,220,120,' + (.5 * fade) + ')');
      grd.addColorStop(1, 'rgba(255,190,60,0)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(L, 0, tipR, 0, Math.PI * 2); g.fill();
    }
    // embers peeling off behind the tip
    g.fillStyle = 'rgba(255,240,190,' + (.85 * fade) + ')';
    for (const s of shed) {
      if (e < s.at) continue;
      const trail = (e - s.at) / Math.max(.01, 1 - s.at);
      const px = len * s.at + s.sp * trail * .6;
      const py = s.off * trail;
      const rr = cell * .07 * (1 - trail);
      if (rr > .3) { g.beginPath(); g.arc(px, py, rr, 0, Math.PI * 2); g.fill(); }
    }
  });
}
// Jagged lightning from the rainbow to a doomed fruit — a straight bar read as
// a UI divider, a forked bolt reads as power.
function fxBolt(fr, fc, tr, tc) {
  const a = fxAt(fr, fc), b = fxAt(tr, tc);
  const segs = 6, pts = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const jitter = (i === 0 || i === segs) ? 0 : (Math.random() - .5) * a.cell * .55;
    const nx = -(b.y - a.y), ny = (b.x - a.x);
    const nl = Math.hypot(nx, ny) || 1;
    pts.push([a.x + (b.x - a.x) * t + nx / nl * jitter,
              a.y + (b.y - a.y) * t + ny / nl * jitter]);
  }
  fxPush(340, (g, p) => {
    const fade = 1 - p;
    g.globalAlpha = fade;
    g.lineCap = 'round'; g.lineJoin = 'round';
    const drawPath = () => {
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
      const upTo = Math.min(segs, Math.ceil(easeOut(Math.min(1, p * 2.2)) * segs));
      for (let i = 1; i <= upTo; i++) g.lineTo(pts[i][0], pts[i][1]);
      g.stroke();
    };
    g.strokeStyle = 'rgba(255,210,120,.75)'; g.lineWidth = a.cell * .22 * fade; drawPath();
    g.strokeStyle = 'rgba(255,255,255,.98)'; g.lineWidth = a.cell * .08 * fade; drawPath();
  });
}
// A bomb clears a SQUARE, so its wave is a square. A circle was telling you
// the wrong shape.
function fxSquare(r, c, span, colour, dur) {
  const { x, y, cell } = fxAt(r, c);
  const half = span * cell * .5;
  fxPush(dur || 520, (g, p) => {
    const h = Math.max(1, half * easeOut(p));
    g.globalAlpha = (1 - p) * .95;
    g.strokeStyle = colour || '#fff';
    g.lineWidth = Math.max(1, cell * .15 * (1 - p));
    g.lineJoin = 'round';
    const rad = Math.min(h * .5, cell * .38);
    g.beginPath();
    if (g.roundRect) g.roundRect(x - h, y - h, h * 2, h * 2, rad);
    else g.rect(x - h, y - h, h * 2, h * 2);
    g.stroke();
  });
}
// Star + bomb clears a cross THREE lanes wide, but it was drawing the ordinary
// one-lane cross — the visual was describing a different move than the one the
// game actually made. The lanes now widen outward from the centre so it reads
// as one growing cross rather than twelve separate beams fired at once.
function fxMegaCross(r, c) {
  fxFlash(r, c, 4.5, 'rgba(255,240,170,');
  fxRing(r, c, 3.4, 'rgba(255,240,180,.9)', 580);
  fxSparks(r, c, '#ffe6a0', 20, 1.7);
  const lane = off => {
    if (r + off >= 0 && r + off < R) { fxBeam(r + off, c, 0, 1); fxBeam(r + off, c, 0, -1); }
    if (c + off >= 0 && c + off < C) { fxBeam(r, c + off, 1, 0); fxBeam(r, c + off, -1, 0); }
  };
  lane(0);
  if (!REDUCED) { setTimeout(() => { lane(-1); lane(1); }, 95); } else { lane(-1); lane(1); }
}
// The bomb's own blast: square wave, twin outlines, real debris.
function bombBlast(r, c, span) {
  fxFlash(r, c, Math.min(span, 5), 'rgba(255,205,130,');
  fxSquare(r, c, span, 'rgba(255,255,255,.95)', 540);
  fxSquare(r, c, span * .68, 'rgba(255,190,95,.85)', 430);
  fxSparks(r, c, '#ffd48a', span > 3 ? 24 : 16, span > 3 ? 1.9 : 1.5);
  fxShards(r, c, '#ffbe6b', span > 3 ? 10 : 7);
}

// Sparks running INWARD — the grammar of something being assembled.
function fxImplode(r, c, colour) {
  const { x, y, cell } = fxAt(r, c);
  const seeds = [];
  for (let i = 0; i < 12; i++)
    seeds.push({ a: Math.random() * Math.PI * 2, d: cell * (1.1 + Math.random() * .9), s: cell * .06 });
  fxPush(480, (g, p) => {
    const e = easeOut(p);
    g.globalAlpha = p < .75 ? 1 : (1 - p) * 4;
    g.fillStyle = colour || '#fff';
    for (const s of seeds) {
      const d = s.d * (1 - e);
      g.beginPath(); g.arc(x + Math.cos(s.a) * d, y + Math.sin(s.a) * d, s.s * (1 - p * .5), 0, Math.PI * 2); g.fill();
    }
  });
}
function fxDust(r, c) {
  const { x, y, cell } = fxAt(r, c);
  fxPush(380, (g, p) => {
    g.globalAlpha = (1 - p) * .5;
    g.fillStyle = '#fff';
    g.beginPath();
    g.ellipse(x, y + cell * .42, cell * (.28 + p * .5), cell * (.1 + p * .1), 0, 0, Math.PI * 2);
    g.fill();
  });
}

/* ---------------- effects ---------------- */
function cellCentre(r, c) {
  const box = board.getBoundingClientRect();
  const cell = board.clientWidth / C;
  return { x: box.left + (c + .5) * cell, y: box.top + (r + .5) * cell };
}
// `boost` ramps the burst with the cascade depth, so a long chain visibly
// throws more confetti than a plain three.
// `boost` ramps the burst with cascade depth, so a long chain visibly throws
// more than a plain three.
/* A deep cascade should LOOK bigger than a shallow one. The audio already
   climbs a ten-step ladder as a chain runs; the picture did not follow — the
   same four layers came out at every depth, the ring was a flat 2.1 across and
   500ms long however far the chain had gone, and the debris caps bit at depth 3
   so everything past that was identical. Every part of the burst scales now, and
   the caps sit far enough out that a five-deep chain still has somewhere to go. */
function particles(r, c, kind, boost, away) {
  const col = kind == null ? '#ffe9a8' : KINDS[kind].from;
  const b = boost || 0;
  fxSparks(r, c, col, Math.min(34, 10 + b * 6), 1 + b * .28);
  fxShards(r, c, col, Math.min(15, 5 + Math.round(b * 2)), away);
  // The flash takes the chain's colour too, so the whole burst warms together
  // rather than one part of it going off on its own.
  fxFlash(r, c, 1.7 + b * .22, b ? heat(b).replace(/,[^,]*\)$/, ',') : 'rgba(255,235,170,');
}
// Particles that fly INWARD — the visual grammar of something being created
// rather than destroyed.
function converge(r, c, kind) {
  fxImplode(r, c, kind == null ? '#fff' : KINDS[kind].from);
  fxRing(r, c, 2.4, 'rgba(255,240,190,.9)', 460);
}
// Halo left where a fruit was. Lives inside the board so it scrolls/resizes
// with it, unlike the fixed-position particles.
/* How a chain gets louder. Size was the wrong lever — a wider ring is just a
   wider ring, and scale on its own is not excitement. Two things that do read:

   TEMPERATURE. The burst heats up as the chain runs, white through gold to a hot
   magenta. Colour is a cue the eye resolves fast, it costs nothing, and "getting
   hotter" is a thing everyone already understands without being taught.

   REPETITION. From the third link a second ring chases the first. A shockwave
   reads as something REPEATING; a single ring growing reads as something
   inflating. That difference is most of why one feels like impact and the other
   feels like a balloon.

   The width still creeps, but barely — a quarter of what it was — because some
   growth stops the deep ones feeling identical to the shallow ones. */
const CHAIN_HEAT = [
  'rgba(255,255,255,.95)',   // 1 — plain white
  'rgba(255,243,196,.95)',   // 2 — warm
  'rgba(255,208,112,.96)',   // 3 — gold
  'rgba(255,152,92,.96)',    // 4 — hot
  'rgba(255,112,172,.96)',   // 5+ — magenta
];
const heat = b => CHAIN_HEAT[Math.min(b, CHAIN_HEAT.length - 1)];
function ring(r, c, boost) {
  const b = boost || 0;
  const col = heat(b);
  fxRing(r, c, 2.1 + b * .11, col, 500 + b * 45);
  if (b >= 2) setTimeout(() => fxRing(r, c, 1.45 + b * .1, col, 400), 75);
}
function dust(r, c) { fxDust(r, c); }
// The number doesn't just float off — it flies to the score counter and lands
// on it, which is what actually connects the burst to the number going up.
function scorePop(r, c, n) {
  const p = cellCentre(r, c);
  const el = document.createElement('div');
  el.className = 'pop-score';
  el.textContent = '+' + n;
  el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
  el.style.fontSize = Math.min(38, 17 + n / 55) + 'px';
  document.body.appendChild(el);
  if (REDUCED) { setTimeout(() => el.remove(), 850); return; }
  const to = $('score').getBoundingClientRect();
  setTimeout(() => {
    el.style.transition = 'transform .5s cubic-bezier(.5,-0.2,.5,1), opacity .5s ease-in';
    el.style.animation = 'none';
    el.style.transform = 'translate(' + (to.left + to.width / 2 - p.x) + 'px,'
                                      + (to.top + to.height / 2 - p.y) + 'px) scale(.45)';
    el.style.opacity = '0';
  }, 330);
  setTimeout(() => { el.remove(); bumpScore(); }, 840);
}
function bumpScore() {
  const s = $('score');
  s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump');
  setTimeout(() => s.classList.remove('bump'), 320);
}
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}
// A collected fruit flies from the board to its goal chip — the clearest
// possible "that one counted" signal for a kid who can't read the number yet.
function flyToGoal(r, c, gi) {
  const chip = document.querySelector('#goals .goal[data-i="' + gi + '"] .mini');
  if (!chip || REDUCED) return;
  const from = cellCentre(r, c), to = chip.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'fly';
  el.textContent = KINDS[L.goals[gi].k].emoji;
  const size = Math.max(20, board.clientWidth / C * .45);
  el.style.font = size + 'px/1 sans-serif';
  el.style.left = (from.x - size / 2) + 'px';
  el.style.top = (from.y - size / 2) + 'px';
  el.style.width = el.style.height = size + 'px';
  document.body.appendChild(el);
  requestAnimationFrame(() => {
    el.style.transform = 'translate(' + (to.left + to.width / 2 - from.x) + 'px,'
                                      + (to.top + to.height / 2 - from.y) + 'px) scale(.55)';
    el.style.opacity = '.2';
  });
  setTimeout(() => el.remove(), 620);
}

// Four blades of light, one down each arm, instead of two bars crossing. The
// arms grow outward from the star so you can see the blast travel.
function starBeams(r, c) {
  fxFlash(r, c, 2.6, 'rgba(255,235,150,');
  fxBeam(r, c, 0, 1); fxBeam(r, c, 0, -1);
  fxBeam(r, c, 1, 0); fxBeam(r, c, -1, 0);
  fxRing(r, c, 2.4, 'rgba(255,236,150,.9)', 480);
}
// A ring washing outward. `span` is how many cells across it should reach, so
// a bomb's ring stops at its blast radius and the rainbow's covers the board —
// the size of the ring is itself information.
function shockwave(r, c, span) {
  const s = span || Math.max(R, C) * 2.2;
  fxFlash(r, c, Math.min(s, 5), 'rgba(255,210,140,');
  fxRing(r, c, s, 'rgba(255,255,255,.95)', 560);
  fxRing(r, c, s * .72, 'rgba(255,200,110,.8)', 460);   // inner wave, slight lag
  fxSparks(r, c, '#ffd48a', 16, 1.5);
