// The orb swells and flares before it starts firing — the beat that says
// something big is about to happen.
async function windUp(t) {
  if (REDUCED || !t || !t.el) return;
  t.el.classList.add('firing');
  sfx('windup');
  await sleep(380);
  t.el.classList.remove('firing');
}

// Fruit around a newborn booster flinch away from it — the little shove that
// makes the birth feel like it displaced something.
function pushNeighbours(r, c) {
  if (REDUCED) return;
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (!dr && !dc) continue;
    const t = grid[r + dr] && grid[r + dr][c + dc];
    if (!t) continue;
    t.el.style.setProperty('--px', (dc * 14) + '%');
    t.el.style.setProperty('--py', (dr * 14) + '%');
    t.el.classList.remove('push'); void t.el.offsetWidth; t.el.classList.add('push');
    setTimeout(() => t.el.classList.remove('push'), 460);
  }
}

// A bolt of light from the rainbow to one doomed fruit.
function zap(fr, fc, tr, tc) {
  if (fr === tr && fc === tc) return;
  fxBolt(fr, fc, tr, tc);
  fxFlash(tr, tc, 1.5, 'rgba(200,230,255,');
}

/* ---------------- the resolve loop ---------------- */
// The shape of the match becomes the shape of the blast — a line match blasts
// lines, a corner match blasts a blob, a long match takes a whole colour. That
// mapping is the thing that makes boosters guessable instead of memorised.
function blastCells(r, c, sp, k, out, radius) {
  if (sp === SP_STAR) {
    for (let i = 0; i < C; i++) out.add(r * C + i);
    for (let i = 0; i < R; i++) out.add(i * C + c);
  } else if (sp === SP_BOMB) {
    const rad = radius || 1;
    for (let rr = r - rad; rr <= r + rad; rr++) for (let cc = c - rad; cc <= c + rad; cc++)
      if (rr >= 0 && rr < R && cc >= 0 && cc < C) out.add(rr * C + cc);
  } else if (sp === SP_RAIN) {
    for (let rr = 0; rr < R; rr++) for (let cc = 0; cc < C; cc++)
      if (grid[rr][cc] && grid[rr][cc].k === k) out.add(rr * C + cc);
  }
}
// A booster caught in a clear fires, and whatever it hits can fire too.
function expand(set) {
  const queue = [...set];
  let fired = null;
  while (queue.length) {
    const key = queue.pop();
    const t = grid[Math.floor(key / C)][key % C];
    if (!t || t.sp === SP_NONE || t.fired) continue;
    t.fired = true;
    // Show every booster going off, including ones set off by other boosters —
    // otherwise a chain reaction just looks like the board erasing itself.
    if (t.sp === SP_STAR) starBeams(t.r, t.c);
    else if (t.sp === SP_BOMB) shockwave(t.r, t.c, 2 * (t.radius || 1) + 1);
    else shockwave(t.r, t.c);
    if (!fired) fired = [t.r, t.c];
    const add = new Set();
    blastCells(t.r, t.c, t.sp, t.sp === SP_RAIN ? -1 : t.k, add, t.radius);
    add.forEach(x => { if (!set.has(x)) { set.add(x); queue.push(x); } });
  }
  return fired;
}

// `from` is the cell a blast radiated out of, if any. Popping outward from it
// in waves is what makes a booster legible: you can see the blast travel, so
// you can see which fruit it took.
// `zapFrom` switches from the radial wave to the rainbow's one-at-a-time hunt:
// targets are taken in order of distance, each getting its own bolt, with the
// cadence tightened for big sets so the whole show still lands in about a
// second whether it's eight fruit or the entire board.
// `suckTo` maps a doomed cell to the cell a booster is forming in. Those fruit
// travel into it and shrink out on arrival instead of popping where they stand,
// which is what stitches the clear and the creation into one motion.
async function clearCells(keys, cascade, from, zapFrom, suckTo) {
  const gained = keys.size * 60 * Math.min(cascade, 5);
  score += gained;
  let goalHits = 0, coverHits = 0, notes = [];
  const flyBudget = { n: 0 };
  let order = null, step = 0, lastDelay = 0;
  if (zapFrom) {
    const d = k => Math.hypot(Math.floor(k / C) - zapFrom[0], (k % C) - zapFrom[1]);
    order = new Map();
    [...keys].sort((a, b) => d(a) - d(b)).forEach((k, i) => order.set(k, i));
    step = keys.size > 24 ? 26 : keys.size > 12 ? 48 : 78;
    lastDelay = (keys.size - 1) * step;
  }

  // A beat where the doomed fruit flare white before they go. Without it the
  // board just loses tiles; with it you can see WHICH ones matched.
  if (!REDUCED) {
    keys.forEach(key => {
      const t = grid[Math.floor(key / C)][key % C];
      if (t) t.el.classList.add('charge');
    });
    await sleep(150);
  }

  keys.forEach(key => {
    const r = Math.floor(key / C), c = key % C;
    const t = grid[r][c];
    if (!t) return;
    // credit the goal
    if (t.sp !== SP_RAIN) {
      const gi = L.goals.findIndex(g => g.t === 'fruit' && g.k === t.k);
      if (gi >= 0 && goalGot[gi] < L.goals[gi].need) {
        goalGot[gi]++; goalHits++;
        if (flyBudget.n++ < 6) flyToGoal(r, c, gi);
      }
    }
    if (sweepCover(r, c)) coverHits++;
    if (t.k >= 0) notes.push(KINDS[t.k].note);
    // Pops travel outward from wherever this clear started — the tile you moved,
    // or the booster that went off — so the burst reads as a consequence of it.
    const delay = order ? order.get(key) * step
                : from  ? Math.min(300, (Math.abs(r - from[0]) + Math.abs(c - from[1])) * 46)
                : 0;
    const el = t.el;
    const kind = t.sp === SP_RAIN ? null : t.k;
    // Drop .charge as .pop goes on: both style .inner and .charge is defined
    // later in the sheet, so leaving it would win the cascade and the tile
    // would sit there flashing instead of bursting. Pop opens on charge's end
    // state, so the handover is invisible.
    const target = suckTo && suckTo.get(key);
    const fire = target ? () => {
      // Rush into the cell the booster is forming in. Riding the tile's own
      // --tr/--tc transform means this uses the same movement path as gravity,
      // so it reads as the fruit physically being drawn in.
      el.classList.remove('charge');
      el.style.transitionDuration = '300ms';
      el.style.transitionTimingFunction = 'cubic-bezier(.45,0,.7,.35)';
      el.classList.add('suck');
      place(t, target[0], target[1]);
      fxSparks(r, c, kind == null ? '#fff' : KINDS[kind].from, 6, .55);
    } : () => {
      el.classList.remove('charge');
      if (zapFrom) { zap(zapFrom[0], zapFrom[1], r, c); sfx('zap'); }
      particles(r, c, kind, cascade - 1); ring(r, c);
      el.classList.add('pop');
    };
    if (delay) { setTimeout(fire, delay); } else fire();
    setTimeout(() => el.remove(), (target ? 330 : 470) + delay);
    grid[r][c] = null;
  });

  sfx('pop', cascade - 1, notes);
  buzz(cascade > 1 ? 22 : 14);
  if (coverHits) { sfx('leaf'); paintGoals(true); }
  if (goalHits) { paintGoals(true); sfx('goal'); }
  // A score goal has no "hit" to react to — it moves on every clear, so it has
  // to be refreshed here or the chip sits at 0 for the whole level.
  if (L.goals.some(g => g.t === 'score')) paintGoals(true);
  const mid = [...keys][Math.floor(keys.size / 2)];
  scorePop(Math.floor(mid / C), mid % C, gained);
  paintHud();
  // Long enough for the last wave — or the last bolt — to actually be seen.
  await sleep(REDUCED ? 60 : lastDelay + (zapFrom ? 460 : from ? 520 : 400));
}

async function gravity() {
  let maxDrop = 0, landed = [];
  for (let c = 0; c < C; c++) {
    let write = R - 1;
    for (let r = R - 1; r >= 0; r--) {
      const t = grid[r][c];
      if (!t) continue;
      if (write !== r) {
        grid[write][c] = t; grid[r][c] = null;
        const dist = write - r;
        maxDrop = Math.max(maxDrop, dist);
        t.el.style.transitionDuration = Math.min(430, 130 + dist * 55) + 'ms';
        t.el.style.transitionTimingFunction = FALL_EASE;
        place(t, write, c);
        landed.push(t);
      }
      write--;
    }
    // refill from above the ceiling
    let above = 1;
    for (let r = write; r >= 0; r--) {
      // Born above the ceiling, then walked down to its slot in the same tick —
      // makeTile has already flushed layout, so the transition still animates,
      // and the model never sees a tile parked at a negative row.
      const t = makeTile(refillKind(r, c), -above, c);
      grid[r][c] = t;
      const dist = r + above;
      maxDrop = Math.max(maxDrop, dist);
      t.el.style.transitionDuration = Math.min(430, 130 + dist * 55) + 'ms';
      t.el.style.transitionTimingFunction = 'cubic-bezier(.45,.05,.55,1)';
      place(t, r, c);
      landed.push(t);
      above++;
    }
  }
  if (!landed.length) return;
  const dur = REDUCED ? 30 : Math.min(430, 130 + maxDrop * 55);
  await sleep(dur);
  sfx('land');
  landed.forEach(t => {
    t.el.style.transitionDuration = '';
    t.el.style.transitionTimingFunction = '';
    t.el.classList.add('land');
    setTimeout(() => t.el.classList.remove('land'), 320);
  });
  // A puff under the fruit that sits on the floor of each column — one per
  // column, so a full refill doesn't spray forty puffs at once.
  const bottoms = new Set();
  landed.forEach(t => { if (!bottoms.has(t.c) && (t.r === R - 1 || (grid[t.r + 1] && grid[t.r + 1][t.c] && !landed.includes(grid[t.r + 1][t.c])))) { bottoms.add(t.c); dust(t.r, t.c); } });
  await sleep(REDUCED ? 10 : 110);
}

// Toddlers can't read these, so each one carries an emoji that says the same
// thing — the word is for the grown-up reading over their shoulder.
const CHEERS = [['Nice!', '✨'], ['Wow!', '🌟'], ['Amazing!', '🎉'], ['Incredible!', '🏆'], ['Fruit-tastic!', '🤩']];

// Runs matches → boosters → clears → gravity, over and over until it settles.
async function resolve(origins) {
  let cascade = 0, madeBooster = false, lucky = false;
  // Remember where the player actually touched, so the very first burst can
  // radiate out from their own move.
  const touched = origins && origins.length ? origins[0] : null;
  for (;;) {
    const gs = groups();
    if (!gs.length) break;
    cascade++;

    const keys = new Set();
    const spawns = [];              // [key, spKind, fruitKind, cell]
    const suckTo = new Map();       // doomed cell -> cell its booster forms in
    for (const g of gs) {
      // A rainbow is the prize for a deliberate straight five. Corners and Ts —
      // which are easy to make by accident — give the (still lovely) star.
      let sp = SP_NONE;
      if (g.maxRun >= 5) sp = SP_RAIN;
      else if (g.lines >= 2) sp = SP_BOMB;     // a corner or T — blasts a blob
      else if (g.cells.length >= 4) sp = SP_STAR;
      // Gone too long without one? Quietly turn this match into a star. The
      // child only ever sees a gift arriving, never a rule being bent.
      else if (cascade === 1 && sinceBooster >= PITY()) { sp = SP_STAR; lucky = true; }

      let spawnKey = null;
      if (sp) {
        // The new booster may NOT be planted on a cell that already holds one.
        // It used to prefer the tile the player moved, and if that tile was
        // itself a star or bomb it got excluded from the clear set, never
        // fired, and was then overwritten — the player's booster vanished with
        // no blast at all. Plain fruit only; nearest the player's move first.
        const plain = ([r, c]) => grid[r][c] && grid[r][c].sp === SP_NONE;
        const hit = (origins || []).find(o => g.cells.some(([r, c]) => r === o[0] && c === o[1]) && plain(o));
        const cell = hit || g.cells.filter(plain)[Math.floor(g.cells.filter(plain).length / 2)];
        // If every cell in the group is already a booster there's nowhere to
        // put a new one — they simply all go off, which is the better show.
        if (cell) {
          spawnKey = cell[0] * C + cell[1];
          spawns.push([spawnKey, sp, g.k, cell]);
        }
      }
      g.cells.forEach(([r, c]) => {
        const key = r * C + c;
        if (key !== spawnKey) {
          keys.add(key);
          // Everything in a group that's forming a booster gets drawn into it.
          if (spawnKey !== null) suckTo.set(key, [Math.floor(spawnKey / C), spawnKey % C]);
        }
      });
    }
    origins = null;

    const blastFrom = expand(keys);
    // Let the beam or the ring actually arrive before the fruit it's hitting
    // disappears — firing both on the same frame read as "everything vanished".
    if (blastFrom) { sfx('blast'); shake(); await sleep(REDUCED ? 0 : 130); }
    spawns.forEach(([key]) => keys.delete(key));

    if (cascade >= 2 && !REDUCED) {
      const [word, icon] = CHEERS[Math.min(cascade - 2, CHEERS.length - 1)];
      toast(icon + ' ' + word);
    }
    if (cascade >= 3) shake();

    // The booster is born WHILE its fruit are still travelling into it, not
    // after the whole clear has finished. Firing it afterwards was what made
    // creation feel like a separate, disconnected second animation.
    let promoted = false;
    const promote = () => {
      if (promoted) return;
      promoted = true;
      for (const [key, sp, k] of spawns) {
        const r = Math.floor(key / C), c = key % C;
        const t = grid[r][c];
        if (!t) continue;
        t.sp = sp; if (sp === SP_RAIN) t.k = -1; else t.k = k;
        t.fired = false;
        paint(t);
        converge(r, c, sp === SP_RAIN ? null : k);
        pushNeighbours(r, c);
        t.el.classList.add('born');
        setTimeout(() => t.el.classList.remove('born'), 320);
      }
      madeBooster = true;
      spawns.forEach(([, sp]) => { boostMade[sp] = (boostMade[sp] || 0) + 1; });
      if (L.goals.some(g => g.t === 'boost')) paintGoals(true);
      sfx(lucky ? 'lucky' : 'make'); buzz(30);
      if (lucky) toast('⭐ Lucky!');
    };
    // 150ms of charge, then ~180ms of travel — the booster lands as they arrive.
    let promoteTimer = null;
    if (spawns.length) promoteTimer = setTimeout(promote, REDUCED ? 0 : 330);

    await clearCells(keys, cascade, blastFrom || (cascade === 1 ? touched : null), null, suckTo);

    // Guarantee it happened before gravity, whatever the timer did.
    if (spawns.length) { clearTimeout(promoteTimer); promote(); }

    await gravity();
  }
  if (madeBooster) sinceBooster = 0; else if (cascade) sinceBooster++;
  return cascade;
}

/* ---------------- level intro / outro ----------------
   A level should arrive and leave, not blink in and out. */
async function playIntro(showCard) {
  if (REDUCED) { busy = false; return; }
  const tiles = grid.flat().filter(Boolean);
  // Hold the fruit off-stage so the card lands on an empty board and the wave
  // is the payoff — running both at once meant the board quietly finished
  // assembling behind the card and then nothing happened for a second.
  tiles.forEach(t => { t.el.style.visibility = 'hidden'; });

  if (showCard) {
    const card = $('levelcard');
    card.querySelector('.lc-n').textContent = L.name;
    card.querySelector('.lc-goals').textContent = goalSummary(L).join('  ');
    card.classList.remove('out'); card.classList.add('show');
    sfx('level');
    await sleep(780);
    card.classList.add('out');
    await sleep(330);
    card.classList.remove('show', 'out');
  }

  tiles.forEach(t => { t.el.style.visibility = ''; t.el.classList.add('dropin'); });
  // longest delay is the far corner of the wave, plus the animation itself
  await sleep(((R - 1) + (C - 1)) * 42 + 520);
  tiles.forEach(t => t.el.classList.remove('dropin'));
  sfx('land');
  busy = false;
}

async function playOutro() {
  if (REDUCED) return;
  const tiles = grid.flat().filter(Boolean);
  tiles.forEach(t => t.el.classList.add('sweepout'));
  await sleep(((R - 1 + C - 1) * 32) + 500);
  tiles.forEach(t => { t.el.classList.remove('sweepout'); t.el.style.opacity = '0'; });
}

// Was a screen shake. Jolting the whole board is unpleasant to look at and
// worse on a device held close to a small face, so the board flares instead —
// same "that was big" beat, none of the motion.
function shake() {
  if (REDUCED) return;
  const w = $('board-wrap');
  w.classList.remove('flash'); void w.offsetWidth; w.classList.add('flash');
  setTimeout(() => w.classList.remove('flash'), 440);
}

// `silent` is the mix tool driving it: that path has its own tumble animation
// and toast, so the automatic dead-board version's presentation is skipped.
async function reshuffle(silent) {
  if (!silent) { toast('🌀 Let\'s mix!'); sfx('mix'); }
  const flat = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (grid[r][c].sp === SP_NONE) flat.push(grid[r][c]);
  for (let tries = 0; tries < 80; tries++) {
    const ks = flat.map(t => t.k);
    for (let i = ks.length - 1; i > 0; i--) { const j = rnd(i + 1); [ks[i], ks[j]] = [ks[j], ks[i]]; }
    flat.forEach((t, i) => { t.k = ks[i]; });
    if (!runsOn(grid).length && anyMove()) break;
  }
  if (silent) { flat.forEach(t => paint(t)); return; }
  flat.forEach(t => { paint(t); t.el.classList.add('born'); });
  await sleep(360);
  flat.forEach(t => t.el.classList.remove('born'));
}

/* ---------------- interaction ---------------- */
function adjacent(a, b) { return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1; }

// Whichever fruit the rainbow would take if you set it off where it stands.
// activate() and the preview must agree, so they share this.
function commonKind() {
  const count = new Array(KINDS.length).fill(0);
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++)
    if (grid[r][c] && grid[r][c].k >= 0) count[grid[r][c].k]++;
  let best = 0; count.forEach((n, i) => { if (n > count[best]) best = i; });
  return best;
}
function clearAim() { board.querySelectorAll('.tile.aim').forEach(el => el.classList.remove('aim')); }
// Selecting a booster lights up exactly the fruit it would clear. This is the
// whole answer to "what does this thing do" — you see it before you commit,
// and nothing is spent finding out.
function showAim(t) {
  clearAim();
  if (!t || t.sp === SP_NONE) return;
  const keys = new Set();
  blastCells(t.r, t.c, t.sp, t.sp === SP_RAIN ? commonKind() : t.k, keys, t.radius);
  keys.forEach(key => {
    const x = grid[Math.floor(key / C)][key % C];
    if (x && x !== t) x.el.classList.add('aim');
  });
}
function select(t) {
  clearNudge();
  if (sel) sel.el.classList.remove('sel');
  sel = t;
  if (t) { t.el.classList.add('sel'); sfx('tap'); }
  showAim(t);
  setFoot(t && t.sp !== SP_NONE ? 'Tap it again to set it off! 💥' : null);
}

async function activate(t) {
  // Tapping an already-selected booster sets it off. Costs a move.
  if (busy || over) return;
  busy = true;
  const at = [t.r, t.c];
  select(null);
  spendMove();
  const keys = new Set([t.r * C + t.c]);
  if (t.sp === SP_RAIN) {
    blastCells(t.r, t.c, SP_RAIN, commonKind(), keys);
    await windUp(t);
    shockwave(at[0], at[1]);
    t.fired = true;
    expand(keys);
    sfx('blast'); buzz(40); shake();
  await sleep(REDUCED ? 0 : 130);
    await clearCells(keys, 2, at, at);      // one bolt per fruit, in turn
    await gravity();
    await resolve(null);
    return settle();
  } else if (t.sp === SP_BOMB) {
    blastCells(t.r, t.c, SP_BOMB, t.k, keys, t.radius);
    shockwave(at[0], at[1], 2 * (t.radius || 1) + 1);
  } else {
    blastCells(t.r, t.c, SP_STAR, t.k, keys);
    starBeams(at[0], at[1]);
  }
  t.fired = true;
  expand(keys);
  sfx('blast'); shake(); buzz(40);
  await sleep(REDUCED ? 0 : 130);
  await clearCells(keys, 2, at);
  await gravity();
  await resolve(null);
  await settle();
}

/* ---------------- tool use ---------------- */
function paintTools() {
  const t = tools();
  document.querySelectorAll('#tools .tool').forEach(btn => {
    const id = btn.dataset.t, n = t[id] || 0;
    btn.querySelector('.ct').textContent = n;
    btn.classList.toggle('empty', n === 0);
    btn.classList.toggle('armed', armed === id);
    btn.setAttribute('aria-label', { hammer: 'hammer, pop any fruit', swap: 'swap any two fruit', mix: 'mix the board' }[id] + ', ' + n + ' left');
  });
  board.classList.toggle('picking', !!armed);
}
function armTool(id) {
  if (busy || over) return;
  const t = tools();
  if (!t[id]) { sfx('nope'); return; }
  armed = (armed === id) ? null : id;
  toolPick = null;
  select(null);
  clearNudge();
  sfx('tap');
  paintTools();
  setFoot(armed === 'hammer' ? 'Tap any fruit to pop it! 🔨'
        : armed === 'swap'   ? 'Tap two fruit next to each other 🔄'
        : armed === 'mix'    ? 'Tap the board to mix it up 🌀' : null);
}
function disarm() { armed = null; toolPick = null; paintTools(); setFoot(null); }

// A hammer swinging down onto the tile, landing, then lifting away.
function smash(r, c) {
  if (REDUCED) return;
  const cell = board.clientWidth / C;
  const el = document.createElement('div');
  el.className = 'smash';
  el.textContent = '🔨';
  el.style.left = (c * cell) + 'px';
  el.style.top = (r * cell) + 'px';
  board.appendChild(el);
  setTimeout(() => el.remove(), 440);
}

async function useHammer(t) {
  if (busy || over) return;
  busy = true;
  const at = [t.r, t.c];
  if (!spendTool('hammer')) { busy = false; return; }
  disarm();
  // let the hammer actually fall before anything breaks
  smash(at[0], at[1]);
  sfx('swing');
  await sleep(REDUCED ? 10 : 190);
  const keys = new Set([at[0] * C + at[1]]);
  if (t.sp !== SP_NONE) { t.fired = true; blastCells(t.r, t.c, t.sp, t.sp === SP_RAIN ? commonKind() : t.k, keys, t.radius); }
  expand(keys);
  sfx('blast'); buzz(45); shake();
  await sleep(REDUCED ? 0 : 130);
  await clearCells(keys, 1, at);
  await gravity();
  await resolve(null);
  await settle();
}

async function useSwap(a, b) {
  if (busy || over) return;
  busy = true;
  if (!spendTool('swap')) { busy = false; return; }
  disarm();
  sfx('swap');
  const ar = a.r, ac2 = a.c, br = b.r, bc = b.c;
  a.el.classList.add('swapping'); b.el.classList.add('swapping');
  place(a, br, bc); place(b, ar, ac2);
  grid[br][bc] = a; grid[ar][ac2] = b;
  await sleep(REDUCED ? 20 : 270);
  a.el.classList.remove('swapping'); b.el.classList.remove('swapping');
  // The whole point is that it sticks even with no match — no revert here.
  if (groups().length) await resolve([[a.r, a.c], [b.r, b.c]]);
  await settle();
}

async function useMix() {
  if (busy || over) return;
  busy = true;
  if (!spendTool('mix')) { busy = false; return; }
  disarm();
  // Spin the whole board through a tumble; the re-deal happens at the midpoint
  // where every tile is small and blurred, so the swap itself is invisible.
  const tiles = grid.flat().filter(Boolean);
  if (!REDUCED) {
    tiles.forEach(t => t.el.classList.add('mixing'));
    sfx('mix');
    await sleep(320);
  }
  await reshuffle(true);
  if (!REDUCED) {
    await sleep(380);
    tiles.forEach(t => t.el.classList.remove('mixing'));
  }
  await resolve(null);
  await settle();
}

async function trySwap(a, b) {
  if (busy || over) return;
  busy = true;
  select(null);
  clearNudge();
  sfx('swap');

  // visual swap — both tiles lift and swell as they trade places
  const ar = a.r, ac2 = a.c, br = b.r, bc = b.c;
  a.el.classList.add('swapping'); b.el.classList.add('swapping');
  place(a, br, bc); place(b, ar, ac2);
  grid[br][bc] = a; grid[ar][ac2] = b;
  await sleep(REDUCED ? 20 : 270);
  a.el.classList.remove('swapping'); b.el.classList.remove('swapping');

  // Two boosters swapped together combine into something bigger than either.
  // This is the biggest reward in the game, so it gets a name and a toast.
  if (a.sp !== SP_NONE && b.sp !== SP_NONE) {
    spendMove();
    const at = [b.r, b.c];
    const keys = new Set([a.r * C + a.c, b.r * C + b.c]);
    const pair = [a.sp, b.sp].sort().join('');
    let zapFrom = null;

    if (pair === String(SP_RAIN) + String(SP_RAIN)) {
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) keys.add(r * C + c);
      toast('🌈 EVERYTHING!');
      await windUp(isRain(a) ? a : b);
      shockwave(at[0], at[1]);
      zapFrom = at;                          // bolt every last fruit off the board
    } else if (a.sp === SP_RAIN || b.sp === SP_RAIN) {
      // Rainbow + booster: every fruit of that colour BECOMES that booster and
      // goes off. The showiest thing in the game.
      const other = isRain(a) ? b : a;
      const rb = isRain(a) ? a : b;
      const changed = [];
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
        const t = grid[r][c];
        if (t && t.k === other.k && t.sp === SP_NONE) {
          t.sp = other.sp; t.radius = other.radius; t.fired = false;
          changed.push(t);
        }
      }
      rb.fired = true;
      keys.add(rb.r * C + rb.c);
      // EVERY transformed tile has to go into the clear set. Without this only
      // the ones that happened to sit in the original booster's blast ever
      // fired, so most of the board it had just converted did nothing at all.
      changed.forEach(t => keys.add(t.r * C + t.c));
      toast(other.sp === SP_BOMB ? '💣 x' + changed.length + '!' : '⭐ x' + changed.length + '!');
      await windUp(rb);
      shockwave(at[0], at[1]);
      // Convert them one at a time, nearest first, so you watch the rainbow
      // seed the whole board before any of it goes off.
      if (!REDUCED) {
        changed.sort((p, q) => (Math.hypot(p.r - at[0], p.c - at[1]) - Math.hypot(q.r - at[0], q.c - at[1])));
        const step = changed.length > 12 ? 38 : 62;
        changed.forEach((t, i) => setTimeout(() => {
          paint(t); zap(at[0], at[1], t.r, t.c); converge(t.r, t.c, t.k); sfx('zap');
        }, i * step));
        await sleep(changed.length * step + 260);
      } else {
        changed.forEach(t => paint(t));
      }
    } else if (pair === String(SP_BOMB) + String(SP_BOMB)) {
      a.radius = 2; a.fired = false;         // one big 5x5 instead of two 3x3s
      b.sp = SP_NONE;
      keys.add(a.r * C + a.c);
      toast('💣 BIG BOOM!');
    } else if (pair === String(SP_STAR) + String(SP_BOMB)) {
      // A fat cross: three rows and three columns.
      const bomb = a.sp === SP_BOMB ? a : b, star = a.sp === SP_BOMB ? b : a;
      for (let d = -1; d <= 1; d++) {
        const rr = star.r + d, cc = star.c + d;
        if (rr >= 0 && rr < R) for (let i = 0; i < C; i++) keys.add(rr * C + i);
        if (cc >= 0 && cc < C) for (let i = 0; i < R; i++) keys.add(i * C + cc);
      }
      bomb.fired = star.fired = true;
      toast('⭐ MEGA CROSS!');
      starBeams(star.r, star.c);
    } else {
      toast('⭐ DOUBLE!');                    // star + star: both crosses fire
    }

    expand(keys);
    sfx('blast'); shake(); buzz(60);
  await sleep(REDUCED ? 0 : 130);
    await clearCells(keys, 3, at, zapFrom);
    await gravity();
    await resolve(null);
    return settle();
  }

  const rainbow = isRain(a) || isRain(b);
  if (rainbow) {
    spendMove();
    const rb = isRain(a) ? a : b;
    const at = [rb.r, rb.c];
    const keys = new Set([a.r * C + a.c, b.r * C + b.c]);
    const other = isRain(a) ? b : a;
    blastCells(other.r, other.c, SP_RAIN, other.k, keys);
    await windUp(rb);
    shockwave(at[0], at[1]);
    a.fired = b.fired = true;
    expand(keys);
    sfx('blast'); shake(); buzz(45);
  await sleep(REDUCED ? 0 : 130);
    await clearCells(keys, 2, at, at);      // hunt the colour down one by one
    await gravity();
    await resolve(null);
    return settle();
  }

  if (!groups().length) {
    // Not a match — no penalty, no scolding, just a little "nope" wobble.
    place(a, ar, ac2); place(b, br, bc);
    grid[ar][ac2] = a; grid[br][bc] = b;
    a.el.classList.add('nope'); b.el.classList.add('nope');
    sfx('nope');
    setTimeout(() => { a.el.classList.remove('nope'); b.el.classList.remove('nope'); }, 360);
    await sleep(REDUCED ? 20 : 300);
    busy = false;
    armIdle();
    return;
  }

  spendMove();
  await resolve([[a.r, a.c], [b.r, b.c]]);
  await settle();
}

async function settle() {
  if (!anyMove()) await reshuffle();
  busy = false;
  paintHud();
  if (checkWin()) return;
  if (!freePlay && movesLeft <= 0) { $('more').classList.add('show'); return; }
  saveGame();
  armIdle();
}

board.addEventListener('pointerdown', ev => {
  if (busy || over) return;
  ac();                                     // unlock audio on first touch
  // A primed tool takes over the board entirely — no selecting, no dragging.
  if (armed === 'mix') { useMix(); return; }
  const el = ev.target.closest('.tile');
  if (!el) return;
  const t = tileFromEl(el);
  if (!t) return;
  if (armed === 'hammer') { useHammer(t); return; }
  if (armed === 'swap') {
    if (!toolPick) { toolPick = t; t.el.classList.add('sel'); sfx('tap'); setFoot('Now tap the one next to it 🔄'); return; }
    if (toolPick === t) { toolPick.el.classList.remove('sel'); toolPick = null; setFoot('Tap two fruit next to each other 🔄'); return; }
    if (!adjacent(toolPick, t)) { sfx('nope'); return; }
    const a = toolPick;
    a.el.classList.remove('sel');
    useSwap(a, t);
    return;
  }
  drag = { t, x: ev.clientX, y: ev.clientY, done: false };
  if (sel && sel !== t && adjacent(sel, t)) { const s = sel; drag.done = true; trySwap(s, t); return; }
  if (sel === t) { drag.done = true; if (t.sp !== SP_NONE) activate(t); else select(null); return; }
  select(t);
});
let drag = null;
board.addEventListener('pointermove', ev => {
  if (!drag || drag.done || busy || armed) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  const cell = board.clientWidth / C;
  if (Math.hypot(dx, dy) < cell * .42) return;
  drag.done = true;
  const [dr, dc] = Math.abs(dx) > Math.abs(dy) ? [0, Math.sign(dx)] : [Math.sign(dy), 0];
  const r2 = drag.t.r + dr, c2 = drag.t.c + dc;
  if (r2 < 0 || r2 >= R || c2 < 0 || c2 >= C) return;
  trySwap(drag.t, grid[r2][c2]);
});
board.addEventListener('pointerup', () => { drag = null; });
board.addEventListener('pointercancel', () => { drag = null; });

function tileFromEl(el) {
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (grid[r][c] && grid[r][c].el === el) return grid[r][c];
  return null;
}

/* ---------------- gentle nudge instead of a timer ---------------- */
function clearNudge() {
  nudged.forEach(t => t.el.classList.remove('nudge'));
  nudged = [];
  if (handEl) { handEl.remove(); handEl = null; }
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
}
// A finger that actually travels from one tile to the other. Pulsing two tiles
// said "look here"; this says "trade these two", which is the thing a child who
// can't read the footnote needs to be told.
function showHand(a, b) {
  if (REDUCED) return;
  const cell = board.clientWidth / C;
  handEl = document.createElement('div');
  handEl.className = 'hand';
  handEl.textContent = '👆';
  handEl.style.setProperty('--hx0', (a[1] * cell) + 'px');
  handEl.style.setProperty('--hy0', (a[0] * cell) + 'px');
  handEl.style.setProperty('--hx1', (b[1] * cell) + 'px');
  handEl.style.setProperty('--hy1', (b[0] * cell) + 'px');
  board.appendChild(handEl);
}
// `fast` is the first-run tutorial: on a brand-new save the hand shows up in a
// couple of seconds instead of six, so nobody has to be told how to play.
function armIdle(fast) {
  clearNudge();
  idleTimer = setTimeout(() => {
    if (busy || over || sel) { armIdle(); return; }
    const mv = hintMove();
    if (!mv) return;
    nudged = mv.map(([r, c]) => grid[r][c]).filter(Boolean);
    nudged.forEach(t => t.el.classList.add('nudge'));
    showHand(mv[0], mv[1]);
    idleTimer = setTimeout(() => { clearNudge(); armIdle(); }, 5200);
  }, fast ? 2200 : 6000);
}

/* ---------------- HUD ---------------- */
function spendMove() {
  if (freePlay) return;
  movesLeft--; movesUsed++;
  const box = $('moves-box');
  box.classList.remove('bump'); void box.offsetWidth; box.classList.add('bump');
  paintHud();
}
let footBase = '';
function setFoot(msg) { $('foot').textContent = msg || footBase; }
function paintHud() {
  $('score').textContent = score.toLocaleString() + ' points';
  $('moves-n').textContent = freePlay ? '∞' : Math.max(0, movesLeft);
  $('moves-box').classList.toggle('low', !freePlay && movesLeft <= 3);
}
function miniTile(k) {
  const K = KINDS[k];
  return '<span class="mini"><span class="shape" style="border-radius:30%;background:linear-gradient(160deg,'
       + K.from + ',' + K.to + ')"></span><span class="face">' + K.emoji + '</span></span>';
}
let goalSig = '';
// One chip per goal, whatever kind it is.
function goalChip(g) {
  if (g.t === 'fruit') return miniTile(g.k);
  const face = g.t === 'leaf' ? '🍃'
             : g.t === 'score' ? '🏆'
             : '✨';
  const bg = g.t === 'leaf' ? 'linear-gradient(160deg,#d6f5b0,#7cc94e)'
           : g.t === 'score' ? 'linear-gradient(160deg,#ffe08a,#f5a524)'
           : 'linear-gradient(160deg,#cfe4ff,#7aa8ff)';
  return '<span class="mini"><span class="shape" style="border-radius:26%;background:' + bg
       + '"></span><span class="face">' + face + '</span></span>';
}
// Short "12🍓 6🍃" style summary, used on the level card and the menu.
function goalSummary(lv) {
  return lv.goals.map(g =>
      g.t === 'fruit' ? g.need + KINDS[g.k].emoji
    : g.t === 'leaf'  ? g.need + '🍃'
    : g.t === 'score' ? g.need.toLocaleString() + '🏆'
    : g.need + '✨');
}
function goalLabel(g) {
  return g.t === 'fruit' ? 'collect ' + g.need + ' ' + KINDS[g.k].name
       : g.t === 'leaf'  ? 'sweep ' + g.need + ' leaves'
       : g.t === 'score' ? 'score ' + g.need + ' points'
       : 'make ' + g.need + ' boosters';
}
// How far along a goal is, and what it needs.
function goalProgress(g, i) {
  if (g.t === 'leaf')  return Math.max(0, g.need - coversLeft);
  if (g.t === 'score') return Math.min(g.need, score);
  if (g.t === 'boost') return Object.values(boostMade).reduce((a, b) => a + b, 0);
  return goalGot[i] || 0;
}
function paintGoals(animate) {
  const host = $('goals');
  // Rebuild on the actual goal set, not the chip count — two levels can want
  // the same NUMBER of chips but different ones, which used to leave the
  // previous level's chip sitting there showing this level's numbers.
  const sig = L.name + '|' + L.goals.map(g => [g.t, g.k, g.sp, g.need].join(':')).join(',');
  if (!L.goals.length) { host.innerHTML = ''; goalSig = sig; return; }
  if (sig !== goalSig) {
    goalSig = sig;
    host.innerHTML = L.goals.map((g, i) =>
      '<div class="goal" data-i="' + i + '" aria-label="' + goalLabel(g) + '">'
      + goalChip(g) + '<span class="num"></span></div>').join('');
  }
  L.goals.forEach((g, i) => {
    const chip = host.children[i];
    const got = goalProgress(g, i);
    const done = got >= g.need;
    chip.querySelector('.num').textContent = done ? '✓'
      : (g.t === 'score' ? got.toLocaleString() + '/' + g.need.toLocaleString() : got + '/' + g.need);
    chip.classList.toggle('done', done);
    if (animate) { chip.classList.remove('pulse'); void chip.offsetWidth; chip.classList.add('pulse'); }
  });
}
function goalMet() { return L.goals.every((g, i) => goalProgress(g, i) >= g.need); }

/* ---------------- win ---------------- */
function checkWin() {
  if (freePlay || over || !goalMet()) return false;
  over = true;
  clearNudge();
  clearSave();
  let n = 3;
  if (usedHelp) n = 1;
  else if (movesUsed > par2(L)) n = 1;
  else if (movesUsed > par3(L)) n = 2;
  setStar(levelNo, n);
  addTotal(score);              // points are kept forever
  unlockLevel(levelNo + 1);     // there is always a next level
  // Every level pays out a tool, rotating so the stock stays balanced, plus a
  // bonus one for three stars. This is the only way to get them — no shop.
  const won1 = TOOL_IDS[levelNo % TOOL_IDS.length];
  grantTool(won1);
  const won2 = n === 3 ? TOOL_IDS[(levelNo + 1) % TOOL_IDS.length] : null;
  if (won2) grantTool(won2);
  $('win-prize').textContent = won2
    ? 'You won ' + TOOL_ICON[won1] + ' and ' + TOOL_ICON[won2] + '!'
    : 'You won a ' + TOOL_ICON[won1] + '!';
  paintMenu();
  sfx('win'); buzz([80, 60, 80, 60, 160]);
  $('win-title').textContent = n === 3 ? 'Perfect!' : n === 2 ? 'Great job!' : 'You did it!';
  $('win-sub').textContent = score.toLocaleString() + ' points · 🏆 ' + totalScore().toLocaleString() + ' total';
  $('win-mascot').textContent = ['🐻', '🐰', '🦊', '🐸', '🐨'][rnd(5)];
  const row = $('starrow').children;
  for (let i = 0; i < 3; i++) row[i].classList.remove('on');
  $('next-btn').textContent = 'Level ' + (levelNo + 1) + ' ▸';
  // Clear the board away first — the celebration lands on an empty stage
  // instead of covering up a board still full of fruit.
  (async () => {
    await playOutro();
    confettiBurst(); cannon('left'); cannon('right');
    $('win').classList.add('show');
    setTimeout(() => { if ($('win').classList.contains('show')) { cannon('left'); cannon('right'); } }, 850);
    for (let i = 0; i < n; i++) setTimeout(() => { row[i].classList.add('on'); sfx('star', i); }, 420 + i * 340);
  })();
  return true;
}

const CONF = ['#ffd34d', '#ff9d5c', '#ff8fb2', '#54c452', '#4aa3ff', '#a394ff', '#7df5b9'];
function confPiece(k) {
  const w = 7 + Math.random() * 9, round = Math.random() < .5;
  const p = document.createElement('span');
  p.style.width = w + 'px';
  p.style.height = (round ? w : w * (.4 + Math.random() * .55)) + 'px';
  p.style.background = CONF[k % CONF.length];
  p.style.borderRadius = round ? '50%' : '2px';
  return p;
}
function confettiBurst() {
  if (REDUCED) return;
  for (let k = 0; k < 70; k++) {
    const s = confPiece(k);
    s.className = 'confetti';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (2.2 + Math.random() * 2.5) + 's';
    s.style.animationDelay = (Math.random() * .8) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 6000);
  }
}
function cannon(side) {
  if (REDUCED) return;
  const dir = side === 'left' ? 1 : -1;
  for (let k = 0; k < 26; k++) {
    const outer = document.createElement('span');
    outer.className = 'cann-x';
    outer.style.left = side === 'left' ? '3vw' : '97vw';
    outer.style.setProperty('--tx', (dir * (12 + Math.random() * 62)) + 'vw');
    const inner = document.createElement('span');
    inner.className = 'cann-y';
    inner.style.setProperty('--rise', -(34 + Math.random() * 42) + 'vh');
    const p = confPiece(k);
    p.className = 'cann-p';
    p.style.animationDuration = (.35 + Math.random() * .4) + 's';
    inner.appendChild(p); outer.appendChild(inner);
    document.body.appendChild(outer);
    setTimeout(() => outer.remove(), 2600);
  }
}

/* ---------------- screens & routing ---------------- */
function paintMenu() {
  const s = stars();
  const mx = maxLevel();
  $('totals').innerHTML =
      '<span class="tot" aria-label="stars earned">⭐ ' + totalStars() + '</span>'
    + '<span class="tot" aria-label="total points">🏆 ' + totalScore().toLocaleString() + '</span>';

  // Continue on the first level not yet beaten, else the newest one unlocked.
  let next = mx;
  for (let i = 1; i <= mx; i++) if (!s[i]) { next = i; break; }
  const play = $('play-btn');
  play.textContent = '▶ Level ' + next;
  play.dataset.n = next;

  let html = '';
  for (let i = 1; i <= mx; i++) {
    const st = s[i] || 0;
    html += '<button class="lvl-chip' + (i === next ? ' cur' : '') + '" data-n="' + i + '"'
      + ' aria-label="Level ' + i + (st ? ', ' + st + ' stars' : '') + '">'
      + '<span class="n">' + i + '</span>'
      + '<span class="s">' + (st ? '⭐'.repeat(st) : '') + '</span></button>';
  }
  // A grid holding one chip just looks broken — there's nothing to pick yet.
  $('levels').style.display = mx > 1 ? '' : 'none';
  $('levels').innerHTML = html;
  const cur = $('levels').querySelector('.cur');
  if (cur) cur.scrollIntoView({ block: 'nearest' });
}
$('levels').addEventListener('click', ev => {
  const b = ev.target.closest('.lvl-chip');
  if (!b) return;
  ac(); sfx('tap');
  location.hash = '#lvl-' + b.dataset.n;
});
$('play-btn').addEventListener('click', () => {
  ac(); sfx('tap');
  location.hash = '#lvl-' + $('play-btn').dataset.n;
});
$('free-btn').addEventListener('click', () => { ac(); sfx('tap'); location.hash = '#free'; });
$('tools').addEventListener('click', ev => {
  const b = ev.target.closest('.tool');
  if (b) { ac(); armTool(b.dataset.t); }
});

function showMenu() {
  over = true; busy = false;
  clearNudge();
  $('menu').classList.remove('hidden');
  $('game').classList.add('hidden');
  $('win').classList.remove('show');
  $('more').classList.remove('show');
  $('resume').classList.remove('show');
  paintMenu();
}

function start(idx, resume, quiet) {
  freePlay = idx === 'free';
  levelNo = freePlay ? 0 : idx;
  L = freePlay ? FREE : levelFor(idx);
  R = L.rows; C = L.cols; KN = L.kinds;
  score = 0; movesLeft = L.moves; movesUsed = 0; usedHelp = false; over = false; busy = false; sel = null;
  goalGot = L.goals.map(() => 0);
  boostMade = {};
  sinceBooster = 0;

  if (resume) {
    score = resume.score; movesLeft = resume.movesLeft; movesUsed = resume.used;
    usedHelp = !!resume.helped; goalGot = resume.got.slice();
    boostMade = resume.made || {};
  }

  $('menu').classList.add('hidden');
  $('game').classList.remove('hidden');
  $('win').classList.remove('show');
  $('more').classList.remove('show');
  $('resume').classList.remove('show');
  $('lv-name').textContent = L.name;
  footBase = freePlay ? 'Pop as much as you like. 🎈'
    : L.covers ? 'Pop the fruit sitting on the leaves 🍃'
    : 'Tap a fruit, then the one next to it.';
  setFoot(null);

  layout();
  if (resume) {
    restoreBoard(resume.grid);
    restoreCovers(resume.cov);
    // Saves are only ever written from a settled board, so a run here means a
    // stale or hand-edited save — deal a fresh board rather than gift a match.
    if (runsOn(grid).length) { buildBoard(); makeCovers(L.covers || 0, L.pattern); }
  } else {
    buildBoard();
    makeCovers(L.covers || 0, L.pattern);
  }
  paintGoals(false);
  paintHud();
  armed = null; toolPick = null;
  paintTools();
  // If a restored board happens to be dead, mix it before the child touches it.
  if (!anyMove()) reshuffle();

  // Play the arrival, and hold input until the board has finished landing.
  // Resuming skips the card — the "welcome back" dialog is already the intro.
  busy = true;
  playIntro(!quiet && !resume).then(() => {
    // First ever game? Bring the pointing hand in early — that's the tutorial.
    armIdle(!freePlay && levelNo === 1 && !Object.keys(stars()).length);
  });
}

function applyRoute() {
  const h = location.hash;
  if (h === '#free') { start('free'); return; }
  const m = /^#lvl-(\d+)$/.exec(h);
  if (m) {
    const i = Number(m[1]);
    // Levels never run out, but you can't skip ahead to one you haven't reached.
    if (i >= 1 && i <= maxLevel()) {
      const sv = loadSave();
      const ok = validSave(sv, i);
      start(i, ok ? sv : null);
      // Only ask when there's progress worth keeping — a level opened and left
      // untouched has nothing to decide about.
      if (ok && sv.used > 0) { clearNudge(); $('resume').classList.add('show'); }
      return;
    }
  }
  showMenu();
}
window.addEventListener('hashchange', applyRoute);

/* ---------------- buttons ---------------- */
$('back-btn').onclick  = () => { saveGame(); location.hash = ''; };
$('menu-btn').onclick  = () => { location.hash = ''; };
$('again-btn').onclick = () => { clearSave(); start(freePlay ? 'free' : levelNo); };
$('next-btn').onclick  = () => { clearSave(); location.hash = '#lvl-' + (levelNo + 1); };
$('home-btn').onclick  = () => { location.href = '../../'; };
$('more-btn').onclick  = () => {
  usedHelp = true; movesLeft += 5;
  $('more').classList.remove('show');
  paintHud(); saveGame(); armIdle();
  sfx('make');
};
$('more-quit').onclick = () => { $('more').classList.remove('show'); location.hash = ''; };
$('resume-yes').onclick = () => { sfx('tap'); $('resume').classList.remove('show'); armIdle(); };
$('resume-new').onclick = () => {
  sfx('tap'); $('resume').classList.remove('show');
  clearSave(); start(levelNo);
};

$('set-btn').onclick   = () => $('settings').classList.add('show');
$('set-close').onclick = () => $('settings').classList.remove('show');
$('settings').addEventListener('click', ev => { if (ev.target === $('settings')) $('settings').classList.remove('show'); });
function paintToggles() {
  $('t-sound').textContent = soundOn ? 'ON' : 'OFF';
  $('t-sound').classList.toggle('off', !soundOn);
  $('t-vibe').textContent = vibeOn ? 'ON' : 'OFF';
  $('t-vibe').classList.toggle('off', !vibeOn);
}
$('t-sound').onclick = () => { soundOn = !soundOn; localStorage.setItem('match3-sound', soundOn ? 'on' : 'off'); paintToggles(); if (soundOn) sfx('pop', 0); };
$('t-vibe').onclick  = () => { vibeOn = !vibeOn; localStorage.setItem('match3-vibe', vibeOn ? 'on' : 'off'); paintToggles(); if (vibeOn) buzz(30); };
// iOS has no Vibration API at all — don't offer a switch that does nothing.
if (!navigator.vibrate) $('vibe-row').style.display = 'none';
paintToggles();

/* ---------------- no zooming ----------------
   Tapping an already-selected booster to set it off IS a double tap, so the
   browser's double-tap-to-zoom actively fights the game. touch-action already
   asks for this, but iOS Safari ignores user-scalable, so the gestures are
   swallowed explicitly too. */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
let lastTap = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  // Only the *second* tap of a quick pair is cancelled, so ordinary taps and
  // scrolling are untouched.
  if (now - lastTap <= 320) e.preventDefault();
  lastTap = now;
}, { passive: false });

window.addEventListener('pagehide', saveGame);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });

applyRoute();
</script>
</body>
