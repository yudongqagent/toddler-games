   ring on every intermediate beat so the through-line is always visible. */
function applyStepVisuals(st){
  boardEl.querySelectorAll('.dim,.band,.ev,.goal,.hintwrong').forEach(el=>el.classList.remove('dim','band','ev','goal','hintwrong'));
  boardEl.querySelectorAll('.cands').forEach(el=>el.remove());
  const svg=$('hint-arrows'); if(svg){ svg.style.display='none'; svg.innerHTML=''; }
  const touched=new Set([...(st.band||[]), ...(st.ev||[]), ...(st.wrongRing||[])]);
  if(st.target!=null) touched.add(st.target);
  if(st.goal!=null) touched.add(st.goal);
  (st.cross||[]).forEach(m=>touched.add(m.cell));
  (st.focus||[]).forEach(m=>touched.add(m.cell));
  (st.arrows||[]).forEach(pr=>{ touched.add(pr[0]); touched.add(pr[1]); });
  if(st.dim!==false && touched.size)
    for(let i=0;i<board.length;i++) if(!touched.has(i)) boardEl.children[i].classList.add('dim');
  (st.band||[]).forEach(c=>{ const el=boardEl.children[c]; if(el) el.classList.add('band'); });
  (st.ev||[]).forEach(c=>{ const el=boardEl.children[c]; if(el) el.classList.add('ev'); });
  if(st.goal!=null){ const el=boardEl.children[st.goal]; if(el) el.classList.add('goal'); }
  (st.wrongRing||[]).forEach(c=>{ const el=boardEl.children[c]; if(el) el.classList.add('hintwrong'); });
  const items={};
  (st.focus||[]).forEach(m=>{ (items[m.cell]=items[m.cell]||[]).push(...m.values.map(v=>({v,focus:true}))); });
  (st.cross||[]).forEach(m=>{ (items[m.cell]=items[m.cell]||[]).push(...m.values.map(v=>({v,cross:true}))); });
  for(const c in items) setMarks(+c, items[c]);
  if(st.arrows && st.arrows.length) drawArrows(st.arrows);
  if(st.target!=null) selectCell(st.target);
  else if(selectedCell>=0) selectCell(-1);
  if(st.pulse!=null) pulseTrayBtn(st.pulse);
}

function collectStepCells(st){
  const s=new Set([...(st.band||[]), ...(st.ev||[]), ...(st.wrongRing||[])]);
  if(st.target!=null) s.add(st.target);
  if(st.goal!=null) s.add(st.goal);
  (st.cross||[]).forEach(m=>s.add(m.cell));
  (st.focus||[]).forEach(m=>s.add(m.cell));
  (st.arrows||[]).forEach(pr=>{ s.add(pr[0]); s.add(pr[1]); });
  return [...s];
}
function renderHintStep(){
  const st=hintStory[hintStep];
  applyStepVisuals(st);
  $('hint-text').innerHTML=st.text;
  const total=hintStory.length;
  $('hint-dots').innerHTML = total>1
    ? hintStory.map((_,k)=>'<span class="hdot'+(k===hintStep?' on':'')+'"></span>').join('') : '';
  $('hint-next').textContent = hintStep<total-1 ? 'Next ▸' : 'Got it! ✓';
  const b=$('hint-bubble');
  b.classList.add('show');
  const br=boardEl.getBoundingClientRect();
  const h=b.offsetHeight;
  // Landscape: the board owns the full height, so there is no room above or
  // below it. Float the card over the panel beside the board instead — the
  // board, which is what the step is pointing at, stays fully visible.
  if(document.documentElement.classList.contains('land')){
    // centre it in the strip beside the board, then pull it back inside the
    // screen — the close button hangs 10px past the card's own corner.
    const w=b.offsetWidth;
    const cx=Math.min((br.right+window.innerWidth)/2, window.innerWidth-14-w/2);
    b.style.left=Math.max(w/2+14, cx)+'px';
    b.style.top=Math.max(14,(window.innerHeight-h)/2)+'px';
    b.classList.remove('below');
    return;
  }
  // Portrait: put the card where it hides nothing this step talks about —
  // above the board normally, below it when the action is in the top rows.
  b.style.left='50%';
  const aboveTop=Math.max(8, br.top-h-14);
  const covers=collectStepCells(st).some(c=>{
    const el=boardEl.children[c];
    return el && el.getBoundingClientRect().top < aboveTop+h+12;
  });
  const belowTop=br.bottom+14;
  if(covers && belowTop+h <= window.innerHeight-8){
    b.style.top=belowTop+'px';
    b.classList.add('below');
  } else {
    b.style.top=aboveTop+'px';
    b.classList.remove('below');
  }
}
function showStory(steps){
  hintStory=steps.filter(Boolean);
  if(!hintStory.length){ hintStory=null; return; }
  hintStep=0;
  renderHintStep();
}
function hintNext(){
  if(!hintStory){ clearHintFx(); return; }
  sfx('tap');
  if(hintStep<hintStory.length-1){ hintStep++; renderHintStep(); }
  else clearHintFx();
}

function pulseTrayBtn(v){
  const b=trayEl.querySelector('.tray-btn[data-val="'+v+'"]');
  if(!b) return;
  b.classList.add('hintpulse');
  hintTimers.push(setTimeout(()=>b.classList.remove('hintpulse'),3300));
}

/* ---------------- story builders ---------------- */

// One step for a single found on grid gd. opts: {spot, ending, ring}
// ring=true is the "a wrong number sits on this square" flavour: orange ring,
// no gold target, ending tells the player to swap it.
function singleStepFor(fs, gd, opts){
  opts=opts||{};
  const v=fs.value;
  const spot=opts.spot||'the golden square';
  const ending=opts.ending!==undefined?opts.ending:' Tap '+symTag(v)+'! ✨';
  let st;
  if(fs.tech==='hidden'){
    const un=uname(fs.unitKind);
    const empties=fs.unitCells.filter(p=>gd[p]===0 && p!==fs.cell);
    st={ text:'Only '+spot+' can take '+aSym(v)+' in this '+un+' — the crossed squares already see one (follow the arrows).'+ending,
      band:fs.unitCells,
      cross:empties.map(p=>({cell:p, values:[v]})),
      ev:fs.blocks.map(b=>b.byCell),
      arrows:fs.blocks.map(b=>[b.byCell, b.cell]) };
  } else {
    st={ text:'Only '+symTag(v)+' fits '+spot+' — everything else is already around it: '+takenAround(fs.blockers)+'.'+ending,
      ev:fs.blockers.map(b=>b.cell),
      arrows:fs.blockers.map(b=>[b.cell, fs.cell]) };
  }
  if(opts.ring) st.wrongRing=[fs.cell];
  else { st.target=fs.cell; st.pulse=v; st.focus=[{cell:fs.cell, values:[v]}]; }
  return st;
}
function storySimple(fs){ return [singleStepFor(fs, board)]; }

// bare symbol (no colour tag) for the compact "what's left" strip
function symPlain(v){ return symbols[v-1]; }
// emphasise a word inside the (purple) hint bubble
function emph(s){ return '<b style="color:#e6512e">'+s+'</b>'; }
// a row of digit chips: crossed-by-us (red), blocked-around (grey), survivor (gold)
function leftStrip(keep, chainVals, goneVals){
  const cs=new Set(chainVals), gs=new Set(goneVals);
  let chips='';
  for(let u=1;u<=L.n;u++){
    const cls = u===keep ? 'keep' : cs.has(u) ? 'chain' : gs.has(u) ? 'gone' : 'gone';
    chips+='<span class="ls '+cls+'">'+symPlain(u)+'</span>';
  }
  return '<div class="leftstrip">'+chips+'</div>';
}
const rowCellsOf=r=>[...Array(L.n).keys()].map(c=>r*L.n+c);
const colCellsOf=c=>[...Array(L.n).keys()].map(r=>r*L.n+c);

/* Every advanced elimination becomes ONE OR MORE beats. Mild tricks
   (pointing / claiming) stay a single beat; pairs get two; the wings get a
   walked case-split so no single sentence has to carry the whole deduction. */
function elimBeats(d){
  switch(d.tech){
    case 'XY-Wing':  return xyWingBeats(d);
    case 'X-Wing':   return xWingBeats(d);
    case 'naked pair': case 'naked triple':  return pairBeats(d, false);
    case 'hidden pair': case 'hidden triple': return pairBeats(d, true);
    default:         return pointClaimBeats(d);
  }
}

const NUMWORD=['','one','two','three','four','five','six','seven','eight','nine'];
function countWord(k){ return NUMWORD[k]||String(k); }

/* pointing / claiming — two beats, because it is a two-part deduction and
   cramming it into one made the picture lie: the old step banded the *swept*
   unit only, so the unit the sentence called "this box" was never drawn and
   its other empty squares stayed dim and unexplained ("why not there?").

   Both techniques are the same shape with the roles swapped:
     pointing — the digit is trapped inside a BOX,  so a LINE gets swept
     claiming — the digit is trapped inside a LINE, so a BOX gets swept
   Beat 1 shows the home unit and proves the digit is trapped there (every
   other empty square of it gets a crossed digit, with an arrow to the filled
   peer that rules it out). Beat 2 shows the swept unit and hands out the
   eliminations. No unit is ever drawn without the reason it is drawn. */
function pointClaimBeats(d){
  const v=d.value, gd=board, pointing=d.tech!=='claiming';
  const homeCells=pointing?d.boxCells:d.lineCells;      // where v is trapped
  const homeName =pointing?'box':uname(d.unitKind);
  const swept    =pointing?d.lineCells:d.boxCells;      // where v gets crossed out
  const sweptName=pointing?uname(d.unitKind):'box';
  const focus=d.patternCells.map(c=>({cell:c, values:[v]}));
  const spots=countWord(d.patternCells.length);

  // Beat 1 — the digit has nowhere else to go inside its home unit.
  const pat=new Set(d.patternCells);
  const ev=[], arrows=[], cross=[]; let phys=0, chained=0;
  for(const q of homeCells){
    if(gd[q]!==0 || pat.has(q)) continue;
    const b=blockerFor(gd,q,v);
    if(b){ ev.push(b.cell); arrows.push([b.cell,q]); phys++; } else chained++;
    cross.push({cell:q, values:[v]});
  }
  const why = !cross.length ? ''
    : chained&&phys ? ' — the rest already see '+aSym(v)+' (arrows) or we crossed '+symTag(v)+' out of them just before'
    : chained ? ' — we crossed '+symTag(v)+' out of the others just before'
    : ' — every other empty square here already sees '+aSym(v)+' (arrows)';
  const beat1={ text:'In this '+homeName+', '+aSym(v)+' can only go in the '+spots+' bright squares'+why+'.',
    band:homeCells, focus, cross, ev, arrows };

  // Beat 2 — they all share one line (or one box), so that unit is spoken for.
  const all=d.patternCells.length===2 ? 'Both' : 'All '+spots;
  const beat2={ text:all+' bright squares sit in the same '+sweptName+'! So this '+sweptName+'’s '+
      symTag(v)+' has to be one of them — every other square in it can’t be '+symTag(v)+' (crossed out).',
    band:swept, focus, cross:groupElims(d.elims) };
  return [beat1, beat2];
}

// naked / hidden pair (or triple) — split into premise + conclusion
function pairBeats(d, hidden){
  const vsAnd=joinAnd(d.values.map(symTag));
  const vsOr=joinOr(d.values.map(symTag));
  const un=uname(d.unitKind);
  const focus=d.patternCells.map(c=>({cell:c, values:d.values}));
  const cross=groupElims(d.elims);
  const those=d.values.length>2?'those three':'those two';
  if(hidden){
    return [
      { text:'In this '+un+', '+vsAnd+' can only go in the bright squares — nowhere else fits them.',
        band:d.unitCells, focus },
      { text:'So '+those+' squares must each be '+vsOr+' — every other number is crossed off them.',
        band:d.unitCells, focus, cross }
    ];
  }
  return [
    { text:'Each bright square can only be '+vsOr+' — no other number fits either one.',
      band:d.unitCells, focus },
    { text:'Between them they use up '+vsAnd+', so nothing else in this '+un+' can be '+vsOr+' (crossed out).',
      band:d.unitCells, focus, cross }
  ];
}

// X-Wing — rectangle, then the either/or, then the sweep
function xWingBeats(d){
  const v=d.value, pc=d.patternCells;
  const rowMode=d.unitKind==='row';
  const rset=[...new Set(pc.map(c=>Math.floor(c/L.n)))].sort((a,b)=>a-b);
  const cset=[...new Set(pc.map(c=>c%L.n))].sort((a,b)=>a-b);
  const baseIdx=rowMode?rset:cset, crossIdx=rowMode?cset:rset;
  const baseName=rowMode?'rows':'columns', crossName=rowMode?'columns':'rows';
  const baseCells=baseIdx.flatMap(i=>rowMode?rowCellsOf(i):colCellsOf(i));
  const crossCells=crossIdx.flatMap(i=>rowMode?colCellsOf(i):rowCellsOf(i));
  const baseNums=joinAnd(baseIdx.map(i=>String(i+1)));
  const crossNums=joinAnd(crossIdx.map(i=>String(i+1)));
  const focus=pc.map(c=>({cell:c, values:[v]}));
  const diag=[[pc[0],pc[3]],[pc[1],pc[2]]];
  const cross=groupElims(d.elims);
  return [
    { text:'A rectangle trick! In '+baseName+' '+baseNums+', '+symTag(v)+' fits in only two spots each — and they line up into these four corners.',
      band:baseCells, focus, arrows:diag },
    { text:symTag(v)+' has to take one pair of opposite corners or the other. '+emph('Either way')+', it lands once in each of '+crossName+' '+crossNums+'.',
      focus, arrows:diag },
    { text:'So '+crossName+' '+crossNums+' have used up their '+symTag(v)+' here — cross '+symTag(v)+' out of every other square in them.',
      band:crossCells, focus, cross }
  ];
}

// XY-Wing — meet the cast, walk each case, then conclude
function xyWingBeats(d){
  const [piv,w1,w2]=d.patternCells, Z=d.value;
  const pm=d.candBefore[piv], m1=d.candBefore[w1], m2=d.candBefore[w2];
  const s1=bitsOf(m1&pm)[0], s2=bitsOf(m2&pm)[0];   // value each wing shares with the hinge
  const cross=groupElims(d.elims);
  return [
    { text:'Three special squares, each with just two choices. Watch the '+emph('hinge')+' — where the arrows begin: it is '+symTag(s1)+' or '+symTag(s2)+'.',
      focus:[{cell:piv,values:bitsOf(pm)},{cell:w1,values:bitsOf(m1)},{cell:w2,values:bitsOf(m2)}],
      arrows:[[piv,w1],[piv,w2]] },
    { text:'Say the hinge is '+symTag(s1)+'. Then its partner here can\'t be '+symTag(s1)+' too — so that partner must be '+symTag(Z)+'.',
      focus:[{cell:piv,values:[s1]},{cell:w1,values:[Z]}], arrows:[[piv,w1]] },
    { text:'But if the hinge is '+symTag(s2)+' instead, then this other partner must be '+symTag(Z)+'.',
      focus:[{cell:piv,values:[s2]},{cell:w2,values:[Z]}], arrows:[[piv,w2]] },
    { text:emph('Either way')+', one partner ends up '+symTag(Z)+'! So any square that sees '+emph('both')+' partners can never be '+symTag(Z)+' (crossed out).',
      focus:[{cell:w1,values:[Z]},{cell:w2,values:[Z]}], cross,
      arrows:cross.flatMap(m=>[[w1,m.cell],[w2,m.cell]]) }
  ];
}

// Final placement step of a chain. For a naked single the census is shown as a
// compact "what's left" strip (red = we crossed it out, grey = already around
// it, gold = the survivor) instead of one long run-on sentence.
function chainFinalStep(chain, gd, opts){
  gd=gd||board; opts=opts||{};
  const p=chain.place, v=p.value;
  const spot=opts.spot||'the golden square';
  const ending=opts.ending!==undefined?opts.ending:' Tap '+symTag(v)+'! ✨';
  let st;
  if(p.tech==='hidden single'){
    const un=uname(p.unitKind);
    const empties=p.unitCells.filter(q=>gd[q]===0 && q!==p.cell);
    const ev=[], arrows=[], cross=[]; let phys=0, chained=0;
    for(const q of empties){
      const b=blockerFor(gd,q,v);
      if(b){ ev.push(b.cell); arrows.push([b.cell,q]); phys++; }
      else chained++;
      cross.push({cell:q, values:[v]});
    }
    const clause = chained&&phys ? 'we just crossed it out of some spots, and the rest already see '+aSym(v)+' (arrows)'
      : chained ? 'we just crossed it out of every other spot'
      : 'every other spot already sees '+aSym(v)+' (arrows)';
    st={ text:'So now only '+spot+' can take '+symTag(v)+' in this '+un+' — '+clause+'.'+ending,
      band:p.unitCells, ev, arrows, cross };
  } else {
    const elimVals=[...new Set(chain.enablers.flatMap(d=>d.elims.filter(e=>e.cell===p.cell).map(e=>e.value)))];
    const goneVals=[], blockCells=[];
    for(let u=1;u<=L.n;u++){ if(u===v||elimVals.includes(u)) continue; const b=blockerFor(gd,p.cell,u); if(b){ goneVals.push(u); blockCells.push(b.cell); } }
    const lead = elimVals.length
      ? 'Every other number is spoken for — the ones we crossed out ('+emph('red')+') and the ones already around it (grey).'
      : 'Every other number is already taken around it.';
    st={ text:'Look at '+spot+' now. '+lead+' Only '+symTag(v)+' is left!'+leftStrip(v, elimVals, goneVals)+ending,
      ev:blockCells, arrows:blockCells.map(c=>[c,p.cell]) };
    // the strip already lists the crossed-out values, so keep the answer square
    // clean — just the surviving number, no cramped in-cell strikethroughs
  }
  if(opts.ring) st.wrongRing=[p.cell];
  else { st.target=p.cell; st.pulse=v; st.focus=[{cell:p.cell, values:[v]}]; }
  return st;
}

// Flatten enabler beats + the final placement. Every non-placement beat carries
// a faint gold "goal" ring on the destination square, so the player always sees
// where the whole chain is heading (the through-line).
function storyChain(chain, gd, finalOpts){
  const steps=[...chain.enablers.flatMap(elimBeats), chainFinalStep(chain, gd, finalOpts)];
  const wantGoal=!(finalOpts&&finalOpts.ring);
  if(wantGoal) for(const s of steps){ if(s.target==null && s.goal==null) s.goal=chain.place.cell; }
  return steps;
}

// why a placed number is wrong
function storyWrong(i){
  const v=board[i], sym=symTag(v);
  const partner=conflictPartner(i,v);
  if(partner){
    const un=uname(partner.kind);
    return [{ text:'This '+un+' already has '+aSym(v)+' (green) — two '+sym+'s can\'t share a '+un+'! Tap the wiggly '+sym+' to pop it out.',
      band:partner.cells, ev:[partner.j], wrongRing:[i], arrows:[[partner.j,i]] }];
  }
  // clean all wrong guesses, then prove the square's true value
  const g=board.slice();
  for(let k=0;k<g.length;k++) if(puzzle[k]===0 && g[k]!==0 && g[k]!==solution[k]) g[k]=0;
  const wrongOpts=real=>({ ring:true, spot:'this square',
    ending:' So the '+sym+' can\'t stay — tap it to take it out, then place '+symTag(real)+'.' });
  const simple=findStep(g,i);
  if(simple) return [ singleStepFor(simple, g, wrongOpts(simple.value)) ];
  const chain=chainAt(g,i);
  if(chain){
    const steps=storyChain(chain, g, wrongOpts(chain.place.value));
    steps.forEach(st=>{ if(!(st.wrongRing||[]).includes(i)) st.wrongRing=[...(st.wrongRing||[]), i]; });
    return steps;
  }
  return [{ text:'This '+sym+' doesn\'t belong here. Rub it out with the eraser, then ask me again! 🧽',
    wrongRing:[i], dim:false }];
}

// last-resort explanation for a square that even the engine can't force
// (legacy saves): honest choices + the answer, in one step
function storyChoices(g,i){
  const cands=candList(g,i), W=solution[i];
  const blockers=[];
  for(let u=1;u<=L.n;u++){ if(cands.includes(u)) continue; const b=blockerFor(g,i,u); if(b) blockers.push({value:u, cell:b.cell, kind:b.kind}); }
  const reason=takenAround(blockers);
  return [{ text:'A real puzzler! This square can be '+joinOr(cands.map(symTag))+
      (reason?' — '+reason:'')+'. Secret: here it\'s '+symTag(W)+'. Tap '+symTag(W)+'! ✨',
    ev:blockers.map(b=>b.cell), arrows:blockers.map(b=>[b.cell,i]),
    target:i, pulse:W, focus:[{cell:i, values:[W]}] }];
}
function storyChoicesNarrowest(g){
  let best=-1, bestLen=99;
  for(let i=0;i<g.length;i++){ if(g[i]!==0) continue; const l=candList(g,i).length; if(l<bestLen){ best=i; bestLen=l; if(l<=1) break; } }
  return best>=0 ? storyChoices(g,best) : [];
}

/* ---------------- the hint button ---------------- */

function onHint(){
  if(solvedFlag) return;
  clearHintFx();
  sfx('hint');
  mascotReact('think',1600);
  // 1) a wrong number on the board? explain why it can't stay.
  const wrong = board.findIndex((v,i)=> puzzle[i]===0 && v!==0 && v!==solution[i]);
  if(wrong>=0){ showStory(storyWrong(wrong)); return; }
  // 2) a selected empty square? explain THAT one if logic can.
  if(selectedCell>=0 && board[selectedCell]===0){
    const i=selectedCell;
    const s=findStep(board,i);
    if(s){ showStory(storySimple(s)); return; }
    const chain=chainAt(board,i);
    if(chain){ showStory(storyChain(chain)); return; }
    // not provable there — steer to a square we CAN crack, without a filler step
    const pre='That square isn\'t certain yet — here\'s one we can crack! 🔍 ';
    const any=findStep(board);
    if(any){ const steps=storySimple(any); steps[0]={...steps[0], text:pre+steps[0].text}; showStory(steps); return; }
    const chain2=chainAt(board,null);
    if(chain2){ const steps=storyChain(chain2); steps[0]={...steps[0], text:pre+steps[0].text}; showStory(steps); return; }
    showStory(storyChoices(board,i)); return;
  }
  // 3) an obvious single anywhere?
  const s=findStep(board);
  if(s){ showStory(storySimple(s)); return; }
  // 4) no obvious move — walk the advanced derivation chain.
  const chain=chainAt(board,null);
  if(chain){ showStory(storyChain(chain)); return; }
  // 5) ultimate fallback (legacy saves beyond the engine).
  showStory(storyChoicesNarrowest(board));
}

/* ---------------- save / resume ---------------- */

// One save slot holds the current in-progress puzzle so closing the tab and
// reopening drops the child right back where they were.
function saveGame(){
  if(solvedFlag) return;
  try{ localStorage.setItem('sudoku-save', JSON.stringify(
    { styleKey, levelIdx, symbols, puzzle, solution, board })); }catch(e){}
}
function loadSave(){ try{ return JSON.parse(localStorage.getItem('sudoku-save')||'null'); }catch(e){ return null; } }
function clearSave(){ localStorage.removeItem('sudoku-save'); }

function validSave(sv,key,idx){
  return sv && sv.styleKey===key && sv.levelIdx===idx &&
    LEVELS[key] && LEVELS[key][idx] &&
    Array.isArray(sv.board) && Array.isArray(sv.puzzle) &&
    Array.isArray(sv.solution) && Array.isArray(sv.symbols) &&
    sv.board.length===LEVELS[key][idx].n*LEVELS[key][idx].n;
}

/* ---------------- flow ---------------- */

function makeFresh(){
  symbols = isClassic
    ? [...Array(L.n).keys()].map(i=>String(i+1))
    : shuffle(THEMES[Math.floor(Math.random()*THEMES.length)].slice()).slice(0,L.n);
  const p=makePuzzle(L);
  puzzle=p.puzzle; solution=p.solution; board=puzzle.slice();
}

// Start a level: resume the saved puzzle if it's this exact level (and not
// forced fresh), otherwise generate a new one. Does NOT touch the URL — the
// router owns that.
function enterLevel(key, idx, forceFresh){
  if(!LEVELS[key] || idx<0 || idx>=LEVELS[key].length){ showMenu(); return; }
  styleKey=key; levelIdx=idx; L=LEVELS[key][idx]; isClassic=(key==='classic');
  const sv=forceFresh?null:loadSave();
  const resuming=validSave(sv,key,idx);
  if(resuming){
    symbols=sv.symbols.slice(); puzzle=sv.puzzle.slice();
    solution=sv.solution.slice(); board=sv.board.slice();
  } else {
    makeFresh();
  }
  selectedVal=0; selectedCell=-1; eraserOn=false; solvedFlag=false; streak=0;
  clearHintFx();
  $('level-label').textContent=L.name+' '+L.emoji;
  $('mascot').innerHTML=mascotSvg('happy');
  renderBoard(); renderTray();
  saveGame();
  $('menu').classList.add('hidden');
  $('win').classList.remove('show');
  $('game').classList.remove('hidden');
  // Only ask when the saved game has real progress worth keeping or discarding
  // (a level just opened but untouched has nothing meaningful to resume).
  const hasProgress = resuming && sv.board.some((v,i)=> sv.puzzle[i]===0 && v!==0);
  $('resume').classList.toggle('show', !!hasProgress);
}

// Discard the saved progress and lay out a brand-new puzzle for this level.
function restartCurrent(){
  clearSave();
  makeFresh();
  selectedVal=0; selectedCell=-1; eraserOn=false; solvedFlag=false; streak=0;
  clearHintFx();
  renderBoard(); renderTray();
  saveGame();
}

function playAgain(){ clearSave(); enterLevel(styleKey, levelIdx, true); }

/* ---------------- URL routing (deep-linkable game settings) ---------------- */

function parseHash(){
  const m=/^#?(animal|classic)-(\d+)$/.exec(location.hash);
  return m ? { key:m[1], idx:+m[2] } : null;
}
function applyRoute(){
  const r=parseHash();
  if(r && LEVELS[r.key] && r.idx>=0 && r.idx<LEVELS[r.key].length) enterLevel(r.key, r.idx, false);
  else showMenu();
}
// Navigate by changing the hash (so Back/Forward and shared links work).
// Setting the same hash won't fire hashchange, so route directly in that case.
function goLevel(key, idx){
  const target='#'+key+'-'+idx;
  if(location.hash===target) applyRoute(); else location.hash=target;
}
function goMenu(){
  if(location.hash==='' || location.hash==='#') showMenu(); else location.hash='';
}

const CONF_COLORS=['#ffd34d','#ff9d5c','#ff8fb2','#54c452','#4aa3ff','#a394ff','#7df5b9'];
function confettiPiece(k){
  const w=7+Math.random()*9, round=Math.random()<0.5;
  const p=document.createElement('span');
  p.style.width=w+'px';
  p.style.height=(round?w:w*(0.4+Math.random()*0.55))+'px';
  p.style.background=CONF_COLORS[k%CONF_COLORS.length];
  p.style.borderRadius=round?'50%':'2px';
  return p;
}
// gentle rain of confetti from the top
function confettiBurst(){
  for(let k=0;k<70;k++){
    const s=confettiPiece(k);
    s.className='confetti';
    s.style.left=Math.random()*100+'vw';
    s.style.animationDuration=(2.2+Math.random()*2.5)+'s';
    s.style.animationDelay=(Math.random()*0.8)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),6000);
  }
}
// party-popper burst arcing up from a bottom corner
function confettiCannon(side){
  const dir = side==='left' ? 1 : -1;
  const originX = side==='left' ? '3vw' : '97vw';
  for(let k=0;k<30;k++){
    const outer=document.createElement('span');
    outer.className='cann-x';
    outer.style.left=originX;
    outer.style.setProperty('--tx',(dir*(12+Math.random()*62))+'vw');
    const inner=document.createElement('span');
    inner.className='cann-y';
    inner.style.setProperty('--rise', -(34+Math.random()*42)+'vh');
    const p=confettiPiece(k);
    p.className='cann-p';
    p.style.animationDuration=(0.35+Math.random()*0.4)+'s';
    inner.appendChild(p); outer.appendChild(inner);
    document.body.appendChild(outer);
    setTimeout(()=>outer.remove(),2600);
  }
}

function onWin(){
  solvedFlag=true;
  clearSave();                    // finished — nothing to resume
  const earned=addStar();
  sfx('win'); buzz([80,60,80,60,160]);
  mascotReact('party');
  $('win-mascot').innerHTML=mascotSvg('party');
  confettiBurst();
  confettiCannon('left'); confettiCannon('right');
  setTimeout(()=>{ if($('win').classList.contains('show')){ confettiCannon('left'); confettiCannon('right'); } }, 850);
  $('win-big').innerHTML=ICONS.trophy;
  $('win-msg').textContent=WIN_MSGS[Math.floor(Math.random()*WIN_MSGS.length)];
  const ws=$('win-stars');
  ws.innerHTML='';
  for(let k=0;k<earned;k++){
    const s=document.createElement('span');
    s.innerHTML=ICONS.star;
    const t=0.9+k*0.28;
    s.style.animationDelay=t+'s';
    ws.appendChild(s);
    // each star lands with its own sparkle + an ascending "ding"
    setTimeout(()=>{
      if(!$('win').classList.contains('show')) return;
      if(soundOn){ try{ tone(784*Math.pow(1.122,k),0,.3,'triangle',.18); tone(1176*Math.pow(1.122,k),.04,.22,'triangle',.1); }catch(e){} }
      sparkleBurst(s); buzz(20);
    }, t*1000);
  }
  $('win-sub').textContent=earned>=5?'All 5 stars! You are a champion!':(L.name+' stars: '+earned+' of 5');
  // beating Champion unlocks Legend — offered here and now on the menu
  const beatChampion = styleKey==='classic' && levelIdx===3;
  if(beatChampion) unlockLegend();
  $('secret-btn').style.display = beatChampion ? '' : 'none';
  setTimeout(()=>$('win').classList.add('show'),700);
}

function showMenu(){
  clearHintFx();
  $('resume').classList.remove('show');
  renderMenu();
  $('game').classList.add('hidden');
  $('win').classList.remove('show');
  $('menu').classList.remove('hidden');
}

function setStyle(key){
  styleKey=key;
  localStorage.setItem('sudoku-style',key);
  sfx('tap');
  renderMenu();
}

/* ---------------- wire up ---------------- */

document.querySelectorAll('.level-btn').forEach(b=>{
  b.addEventListener('click',()=>{ sfx('tap'); goLevel(styleKey, +b.dataset.level); });
});
$('style-animal').addEventListener('click',()=>setStyle('animal'));
$('style-classic').addEventListener('click',()=>setStyle('classic'));
$('back-btn').addEventListener('click',()=>{ sfx('tap'); goMenu(); });
$('menu-btn').addEventListener('click',()=>{ sfx('tap'); goMenu(); });
$('hint-btn').addEventListener('click',onHint);
$('hint-next').addEventListener('click',hintNext);
$('hint-x').addEventListener('click',()=>{ sfx('tap'); clearHintFx(); });
$('again-btn').addEventListener('click',()=>{ sfx('tap'); playAgain(); });
$('secret-btn').addEventListener('click',()=>{ sfx('tap'); goLevel('classic',4); });

/* settings panel */
function renderSwitches(){
  $('sw-sound').classList.toggle('on', soundOn);
  $('sw-vibe').classList.toggle('on', vibeOn);
}
$('resume-yes').addEventListener('click',()=>{ sfx('tap'); $('resume').classList.remove('show'); });
$('resume-new').addEventListener('click',()=>{ sfx('tap'); $('resume').classList.remove('show'); restartCurrent(); });
$('settings-btn').addEventListener('click',()=>{ sfx('tap'); renderSwitches(); $('settings').classList.add('show'); });
$('settings-close').addEventListener('click',()=>{ sfx('tap'); $('settings').classList.remove('show'); });
$('settings').addEventListener('click',e=>{ if(e.target===$('settings')) $('settings').classList.remove('show'); });
$('sw-sound').addEventListener('click',()=>{
  soundOn=!soundOn; localStorage.setItem('sudoku-sound',soundOn?'on':'off');
  renderSwitches(); if(soundOn) sfx('tap');
});
$('sw-vibe').addEventListener('click',()=>{
  vibeOn=!vibeOn; localStorage.setItem('sudoku-vibe',vibeOn?'on':'off');
  renderSwitches(); if(vibeOn) buzz(20);
});
// The Vibration API doesn't exist on iOS Safari (iPhone/iPad) — hide the
// toggle where it can't do anything rather than pretend it works.
if(typeof navigator.vibrate!=='function') $('row-vibe').style.display='none';

/* icon chrome (SVG, no raw emoji) */
$('settings-btn').innerHTML=ICONS.gear;
$('arcade-btn').innerHTML=ICONS.home+' All games';
$('arcade-btn').addEventListener('click',()=>{ sfx('tap'); location.href='../../'; });
$('back-btn').innerHTML=ICONS.home;
$('hint-btn').innerHTML=ICONS.bulb;
$('menu-btn').innerHTML=ICONS.home+' Menu';
$('again-btn').innerHTML=ICONS.again+' Play again';
$('style-animal').innerHTML=ICONS.smile+' Emoji';
$('style-classic').innerHTML=ICONS.grid+' Numbers';
$('secret-btn').innerHTML=ICONS.crown+' Secret: Legend';
$('resume-yes').innerHTML=ICONS.play+' Resume';
$('resume-new').innerHTML=ICONS.again+' New game';
$('pstar').innerHTML=ICONS.star;
$('mascot').innerHTML=mascotSvg('happy');

window.addEventListener('resize',()=>{
  if($('game').classList.contains('hidden')) return;
  renderBoard();
  if(hintActive()) renderHintStep();   // keep the walkthrough alive across rotation
});
window.addEventListener('hashchange', applyRoute);
// block pinch zoom on iOS (double-tap zoom is disabled via touch-action:manipulation)
document.addEventListener('gesturestart',e=>e.preventDefault());

renderMenu();
// Boot: honor a deep-link, else resume a saved game, else show the menu.
(function boot(){
  if(!parseHash()){
    const sv=loadSave();
    if(sv && LEVELS[sv.styleKey] && sv.levelIdx>=0 && sv.levelIdx<LEVELS[sv.styleKey].length){
      styleKey=sv.styleKey;
      location.hash='#'+sv.styleKey+'-'+sv.levelIdx;   // fires hashchange -> resume
      return;
    }
  }
  applyRoute();
})();
</script>
