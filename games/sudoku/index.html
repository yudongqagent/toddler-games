/* Board + tray geometry for the current viewport.

   Two arrangements. Stacked (topbar / board / tray down the page) is the
   natural one and wins on any upright screen. Side-by-side (board left,
   controls right) wins when the screen is wider than it is tall: the stack
   then has to fit the board into ~60% of a short height, which shrinks it to
   a postage stamp and pushes the tray off the bottom edge. We simply build
   both and keep whichever gives the child a bigger board. */
// The four safe-area insets, in pixels, read off the probe's resolved padding.
function safeInsets(){
  const s=getComputedStyle($('safe-probe'));
  return { t:parseFloat(s.paddingTop)||0,  r:parseFloat(s.paddingRight)||0,
           b:parseFloat(s.paddingBottom)||0, l:parseFloat(s.paddingLeft)||0 };
}
function layoutSizes(){
  const n=L.n;
  const vw=Math.min(window.innerWidth, document.documentElement.clientWidth||1e9);
  const vh=window.innerHeight;
  const gap = n===9?2:3;                 // thin line between cells
  const bgap = n===9?6:8;                // thick line between boxes
  const sx=n/L.boxW-1, sy=n/L.boxH-1;    // box separators per axis
  const cellFor=max=>Math.max(12, Math.floor(Math.min(
    (max-16-sx*bgap-(n+sx-1)*gap)/n,
    (max-16-sy*bgap-(n+sy-1)*gap)/n)));
  const boardWFor=c=>c*n+sx*bgap+(n+sx-1)*gap+16;
  const tgap=Math.min(vw*0.02, 12);
  const nBtn=n+1;                        // +1 for the eraser
  // What the outer shell has already claimed: the safe-area insets and the
  // header row. Measure the header rather than recompute it — its height moves
  // with the safe area and shrinks in landscape.
  const ins=safeInsets();
  const barH=document.querySelector('.appbar').getBoundingClientRect().height;
  const sideW = vw - Math.max(8, ins.l) - Math.max(8, ins.r);
  const sideH = vh - Math.max(8, ins.t) - Math.max(8, ins.b) - 6;

  // Stacked: the board gets whatever is left once the header, the tray, the
  // progress bar and the gaps have taken theirs. This used to be a fraction of
  // the viewport height, tuned before any of that chrome existed — on a small
  // phone with a notch it handed the board more than there was and pushed the
  // tray off the bottom. Everything else is known here, so just subtract it.
  const stackRows = n>6 && vw<560 ? 2 : 1;
  const stackCols = Math.ceil(nBtn/stackRows);
  const stackW = vw - Math.max(12, ins.l) - Math.max(12, ins.r);   // .screen padding
  const stackTs = Math.min(Math.floor((stackW-16-tgap*(stackCols-1))/stackCols), 84);
  const trayH = stackRows*stackTs + (stackRows-1)*tgap + 16;   // +16 = tray padding
  const g1 = Math.min(18, vh*0.025), g2 = Math.min(14, vh*0.02);
  const stackAvail = vh - barH - Math.max(10, ins.b)
                   - trayH - 16 - (g1 + g2);                   // 16 = progress bar
  const stackCell=cellFor(Math.min(stackW, stackAvail, 620));
  // side-by-side: board takes the height, the panel takes a slice of the width
  const sideCell=cellFor(Math.min(sideH, sideW-PANEL_MIN, 620));
  const side = vw>vh && sideCell>stackCell;

  let cell, cols, ts;
  if(side){
    cell=sideCell;
    // Room left for the panel once the board has its column, and the height
    // left once the topbar and progress bar have theirs. The gutter is the
    // page padding, the column gap and the tray's own padding — miss any of
    // it and the grid overflows, shoving the board off the left edge.
    const colGap=Math.min(26,Math.max(10,vw*0.022));
    const restW=sideW-boardWFor(cell)-(32+colGap);
    const restH=vh-barH-Math.max(8,ins.t)-Math.max(8,ins.b)-PANEL_CHROME;
    // Pick the keypad shape. Big buttons matter most (small fingers), but a
    // shape is also better for spanning the panel instead of hugging one edge,
    // worse for a ragged last row, and worse for standing taller than it is
    // wide — a 2x5 strip beside the board reads as a leftover column, not a
    // keypad. Once buttons hit the 84px cap those are all that's left to
    // choose on; on a cramped panel the size term takes over again.
    let bestScore=-1; ts=0; cols=1;
    for(let k=1;k<=nBtn;k++){
      const rows=Math.ceil(nBtn/k);
      const s=Math.floor(Math.min((restW-(k-1)*tgap)/k, (restH-(rows-1)*tgap)/rows, 84));
      const fill=Math.min(1,(k*s+(k-1)*tgap)/restW);
      const score=s+26*fill-5*(k*rows-nBtn)-12*Math.max(0,rows-k);
      if(score>bestScore){ bestScore=score; ts=s; cols=k; }
    }
    ts=Math.max(ts,30);
  } else {
    cell=stackCell;
    cols=Math.ceil(nBtn/stackRows);
    ts=Math.min(Math.floor((stackW-16-tgap*(cols-1))/cols), 84);
  }
  document.documentElement.classList.toggle('land', side);
  document.documentElement.style.setProperty('--tray-size', ts+'px');
  document.documentElement.style.setProperty('--tray-gap', tgap+'px');
  document.documentElement.style.setProperty('--tray-cols', cols);
  return {cell, gap, bgap, sx};
}
const PANEL_MIN=200;      // narrowest the side panel may squeeze the board to
const PANEL_CHROME=40;    // progress bar + the gap above it (the topbar moved
                          // into the shared header, so the panel no longer pays)

function symColor(v){ return isClassic ? DIGIT_COLORS[(v-1)%DIGIT_COLORS.length] : ''; }
// symbol as rich text for the hint bubble: colored bold digit, or the emoji piece
function symTag(v){ return isClassic ? '<b style="color:'+symColor(v)+'">'+symbols[v-1]+'</b>' : symbols[v-1]; }
function boxOf(i){ const n=L.n,r=Math.floor(i/n),c=i%n; return Math.floor(r/L.boxH)*100+Math.floor(c/L.boxW); }

function renderBoard(){
  const n=L.n, {cell,gap,bgap,sx}=layoutSizes();
  // spacer tracks between boxes render as thick lines of the board color
  const colTracks=[], rowTracks=[];
  for(let c=0;c<n;c++){ if(c>0&&c%L.boxW===0) colTracks.push(bgap+'px'); colTracks.push(cell+'px'); }
  for(let r=0;r<n;r++){ if(r>0&&r%L.boxH===0) rowTracks.push(bgap+'px'); rowTracks.push(cell+'px'); }
  boardEl.style.gridTemplateColumns=colTracks.join(' ');
  boardEl.style.gridTemplateRows=rowTracks.join(' ');
  boardEl.style.gap=gap+'px';
  boardEl.innerHTML='';
  for(let i=0;i<n*n;i++){
    const r=Math.floor(i/n), c=i%n;
    const d=document.createElement('div');
    const altBox=(Math.floor(r/L.boxH)+Math.floor(c/L.boxW))%2===1;
    d.className='cell'+(altBox?' alt':'')+(board[i]===0?' hole':'')+(i===selectedCell?' sel':'');
    d.style.gridColumn=c+Math.floor(c/L.boxW)+1;
    d.style.gridRow=r+Math.floor(r/L.boxH)+1;
    d.style.width=d.style.height=cell+'px';
    d.style.fontSize=Math.floor(cell*0.62)+'px';
    const s=document.createElement('span');
    s.className='sym';
    if(board[i]){ s.textContent=symbols[board[i]-1]; s.style.color=symColor(board[i]); }
    d.appendChild(s);
    d.addEventListener('click',()=>onCellTap(i,d));
    boardEl.appendChild(d);
  }
  const boardW=cell*n+sx*bgap+(n+sx-1)*gap+16;
  $('pwrap').style.width=boardW+'px';
  // Landscape: the header floats over the panel column, not the board, so the
  // board keeps the full height it is sized for. The panel's own left edge is
  // whatever the progress bar starts at, once the grid has centred everything.
  document.documentElement.style.setProperty('--panel-x',
    document.documentElement.classList.contains('land')
      ? Math.round($('pwrap').getBoundingClientRect().left)+'px' : '0px');
  updateHighlights();
  updateConflicts();
  updateProgress();
}

function renderTray(){
  trayEl.innerHTML='';
  for(let v=1;v<=L.n;v++){
    const b=document.createElement('button');
    b.className='tray-btn';
    const t=document.createElement('span');
    t.textContent=symbols[v-1];
    t.style.color=symColor(v);
    b.appendChild(t);
    const cnt=document.createElement('span');
    cnt.className='cnt';
    b.appendChild(cnt);
    b.dataset.val=v;
    b.addEventListener('click',e=>{ e.preventDefault(); onTrayTap(v); });
    trayEl.appendChild(b);
  }
  const er=document.createElement('button');
  er.className='tray-btn eraser';
  er.innerHTML=ICONS.eraser;
  er.setAttribute('aria-label','Eraser');
  er.addEventListener('click',e=>{ e.preventDefault(); onEraserTap(); });
  trayEl.appendChild(er);
  updateTray();
}

function updateTray(){
  const counts=new Array(L.n+1).fill(0);
  board.forEach(v=>{ if(v) counts[v]++; });
  trayEl.querySelectorAll('.tray-btn').forEach(b=>{
    if(b.classList.contains('eraser')){ b.classList.toggle('selected',eraserOn); return; }
    const v=+b.dataset.val;
    const done=counts[v]>=L.n;
    b.classList.toggle('done',done);
    b.classList.toggle('selected',v===selectedVal && !done);
    b.querySelector('.cnt').textContent=Math.max(0,L.n-counts[v]);
    if(done && selectedVal===v) selectedVal=0;
  });
  updateHighlights();
}

/* Single source of truth for every persistent cell highlight — driven only
   by state (selectedCell / selectedVal / eraserOn / board). Called after any
   state change so highlights can never get out of sync:
     sel      the chosen empty cell (slot-first mode)
     rc       that cell's row / column / box (teaches the rule)
     match    cells already holding the chosen tray symbol (stamp mode)
     erasable player-placed cells the eraser can rub out (eraser mode) */
function updateHighlights(){
  const n=L.n;
  const selR=selectedCell>=0?Math.floor(selectedCell/n):-1;
  const selC=selectedCell>=0?selectedCell%n:-1;
  const selB=selectedCell>=0?boxOf(selectedCell):-1;
  for(let i=0;i<n*n;i++){
    const el=boardEl.children[i];
    if(!el) continue;
    const r=Math.floor(i/n), c=i%n;
    const isSel = i===selectedCell;
    el.classList.toggle('sel', isSel);
    el.classList.toggle('rc', !isSel && selectedCell>=0 && !hintActive() &&
      (r===selR || c===selC || boxOf(i)===selB));
    el.classList.toggle('match', selectedVal>0 && board[i]===selectedVal);
    el.classList.toggle('erasable', eraserOn && puzzle[i]===0 && board[i]!==0);
  }
}

// Progress tracks only the blanks the player must fill (not the given clues),
// counting correct placements — so the bar starts empty and reaches 100%
// exactly when the puzzle is solved.
function updateProgress(){
  let need=0, done=0;
  for(let i=0;i<board.length;i++){
    if(puzzle[i]===0){ need++; if(board[i]===solution[i]) done++; }
  }
  const pct = need ? Math.round(100*done/need) : 100;
  $('pfill').style.width=pct+'%';
}

// 'sel' is applied by updateHighlights, so this just moves the state + refreshes.
function selectCell(i){ selectedCell=i; updateHighlights(); }

/* ---------------- juicy feedback ---------------- */

let mascotTimer=null;
function mascotReact(state,ms){
  const m=$('mascot');
  m.innerHTML=mascotSvg(state);
  m.classList.remove('bounce'); void m.offsetWidth; m.classList.add('bounce');
  clearTimeout(mascotTimer);
  if(ms) mascotTimer=setTimeout(()=>{ m.innerHTML=mascotSvg('happy'); },ms);
}

const SPARK_COLORS=['#ffd34d','#ff9d5c','#a394ff','#54c452','#4aa3ff'];
function sparkleBurst(el){
  const rect=el.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  for(let k=0;k<6;k++){
    const s=document.createElement('span');
    s.className='spark';
    const sz=Math.max(12,rect.width*0.3);
    s.innerHTML='<svg viewBox="0 0 24 24" width="'+sz+'" height="'+sz+'"><path d="'+STAR_PATH+'" fill="'+SPARK_COLORS[k%SPARK_COLORS.length]+'"/></svg>';
    const ang=Math.PI*2*k/6 + Math.random()*.6;
    const dist=rect.width*(0.8+Math.random()*0.6);
    s.style.setProperty('--dx',Math.cos(ang)*dist+'px');
    s.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    s.style.left=cx+'px'; s.style.top=cy+'px';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),800);
  }
}

function praiseAt(el,text){
  const rect=el.getBoundingClientRect();
  const p=document.createElement('span');
  p.className='praise';
  p.textContent=text;
  p.style.left=(rect.left+rect.width/2)+'px';
  p.style.top=(rect.top-6)+'px';
  p.style.fontSize=Math.max(18,Math.min(30,rect.width*0.5))+'px';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),1200);
}

// When a row, column, or box gets completed, its cells do a golden wave.
function celebrateUnits(i){
  const n=L.n, r=Math.floor(i/n), c=i%n;
  const units=[];
  const rowCells=[...Array(n).keys()].map(k=>r*n+k);
  const colCells=[...Array(n).keys()].map(k=>k*n+c);
  const br=Math.floor(r/L.boxH)*L.boxH, bc=Math.floor(c/L.boxW)*L.boxW;
  const boxCells=[];
  for(let rr=br;rr<br+L.boxH;rr++) for(let cc=bc;cc<bc+L.boxW;cc++) boxCells.push(rr*n+cc);
  for(const cells of [rowCells,colCells,boxCells]){
    if(cells.every(p=>board[p]===solution[p])) units.push(cells);
  }
  if(!units.length) return false;
  const seen=new Set();
  let k=0;
  for(const cells of units){
    for(const p of cells){
      if(seen.has(p)) continue;
      seen.add(p);
      const el=boardEl.children[p];
      el.style.animationDelay=(k*40)+'ms';
      el.classList.remove('cellwin'); void el.offsetWidth; el.classList.add('cellwin');
      k++;
    }
  }
  setTimeout(()=>{ seen.forEach(p=>{ const el=boardEl.children[p]; if(el){ el.classList.remove('cellwin'); el.style.animationDelay=''; } }); },k*40+900);
  sfx('unit'); buzz([40,30,40]);
  return true;
}

/* ---------------- conflicts ---------------- */

// All rows, columns, and boxes as {kind, cells[]}.
function unitList(){
  const n=L.n, units=[];
  for(let r=0;r<n;r++) units.push({kind:'row', cells:[...Array(n).keys()].map(c=>r*n+c)});
  for(let c=0;c<n;c++) units.push({kind:'column', cells:[...Array(n).keys()].map(r=>r*n+c)});
  for(let br=0;br<n;br+=L.boxH)
    for(let bc=0;bc<n;bc+=L.boxW){
      const cells=[];
      for(let r=br;r<br+L.boxH;r++) for(let c=bc;c<bc+L.boxW;c++) cells.push(r*n+c);
      units.push({kind:'box', cells});
    }
  return units;
}

// Cells holding a value that appears twice in some row/column/box.
function computeConflicts(){
  const conf=new Set();
  for(const u of unitList()){
    const byVal={};
    for(const p of u.cells){ const v=board[p]; if(v) (byVal[v]=byVal[v]||[]).push(p); }
    for(const v in byVal) if(byVal[v].length>1) byVal[v].forEach(p=>conf.add(p));
  }
  return conf;
}

function updateConflicts(){
  const conf=computeConflicts();
  for(let i=0;i<board.length;i++){
    const el=boardEl.children[i];
    if(el) el.classList.toggle('conflict',conf.has(i));
  }
  return conf;
}

/* ---------------- interaction ---------------- */

// Placing works in both orders: pick a symbol then stamp cells,
// or pick an empty cell then choose its symbol.
// The number always stays on the board; clashes light up red instead
// of the answer being silently rejected.
function tryPlace(i,v){
  clearHintFx();                  // the player is acting — hint served its purpose
  const el=boardEl.children[i];
  board[i]=v;
  const s=el.querySelector('.sym');
  s.textContent=symbols[v-1]; s.style.color=symColor(v);
  el.classList.remove('hole');
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  if(i===selectedCell) selectCell(-1);
  const conf=updateConflicts();
  updateTray();
  updateProgress();
  saveGame();
  if(conf.has(i)){
    streak=0;
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    setTimeout(()=>el.classList.remove('shake'),500);
    sfx('wrong'); buzz([60,40,60]);
    mascotReact('oops',900);
    return false;
  }
  streak++;
  sfx('place'); buzz(20);
  sparkleBurst(el);
  const unitDone=celebrateUnits(i);
  if(unitDone || streak%3===0){
    praiseAt(el,PRAISES[Math.floor(Math.random()*PRAISES.length)]);
    mascotReact('wow',900);
  } else {
    mascotReact('joy',700);
  }
  if(board.every((x,idx)=>x===solution[idx])) onWin();
  return true;
}

// Remove a symbol the player placed (eraser tool, or tapping a red cell).
function eraseCell(i){
  clearHintFx();
  board[i]=0;
  const el=boardEl.children[i];
  el.querySelector('.sym').textContent='';
  el.classList.add('hole');
  el.classList.remove('pop');
  praiseAt(el,'💨');
  sfx('poof'); buzz(15);
  updateConflicts();
  updateTray();
  updateProgress();
  saveGame();
  if(!selectedVal && !eraserOn) selectCell(i);   // ready to drop a new symbol right in
}

// Tap any filled cell: light up all of its twins for a moment —
// the classic "where are the other 3s?" move from big sudoku apps.
let flashTimer=null;
function flashMatches(v){
  clearTimeout(flashTimer);
  boardEl.querySelectorAll('.flashm').forEach(el=>el.classList.remove('flashm'));
  for(let i=0;i<board.length;i++)
    if(board[i]===v) boardEl.children[i].classList.add('flashm');
  flashTimer=setTimeout(()=>boardEl.querySelectorAll('.flashm').forEach(el=>el.classList.remove('flashm')),1400);
}

function onTrayTap(v){
  eraserOn=false;
  const counts=new Array(L.n+1).fill(0);
  board.forEach(x=>{ if(x) counts[x]++; });
  if(counts[v]>=L.n){ updateTray(); return; }
  if(selectedCell>=0){            // slot-first mode: fill the chosen cell
    tryPlace(selectedCell,v);
    return;
  }
  selectedVal = (selectedVal===v) ? 0 : v;
  sfx('tap');
  updateTray();
}

function onEraserTap(){
  eraserOn=!eraserOn;
  selectedVal=0;
  selectCell(-1);
  sfx('tap');
  updateTray();
}

function onCellTap(i,el){
  if(solvedFlag) return;
  const given=puzzle[i]!==0;
  if(eraserOn){
    if(!given && board[i]!==0){ eraseCell(i); }
    else {                        // can't erase clues or empty spots — gentle "no"
      el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
      setTimeout(()=>el.classList.remove('shake'),450);
      sfx('no');
    }
    return;
  }
  if(board[i]!==0){
    // a red clashing symbol pops right out; any other filled cell —
    // clue or player-placed — shows its twins
    if(!given && el.classList.contains('conflict')){ eraseCell(i); return; }
    flashMatches(board[i]);
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    sfx('tap');
    return;
  }
  if(selectedVal){                // stamp mode: place the chosen symbol
    tryPlace(i,selectedVal);
    return;
  }
  // slot-first mode: highlight this cell, next tray tap fills it
  selectCell(i===selectedCell?-1:i);
  sfx('tap');
}

/* ============================================================
   HINTS v3 — guided, user-paced walkthroughs.
   One deductive engine produces every explanation; the UI walks the
   derivation step by step with a consistent visual language:
     blue band     = the row / column / box we are talking about
     green squares = evidence (the placed numbers doing the blocking)
     arrows        = who blocks whom
     crossed digit = "this value cannot go here"
     gold square   = the answer spot (and the tray pulses the value)
   Everything not part of the step dims out. The player taps
   "Next" through the steps — nothing ever auto-advances.
   ============================================================ */

let hintTimers=[];
let hintStory=null, hintStep=0;
let hintPlaced=false;    // the card is sized and positioned once per story
let hintCounter=false;   // ...and shows "3 / 16" when dots won't fit the width
function hintActive(){ return !!hintStory; }

function clearHintFx(){
  hintTimers.forEach(clearTimeout);
  hintTimers=[];
  hintStory=null; hintStep=0; hintPlaced=false; hintCounter=false;
  $('hint-bubble').classList.remove('show');
  $('hint-bubble').style.minHeight='';
  const svg=$('hint-arrows'); if(svg){ svg.style.display='none'; svg.innerHTML=''; }
  boardEl.querySelectorAll('.dim,.band,.ev,.goal,.explain,.hintwrong').forEach(el=>el.classList.remove('dim','band','ev','goal','explain','hintwrong'));
  boardEl.querySelectorAll('.cands').forEach(el=>el.remove());
  trayEl.querySelectorAll('.hintpulse').forEach(el=>el.classList.remove('hintpulse'));
}

/* ---------------- board-reading helpers (pure logic) ---------------- */

// candidates for cell i on an arbitrary grid g
function candList(g,i){
  const n=L.n, r=Math.floor(i/n), c=i%n, out=[];
  for(let v=1;v<=n;v++) if(placeOk(g,r,c,v,L)) out.push(v);
  return out;
}
// a filled peer of i (row/col/box) holding value u — the reason u is blocked at i
function blockerFor(g,i,u){
  for(const [kind,cells] of unitsOf(i))
    for(const p of cells) if(p!==i && g[p]===u) return {cell:p, kind};
  return null;
}
// the three units cell i belongs to, as [kindName, cells[]]
function unitsOf(i){
  const n=L.n, r=Math.floor(i/n), c=i%n;
  const row=[...Array(n).keys()].map(k=>r*n+k);
  const col=[...Array(n).keys()].map(k=>k*n+c);
  const br=Math.floor(r/L.boxH)*L.boxH, bc=Math.floor(c/L.boxW)*L.boxW, box=[];
  for(let rr=br;rr<br+L.boxH;rr++) for(let cc=bc;cc<bc+L.boxW;cc++) box.push(rr*n+cc);
  return [['row',row],['column',col],['little square',box]];
}
// a same-valued neighbour that makes v at i a visible duplicate
function conflictPartner(i,v){
  for(const [kind,cells] of unitsOf(i))
    for(const j of cells) if(j!==i && board[j]===v) return {j, kind, cells};
  return null;
}

// naked single on the live grid, with the blockers as evidence
function findNaked(g, only){
  const list = only!=null ? [only] : [...Array(g.length).keys()];
  for(const i of list){
    if(g[i]!==0) continue;
    const cand=candList(g,i);
    if(cand.length===1){
      const W=cand[0], blockers=[];
      for(let u=1;u<=L.n;u++){ if(u===W) continue; const b=blockerFor(g,i,u); if(b) blockers.push({value:u, cell:b.cell, kind:b.kind}); }
      return {tech:'naked', cell:i, value:W, blockers};
    }
  }
  return null;
}
// hidden single on the live grid, with per-cell blockers as evidence
function findHidden(g, only){
  for(const u of unitList()){
    for(let W=1;W<=L.n;W++){
      if(u.cells.some(p=>g[p]===W)) continue;
      const spots=u.cells.filter(p=>g[p]===0 && placeOk(g,Math.floor(p/L.n),p%L.n,W,L));
      if(spots.length!==1) continue;
      const i=spots[0];
      if(only!=null && i!==only) continue;
      const blocks=[];
      for(const p of u.cells){ if(p===i||g[p]!==0) continue; const b=blockerFor(g,p,W); if(b) blocks.push({cell:p, byCell:b.cell}); }
      return {tech:'hidden', cell:i, value:W, unitKind:u.kind, unitCells:u.cells, blocks};
    }
  }
  return null;
}
// the simplest obvious step (fewest things to point at)
function findStep(g, only){
  const nk=findNaked(g, only), hd=findHidden(g, only);
  if(nk && hd) return (nk.blockers.length <= hd.blocks.length) ? nk : hd;
  return nk || hd;
}

// is cell i a naked or hidden single under candidate grid `cand`?
function singleAt(cand, i, ctx){
  if(bitcount(cand[i])===1) return {tech:'naked single', cell:i, value:bitsOf(cand[i])[0]};
  for(const u of ctx.units){
    if(!u.cells.includes(i)) continue;
    for(const v of bitsOf(cand[i])){
      const b=1<<(v-1);
      let only=true;
      for(const p of u.cells){ if(p!==i && (cand[p]&b)){ only=false; break; } }
      if(only) return {tech:'hidden single', cell:i, value:v, unitKind:u.kind, unitCells:u.cells};
    }
  }
  return null;
}

/* Which candidates a deduction's premise assumes are ALREADY gone — as
   {cell,value} pairs. A technique only works because certain squares can no
   longer take certain numbers; if one of those was ruled out by an earlier
   trick rather than by a number the player can see on the board, that earlier
   trick has to be told too, or the hint asserts something out of thin air
   ("every other empty square here is already ruled out for 7" — says who?). */
const CHAIN_MAX=6;   // keep even a Legend walkthrough finite
function premiseNeeds(d, g){
  const out=[], n=L.n;
  const add=(cell,value)=>{ if(g[cell]===0) out.push({cell,value}); };
  const pat=new Set(d.patternCells||[]);
  switch(d.tech){
    // v fits nowhere else in the home unit
    case 'pointing':
      for(const p of d.boxCells) if(!pat.has(p)) add(p, d.value);
      break;
    case 'claiming':
      for(const p of d.lineCells) if(!pat.has(p)) add(p, d.value);
      break;
    // each pattern cell holds ONLY the pair's/triple's values
    case 'naked pair': case 'naked triple':
      for(const p of d.patternCells)
        for(let v=1;v<=n;v++) if(!d.values.includes(v)) add(p, v);
      break;
    // the pair's/triple's values appear nowhere else in the unit
    case 'hidden pair': case 'hidden triple':
      for(const p of d.unitCells) if(!pat.has(p)) for(const v of d.values) add(p, v);
      break;
    // in each base line, v sits only in the pattern spots
    case 'X-Wing': case 'Swordfish': {
      const rowMode=d.unitKind==='row';
      for(const i of d.baseIdx)
        for(const p of (rowMode?rowCellsOf(i):colCellsOf(i))) if(!pat.has(p)) add(p, d.value);
      break;
    }
    // the wings are down to exactly two choices (and the XYZ hinge to three)
    case 'XY-Wing': case 'XYZ-Wing':
      for(const p of d.patternCells){
        const m=d.candBefore[p];
        for(let v=1;v<=n;v++) if(!(m&(1<<(v-1)))) add(p, v);
      }
      break;
    // the twins are bivalue, and the link unit really has only two homes for z
    case 'W-Wing': {
      for(const p of d.patternCells){
        const m=d.candBefore[p];
        for(let v=1;v<=n;v++) if(!(m&(1<<(v-1)))) add(p, v);
      }
      const ends=new Set(d.linkCells);
      for(const c of d.unitCells) if(!ends.has(c)) add(c, d.linkValue);
      break;
    }
    // every link in the chain is a unit with only two homes left for the digit
    case 'Colouring':
      for(const lu of d.linkUnits){
        const ends=new Set(lu.spots);
        for(const c of lu.cells) if(!ends.has(c)) add(c, d.value);
      }
      break;
  }
  return out;
}

// The derivation of the next placement (wantCell=null) or of a specific
// square, as { place, enablers[], cand } — enablers are the advanced
// eliminations (from the solver trace) that unlock the placement, closed
// transitively so every crossed-out number in the story has a reason on
// screen: either a number the player can see, or an earlier beat.
function chainAt(g, wantCell){
  const r=solve(g,L);
  const fp=r.trace.findIndex(d=>d.kind==='place');
  const preElims=(fp<0?r.trace:r.trace.slice(0,fp)).filter(d=>d.kind==='elim');
  const cand = fp>=0 ? r.trace[fp].candBefore : (r.trace.length ? r.state.cand : computeCands(g,r.ctx));
  const build=place=>{
    if(place.tech==='naked single' && !place.unitCells){
      // give naked singles their units too (for banding)
      place.unitCells=null;
    }
    const enablers=[], have=new Set();
    const push=d=>{ if(!have.has(d)){ have.add(d); enablers.push(d); } };
    for(const d of preElims){
      const rel = place.tech==='naked single'
        ? d.elims.some(e=>e.cell===place.cell)
        : d.elims.some(e=>e.value===place.value && place.unitCells.includes(e.cell));
      if(rel) push(d);
    }
    // Pull in whatever justifies each enabler's premise (and then theirs, ...).
    // A premise candidate blocked by a visible number needs no beat — the hint
    // draws an arrow to it. Anything else must come from an earlier elimination.
    for(let i=0;i<enablers.length && enablers.length<CHAIN_MAX;i++){
      for(const need of premiseNeeds(enablers[i], g)){
        if(blockerFor(g, need.cell, need.value)) continue;
        const src=preElims.find(e=>e.elims.some(x=>x.cell===need.cell && x.value===need.value));
        if(src) push(src);
      }
    }
    enablers.sort((a,b)=>preElims.indexOf(a)-preElims.indexOf(b));
    return { place, enablers, cand };
  };
  if(wantCell!=null){
    const place=singleAt(cand, wantCell, r.ctx);
    return place ? build(place) : null;
  }
  if(fp<0) return null;
  // Once the eliminations are in, several squares are usually crackable — and
  // now that a chain carries its own justifications it can get long. Walk the
  // one with the shortest honest derivation, so the child taps Next as few
  // times as possible for the same amount of truth.
  let best=null;
  for(let i=0;i<g.length;i++){
    if(g[i]!==0) continue;
    const p=singleAt(cand, i, r.ctx);
    if(!p) continue;
    const c=build(p);
    if(!best || c.enablers.length<best.enablers.length) best=c;
    if(best.enablers.length<=1) break;
  }
  return best || build(r.trace[fp]);
}

/* ---------------- words ---------------- */

function PIECE(){ return isClassic?'number':'friend'; }
function aSym(v){ return (isClassic && v===8 ? 'an ' : 'a ')+symTag(v); }
function listSyms(vals){ return vals.map(symTag).join(', '); }
function joinAnd(parts){
  parts=parts.filter(Boolean);
  if(parts.length<=1) return parts[0]||'';
  return parts.slice(0,-1).join(', ')+' and '+parts[parts.length-1];
}
function joinOr(parts){
  parts=parts.filter(Boolean);
  if(parts.length<=1) return parts[0]||'';
  return parts.slice(0,-1).join(', ')+' or '+parts[parts.length-1];
}
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function uname(kind){ return kind==='little square' ? 'box' : (kind||'row'); }
// "its row already has 1 and 4, and its box has 3"
function takenAround(blockers){
  const by={row:[], column:[], 'little square':[]};
  blockers.forEach(b=> by[b.kind].push(b.value));
  const parts=[];
  if(by.row.length) parts.push('its row already has '+listSyms(by.row));
  if(by.column.length) parts.push('its column has '+listSyms(by.column));
  if(by['little square'].length) parts.push('its box has '+listSyms(by['little square']));
  return joinAnd(parts);
}

/* ---------------- step visuals ---------------- */

// crossed-out / focused mini-digits inside a cell
function markHtml(items){
  const spans=items.map(it=>{
    const cls=it.cross?'crossed':(it.focus?'focus':'');
    return '<span'+(cls?' class="'+cls+'"':'')+'>'+it.v+'</span>';
  }).join('');
  return '<div class="cands'+(items.length>2?' multi':'')+'">'+spans+'</div>';
}
function setMarks(cell, items){
  const el=boardEl.children[cell]; if(!el) return;
  const old=el.querySelector('.cands'); if(old) old.remove();
  el.insertAdjacentHTML('beforeend', markHtml(items));
}
function groupElims(elims){
  const by={};
  for(const e of elims) (by[e.cell]=by[e.cell]||[]).push(e.value);
  return Object.keys(by).map(c=>({cell:+c, values:by[c]}));
}

function drawArrows(pairs){
  const svg=$('hint-arrows'); if(!svg) return;
  let out='<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4f8b"/></marker></defs>';
  for(const [a,b] of pairs){
    const ea=boardEl.children[a], eb=boardEl.children[b];
    if(!ea||!eb) continue;
    const ra=ea.getBoundingClientRect(), rb=eb.getBoundingClientRect();
    const ax=ra.left+ra.width/2, ay=ra.top+ra.height/2;
    const bx=rb.left+rb.width/2, by=rb.top+rb.height/2;
    const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy)||1;
    const off=ra.width*0.45;
    out+='<line x1="'+(ax+dx/len*off)+'" y1="'+(ay+dy/len*off)+'" x2="'+(bx-dx/len*off)+'" y2="'+(by-dy/len*off)+
      '" stroke="#ff4f8b" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" opacity=".9"/>';
  }
  svg.innerHTML=out; svg.style.display='block';
}

/* A step: { text, band[], ev[], wrongRing[], cross[{cell,values}],
   focus[{cell,values}], arrows[[from,to]], target, goal, pulse, dim }
   goal = the destination square of the whole chain, shown as a faint gold
   ring on every intermediate beat so the through-line is always visible. */
function applyStepVisuals(st){
  boardEl.querySelectorAll('.dim,.band,.ev,.goal,.hintwrong').forEach(el=>el.classList.remove('dim','band','ev','goal','hintwrong'));
  boardEl.querySelectorAll('.cands').forEach(el=>el.remove());
  const svg=$('hint-arrows'); if(svg){ svg.style.display='none'; svg.innerHTML=''; }
  const touched=new Set([...(st.band||[]), ...(st.ev||[]), ...(st.wrongRing||[])]);
  if(st.target!=null) touched.add(st.target);
  if(st.goal!=null) touched.add(st.goal);
  (st.cross||[]).forEach(m=>touched.add(m.cell));
  (st.focus||[]).forEach(m=>touched.add(m.cell));
  (st.arrows||[]).forEach(pr=>{ touched.add(pr[0]); touched.add(pr[1]); });
  if(st.dim!==false && touched.size)
    for(let i=0;i<board.length;i++) if(!touched.has(i)) boardEl.children[i].classList.add('dim');
  (st.band||[]).forEach(c=>{ const el=boardEl.children[c]; if(el) el.classList.add('band'); });
  (st.ev||[]).forEach(c=>{ const el=boardEl.children[c]; if(el) el.classList.add('ev'); });
  if(st.goal!=null){ const el=boardEl.children[st.goal]; if(el) el.classList.add('goal'); }
  (st.wrongRing||[]).forEach(c=>{ const el=boardEl.children[c]; if(el) el.classList.add('hintwrong'); });
  const items={};
  (st.focus||[]).forEach(m=>{ (items[m.cell]=items[m.cell]||[]).push(...m.values.map(v=>({v,focus:true}))); });
  (st.cross||[]).forEach(m=>{ (items[m.cell]=items[m.cell]||[]).push(...m.values.map(v=>({v,cross:true}))); });
  for(const c in items) setMarks(+c, items[c]);
  if(st.arrows && st.arrows.length) drawArrows(st.arrows);
  if(st.target!=null) selectCell(st.target);
  else if(selectedCell>=0) selectCell(-1);
  if(st.pulse!=null) pulseTrayBtn(st.pulse);
}

function collectStepCells(st){
  const s=new Set([...(st.band||[]), ...(st.ev||[]), ...(st.wrongRing||[])]);
  if(st.target!=null) s.add(st.target);
  if(st.goal!=null) s.add(st.goal);
  (st.cross||[]).forEach(m=>s.add(m.cell));
  (st.focus||[]).forEach(m=>s.add(m.cell));
  (st.arrows||[]).forEach(pr=>{ s.add(pr[0]); s.add(pr[1]); });
  return [...s];
}
/* Size and place the card ONCE for the whole walkthrough.

   Stepping through a hint used to move the card: each beat was measured and
   re-positioned on its own, so a longer sentence grew the box and a beat that
   touched the top rows flipped it to the other side of the board. The reader
   had to find the text and the Next button again every tap.

   So: measure every beat up front, hold the box at the tallest one, and pick a
   single side that clears every beat's squares. Nothing moves after that — the
   text swaps inside a box that stays put. */
function layoutHintCard(){
  const b=$('hint-bubble'), textEl=$('hint-text'), total=hintStory.length;
  const wasShown=b.classList.contains('show');
  const keep=textEl.innerHTML;
  b.style.minHeight='0px';
  b.style.visibility='hidden';
  b.classList.add('show');
  // dots and buttons are part of the height, so put them in before measuring
  const dotsEl=$('hint-dots');
  dotsEl.classList.remove('count');
  dotsEl.innerHTML = total>1 ? hintStory.map(()=>'<span class="hdot"></span>').join('') : '';
  $('hint-back').style.display = total>1 ? '' : 'none';
  // A long derivation has more beats than the card is wide. Ask the layout
  // rather than guessing a cutoff. scrollWidth is no use here — a centred flex
  // row spills both ways and reports none of it — so measure the dots' own
  // footprint against the track. offsetWidth/clientWidth are both untransformed,
  // so this stays right even mid scale-in.
  hintCounter=false;
  const dot=dotsEl.firstElementChild;
  if(total>1 && dot){
    const gap=parseFloat(getComputedStyle(dotsEl).gap)||6;
    const need=total*dot.offsetWidth + (total-1)*gap;
    hintCounter = need > dotsEl.clientWidth+1;
  }
  if(hintCounter) dotsEl.classList.add('count');
  let h=0;
  for(const st of hintStory){ textEl.innerHTML=st.text; h=Math.max(h, b.offsetHeight); }
  textEl.innerHTML=keep;
  b.style.minHeight=h+'px';
  b.style.visibility='';
  if(!wasShown) b.classList.remove('show');

  // The card may only use the space between the header and the bottom inset —
  // it used to clamp at 8px from the top, which put it over the back and
  // settings buttons and under the status bar.
  const ins=safeInsets();
  const lo=$('appbar-mid').getBoundingClientRect().bottom + 8;
  const hi=window.innerHeight - Math.max(8, ins.b);
  const br=boardEl.getBoundingClientRect();

  // Landscape: the board owns the full height, so there is no room above or
  // below it. Float the card over the panel beside the board instead — the
  // board, which is what every step points at, stays fully visible.
  if(document.documentElement.classList.contains('land')){
    // centre it in the strip beside the board, then pull it back inside the
    // screen — the close button hangs 10px past the card's own corner.
    const w=b.offsetWidth;
    const right=window.innerWidth-Math.max(14, ins.r), left=Math.max(14, ins.l);
    const cx=Math.min((br.right+right)/2, right-w/2);
    b.style.left=Math.max(left+w/2, cx)+'px';
    b.style.top=Math.min(Math.max(lo, (window.innerHeight-h)/2), Math.max(lo, hi-h))+'px';
    b.classList.remove('below');
    hintPlaced=true;
    return;
  }
  // Portrait: sit under the board, against the bottom of the safe area. The
  // board is what every beat points at, so it stays clear; the tray underneath
  // is only wanted once the walkthrough is dismissed. Always the same place,
  // so nothing about the card moves between stories either.
  b.style.left=(ins.l + (window.innerWidth-ins.l-ins.r)/2)+'px';   // centre of the SAFE box
  b.style.top=Math.max(lo, Math.min(br.bottom+14, hi-h-8))+'px';
  b.classList.toggle('below', parseFloat(b.style.top) >= br.bottom);
  hintPlaced=true;
}
function renderHintStep(){
  if(!hintPlaced) layoutHintCard();
  const st=hintStory[hintStep];
  applyStepVisuals(st);
  $('hint-text').innerHTML=st.text;
  const total=hintStory.length;
  $('hint-dots').innerHTML = total<2 ? ''
    : hintCounter ? (hintStep+1)+' / '+total
    : hintStory.map((_,k)=>'<span class="hdot'+(k===hintStep?' on':'')+'"></span>').join('');
  $('hint-next').textContent = hintStep<total-1 ? 'Next ▸' : 'Got it! ✓';
  $('hint-back').disabled = hintStep===0;
  $('hint-bubble').classList.add('show');
}
function showStory(steps){
  hintStory=steps.filter(Boolean);
  if(!hintStory.length){ hintStory=null; return; }
  hintStep=0; hintPlaced=false;
  renderHintStep();
}
function hintNext(){
  if(!hintStory){ clearHintFx(); return; }
  sfx('tap');
  if(hintStep<hintStory.length-1){ hintStep++; renderHintStep(); }
  else clearHintFx();
}
function hintBack(){
  if(!hintStory || hintStep===0) return;
  sfx('tap');
  hintStep--; renderHintStep();
}

function pulseTrayBtn(v){
  const b=trayEl.querySelector('.tray-btn[data-val="'+v+'"]');
  if(!b) return;
  b.classList.add('hintpulse');
  hintTimers.push(setTimeout(()=>b.classList.remove('hintpulse'),3300));
}

/* ---------------- story builders ---------------- */

// One step for a single found on grid gd. opts: {spot, ending, ring}
// ring=true is the "a wrong number sits on this square" flavour: orange ring,
// no gold target, ending tells the player to swap it.
function singleStepFor(fs, gd, opts){
  opts=opts||{};
  const v=fs.value;
  const spot=opts.spot||'the golden square';
  const ending=opts.ending!==undefined?opts.ending:' Tap '+symTag(v)+'! ✨';
  let st;
  if(fs.tech==='hidden'){
    const un=uname(fs.unitKind);
    const empties=fs.unitCells.filter(p=>gd[p]===0 && p!==fs.cell);
    st={ text:'Only '+spot+' can take '+aSym(v)+' in this '+un+' — the crossed squares already see one (follow the arrows).'+ending,
      band:fs.unitCells,
      cross:empties.map(p=>({cell:p, values:[v]})),
      ev:fs.blocks.map(b=>b.byCell),
      arrows:fs.blocks.map(b=>[b.byCell, b.cell]) };
  } else {
    st={ text:'Only '+symTag(v)+' fits '+spot+' — everything else is already around it: '+takenAround(fs.blockers)+'.'+ending,
      ev:fs.blockers.map(b=>b.cell),
      arrows:fs.blockers.map(b=>[b.cell, fs.cell]) };
  }
  if(opts.ring) st.wrongRing=[fs.cell];
  else { st.target=fs.cell; st.pulse=v; st.focus=[{cell:fs.cell, values:[v]}]; }
  return st;
}
function storySimple(fs){ return [singleStepFor(fs, board)]; }

// bare symbol (no colour tag) for the compact "what's left" strip
function symPlain(v){ return symbols[v-1]; }
// emphasise a word inside the (purple) hint bubble
function emph(s){ return '<b style="color:#e6512e">'+s+'</b>'; }
// a row of digit chips: crossed-by-us (red), blocked-around (grey), survivor (gold)
function leftStrip(keep, chainVals, goneVals){
  const cs=new Set(chainVals), gs=new Set(goneVals);
  let chips='';
  for(let u=1;u<=L.n;u++){
    const cls = u===keep ? 'keep' : cs.has(u) ? 'chain' : gs.has(u) ? 'gone' : 'gone';
    chips+='<span class="ls '+cls+'">'+symPlain(u)+'</span>';
  }
  return '<div class="leftstrip">'+chips+'</div>';
}
const rowCellsOf=r=>[...Array(L.n).keys()].map(c=>r*L.n+c);
const colCellsOf=c=>[...Array(L.n).keys()].map(r=>r*L.n+c);

/* Every advanced elimination becomes ONE OR MORE beats. Mild tricks
   (pointing / claiming) stay a single beat; pairs get two; the wings get a
   walked case-split so no single sentence has to carry the whole deduction. */
function elimBeats(d){
  switch(d.tech){
    case 'XY-Wing':  return xyWingBeats(d);
    case 'XYZ-Wing': return xyzWingBeats(d);
    case 'W-Wing':   return wWingBeats(d);
    case 'Colouring': return colourBeats(d);
    case 'X-Wing': case 'Swordfish': return fishBeats(d);
    case 'naked pair': case 'naked triple':  return pairBeats(d, false);
    case 'hidden pair': case 'hidden triple': return pairBeats(d, true);
    default:         return pointClaimBeats(d);
  }
}

const NUMWORD=['','one','two','three','four','five','six','seven','eight','nine'];
function countWord(k){ return NUMWORD[k]||String(k); }

/* pointing / claiming — two beats, because it is a two-part deduction and
   cramming it into one made the picture lie: the old step banded the *swept*
   unit only, so the unit the sentence called "this box" was never drawn and
   its other empty squares stayed dim and unexplained ("why not there?").

   Both techniques are the same shape with the roles swapped:
     pointing — the digit is trapped inside a BOX,  so a LINE gets swept
     claiming — the digit is trapped inside a LINE, so a BOX gets swept
   Beat 1 shows the home unit and proves the digit is trapped there (every
   other empty square of it gets a crossed digit, with an arrow to the filled
   peer that rules it out). Beat 2 shows the swept unit and hands out the
   eliminations. No unit is ever drawn without the reason it is drawn. */
function pointClaimBeats(d){
  const v=d.value, gd=board, pointing=d.tech!=='claiming';
  const homeCells=pointing?d.boxCells:d.lineCells;      // where v is trapped
  const homeName =pointing?'box':uname(d.unitKind);
  const swept    =pointing?d.lineCells:d.boxCells;      // where v gets crossed out
  const sweptName=pointing?uname(d.unitKind):'box';
  const focus=d.patternCells.map(c=>({cell:c, values:[v]}));
  const spots=countWord(d.patternCells.length);

  // Beat 1 — the digit has nowhere else to go inside its home unit.
  const pat=new Set(d.patternCells);
  const ev=[], arrows=[], cross=[]; let phys=0, chained=0;
  for(const q of homeCells){
    if(gd[q]!==0 || pat.has(q)) continue;
    const b=blockerFor(gd,q,v);
    if(b){ ev.push(b.cell); arrows.push([b.cell,q]); phys++; } else chained++;
    cross.push({cell:q, values:[v]});
  }
  const why = !cross.length ? ''
    : chained&&phys ? ' — the rest already see '+aSym(v)+' (arrows) or we crossed '+symTag(v)+' out of them just before'
    : chained ? ' — we crossed '+symTag(v)+' out of the others just before'
    : ' — every other empty square here already sees '+aSym(v)+' (arrows)';
  const beat1={ text:'In this '+homeName+', '+aSym(v)+' can only go in the '+spots+' bright squares'+why+'.',
    band:homeCells, focus, cross, ev, arrows };

  // Beat 2 — they all share one line (or one box), so that unit is spoken for.
  const all=d.patternCells.length===2 ? 'Both' : 'All '+spots;
  const beat2={ text:all+' bright squares sit in the same '+sweptName+'! So this '+sweptName+'’s '+
      symTag(v)+' has to be one of them — every other square in it can’t be '+symTag(v)+' (crossed out).',
    band:swept, focus, cross:groupElims(d.elims) };
  return [beat1, beat2];
}

// naked / hidden pair (or triple) — split into premise + conclusion
function pairBeats(d, hidden){
  const vsAnd=joinAnd(d.values.map(symTag));
  const vsOr=joinOr(d.values.map(symTag));
  const un=uname(d.unitKind);
  const focus=d.patternCells.map(c=>({cell:c, values:d.values}));
  const cross=groupElims(d.elims);
  const those=d.values.length>2?'those three':'those two';
  if(hidden){
    return [
      { text:'In this '+un+', '+vsAnd+' can only go in the bright squares — nowhere else fits them.',
        band:d.unitCells, focus },
      { text:'So '+those+' squares must each be '+vsOr+' — every other number is crossed off them.',
        band:d.unitCells, focus, cross }
    ];
  }
  return [
    { text:'Each bright square can only be '+vsOr+' — no other number fits either one.',
      band:d.unitCells, focus },
    { text:'Between them they use up '+vsAnd+', so nothing else in this '+un+' can be '+vsOr+' (crossed out).',
      band:d.unitCells, focus, cross }
  ];
}

// Fish (X-Wing / Swordfish) — show the frame, then the either/or, then the
// sweep. Two base lines make a rectangle you can draw diagonals across; three
// make a shape with no nice name, so that beat leans on the counting instead.
function fishBeats(d){
  const v=d.value, pc=d.patternCells, k=d.baseIdx.length;
  const rowMode=d.unitKind==='row';
  const baseName=rowMode?'rows':'columns', crossName=rowMode?'columns':'rows';
  const baseCells=d.baseIdx.flatMap(i=>rowMode?rowCellsOf(i):colCellsOf(i));
  const crossCells=d.crossIdx.flatMap(i=>rowMode?colCellsOf(i):rowCellsOf(i));
  const baseNums=joinAnd(d.baseIdx.map(i=>String(i+1)));
  const crossNums=joinAnd(d.crossIdx.map(i=>String(i+1)));
  const focus=pc.map(c=>({cell:c, values:[v]}));
  const diag=k===2 ? [[pc[0],pc[3]],[pc[1],pc[2]]] : [];
  const cross=groupElims(d.elims);
  const open = k===2
    ? 'A rectangle trick! In '+baseName+' '+baseNums+', '+symTag(v)+' fits in only two spots each — and they line up into these four corners.'
    : 'The big one! Look at '+baseName+' '+baseNums+' — every spot left for '+symTag(v)+
      ' in them sits in just '+countWord(k)+' '+crossName+': '+crossNums+'.';
  const mid = k===2
    ? symTag(v)+' has to take one pair of opposite corners or the other. '+emph('Either way')+', it lands once in each of '+crossName+' '+crossNums+'.'
    : 'Those '+countWord(k)+' '+baseName+' each need a '+symTag(v)+', and only those '+
      countWord(k)+' '+crossName+' can give them one. '+emph('However they land')+
      ', they fill all '+countWord(k)+' '+crossName+'.';
  return [
    { text:open, band:baseCells, focus, arrows:diag },
    { text:mid, focus, arrows:diag },
    { text:'So '+crossName+' '+crossNums+' have used up their '+symTag(v)+' here — cross '+symTag(v)+' out of every other square in them.',
      band:crossCells, focus, cross }
  ];
}

// XY-Wing — meet the cast, walk each case, then conclude
function xyWingBeats(d){
  const [piv,w1,w2]=d.patternCells, Z=d.value;
  const pm=d.candBefore[piv], m1=d.candBefore[w1], m2=d.candBefore[w2];
  const s1=bitsOf(m1&pm)[0], s2=bitsOf(m2&pm)[0];   // value each wing shares with the hinge
  const cross=groupElims(d.elims);
  return [
    { text:'Three special squares, each with just two choices. Watch the '+emph('hinge')+' — where the arrows begin: it is '+symTag(s1)+' or '+symTag(s2)+'.',
      focus:[{cell:piv,values:bitsOf(pm)},{cell:w1,values:bitsOf(m1)},{cell:w2,values:bitsOf(m2)}],
      arrows:[[piv,w1],[piv,w2]] },
    { text:'Say the hinge is '+symTag(s1)+'. Then its partner here can\'t be '+symTag(s1)+' too — so that partner must be '+symTag(Z)+'.',
      focus:[{cell:piv,values:[s1]},{cell:w1,values:[Z]}], arrows:[[piv,w1]] },
    { text:'But if the hinge is '+symTag(s2)+' instead, then this other partner must be '+symTag(Z)+'.',
      focus:[{cell:piv,values:[s2]},{cell:w2,values:[Z]}], arrows:[[piv,w2]] },
    { text:emph('Either way')+', one partner ends up '+symTag(Z)+'! So any square that sees '+emph('both')+' partners can never be '+symTag(Z)+' (crossed out).',
      focus:[{cell:w1,values:[Z]},{cell:w2,values:[Z]}], cross,
      arrows:cross.flatMap(m=>[[w1,m.cell],[w2,m.cell]]) }
  ];
}

// XYZ-Wing — the XY-Wing with the hinge itself in the running, so there are
// three cases to walk instead of two, and the crossed squares must see all
// three cells rather than just the two partners.
function xyzWingBeats(d){
  const [piv,w1,w2]=d.patternCells, Z=d.value, zb=1<<(Z-1);
  const pm=d.candBefore[piv], m1=d.candBefore[w1], m2=d.candBefore[w2];
  const x=bitsOf(m1&~zb)[0], y=bitsOf(m2&~zb)[0];   // each wing's other value
  const cross=groupElims(d.elims);
  return [
    { text:'Three squares again — but this time the '+emph('hinge')+', where the arrows begin, has '+emph('three')+' choices: '+symTag(x)+', '+symTag(y)+' or '+symTag(Z)+'.',
      focus:[{cell:piv,values:bitsOf(pm)},{cell:w1,values:bitsOf(m1)},{cell:w2,values:bitsOf(m2)}],
      arrows:[[piv,w1],[piv,w2]] },
    { text:'Say the hinge is '+symTag(x)+'. Then this partner can\'t be '+symTag(x)+' too — so it must be '+symTag(Z)+'.',
      focus:[{cell:piv,values:[x]},{cell:w1,values:[Z]}], arrows:[[piv,w1]] },
    { text:'Say it\'s '+symTag(y)+' instead. Then the other partner must be '+symTag(Z)+'.',
      focus:[{cell:piv,values:[y]},{cell:w2,values:[Z]}], arrows:[[piv,w2]] },
    { text:'And if the hinge is '+symTag(Z)+' — there it is already! '+emph('Every way')+', one of these three is '+symTag(Z)+'. So a square seeing '+emph('all three')+' can never be '+symTag(Z)+' (crossed out).',
      focus:[{cell:piv,values:[Z]},{cell:w1,values:[Z]},{cell:w2,values:[Z]}], cross,
      arrows:cross.flatMap(m=>[[piv,m.cell],[w1,m.cell],[w2,m.cell]]) }
  ];
}

// W-Wing — the twins, the strong link that connects them, then the sweep.
function wWingBeats(d){
  const [p,q]=d.patternCells, [c1,c2]=d.linkCells, X=d.value, Z=d.linkValue;
  const cross=groupElims(d.elims);
  return [
    { text:'Twin squares: both are '+symTag(X)+' or '+symTag(Z)+', and they can\'t see each other.',
      focus:[{cell:p,values:bitsOf(d.candBefore[p])},{cell:q,values:bitsOf(d.candBefore[q])}] },
    { text:'This '+uname(d.unitKind)+' has only two homes left for '+symTag(Z)+' (green), and one of them sees each twin.',
      band:d.unitCells, ev:d.linkCells,
      focus:[{cell:c1,values:[Z]},{cell:c2,values:[Z]}],
      arrows:[[c1,p],[c2,q]] },
    { text:'Whichever green square takes the '+symTag(Z)+', the twin it sees can\'t be '+symTag(Z)+' — so that twin is '+symTag(X)+'. '+
      emph('Either way')+' a twin is '+symTag(X)+', and anything seeing '+emph('both')+' twins can\'t be (crossed out).',
      focus:[{cell:p,values:[X]},{cell:q,values:[X]}], cross,
      arrows:cross.flatMap(m=>[[p,m.cell],[q,m.cell]]) }
  ];
}

// Simple colouring — build the chain, then trap or wrap. Green and blue are
// the two colours; one of them is entirely right, we just don't know which.
function colourBeats(d){
  const v=d.value, A=d.colourA, B=d.colourB;
  const focus=d.patternCells.map(c=>({cell:c, values:[v]}));
  const cross=groupElims(d.elims);
  const chain={ text:'Chain on '+symTag(v)+': each link is a unit with only two homes left for it, so the two ends flip — one is '+symTag(v)+', the other isn\'t. Follow that all the way and the chain falls into two colours.',
    ev:A, band:B, focus,
    arrows:d.linkUnits.map(lu=>[lu.spots[0],lu.spots[1]]) };
  if(d.rule==='trap'){
    const dead=d.deadColour==='A'?A:B, deadName=d.deadColour==='A'?'green':'blue';
    return [ chain,
      { text:'One whole colour is '+symTag(v)+' and the other isn\'t. But these two '+deadName+' squares see each other — they can\'t both be '+symTag(v)+'.',
        ev:A, band:B, focus, wrongRing:d.clash },
      { text:'So '+deadName+' is the wrong colour entirely — every '+deadName+' square loses its '+symTag(v)+' (crossed out).',
        cross, focus:d.patternCells.filter(c=>dead.indexOf(c)<0).map(c=>({cell:c,values:[v]})) }
    ];
  }
  return [ chain,
    { text:'One colour is right and one is wrong — either way, '+emph('one of the two')+' holds the '+symTag(v)+' for this chain.',
      ev:A, band:B, focus },
    { text:'So any square seeing '+emph('both')+' colours can never be '+symTag(v)+' (crossed out).',
      ev:A, band:B, focus, cross }
  ];
}

// Final placement step of a chain. For a naked single the census is shown as a
// compact "what's left" strip (red = we crossed it out, grey = already around
// it, gold = the survivor) instead of one long run-on sentence.
function chainFinalStep(chain, gd, opts){
  gd=gd||board; opts=opts||{};
  const p=chain.place, v=p.value;
  const spot=opts.spot||'the golden square';
  const ending=opts.ending!==undefined?opts.ending:' Tap '+symTag(v)+'! ✨';
  let st;
  if(p.tech==='hidden single'){
    const un=uname(p.unitKind);
    const empties=p.unitCells.filter(q=>gd[q]===0 && q!==p.cell);
    const ev=[], arrows=[], cross=[]; let phys=0, chained=0;
    for(const q of empties){
      const b=blockerFor(gd,q,v);
      if(b){ ev.push(b.cell); arrows.push([b.cell,q]); phys++; }
      else chained++;
      cross.push({cell:q, values:[v]});
    }
    const clause = chained&&phys ? 'we just crossed it out of some spots, and the rest already see '+aSym(v)+' (arrows)'
      : chained ? 'we just crossed it out of every other spot'
      : 'every other spot already sees '+aSym(v)+' (arrows)';
    st={ text:'So now only '+spot+' can take '+symTag(v)+' in this '+un+' — '+clause+'.'+ending,
      band:p.unitCells, ev, arrows, cross };
  } else {
    const elimVals=[...new Set(chain.enablers.flatMap(d=>d.elims.filter(e=>e.cell===p.cell).map(e=>e.value)))];
    const goneVals=[], blockCells=[];
    for(let u=1;u<=L.n;u++){ if(u===v||elimVals.includes(u)) continue; const b=blockerFor(gd,p.cell,u); if(b){ goneVals.push(u); blockCells.push(b.cell); } }
    const lead = elimVals.length
      ? 'Every other number is spoken for — the ones we crossed out ('+emph('red')+') and the ones already around it (grey).'
      : 'Every other number is already taken around it.';
    st={ text:'Look at '+spot+' now. '+lead+' Only '+symTag(v)+' is left!'+leftStrip(v, elimVals, goneVals)+ending,
      ev:blockCells, arrows:blockCells.map(c=>[c,p.cell]) };
    // the strip already lists the crossed-out values, so keep the answer square
    // clean — just the surviving number, no cramped in-cell strikethroughs
  }
  if(opts.ring) st.wrongRing=[p.cell];
  else { st.target=p.cell; st.pulse=v; st.focus=[{cell:p.cell, values:[v]}]; }
  return st;
}

// Flatten enabler beats + the final placement. Every non-placement beat carries
// a faint gold "goal" ring on the destination square, so the player always sees
// where the whole chain is heading (the through-line).
function storyChain(chain, gd, finalOpts){
  const steps=[...chain.enablers.flatMap(elimBeats), chainFinalStep(chain, gd, finalOpts)];
  const wantGoal=!(finalOpts&&finalOpts.ring);
  if(wantGoal) for(const s of steps){ if(s.target==null && s.goal==null) s.goal=chain.place.cell; }
  return steps;
}

// why a placed number is wrong
function storyWrong(i){
  const v=board[i], sym=symTag(v);
  const partner=conflictPartner(i,v);
  if(partner){
    const un=uname(partner.kind);
    return [{ text:'This '+un+' already has '+aSym(v)+' (green) — two '+sym+'s can\'t share a '+un+'! Tap the wiggly '+sym+' to pop it out.',
      band:partner.cells, ev:[partner.j], wrongRing:[i], arrows:[[partner.j,i]] }];
  }
  // clean all wrong guesses, then prove the square's true value
  const g=board.slice();
  for(let k=0;k<g.length;k++) if(puzzle[k]===0 && g[k]!==0 && g[k]!==solution[k]) g[k]=0;
  const wrongOpts=real=>({ ring:true, spot:'this square',
    ending:' So the '+sym+' can\'t stay — tap it to take it out, then place '+symTag(real)+'.' });
  const simple=findStep(g,i);
  if(simple) return [ singleStepFor(simple, g, wrongOpts(simple.value)) ];
  const chain=chainAt(g,i);
  if(chain){
    const steps=storyChain(chain, g, wrongOpts(chain.place.value));
    steps.forEach(st=>{ if(!(st.wrongRing||[]).includes(i)) st.wrongRing=[...(st.wrongRing||[]), i]; });
    return steps;
  }
  return [{ text:'This '+sym+' doesn\'t belong here. Rub it out with the eraser, then ask me again! 🧽',
    wrongRing:[i], dim:false }];
}

// last-resort explanation for a square that even the engine can't force
// (legacy saves): honest choices + the answer, in one step
function storyChoices(g,i){
  const cands=candList(g,i), W=solution[i];
  const blockers=[];
  for(let u=1;u<=L.n;u++){ if(cands.includes(u)) continue; const b=blockerFor(g,i,u); if(b) blockers.push({value:u, cell:b.cell, kind:b.kind}); }
  const reason=takenAround(blockers);
  return [{ text:'A real puzzler! This square can be '+joinOr(cands.map(symTag))+
      (reason?' — '+reason:'')+'. Secret: here it\'s '+symTag(W)+'. Tap '+symTag(W)+'! ✨',
    ev:blockers.map(b=>b.cell), arrows:blockers.map(b=>[b.cell,i]),
    target:i, pulse:W, focus:[{cell:i, values:[W]}] }];
}
function storyChoicesNarrowest(g){
  let best=-1, bestLen=99;
  for(let i=0;i<g.length;i++){ if(g[i]!==0) continue; const l=candList(g,i).length; if(l<bestLen){ best=i; bestLen=l; if(l<=1) break; } }
  return best>=0 ? storyChoices(g,best) : [];
}

/* ---------------- the hint button ---------------- */

function onHint(){
  if(solvedFlag) return;
  clearHintFx();
  sfx('hint');
  mascotReact('think',1600);
  // 1) a wrong number on the board? explain why it can't stay.
  const wrong = board.findIndex((v,i)=> puzzle[i]===0 && v!==0 && v!==solution[i]);
  if(wrong>=0){ showStory(storyWrong(wrong)); return; }
  // 2) a selected empty square? explain THAT one if logic can.
  if(selectedCell>=0 && board[selectedCell]===0){
    const i=selectedCell;
    const s=findStep(board,i);
    if(s){ showStory(storySimple(s)); return; }
    const chain=chainAt(board,i);
    if(chain){ showStory(storyChain(chain)); return; }
    // not provable there — steer to a square we CAN crack, without a filler step
    const pre='That square isn\'t certain yet — here\'s one we can crack! 🔍 ';
    const any=findStep(board);
    if(any){ const steps=storySimple(any); steps[0]={...steps[0], text:pre+steps[0].text}; showStory(steps); return; }
    const chain2=chainAt(board,null);
    if(chain2){ const steps=storyChain(chain2); steps[0]={...steps[0], text:pre+steps[0].text}; showStory(steps); return; }
    showStory(storyChoices(board,i)); return;
  }
  // 3) an obvious single anywhere?
  const s=findStep(board);
  if(s){ showStory(storySimple(s)); return; }
  // 4) no obvious move — walk the advanced derivation chain.
  const chain=chainAt(board,null);
  if(chain){ showStory(storyChain(chain)); return; }
  // 5) ultimate fallback (legacy saves beyond the engine).
  showStory(storyChoicesNarrowest(board));
}

/* ---------------- save / resume ---------------- */

// One save slot holds the current in-progress puzzle so closing the tab and
// reopening drops the child right back where they were.
function saveGame(){
  if(solvedFlag) return;
  try{ localStorage.setItem('sudoku-save', JSON.stringify(
    { styleKey, levelIdx, symbols, puzzle, solution, board })); }catch(e){}
}
function loadSave(){ try{ return JSON.parse(localStorage.getItem('sudoku-save')||'null'); }catch(e){ return null; } }
function clearSave(){ localStorage.removeItem('sudoku-save'); }

function validSave(sv,key,idx){
  return sv && sv.styleKey===key && sv.levelIdx===idx &&
    LEVELS[key] && LEVELS[key][idx] &&
    Array.isArray(sv.board) && Array.isArray(sv.puzzle) &&
    Array.isArray(sv.solution) && Array.isArray(sv.symbols) &&
    sv.board.length===LEVELS[key][idx].n*LEVELS[key][idx].n;
}

/* ---------------- flow ---------------- */

function makeFresh(){
  symbols = isClassic
    ? [...Array(L.n).keys()].map(i=>String(i+1))
    : shuffle(THEMES[Math.floor(Math.random()*THEMES.length)].slice()).slice(0,L.n);
  const p=makePuzzle(L);
  puzzle=p.puzzle; solution=p.solution; board=puzzle.slice();
}

// Start a level: resume the saved puzzle if it's this exact level (and not
// forced fresh), otherwise generate a new one. Does NOT touch the URL — the
// router owns that.
function enterLevel(key, idx, forceFresh){
  if(!LEVELS[key] || idx<0 || idx>=LEVELS[key].length){ showMenu(); return; }
  styleKey=key; levelIdx=idx; L=LEVELS[key][idx]; isClassic=(key==='classic');
  const sv=forceFresh?null:loadSave();
  const resuming=validSave(sv,key,idx);
  if(resuming){
    symbols=sv.symbols.slice(); puzzle=sv.puzzle.slice();
    solution=sv.solution.slice(); board=sv.board.slice();
  } else {
    makeFresh();
  }
  selectedVal=0; selectedCell=-1; eraserOn=false; solvedFlag=false; streak=0;
  clearHintFx();
  $('level-label').textContent=L.name+' '+L.emoji;
  $('mascot').innerHTML=mascotSvg('happy');
  renderBoard(); renderTray();
  // Deliberately no saveGame() here: opening a level must not overwrite the
  // one save slot. Placing or erasing a symbol saves, so merely browsing the
  // menu can't throw away a half-finished puzzle.
  $('menu').classList.add('hidden');
  $('win').classList.remove('show');
  $('game').classList.remove('hidden');
  document.documentElement.classList.add('in-game');   // reveals the header's middle
  // Only ask when the saved game has real progress worth keeping or discarding
  // (a level just opened but untouched has nothing meaningful to resume).
  const hasProgress = resuming && sv.board.some((v,i)=> sv.puzzle[i]===0 && v!==0);
  $('resume').classList.toggle('show', !!hasProgress);
}

// Discard the saved progress and lay out a brand-new puzzle for this level.
function restartCurrent(){
  clearSave();
  makeFresh();
  selectedVal=0; selectedCell=-1; eraserOn=false; solvedFlag=false; streak=0;
  clearHintFx();
  renderBoard(); renderTray();
  saveGame();
}

function playAgain(){ clearSave(); enterLevel(styleKey, levelIdx, true); }

/* ---------------- URL routing (deep-linkable game settings) ---------------- */

function parseHash(){
  const m=/^#?(animal|classic)-(\d+)$/.exec(location.hash);
  return m ? { key:m[1], idx:+m[2] } : null;
}
function applyRoute(){
  const r=parseHash();
  if(r && LEVELS[r.key] && r.idx>=0 && r.idx<LEVELS[r.key].length) enterLevel(r.key, r.idx, false);
  else showMenu();
}
// Navigate by changing the hash (so Back/Forward and shared links work).
// Setting the same hash won't fire hashchange, so route directly in that case.
function goLevel(key, idx){
  const target='#'+key+'-'+idx;
  if(location.hash===target) applyRoute(); else location.hash=target;
}
function goMenu(){
  if(location.hash==='' || location.hash==='#') showMenu(); else location.hash='';
}

const CONF_COLORS=['#ffd34d','#ff9d5c','#ff8fb2','#54c452','#4aa3ff','#a394ff','#7df5b9'];
function confettiPiece(k){
  const w=7+Math.random()*9, round=Math.random()<0.5;
  const p=document.createElement('span');
  p.style.width=w+'px';
  p.style.height=(round?w:w*(0.4+Math.random()*0.55))+'px';
  p.style.background=CONF_COLORS[k%CONF_COLORS.length];
  p.style.borderRadius=round?'50%':'2px';
  return p;
}
// gentle rain of confetti from the top
function confettiBurst(){
  for(let k=0;k<70;k++){
    const s=confettiPiece(k);
    s.className='confetti';
    s.style.left=Math.random()*100+'vw';
    s.style.animationDuration=(2.2+Math.random()*2.5)+'s';
    s.style.animationDelay=(Math.random()*0.8)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),6000);
  }
}
// party-popper burst arcing up from a bottom corner
function confettiCannon(side){
  const dir = side==='left' ? 1 : -1;
  const originX = side==='left' ? '3vw' : '97vw';
  for(let k=0;k<30;k++){
    const outer=document.createElement('span');
    outer.className='cann-x';
    outer.style.left=originX;
    outer.style.setProperty('--tx',(dir*(12+Math.random()*62))+'vw');
    const inner=document.createElement('span');
    inner.className='cann-y';
    inner.style.setProperty('--rise', -(34+Math.random()*42)+'vh');
    const p=confettiPiece(k);
    p.className='cann-p';
    p.style.animationDuration=(0.35+Math.random()*0.4)+'s';
    inner.appendChild(p); outer.appendChild(inner);
    document.body.appendChild(outer);
    setTimeout(()=>outer.remove(),2600);
  }
}

function onWin(){
  solvedFlag=true;
  clearSave();                    // finished — nothing to resume
  const earned=addStar();
  sfx('win'); buzz([80,60,80,60,160]);
  mascotReact('party');
  $('win-mascot').innerHTML=mascotSvg('party');
  confettiBurst();
  confettiCannon('left'); confettiCannon('right');
  setTimeout(()=>{ if($('win').classList.contains('show')){ confettiCannon('left'); confettiCannon('right'); } }, 850);
  $('win-big').innerHTML=ICONS.trophy;
  $('win-msg').textContent=WIN_MSGS[Math.floor(Math.random()*WIN_MSGS.length)];
  const ws=$('win-stars');
  ws.innerHTML='';
  for(let k=0;k<earned;k++){
    const s=document.createElement('span');
    s.innerHTML=ICONS.star;
    const t=0.9+k*0.28;
    s.style.animationDelay=t+'s';
    ws.appendChild(s);
    // each star lands with its own sparkle + an ascending "ding"
    setTimeout(()=>{
      if(!$('win').classList.contains('show')) return;
      if(soundOn){ try{ tone(784*Math.pow(1.122,k),0,.3,'triangle',.18); tone(1176*Math.pow(1.122,k),.04,.22,'triangle',.1); }catch(e){} }
      sparkleBurst(s); buzz(20);
    }, t*1000);
  }
  $('win-sub').textContent=earned>=5?'All 5 stars! You are a champion!':(L.name+' stars: '+earned+' of 5');
  // beating Champion unlocks Legend — offered here and now on the menu
  const beatChampion = styleKey==='classic' && levelIdx===3;
  if(beatChampion) unlockLegend();
  $('secret-btn').style.display = beatChampion ? '' : 'none';
  setTimeout(()=>$('win').classList.add('show'),700);
}

function showMenu(){
  clearHintFx();
  $('resume').classList.remove('show');
  renderMenu();
  $('game').classList.add('hidden');
  $('win').classList.remove('show');
  $('menu').classList.remove('hidden');
  document.documentElement.classList.remove('in-game');
}

function setStyle(key){
  styleKey=key;
  localStorage.setItem('sudoku-style',key);
  sfx('tap');
  renderMenu();
}

/* ---------------- wire up ---------------- */

document.querySelectorAll('.level-btn').forEach(b=>{
  b.addEventListener('click',()=>{ sfx('tap'); goLevel(styleKey, +b.dataset.level); });
});
$('style-animal').addEventListener('click',()=>setStyle('animal'));
$('style-classic').addEventListener('click',()=>setStyle('classic'));
// One back button for the whole app: it steps up a level, so from anywhere
// you reach the game picker — mid-puzzle that's board -> levels -> all games.
$('chrome-back').addEventListener('click',()=>{
  sfx('tap');
  if($('game').classList.contains('hidden')) location.href='../../';
  else goMenu();
});
$('menu-btn').addEventListener('click',()=>{ sfx('tap'); goMenu(); });
$('hint-btn').addEventListener('click',onHint);
$('hint-next').addEventListener('click',hintNext);
$('hint-back').addEventListener('click',hintBack);
$('hint-x').addEventListener('click',()=>{ sfx('tap'); clearHintFx(); });
$('again-btn').addEventListener('click',()=>{ sfx('tap'); playAgain(); });
$('secret-btn').addEventListener('click',()=>{ sfx('tap'); goLevel('classic',4); });

/* settings panel */
function renderSwitches(){
  $('sw-sound').classList.toggle('on', soundOn);
  $('sw-vibe').classList.toggle('on', vibeOn);
}
$('resume-yes').addEventListener('click',()=>{ sfx('tap'); $('resume').classList.remove('show'); });
$('resume-new').addEventListener('click',()=>{ sfx('tap'); $('resume').classList.remove('show'); restartCurrent(); });
$('settings-btn').addEventListener('click',()=>{ sfx('tap'); renderSwitches(); $('settings').classList.add('show'); });
$('settings-close').addEventListener('click',()=>{ sfx('tap'); $('settings').classList.remove('show'); });
$('settings').addEventListener('click',e=>{ if(e.target===$('settings')) $('settings').classList.remove('show'); });
$('sw-sound').addEventListener('click',()=>{
  soundOn=!soundOn; localStorage.setItem('sudoku-sound',soundOn?'on':'off');
  renderSwitches(); if(soundOn) sfx('tap');
});
$('sw-vibe').addEventListener('click',()=>{
  vibeOn=!vibeOn; localStorage.setItem('sudoku-vibe',vibeOn?'on':'off');
  renderSwitches(); if(vibeOn) buzz(20);
});
// The Vibration API doesn't exist on iOS Safari (iPhone/iPad) — hide the
// toggle where it can't do anything rather than pretend it works.
if(typeof navigator.vibrate!=='function') $('row-vibe').style.display='none';

/* icon chrome (SVG, no raw emoji) */
$('settings-btn').innerHTML=ICONS.gear;
$('chrome-back').innerHTML=ICONS.back;
$('hint-btn').innerHTML=ICONS.bulb;
$('menu-btn').innerHTML=ICONS.home+' Menu';
$('again-btn').innerHTML=ICONS.again+' Play again';
$('style-animal').innerHTML=ICONS.smile+' Emoji';
$('style-classic').innerHTML=ICONS.grid+' Numbers';
$('secret-btn').innerHTML=ICONS.crown+' Secret: Legend';
$('resume-yes').innerHTML=ICONS.play+' Resume';
$('resume-new').innerHTML=ICONS.again+' New game';
$('pstar').innerHTML=ICONS.star;
$('mascot').innerHTML=mascotSvg('happy');

window.addEventListener('resize',()=>{
  if($('game').classList.contains('hidden')) return;
  renderBoard();
  // rotation moves the board, so the card has to be re-measured and re-placed
  if(hintActive()){ hintPlaced=false; renderHintStep(); }
});
window.addEventListener('hashchange', applyRoute);
// block pinch zoom on iOS (double-tap zoom is disabled via touch-action:manipulation)
document.addEventListener('gesturestart',e=>e.preventDefault());

renderMenu();
// Boot: honor a deep-link, else show the menu. Opening the game never drops
// you straight back into the last puzzle — picking that level again does, and
// enterLevel asks before keeping the progress.
applyRoute();
</script>
