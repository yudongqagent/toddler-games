<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#7c5cff">
<title>Sudoku Fun</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐶</text></svg>">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  /* ---------- shared outer shell (identical in every game) ----------------
     Safe-area insets go through variables so the whole app reads them from
     one place — and so they can be overridden to rehearse a notch/Dynamic
     Island on a device that doesn't have one. */
  :root {
    --sat:env(safe-area-inset-top, 0px);
    --sar:env(safe-area-inset-right, 0px);
    --sab:env(safe-area-inset-bottom, 0px);
    --sal:env(safe-area-inset-left, 0px);
    --chrome:clamp(44px,10vw,54px);   /* corner button size */
    --cgap:10px;                      /* its margin from the safe edge */
    --appbar-h:calc(var(--sat) + var(--chrome) + var(--cgap) * 2);
  }
  /* The gradient lives on <html>, not <body>: the root background is painted
     over the whole canvas, so it reaches under the home indicator instead of
     stopping at the body box and leaving a white strip when installed. */
  html {
    background:linear-gradient(160deg,#9d87ff 0%,#74c3ff 45%,#7df5b9 100%);
    background-attachment:fixed;
  }
  html, body {
    height:100%;
    overflow:hidden;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
    font-family:-apple-system-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", "Comic Sans MS", sans-serif;
  }
  body {
    background:none;
    display:flex; flex-direction:column; align-items:center;
  }

  /* One header row on every screen of every game: back on the left, settings
     on the right, and whatever that game needs in between. Nothing else may
     live up here, and nothing else may overlap it. */
  .appbar {
    position:fixed; top:0; left:0; right:0; z-index:60;
    height:var(--appbar-h);
    display:flex; align-items:center; gap:10px;
    padding:calc(var(--sat) + var(--cgap)) calc(var(--sar) + var(--cgap))
            var(--cgap) calc(var(--sal) + var(--cgap));
    pointer-events:none;              /* taps fall through the empty middle */
  }
  .appbar > * { pointer-events:auto; }
  .appbar-mid {
    flex:1; min-width:0;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .chrome-btn {
    flex:none;
    width:var(--chrome); height:var(--chrome);
    border:none; cursor:pointer; border-radius:50%;
    background:#ffffffee; color:#7c5cff;
    display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--chrome) * .46); font-weight:800; font-family:inherit;
    box-shadow:0 4px 0 rgba(0,0,0,.15), inset 0 2px 0 rgba(255,255,255,.9);
    transition:transform .1s;
  }
  .chrome-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.15); }
  /* the arcade has no back; keep the slot so the middle stays centred */
  .chrome-btn[hidden] { visibility:hidden; }
  /* A custom property built from env() can't be read back resolved, so park
     the four insets on a probe's padding — computed padding IS in pixels. */
  #safe-probe {
    position:fixed; left:0; top:0; width:0; height:0;
    visibility:hidden; pointer-events:none;
    padding:var(--sat) var(--sar) var(--sab) var(--sal);
  }

  /* soft drifting bubbles behind everything */
  .bub {
    position:fixed; border-radius:50%; z-index:0; pointer-events:none;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.5), rgba(255,255,255,.08) 70%);
    animation:drift ease-in-out infinite alternate;
  }
  @keyframes drift { from{transform:translate(0,0) scale(1)} to{transform:translate(4vw,-6vh) scale(1.12)} }

  .screen {
    position:absolute; inset:0; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:min(2.5vh,18px);
    /* every screen sits below the chrome row, so the corner buttons never
       land on content and the Dynamic Island never lands on either */
    padding:var(--appbar-h) max(12px, var(--sar))
            max(10px, var(--sab)) max(12px, var(--sal));
    transition:opacity .25s, transform .25s;
  }
  .screen.hidden { opacity:0; pointer-events:none; transform:scale(.96); }

  /* ---------- MENU ---------- */
  /* scroll when the menu doesn't fit (short/landscape screens), center when it does */
  #menu { overflow-y:auto; justify-content:flex-start; }
  #menu > * { flex-shrink:0; }
  #menu > :first-child { margin-top:auto; }
  #menu > :last-child { margin-bottom:auto; }
  #menu h1 {
    font-size:clamp(30px, 8vw, 56px);
    color:#fff;
    text-shadow:0 3px 0 rgba(80,60,180,.35);
    text-align:center;
    animation:bob 2.5s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  #menu .subtitle { font-size:clamp(15px,4vw,22px); color:#ffffffdd; margin-top:-6px; }

  .style-toggle {
    display:flex; gap:0;
    background:#ffffff55;
    border-radius:999px;
    padding:5px;
    box-shadow:inset 0 1px 3px rgba(60,40,150,.15);
  }
  .style-btn {
    border:none; cursor:pointer;
    border-radius:999px;
    padding:10px 22px;
    font-family:inherit; font-weight:800;
    font-size:clamp(15px,4vw,20px);
    background:transparent; color:#ffffffcc;
    transition:background .15s, color .15s;
  }
  .style-btn.active { background:#fff; color:#5b3fd4; box-shadow:0 2px 8px rgba(0,0,0,.15); }

  .levels {
    display:grid; grid-template-columns:repeat(2, minmax(140px, 220px));
    gap:min(3vw,18px); width:min(92vw,500px);
  }
  @media (max-width:360px){ .levels{grid-template-columns:1fr;} }
  .level-btn {
    border:none; cursor:pointer;
    border-radius:26px;
    padding:min(2.6vh,20px) 10px;
    font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    box-shadow:0 6px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.55);
    transition:transform .1s;
  }
  .level-btn:active { transform:translateY(4px) scale(.97); box-shadow:0 2px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.55); }
  .level-btn .emoji { font-size:clamp(32px,8vw,50px); filter:drop-shadow(0 3px 3px rgba(0,0,0,.15)); }
  .level-btn .name { font-size:clamp(17px,4.5vw,24px); font-weight:800; color:#4a3800; }
  .level-btn .desc { font-size:clamp(12px,3vw,15px); font-weight:700; color:#4a380099; }
  .level-btn .stars { font-size:clamp(12px,3vw,16px); min-height:1.2em; letter-spacing:1px; }
  .l1{background:linear-gradient(#ffe98a,#ffd34d);} .l2{background:linear-gradient(#a8f0a2,#6fdd66);}
  .l3{background:linear-gradient(#a2d8f0,#66badd);} .l4{background:linear-gradient(#f0b5e6,#e07ad0);}
  /* Legend: a special full-width golden banner, unlocked by beating Champion */
  .legend-btn {
    grid-column:1 / -1;
    background:linear-gradient(120deg,#6a4bd4,#8b5cf6 55%,#b57bff);
    animation:legendglow 2.4s ease-in-out infinite;
  }
  @keyframes legendglow {
    0%,100%{ box-shadow:0 6px 0 rgba(0,0,0,.22), inset 0 2px 0 rgba(255,255,255,.3), 0 0 12px 1px #ffd34d55; }
    50%{ box-shadow:0 6px 0 rgba(0,0,0,.22), inset 0 2px 0 rgba(255,255,255,.3), 0 0 24px 6px #ffd34daa; }
  }
  .legend-btn .name { color:#fff; text-shadow:0 2px 0 rgba(60,40,120,.5); }
  .legend-btn .desc { color:#ffe6a8; }
  .legend-btn .emoji { filter:drop-shadow(0 3px 4px rgba(0,0,0,.4)); }

  /* ---------- GAME ---------- */
  #game { justify-content:center; }
  /* the header's middle is this game's own: hint, mascot, level name */
  html:not(.in-game) .appbar-mid { visibility:hidden; }
  .appbar-mid #hint-btn { flex:none; }
  #mascot {
    font-size:clamp(26px,7vw,38px);
    display:inline-block;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));
  }
  #mascot.bounce { animation:mascotbounce .6s; }
  @keyframes mascotbounce { 0%,100%{transform:scale(1)} 30%{transform:scale(1.35) rotate(-8deg)} 60%{transform:scale(.95) rotate(6deg)} }
  .round-btn {
    border:none; cursor:pointer;
    width:clamp(46px,11vw,58px); height:clamp(46px,11vw,58px);
    border-radius:50%;
    background:#ffffffee;
    font-size:clamp(20px,5vw,26px);
    box-shadow:0 4px 0 rgba(0,0,0,.15), inset 0 2px 0 rgba(255,255,255,.9);
    transition:transform .1s;
    font-family:inherit;
  }
  .round-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.15); }
  .round-btn { display:flex; align-items:center; justify-content:center; }
  svg.ic { width:1em; height:1em; vertical-align:-0.12em; }
  .style-btn svg.ic, .big-btn svg.ic { margin-right:3px; }
  #level-label {
    font-size:clamp(18px,4.5vw,26px); font-weight:800; color:#fff;
    text-shadow:0 2px 0 rgba(80,60,180,.3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #board-area { display:flex; flex-direction:column; align-items:center; gap:min(2vh,14px); }
  /* the board frame doubles as the grid lines: thin gaps between cells,
     wide gaps between boxes — the sudoku box rule made visible */
  #board {
    display:grid;
    background:#b7a8ec;
    border-radius:22px;
    padding:8px;
    box-shadow:0 12px 28px rgba(60,40,150,.28), inset 0 2px 0 rgba(255,255,255,.35);
  }
  .cell {
    display:flex; align-items:center; justify-content:center;
    background:#fff;
    border-radius:18%;
    position:relative;
    cursor:pointer;
    font-weight:800;
    transition:background .15s;
  }
  .cell.alt { background:#f4efff; }
  .cell.hole { background:#e9e3fa; box-shadow:inset 0 3px 7px rgba(96,70,200,.22); }
  .cell.alt.hole { background:#e0d8f7; }
  /* priority chain: rc < match < flashm < erasable < sel < conflict < explain —
     all !important so alt/hole variants can never mask a highlight */
  .cell.rc { background:#fff3c9 !important; }
  .cell.match { background:#d9f6bd !important; box-shadow:inset 0 0 0 2px #9ade6d; }
  .cell.flashm { background:#d9f6bd !important; box-shadow:inset 0 0 0 2px #9ade6d; }
  /* eraser is active: pink-tinted, gently pulsing "you can rub me out" cells */
  .cell.erasable { background:#ffe3f0 !important; animation:erasepulse 1.4s ease-in-out infinite; }
  @keyframes erasepulse { 0%,100%{box-shadow:inset 0 0 0 2px #ff9ec4} 50%{box-shadow:inset 0 0 0 3px #ff5fa2} }
  .cell.sel { background:#ffe063 !important; box-shadow:inset 0 0 0 3px #ffc21d; animation:selpulse 1.2s ease-in-out infinite; z-index:2; }
  @keyframes selpulse { 0%,100%{box-shadow:inset 0 0 0 3px #ffc21d} 50%{box-shadow:inset 0 0 0 5px #ffae00} }
  .cell .sym { line-height:1; pointer-events:none; }
  /* spotlight candidate pencil-marks, shown only during a hint's derivation */
  .cell .cands {
    position:absolute; inset:0; pointer-events:none;
    display:flex; align-items:center; justify-content:center; gap:.06em;
    animation:markpop .25s ease-out;
  }
  @keyframes markpop { from{opacity:0; transform:scale(.6)} to{opacity:1; transform:scale(1)} }
  .cell .cands span { font-size:.55em; font-weight:800; color:#7c5cff; line-height:1; }
  .cell .cands.multi span { font-size:.4em; }
  .cell .cands span.focus { color:#e67e22; }
  .cell .cands span.crossed { color:#ff8a8a; position:relative; }
  .cell .cands span.crossed::after {
    content:''; position:absolute; left:-6%; right:-6%; top:46%; height:2.5px;
    background:#ff5b6b; transform:rotate(-16deg); border-radius:2px;
  }
  .cell.pop .sym { animation:pop .35s; }
  @keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.3)} 100%{transform:scale(1)} }
  .cell.wrong { animation:shake .4s; }
  .cell.wrong .sym { animation:fadeout .5s forwards; }
  .cell.shake { animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
  @keyframes fadeout { to{opacity:0; transform:scale(.3);} }
  .cell.hintglow { animation:glow 1s ease-in-out 2; }
  @keyframes glow { 0%,100%{background:#fff} 50%{background:#fff3ad} }
  .cell.conflict { background:#ffdede !important; box-shadow:inset 0 0 0 3px #ff8080; }
  .cell.conflict .sym { animation:confwob .9s ease-in-out infinite; }
  @keyframes confwob { 0%,100%{transform:rotate(-7deg)} 50%{transform:rotate(7deg)} }
  .cell.explain { background:#fff3ad !important; box-shadow:inset 0 0 0 3px #ffd34d; }
  /* the cell a hint says is misplaced: orange ring + gentle wiggle */
  .cell.hintwrong { box-shadow:inset 0 0 0 3px #ff8a3d !important; }
  .cell.hintwrong .sym { animation:confwob .9s ease-in-out infinite; }
  .cell.cellwin { animation:cellwin .55s both; z-index:1; }
  @keyframes cellwin {
    0%{transform:scale(1)}
    45%{transform:scale(1.28); background:#ffe063; box-shadow:0 0 14px 2px #ffd34dcc;}
    100%{transform:scale(1)}
  }

  #pwrap {
    height:16px; border-radius:999px;
    background:#ffffff66;
    box-shadow:inset 0 2px 4px rgba(60,40,150,.2);
    position:relative;
    overflow:visible;
  }
  #pfill {
    height:100%; border-radius:999px;
    background:linear-gradient(90deg,#ffd34d,#ff9d5c);
    box-shadow:0 1px 3px rgba(0,0,0,.2);
    width:0%;
    transition:width .4s cubic-bezier(.34,1.56,.64,1);
    position:relative;
  }
  #pstar {
    position:absolute; right:-11px; top:50%;
    transform:translateY(-54%);
    font-size:22px;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));
  }

  /* fixed column count from layoutSizes() — the tray never has to guess where
     to wrap, so it always ends up the shape the geometry was solved for */
  #tray {
    display:grid;
    grid-template-columns:repeat(var(--tray-cols, 5), var(--tray-size));
    gap:var(--tray-gap, 10px);
    justify-content:center;
    padding:8px;
  }
  .tray-btn {
    border:none; cursor:pointer;
    width:var(--tray-size); height:var(--tray-size);
    border-radius:26%;
    background:#ffffffee;
    box-shadow:0 5px 0 rgba(0,0,0,.15), inset 0 2px 0 rgba(255,255,255,.9);
    font-size:calc(var(--tray-size) * .58);
    font-weight:800;
    line-height:1;
    transition:transform .12s, box-shadow .12s, background .12s, opacity .2s;
    font-family:inherit;
  }
  .tray-btn:active { transform:scale(.92); }
  .tray-btn { position:relative; }
  .tray-btn.selected {
    background:#ffe063;
    transform:translateY(-6px) scale(1.08);
    box-shadow:0 10px 0 rgba(0,0,0,.15), 0 0 16px 2px #ffd34d88;
  }
  .tray-btn.done { opacity:.3; transform:scale(.85); }
  /* how many of this symbol are still missing */
  .tray-btn .cnt {
    position:absolute; top:-7px; right:-7px;
    min-width:22px; height:22px; padding:0 5px;
    border-radius:999px;
    background:#7c5cff; color:#fff;
    font-size:13px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 4px rgba(0,0,0,.25);
    pointer-events:none;
  }
  .tray-btn.done .cnt { display:none; }
  .tray-btn.eraser.selected { background:#ffd0e6; box-shadow:0 10px 0 rgba(0,0,0,.15), 0 0 16px 2px #ff9ecb88; }
  .tray-btn.hintpulse { animation:traypulse .8s ease-in-out 4; }
  @keyframes traypulse {
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-9px) scale(1.12); box-shadow:0 12px 0 rgba(0,0,0,.15), 0 0 18px 4px #ffd34daa;}
  }

  /* floating praise words + sparkles */
  .praise {
    position:fixed; z-index:45; pointer-events:none;
    font-weight:800; color:#fff;
    text-shadow:0 2px 0 rgba(80,60,180,.45), 0 0 12px rgba(255,255,255,.5);
    animation:rise 1.1s forwards;
    white-space:nowrap;
  }
  @keyframes rise {
    0%{transform:translate(-50%,0) scale(.5); opacity:0}
    20%{opacity:1}
    100%{transform:translate(-50%,-70px) scale(1.2); opacity:0}
  }
  .spark {
    position:fixed; z-index:44; pointer-events:none;
    animation:sparkfly .7s forwards;
  }
  @keyframes sparkfly {
    0%{transform:translate(-50%,-50%) scale(.4); opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1); opacity:0}
  }

  /* hint walkthrough card (user-paced: Next / Got it / close) */
  #hint-bubble {
    position:fixed; left:50%; top:calc(var(--sat) + 74px);
    transform:translateX(-50%) scale(.8);
    z-index:48;
    background:#fff; border-radius:20px;
    padding:14px 18px 12px;
    font-weight:800; color:#5b3fd4;
    font-size:clamp(15px,4.2vw,20px);
    box-shadow:0 10px 28px rgba(60,40,150,.35);
    /* keep the card, and the close button that overhangs its corner, out of
       the side insets */
    width:min(480px, calc(100vw - var(--sal) - var(--sar) - 40px));
    text-align:center;
    opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s;
    /* the card is held at the tallest beat's height, so keep the buttons
       pinned to the bottom edge — they must not drift as the text changes */
    display:flex; flex-direction:column;
  }
  #hint-bubble .hint-foot { margin-top:auto; }
  #hint-bubble.show { opacity:1; pointer-events:auto; transform:translateX(-50%) scale(1); }
  #hint-bubble::after {
    content:''; position:absolute; left:50%; top:100%;
    transform:translateX(-50%);
    border:10px solid transparent; border-top-color:#fff;
  }
  /* when the card sits below the board, the tail points up instead */
  #hint-bubble.below::after {
    top:auto; bottom:100%;
    border-top-color:transparent; border-bottom-color:#fff;
  }
  #hint-x {
    position:absolute; top:-10px; right:-10px;
    width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
    background:#f1eeff; color:#5b3fd4; font-size:16px; font-weight:800;
    box-shadow:0 3px 8px rgba(60,40,150,.3);
    font-family:inherit;
  }
  #hint-x:active { transform:scale(.9); }
  #hint-text { padding:0 4px; }
  .hint-foot {
    display:flex; align-items:center;
    gap:10px; margin-top:10px;
  }
  /* the walkthrough is user-paced in both directions — Back re-reads a beat */
  #hint-back {
    border:none; cursor:pointer; font-family:inherit;
    border-radius:999px; padding:9px 16px;
    font-size:clamp(13px,3.4vw,16px); font-weight:800;
    background:#f1eeff; color:#5b3fd4;
    box-shadow:0 4px 0 rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.7);
    transition:opacity .15s;
  }
  #hint-back:active { transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.12); }
  #hint-back:disabled { opacity:.3; box-shadow:none; cursor:default; transform:none; }
  /* min-width:0 is load-bearing: a flex item defaults to min-content, so a
     long story's dots refuse to shrink and shove the buttons off the card */
  #hint-dots { display:flex; gap:6px; flex:1; min-width:0; justify-content:center; }
  /* too many beats to show as dots — a counter instead. Tabular figures and a
     centred fixed-width box keep it from nudging anything as the number grows. */
  #hint-dots.count {
    display:block; text-align:center; white-space:nowrap;
    font-size:clamp(12px,3.2vw,15px); font-weight:800; color:#9b8fd8;
    font-variant-numeric:tabular-nums;
  }
  /* flex:none or they squash into ovals to fit — and then the overflow test
     below sees them "fitting" and never switches to the counter */
  .hdot { width:9px; height:9px; border-radius:50%; background:#ddd6f8; flex:none; }
  .hdot.on { background:#7c5cff; transform:scale(1.25); }
  #hint-next {
    border:none; cursor:pointer; font-family:inherit;
    border-radius:999px; padding:9px 20px;
    font-size:clamp(14px,3.8vw,17px); font-weight:800;
    background:linear-gradient(#8de78a,#54c452); color:#0d4d0c;
    box-shadow:0 4px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.5);
    margin-left:auto;
    /* wide enough for "Got it! ✓" so the last beat doesn't resize the button */
    min-width:7.2em;
  }
  #hint-next:active { transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.18); }
  /* arrows overlay drawn between cells during a hint step */
  #hint-arrows {
    position:fixed; inset:0; width:100%; height:100%;
    z-index:46; pointer-events:none; display:none;
  }
  /* hint focus states on cells */
  .cell.dim { opacity:.35; filter:saturate(.5); }
  .cell.band { background:#e3f1ff !important; box-shadow:inset 0 0 0 2px #8ec6ff; }
  .cell.ev { background:#d9f6bd !important; box-shadow:inset 0 0 0 2.5px #6cc24a; }
  /* faint gold destination ring: "this is where the whole chain is heading" */
  .cell.goal { box-shadow:inset 0 0 0 2px #ffcf4d; }
  .cell.goal.dim { opacity:.6; }
  /* compact census in the hint bubble: what the golden square still could be */
  .leftstrip { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin:11px 0 2px; }
  .leftstrip .ls {
    width:1.75em; height:1.75em; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:.82em; font-weight:800; position:relative;
  }
  .leftstrip .ls.gone { color:#a79fce; background:#efecfa; }
  .leftstrip .ls.chain { color:#ff5b6b; background:#ffe7ea; }
  .leftstrip .ls.gone::after, .leftstrip .ls.chain::after {
    content:''; position:absolute; left:14%; right:14%; top:50%; height:2.5px;
    background:currentColor; transform:rotate(-13deg); border-radius:2px; opacity:.85;
  }
  .leftstrip .ls.keep {
    color:#0d4d0c; background:linear-gradient(#ffe063,#ffce2c);
    box-shadow:0 0 0 2px #ffc21d; transform:scale(1.12);
  }

  /* ---------- LANDSCAPE: board left, controls right ----------
     Set by layoutSizes() whenever side-by-side buys a bigger board. The board
     gets its own full-height column; the topbar, number keypad and progress
     bar stack beside it. #board-area dissolves (display:contents) so the board
     and the progress bar can land in different grid areas. */
  html.land #game {
    display:grid;
    grid-template-columns:auto auto;
    /* The board spans all three rows and so keeps the full height; the empty
       "top" row is the space the header floats over, on the panel side only. */
    grid-template-rows:var(--appbar-h) 1fr auto;
    grid-template-areas:
      "board top"
      "board tray"
      "board prog";
    align-content:center; justify-content:center;
    column-gap:clamp(10px,2.2vw,26px); row-gap:8px;
    padding:max(8px,var(--sat)) max(8px,var(--sar)) max(8px,var(--sab)) max(8px,var(--sal));
  }
  /* renderBoard() parks the panel's left edge here each layout */
  html.land .appbar { left:var(--panel-x, 0px); }
  html.land #board-area { display:contents; }
  html.land #board { grid-area:board; align-self:center; }
  html.land #tray { grid-area:tray; align-self:center; }
  /* renderBoard() pins the bar to the board's width; beside the board it
     should track the panel instead */
  html.land #pwrap { grid-area:prog; align-self:end; width:auto !important; }
  /* a short landscape screen has no height to spare — shrink the header so
     the board keeps as much of it as possible */
  html.land { --chrome:44px; --cgap:6px; }
  html.land .round-btn { width:44px; height:44px; font-size:20px; }
  html.land #mascot { font-size:clamp(20px,3vw,30px); }
  html.land #level-label { font-size:clamp(15px,2.4vw,22px); }
  /* no room above or below the board — float the card over the panel instead */
  html.land #hint-bubble { width:min(430px, calc(46vw - var(--sar))); max-height:94vh; overflow-y:auto; }
  html.land #hint-bubble::after { display:none; }

  /* ---------- SETTINGS (always-visible button + panel) ---------- */
  .chrome-set svg.ic { animation:spin 9s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }

  .modal {
    position:absolute; inset:0; z-index:55;
    display:flex; align-items:center; justify-content:center;
    background:rgba(60,40,150,.45); backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .modal.show { opacity:1; pointer-events:auto; }
  .settings-card {
    background:#fff; border-radius:28px; padding:24px 26px;
    display:flex; flex-direction:column; gap:16px;
    min-width:min(84vw,320px);
    box-shadow:0 14px 40px rgba(0,0,0,.3);
    animation:winpop .4s;
  }
  .settings-title { font-size:clamp(22px,6vw,28px); font-weight:800; color:#5b3fd4; text-align:center; }
  .set-row { display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .set-label { font-size:clamp(17px,4.5vw,20px); font-weight:800; color:#4a3f7a; }
  .switch {
    width:58px; height:32px; border-radius:999px; border:none; padding:0;
    background:#d7cffa; position:relative; cursor:pointer;
    transition:background .2s;
    box-shadow:inset 0 1px 3px rgba(60,40,150,.25);
    flex:none;
  }
  .switch.on { background:#54c452; }
  .switch .knob {
    position:absolute; top:3px; left:3px;
    width:26px; height:26px; border-radius:50%;
    background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.3);
    transition:left .2s;
  }
  .switch.on .knob { left:29px; }

  /* ---------- WIN OVERLAY ---------- */
  #win {
    position:absolute; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:rgba(60,40,150,.45);
    backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .3s;
  }
  #win.show { opacity:1; pointer-events:auto; }
  /* rotating rays of light behind the card */
  .sunburst {
    position:absolute; left:50%; top:50%;
    width:150vmax; height:150vmax; border-radius:50%;
    background:repeating-conic-gradient(from 0deg,
      rgba(255,255,255,.18) 0deg 11deg, transparent 11deg 22deg);
    pointer-events:none; opacity:0;
    transform:translate(-50%,-50%) scale(.4);
    transition:opacity .5s;
  }
  #win.show .sunburst { opacity:1; animation:sunspin 16s linear infinite; }
  @keyframes sunspin {
    from{ transform:translate(-50%,-50%) rotate(0) scale(1); }
    to{ transform:translate(-50%,-50%) rotate(360deg) scale(1); }
  }
  .win-card {
    position:relative; overflow:visible;
    background:#fff; border-radius:30px;
    padding:30px 34px 28px;
    display:flex; flex-direction:column; align-items:center; gap:12px;

  .win-mascot {

  }
  .win-card .big {

  @keyframes trophyshine {

  #win-stars { display:flex; gap:6px; min-height:1.3em; }

  }
  @keyframes starpop { to{opacity:1; transform:scale(1);} }
  .win-sub { font-size:clamp(13px,3.5vw,16px); font-weight:700; color:#5b3fd499; }

  .big-btn {
    border:none; cursor:pointer;
    border-radius:20px; padding:14px 22px;
    font-size:clamp(17px,4.5vw,22px); font-weight:800;

  .big-btn:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.18); }
  .primary { background:linear-gradient(#8de78a,#54c452); color:#0d4d0c; }
  .secondary { background:linear-gradient(#c9c2ff,#a394ff); color:#2e1e7a; }

    animation:secretglow 1.6s ease-in-out infinite;

    50%{box-shadow:0 5px 0 rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.2), 0 0 20px 4px #ffd34d88;}
  }

  .confetti {
    position:fixed; top:-8vh; z-index:60; pointer-events:none;
    display:block;
    animation:fall linear forwards;
  }
  @keyframes fall {
    to { transform:translateY(115vh) rotate(720deg); opacity:.7; }

  /* party-popper cannons from the bottom corners: outer flings sideways,
     inner arcs up then falls, piece spins — a real parabola */
  .cann-x {
    position:fixed; z-index:60; pointer-events:none; bottom:2vh;

  .cann-y { display:block; animation:cannY 1.9s cubic-bezier(.25,.7,.55,1) forwards; }
  @keyframes cannY {
    0%{ transform:translateY(0); opacity:1; }
    40%{ transform:translateY(var(--rise)); opacity:1; }

  }

  @keyframes cannSpin { to{ transform:rotate(360deg); } }
</style>

/* ---------------- puzzle generation ---------------- */

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function placeOk(grid,r,c,v,L){
  const n=L.n;
  for(let i=0;i<n;i++){
    if(grid[r*n+i]===v || grid[i*n+c]===v) return false;
  }
  const br=Math.floor(r/L.boxH)*L.boxH, bc=Math.floor(c/L.boxW)*L.boxW;
  for(let rr=br;rr<br+L.boxH;rr++)
    for(let cc=bc;cc<bc+L.boxW;cc++)
      if(grid[rr*n+cc]===v) return false;
  return true;
}

// Find the empty cell with fewest candidates (MRV) — keeps 9x9 search fast.
function bestCell(grid,L){
  const n=L.n;
  let bestPos=-1, bestCands=null;
  for(let p=0;p<n*n;p++){
    if(grid[p]!==0) continue;
    const r=Math.floor(p/n), c=p%n, cands=[];
    for(let v=1;v<=n;v++) if(placeOk(grid,r,c,v,L)) cands.push(v);
    if(cands.length===0) return [p,cands];
    if(!bestCands || cands.length<bestCands.length){ bestPos=p; bestCands=cands; if(cands.length===1) break; }
  }
  return [bestPos,bestCands];
}

function fillGrid(grid,L){
  const [p,cands]=bestCell(grid,L);
  if(p===-1) return true;
  if(cands.length===0) return false;
  for(const v of shuffle(cands)){
    grid[p]=v;
    if(fillGrid(grid,L)) return true;
    grid[p]=0;
  }
  return false;
}

// Returns { puzzle, solution } — puzzle has 0 for blanks, unique solution guaranteed.
// candidates for cell i on grid g under level L
function candsAt(g,i,L){
  const n=L.n, r=Math.floor(i/n), c=i%n, out=[];
  for(let v=1;v<=n;v++) if(placeOk(g,r,c,v,L)) out.push(v);
  return out;
}
// every row / column / box as a list of cell indices, for level L
function unitsForL(L){
  const n=L.n, u=[];
  for(let r=0;r<n;r++) u.push([...Array(n).keys()].map(c=>r*n+c));
  for(let c=0;c<n;c++) u.push([...Array(n).keys()].map(r=>r*n+c));
  for(let br=0;br<n;br+=L.boxH) for(let bc=0;bc<n;bc+=L.boxW){
    const cells=[]; for(let r=br;r<br+L.boxH;r++) for(let c=bc;c<bc+L.boxW;c++) cells.push(r*n+c);
    u.push(cells);
  }
  return u;
}
// Can this puzzle be finished using ONLY naked singles (a cell with one option)
// and hidden singles (a value with one home in a unit)? i.e. never a guess.
// This is exactly the reasoning the hint engine explains, so guaranteeing it
// here means every hint can always walk a real logic chain.
function logicSolvable(grid,L){
  const n=L.n, g=grid.slice(), units=unitsForL(L);
  let changed=true;
  while(changed){
    changed=false;
    for(let i=0;i<n*n;i++){
      if(g[i]!==0) continue;
      const cand=candsAt(g,i,L);
      if(cand.length===0) return false;              // contradiction
      if(cand.length===1){ g[i]=cand[0]; changed=true; }
    }
    if(changed) continue;
    for(const cells of units){
      for(let v=1;v<=n && !changed;v++){
        if(cells.some(p=>g[p]===v)) continue;
        let spot=-1, cnt=0;
        for(const p of cells) if(g[p]===0 && placeOk(g,Math.floor(p/n),p%n,v,L)){ spot=p; if(++cnt>1) break; }
        if(cnt===1){ g[spot]=v; changed=true; }
      }
      if(changed) break;
    }
  }
  return g.every(x=>x!==0);
}

// Build a puzzle that is solvable by pure logic (no guessing). Removing cells
// only while it stays logicSolvable also guarantees a unique solution.
function makePuzzle(L){
  const n=L.n;
  if(L.tune) return makeTunedPuzzle(L);
  const solution=new Array(n*n).fill(0);
  fillGrid(solution,L);
  const puzzle=solution.slice();
  let removed=0;
  for(const idx of shuffle([...Array(n*n).keys()])){
    if(removed>=L.blanks) break;
    const saved=puzzle[idx];
    puzzle[idx]=0;
    if(logicSolvable(puzzle,L)) removed++;
    else puzzle[idx]=saved;
  }
  return { puzzle, solution };
}

// count solutions up to `limit` (for uniqueness) — fast backtracking
function countSolutions(grid,L,limit){
  const [p,cands]=bestCell(grid,L);
  if(p===-1) return 1;
  if(cands.length===0) return 0;
  let count=0;
  for(const v of cands){
    grid[p]=v;
    count+=countSolutions(grid,L,limit-count);
    grid[p]=0;
    if(count>=limit) break;
  }
  return count;
}

// Dig as many holes as possible while keeping a UNIQUE solution, then (if it
// needs logic beyond our engine) restore clues until the engine can crack it —
// so it stays hard but every hint can still be derived.
function digUnique(solution,L){
  const n=L.n, puzzle=solution.slice(), removedOrder=[];
  let removed=0;
  for(const idx of shuffle([...Array(n*n).keys()])){
    if(removed>=L.blanks) break;
    const saved=puzzle[idx];
    puzzle[idx]=0;
    if(countSolutions(puzzle.slice(),L,2)===1){ removed++; removedOrder.push(idx); }
    else puzzle[idx]=saved;
  }
  shuffle(removedOrder);
  let gi=0;
  while(!solve(puzzle,L).solved && gi<removedOrder.length){
    puzzle[removedOrder[gi]]=solution[removedOrder[gi]]; gi++;
  }
  return puzzle;
}
/* ---- how hard is this puzzle, really? ----------------------------------
   Replay the solve step by step and price every move by what it costs a
   person: how hard the technique is to know, times how hard the move is to
   FIND. The solver always reaches for the cheapest technique that works, so
   its trace is the least-effort human path.

   The scan term is what makes this work across the whole ladder. Rating a
   board only by its techniques says Master and Champion are both zero — they
   are singles-only by construction, so there is no technique to price. But
   with 46 clues a single is always sitting in front of you, and with 33 you
   have to hunt for it: scan width (empty squares per available move) is 1.2
   on Master and 2.3 on Champion, and that is the real difference.

   `stalls` counts the separate moments where the singles dry up completely —
   what makes a grid feel hard rather than merely long. */
function effortOf(pz,L){
  const ctx=solverCtx(L), n=L.n;
  const state={grid:pz.slice(), cand:computeCands(pz,ctx)};
  let e=0,t2=0,t3=0,t4=0,t5=0,t6=0,stalls=0,prevAdv=false,guard=0;
  while(state.grid.some(v=>v===0)){
    if(++guard>n*n*2) return null;
    let moves=0, empty=0;
    for(let i=0;i<n*n;i++){
      if(state.grid[i]!==0) continue;
      empty++;
      if(singleAt(state.cand,i,ctx)) moves++;
    }
    const scan = moves>0 ? empty/moves : empty;   // squares examined per move found
    let d=null;
    for(const t of TECHS){ d=t(state,ctx); if(d) break; }
    if(!d) return null;                            // beyond the engine: unusable
    if(d.tier===1) e += (d.tech==='naked single' ? scan : 1.6*scan);
    else if(d.tier===2){ t2++; e+=14; }
    else if(d.tier===3){ t3++; e+=34; }
    else if(d.tier===4){ t4++; e+=80; }
    else if(d.tier===5){ t5++; e+=170; }
    else { t6++; e+=320; }
    if(d.tier>=2){ if(!prevAdv){ stalls++; e+=10; } prevAdv=true; } else prevAdv=false;
    applyDeduction(state,d,ctx);
  }
  return { effort:Math.round(e), tier:(t6?6:t5?5:t4?4:t3?3:t2?2:1), stalls,
           hard:t4+t5+t6, adv:t2+t3+t4+t5+t6 };
}

/* Tuned puzzle by ruin-and-recreate search, aimed at the level's `tune` spec.

   Digging at random lands on a singles-only grid ~70% of the time, so sampling
   whole puzzles and picking the best is weak AND slow. But a full dig costs
   ~20ms (uniqueness counting) while a logic solve costs ~0.04ms, so *searching*
   the clue set is 500x cheaper than resampling it: dig once for a valid seed,
   then repeatedly hand a few clues back and greedily re-dig, keeping whatever
   fits the spec better.

   The clue count is the difficulty dial and the technique window is the gate.
   Holding clues fixed is what makes a MIDDLE level possible at all — left to
   dig as deep as logic allows, every board bottoms out around 24 clues and
   comes out Legend-shaped.

   `climb:false` stops the moment the board fits the window (Champion — land in
   the middle and go). `climb:true` keeps pushing effort for the whole slice, so
   the ceiling is open-ended (Legend).

   Every removal is gated on the logic engine still solving the grid. A
   deductive solve proves the answer is forced, so that single test keeps the
   solution unique AND keeps every step explainable by the hint engine. */
function makeTunedPuzzle(L){
  const n=L.n, all=[...Array(n*n).keys()], T=L.tune;
  const seedL=Object.assign({},L,{blanks:n*n-T.clues});
  // Champion's ceiling and Legend's floor are what keep the two levels from
  // ever meeting: 800 < 850, so the bands cannot overlap by construction.
  const lo=T.floor||0, hi=T.ceil||Infinity;
  const fits=r=>!!r && r.tier>=T.tierMin && r.tier<=T.tierMax
    && r.effort>=lo && r.effort<=hi
    && r.stalls>=(T.minStalls||0) && r.hard>=(T.minHard||0);
  const fit=r=>{
    if(!r) return -1e9;
    let f=0;
    if(r.tier<T.tierMin) f-=1e4*(T.tierMin-r.tier);
    if(r.tier>T.tierMax) f-=1e4*(r.tier-T.tierMax);
    // Climbing levels chase effort AND the moments that make it feel hard —
    // raw effort is dominated by scanning ~57 singles, which is bounded, so on
    // its own it plateaus while the board still plays as mostly easy moves.
    // Banded levels steer back into the band, with a faint upward pull so the
    // search keeps a gradient once inside (a flat band leaves it wandering).
    return f + (T.climb ? r.effort + 30*r.stalls + 45*r.hard
                        : -(Math.max(0,lo-r.effort)+Math.max(0,r.effort-hi))
                          + r.effort/1000);
  };
  const start=performance.now();
  let best=null, bestSol=null, bestR=null, bestF=-1e9, seeds=0;
  const keep=(pz,sol,r,f)=>{ best=pz.slice(); bestSol=sol.slice(); bestR=r; bestF=f; };
  do {
    seeds++;
    const seedEnd=performance.now()+T.slice;
    const solution=new Array(n*n).fill(0);
    fillGrid(solution,L);
    let cur=digUnique(solution,seedL), curR=effortOf(cur,L), curF=fit(curR);
    if(curF>bestF) keep(cur,solution,curR,curF);
    while(performance.now()<seedEnd && (T.climb || !fits(bestR))){
      const cand=cur.slice();
      // ruin: hand a handful of clues back, opening up new ways to dig
      for(const h of shuffle(all.filter(i=>cand[i]===0)).slice(0,T.ruin))
        cand[h]=solution[h];
      // recreate: pull clues out again in a fresh order, down to the target count
      let clues=cand.reduce((c,v)=>c+(v!==0),0);
      for(const i of shuffle(all.slice())){
        if(cand[i]===0 || clues<=T.clues) continue;
        const saved=cand[i]; cand[i]=0;
        if(!solve(cand,L).solved) cand[i]=saved; else clues--;
      }
      const r=effortOf(cand,L), f=fit(r);
      if(f>=curF){ cur=cand; curR=r; curF=f; }    // sideways moves keep it exploring
      if(f>bestF) keep(cand,solution,r,f);
    }
    // Out of slice. Take another starting grid if this one never met the spec —
    // `budget` has to leave room for a whole extra slice or the retry can never
    // fire and the level quietly ships a board that misses its own promise.
  } while(!fits(bestR) && seeds<T.seeds && performance.now()-start<T.budget);
  return { puzzle:best, solution:bestSol };
}

/* ============================================================
   Deductive solver — a human-style logic engine used both to
   generate hard puzzles and to walk the hint derivation chain.
   Works on candidate bitmasks; every deduction records its reason.
   ============================================================ */

function bitcount(m){ let c=0; while(m){ m&=m-1; c++; } return c; }
function bitsOf(m){ const out=[]; let v=1; while(m){ if(m&1) out.push(v); m>>=1; v++; } return out; }
function kcombos(arr,k){
  const res=[], n=arr.length;
  (function rec(start,combo){
    if(combo.length===k){ res.push(combo.slice()); return; }
    for(let i=start;i<n;i++){ combo.push(arr[i]); rec(i+1,combo); combo.pop(); }
  })(0,[]);
  return res;
}

// precomputed geometry for a level
let SCTX=null, SCTX_KEY='';
function solverCtx(L){
  const key=L.n+'-'+L.boxW+'-'+L.boxH;
  if(SCTX && SCTX_KEY===key) return SCTX;
  const n=L.n, bpr=n/L.boxW;
  const rows=[],cols=[],boxes=[];
  for(let r=0;r<n;r++) rows.push([...Array(n)].map((_,c)=>r*n+c));
  for(let c=0;c<n;c++) cols.push([...Array(n)].map((_,r)=>r*n+c));
  for(let b=0;b<n;b++) boxes.push([]);
  const boxOfCell=i=>{ const r=Math.floor(i/n),c=i%n; return Math.floor(r/L.boxH)*bpr+Math.floor(c/L.boxW); };
  for(let i=0;i<n*n;i++) boxes[boxOfCell(i)].push(i);
  const units=[...rows.map(c=>({kind:'row',cells:c})),
               ...cols.map(c=>({kind:'column',cells:c})),
               ...boxes.map(c=>({kind:'little square',cells:c}))];
  const peers=[]; for(let i=0;i<n*n;i++) peers.push(new Set());
  for(const u of units) for(const a of u.cells) for(const b of u.cells) if(a!==b) peers[a].add(b);
  SCTX={n,L,rows,cols,boxes,units,peers,boxOfCell}; SCTX_KEY=key;
  return SCTX;
}

function computeCands(grid,ctx){
  const n=ctx.n, cand=new Array(n*n).fill(0);
  for(let i=0;i<n*n;i++){
    if(grid[i]!==0) continue;
    let m=0;
    for(const q of ctx.peers[i]) if(grid[q]!==0) m|=1<<(grid[q]-1);
    cand[i]=(~m)&((1<<n)-1);
  }
  return cand;
}

function applyDeduction(state,d,ctx){
  if(d.kind==='place'){
    state.grid[d.cell]=d.value; state.cand[d.cell]=0;
    const b=~(1<<(d.value-1));
    for(const q of ctx.peers[d.cell]) state.cand[q]&=b;
  } else {
    for(const e of d.elims) state.cand[e.cell]&=~(1<<(e.value-1));
  }
}

/* ---- techniques: each returns the first deduction it finds, or null ---- */

function tNakedSingle(s,ctx){
  for(let i=0;i<s.cand.length;i++){
    if(s.grid[i]!==0) continue;
    const m=s.cand[i];
    if(bitcount(m)===1) return {tier:1,kind:'place',tech:'naked single',cell:i,value:bitsOf(m)[0]};
  }
  return null;
}
function tHiddenSingle(s,ctx){
  for(const u of ctx.units){
    for(let v=1;v<=ctx.n;v++){
      const b=1<<(v-1);
      if(u.cells.some(p=>s.grid[p]===v)) continue;
      let spot=-1,cnt=0;
      for(const p of u.cells) if(s.grid[p]===0 && (s.cand[p]&b)){ spot=p; if(++cnt>1) break; }
      if(cnt===1) return {tier:1,kind:'place',tech:'hidden single',cell:spot,value:v,unitKind:u.kind,unitCells:u.cells};
    }
  }
  return null;
}
function tPointing(s,ctx){
  for(const box of ctx.boxes){
    for(let v=1;v<=ctx.n;v++){
      const b=1<<(v-1);
      const cells=box.filter(p=>s.grid[p]===0 && (s.cand[p]&b));
      if(cells.length<2) continue;
      const rs=new Set(cells.map(p=>Math.floor(p/ctx.n))), cs=new Set(cells.map(p=>p%ctx.n));
      let lineCells=null,lineKind=null;
      if(rs.size===1){ lineCells=ctx.rows[[...rs][0]]; lineKind='row'; }
      else if(cs.size===1){ lineCells=ctx.cols[[...cs][0]]; lineKind='column'; }
      if(!lineCells) continue;
      const boxSet=new Set(box), elims=[];
      for(const p of lineCells) if(!boxSet.has(p) && s.grid[p]===0 && (s.cand[p]&b)) elims.push({cell:p,value:v});
      if(elims.length) return {tier:2,kind:'elim',tech:'pointing',value:v,elims,patternCells:cells,unitKind:lineKind,lineCells,boxCells:box};
    }
  }
  return null;
}
function tClaiming(s,ctx){
  const lines=[...ctx.rows.map(c=>({kind:'row',cells:c})),...ctx.cols.map(c=>({kind:'column',cells:c}))];
  for(const line of lines){
    for(let v=1;v<=ctx.n;v++){
      const b=1<<(v-1);
      const cells=line.cells.filter(p=>s.grid[p]===0 && (s.cand[p]&b));
      if(cells.length<2) continue;
      const bs=new Set(cells.map(p=>ctx.boxOfCell(p)));
      if(bs.size!==1) continue;
      const box=ctx.boxes[[...bs][0]], lineSet=new Set(line.cells), elims=[];
      for(const p of box) if(!lineSet.has(p) && s.grid[p]===0 && (s.cand[p]&b)) elims.push({cell:p,value:v});
      if(elims.length) return {tier:2,kind:'elim',tech:'claiming',value:v,elims,patternCells:cells,unitKind:line.kind,boxCells:box,lineCells:line.cells};
    }
  }
  return null;
}
function tNakedSubset(s,ctx,k){
  for(const u of ctx.units){
    const empt=u.cells.filter(p=>s.grid[p]===0);
    if(empt.length<=k) continue;
    for(const combo of kcombos(empt,k)){
      let union=0; for(const p of combo) union|=s.cand[p];
      if(bitcount(union)!==k) continue;
      if(combo.some(p=>bitcount(s.cand[p])<2)) continue;
      const elims=[];
      for(const p of empt){ if(combo.includes(p)) continue; const common=s.cand[p]&union; if(common) for(const v of bitsOf(common)) elims.push({cell:p,value:v}); }
      if(elims.length) return {tier:3,kind:'elim',tech:(k===2?'naked pair':'naked triple'),elims,patternCells:combo,values:bitsOf(union),unitKind:u.kind,unitCells:u.cells};
    }
  }
  return null;
}
function tHiddenSubset(s,ctx,k){
  for(const u of ctx.units){
    const vals=[]; for(let v=1;v<=ctx.n;v++) if(!u.cells.some(p=>s.grid[p]===v)) vals.push(v);
    if(vals.length<=k) continue;
    for(const combo of kcombos(vals,k)){
      const mask=combo.reduce((m,v)=>m|(1<<(v-1)),0);
      const cells=u.cells.filter(p=>s.grid[p]===0 && (s.cand[p]&mask));
      if(cells.length!==k) continue;
      if(!combo.every(v=>{ const b=1<<(v-1); return cells.some(p=>s.cand[p]&b); })) continue;
      const elims=[];
      for(const p of cells){ const extra=s.cand[p]&~mask; if(extra) for(const v of bitsOf(extra)) elims.push({cell:p,value:v}); }
      if(elims.length) return {tier:3,kind:'elim',tech:(k===2?'hidden pair':'hidden triple'),elims,patternCells:cells,values:combo,unitKind:u.kind,unitCells:u.cells};
    }
  }
  return null;
}
/* Fish of size k: pick k rows in which v fits in at most k columns between
   them. Those k rows need k different v's and only those k columns can supply
   them, so every other row loses v in those columns. k=2 is the X-Wing, k=3
   the Swordfish — same argument, one row wider. */
function tFish(s,ctx,k){
  const n=ctx.n;
  for(let v=1;v<=n;v++){
    const b=1<<(v-1);
    for(const rowMode of [true,false]){
      const spots=[];                       // spots[i] = where v still fits in line i
      for(let i=0;i<n;i++){
        const at=[];
        for(let j=0;j<n;j++){
          const p=rowMode ? i*n+j : j*n+i;
          if(s.grid[p]===0 && (s.cand[p]&b)) at.push(j);
        }
        spots[i]=at;
      }
      const usable=[];
      for(let i=0;i<n;i++) if(spots[i].length>=2 && spots[i].length<=k) usable.push(i);
      if(usable.length<k) continue;
      for(const base of kcombos(usable,k)){
        const cover=new Set();
        for(const i of base) for(const j of spots[i]) cover.add(j);
        if(cover.size!==k) continue;
        const inBase=new Set(base), pattern=[], elims=[];
        for(const i of base) for(const j of spots[i]) pattern.push(rowMode ? i*n+j : j*n+i);
        for(let i=0;i<n;i++){
          if(inBase.has(i)) continue;
          for(const j of cover){
            const p=rowMode ? i*n+j : j*n+i;
            if(s.grid[p]===0 && (s.cand[p]&b)) elims.push({cell:p,value:v});
          }
        }
        if(elims.length) return {tier:k===2?4:5, kind:'elim', tech:k===2?'X-Wing':'Swordfish',
          value:v, elims, patternCells:pattern, unitKind:rowMode?'row':'column',
          baseIdx:base.slice(), crossIdx:[...cover].sort((a,b)=>a-b)};
      }
    }
  }
  return null;
}
/* XYZ-Wing: the hinge has three choices {x,y,z} and each wing shares two of
   them, so between the three of them one is always z — and any square seeing
   all three loses z. Same shape as the XY-Wing with the hinge itself in play. */
function tXYZWing(s,ctx){
  const n=ctx.n, see=(a,b)=>ctx.peers[a].has(b);
  const tri=[], bi=[];
  for(let i=0;i<n*n;i++){
    if(s.grid[i]!==0) continue;
    const c=bitcount(s.cand[i]);
    if(c===3) tri.push(i); else if(c===2) bi.push(i);
  }
  for(const piv of tri){
    const pm=s.cand[piv];
    for(const w1 of bi){
      if(!see(piv,w1) || (s.cand[w1]&pm)!==s.cand[w1]) continue;
      for(const w2 of bi){
        if(w2===w1 || !see(piv,w2) || (s.cand[w2]&pm)!==s.cand[w2]) continue;
        const zm=s.cand[w1]&s.cand[w2];
        if(bitcount(zm)!==1 || (s.cand[w1]|s.cand[w2])!==pm) continue;
        const z=bitsOf(zm)[0], elims=[];
        for(let i=0;i<n*n;i++){
          if(s.grid[i]!==0 || i===piv || i===w1 || i===w2) continue;
          if((s.cand[i]&zm) && see(piv,i) && see(w1,i) && see(w2,i)) elims.push({cell:i,value:z});
        }
        if(elims.length) return {tier:5,kind:'elim',tech:'XYZ-Wing',value:z,elims,
          patternCells:[piv,w1,w2],unitKind:null};
      }
    }
  }
  return null;
}
/* W-Wing: twin cells hold the same pair {x,z} and don't see each other. Some
   unit has only two homes left for z, one seeing each twin — so one of those
   two is z, which forces the twin it sees to be x. Either way an x lands on a
   twin, and anything seeing both twins loses x. */
function tWWing(s,ctx){
  const n=ctx.n, see=(a,b)=>ctx.peers[a].has(b);
  const bi=[];
  for(let i=0;i<n*n;i++) if(s.grid[i]===0 && bitcount(s.cand[i])===2) bi.push(i);
  for(let a=0;a<bi.length;a++) for(let b=a+1;b<bi.length;b++){
    const p=bi[a], q=bi[b];
    if(s.cand[p]!==s.cand[q] || see(p,q)) continue;
    const pair=bitsOf(s.cand[p]);
    for(const [X,Z] of [[pair[0],pair[1]],[pair[1],pair[0]]]){
      const zb=1<<(Z-1), xb=1<<(X-1);
      for(const u of ctx.units){
        const spots=u.cells.filter(c=>s.grid[c]===0 && (s.cand[c]&zb));
        if(spots.length!==2) continue;
        const [c1,c2]=spots;
        if(c1===p||c1===q||c2===p||c2===q) continue;
        if(!((see(c1,p)&&see(c2,q)) || (see(c1,q)&&see(c2,p)))) continue;
        const elims=[];
        for(let i=0;i<n*n;i++){
          if(s.grid[i]!==0||i===p||i===q) continue;
          if((s.cand[i]&xb) && see(i,p) && see(i,q)) elims.push({cell:i,value:X});
        }
        if(elims.length) return {tier:5,kind:'elim',tech:'W-Wing',value:X,elims,
          patternCells:[p,q],linkCells:[c1,c2],linkValue:Z,unitCells:u.cells,unitKind:u.kind};
      }
    }
  }
  return null;
}
/* Simple colouring. For one digit, a unit with exactly two homes left is a
   strong link: one end is the digit, the other isn't. Follow those links and
   two-colour the chain — every cell of one colour is the digit, every cell of
   the other isn't, we just don't know which way round. Two payoffs:
     trap — two cells of the SAME colour see each other, so that colour is
            impossible and every cell of it loses the digit
     wrap — any cell outside seeing BOTH colours loses the digit, since one of
            the two colours is the true one */
function tColour(s,ctx){
  const n=ctx.n;
  for(let v=1;v<=n;v++){
    const b=1<<(v-1);
    const adj=new Map(), linkUnits=[];
    for(const u of ctx.units){
      const spots=u.cells.filter(c=>s.grid[c]===0 && (s.cand[c]&b));
      if(spots.length!==2) continue;
      linkUnits.push({cells:u.cells, spots});
      if(!adj.has(spots[0])) adj.set(spots[0],[]);
      if(!adj.has(spots[1])) adj.set(spots[1],[]);
      adj.get(spots[0]).push(spots[1]);
      adj.get(spots[1]).push(spots[0]);
    }
    if(!adj.size) continue;
    const colour=new Map();
    for(const seed of adj.keys()){
      if(colour.has(seed)) continue;
      const comp=[seed], queue=[seed];
      colour.set(seed,0);
      while(queue.length){
        const c=queue.shift();
        for(const nb of adj.get(c)) if(!colour.has(nb)){
          colour.set(nb, 1-colour.get(c)); comp.push(nb); queue.push(nb);
        }
      }
      if(comp.length<4) continue;                 // too short to be worth walking
      const A=comp.filter(c=>colour.get(c)===0), B=comp.filter(c=>colour.get(c)===1);
      const used=linkUnits.filter(lu=>colour.has(lu.spots[0]) && comp.includes(lu.spots[0]));
      for(const [same,dead] of [[A,'A'],[B,'B']]){
        let clash=null;
        outer: for(let i=0;i<same.length;i++) for(let j=i+1;j<same.length;j++)
          if(ctx.peers[same[i]].has(same[j])){ clash=[same[i],same[j]]; break outer; }
        if(clash) return {tier:6,kind:'elim',tech:'Colouring',value:v,rule:'trap',
          elims:same.map(c=>({cell:c,value:v})),
          patternCells:comp.slice(), colourA:A, colourB:B, deadColour:dead, clash,
          linkUnits:used, unitKind:null};
      }
      const inComp=new Set(comp), elims=[];
      for(let i=0;i<n*n;i++){
        if(s.grid[i]!==0 || inComp.has(i) || !(s.cand[i]&b)) continue;
        if(A.some(c=>ctx.peers[i].has(c)) && B.some(c=>ctx.peers[i].has(c)))
          elims.push({cell:i,value:v});
      }
      if(elims.length) return {tier:6,kind:'elim',tech:'Colouring',value:v,rule:'wrap',
        elims, patternCells:comp.slice(), colourA:A, colourB:B,
        linkUnits:used, unitKind:null};
    }
  }
  return null;
}
function tXYWing(s,ctx){
  const n=ctx.n;
  const bi=[]; for(let i=0;i<n*n;i++) if(s.grid[i]===0 && bitcount(s.cand[i])===2) bi.push({i,m:s.cand[i]});
  const see=(a,b)=>ctx.peers[a].has(b);
  for(const piv of bi){
    for(const p1 of bi){ if(p1.i===piv.i || !see(piv.i,p1.i)) continue;
      const sh1=p1.m&piv.m; if(bitcount(sh1)!==1) continue;
      const z1=p1.m&~piv.m; if(bitcount(z1)!==1) continue;
      for(const p2 of bi){ if(p2.i===piv.i||p2.i===p1.i||!see(piv.i,p2.i)) continue;
        const sh2=p2.m&piv.m; if(bitcount(sh2)!==1 || sh2===sh1) continue;
        if((p2.m&~piv.m)!==z1) continue;              // same z
        const z=bitsOf(z1)[0], elims=[];
        for(let i=0;i<n*n;i++){ if(s.grid[i]!==0||i===piv.i||i===p1.i||i===p2.i) continue;
          if((s.cand[i]&z1) && see(p1.i,i) && see(p2.i,i)) elims.push({cell:i,value:z}); }
        if(elims.length) return {tier:4,kind:'elim',tech:'XY-Wing',value:z,elims,patternCells:[piv.i,p1.i,p2.i],unitKind:null};
      }
    }
  }
  return null;
}

// cheapest first — the solver's trace is only a fair difficulty measure if it
// always reaches for the easiest technique that works
const TECHS=[
  tNakedSingle, tHiddenSingle, tPointing, tClaiming,
  (s,c)=>tNakedSubset(s,c,2), (s,c)=>tHiddenSubset(s,c,2),
  (s,c)=>tNakedSubset(s,c,3), (s,c)=>tHiddenSubset(s,c,3),
  (s,c)=>tFish(s,c,2), tXYWing,
  (s,c)=>tFish(s,c,3), tXYZWing, tWWing,
  tColour
];

// Solve as far as pure logic allows, recording the full reasoned trace.
function solve(grid,L){
  const ctx=solverCtx(L);
  const state={grid:grid.slice(), cand:computeCands(grid,ctx)};
  const trace=[]; let hardestTier=0, guard=0;
  while(state.grid.some(v=>v===0)){
    if(++guard>1000) break;
    let d=null;
    for(const t of TECHS){ d=t(state,ctx); if(d) break; }
    if(!d) return {solved:false, trace, hardestTier, state, ctx};
    hardestTier=Math.max(hardestTier,d.tier);
    d.candBefore=state.cand.slice();   // snapshot for the hint's spotlight marks
    applyDeduction(state,d,ctx);
    trace.push(d);
  }
  return {solved:true, trace, hardestTier, state, ctx};
}

let soundOn = localStorage.getItem('sudoku-sound') !== 'off';
let actx = null;
function ac(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); return actx; }
function tone(freq, t0, dur, type='sine', vol=0.18){
  const ctx=ac(), o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0, ctx.currentTime+t0);
  g.gain.linearRampToValueAtTime(vol, ctx.currentTime+t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+t0+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(ctx.currentTime+t0); o.stop(ctx.currentTime+t0+dur+0.05);
}
// Streak climbs a major-pentatonic ladder — always musical, never dissonant.
const PENTA=[1, 9/8, 5/4, 3/2, 5/3, 2, 9/4, 5/2];
function sfx(name){
  if(!soundOn) return;
  try{
    if(name==='tap')   tone(520,0,.08,'triangle',.12);
    if(name==='place'){
      const base=523*PENTA[Math.min(streak,PENTA.length-1)];
      tone(base,0,.1,'triangle',.16);
      tone(base*1.5,.07,.14,'triangle',.14);
    }
    if(name==='wrong'){ tone(220,0,.15,'sine',.1); tone(180,.12,.2,'sine',.1); }
    if(name==='hint') { tone(880,0,.08,'sine',.12); tone(1100,.08,.1,'sine',.12); }
    if(name==='poof') { tone(320,0,.08,'triangle',.12); tone(200,.05,.14,'sine',.1); }
    if(name==='no')   { tone(240,0,.12,'sine',.09); }
    if(name==='unit') { [659,880,1175].forEach((f,i)=>tone(f,i*.08,.14,'triangle',.15)); }
    if(name==='win')  { [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.12,.25,'triangle',.16)); }
  }catch(e){}
}
