<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#7c5cff">
<title>Sudoku Fun</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐶</text></svg>">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%;
    overflow:hidden;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
    font-family:-apple-system-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", "Comic Sans MS", sans-serif;
  }
  body {
    background:linear-gradient(160deg,#9d87ff 0%,#74c3ff 45%,#7df5b9 100%);
    display:flex; flex-direction:column; align-items:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* soft drifting bubbles behind everything */
  .bub {
    position:fixed; border-radius:50%; z-index:0; pointer-events:none;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.5), rgba(255,255,255,.08) 70%);
    animation:drift ease-in-out infinite alternate;
  }
  @keyframes drift { from{transform:translate(0,0) scale(1)} to{transform:translate(4vw,-6vh) scale(1.12)} }

  .screen {
    position:absolute; inset:0; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:min(2.5vh,18px);
    padding:max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
    transition:opacity .25s, transform .25s;
  }
  .screen.hidden { opacity:0; pointer-events:none; transform:scale(.96); }

  /* ---------- MENU ---------- */
  /* scroll when the menu doesn't fit (short/landscape screens), center when it does */
  #menu { overflow-y:auto; justify-content:flex-start; }
  #menu > * { flex-shrink:0; }
  #menu > :first-child { margin-top:auto; }
  #menu > :last-child { margin-bottom:auto; }
  #menu h1 {
    font-size:clamp(30px, 8vw, 56px);
    color:#fff;
    text-shadow:0 3px 0 rgba(80,60,180,.35);
    text-align:center;
    animation:bob 2.5s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  #menu .subtitle { font-size:clamp(15px,4vw,22px); color:#ffffffdd; margin-top:-6px; }

  .style-toggle {
    display:flex; gap:0;
    background:#ffffff55;
    border-radius:999px;
    padding:5px;
    box-shadow:inset 0 1px 3px rgba(60,40,150,.15);
  }
  .style-btn {
    border:none; cursor:pointer;
    border-radius:999px;
    padding:10px 22px;
    font-family:inherit; font-weight:800;
    font-size:clamp(15px,4vw,20px);
    background:transparent; color:#ffffffcc;
    transition:background .15s, color .15s;
  }
  .style-btn.active { background:#fff; color:#5b3fd4; box-shadow:0 2px 8px rgba(0,0,0,.15); }

  .levels {
    display:grid; grid-template-columns:repeat(2, minmax(140px, 220px));
    gap:min(3vw,18px); width:min(92vw,500px);
  }
  @media (max-width:360px){ .levels{grid-template-columns:1fr;} }
  .level-btn {
    border:none; cursor:pointer;
    border-radius:26px;
    padding:min(2.6vh,20px) 10px;
    font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    box-shadow:0 6px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.55);
    transition:transform .1s;
  }
  .level-btn:active { transform:translateY(4px) scale(.97); box-shadow:0 2px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.55); }
  .level-btn .emoji { font-size:clamp(32px,8vw,50px); filter:drop-shadow(0 3px 3px rgba(0,0,0,.15)); }
  .level-btn .name { font-size:clamp(17px,4.5vw,24px); font-weight:800; color:#4a3800; }
  .level-btn .desc { font-size:clamp(12px,3vw,15px); font-weight:700; color:#4a380099; }
  .level-btn .stars { font-size:clamp(12px,3vw,16px); min-height:1.2em; letter-spacing:1px; }
  .l1{background:linear-gradient(#ffe98a,#ffd34d);} .l2{background:linear-gradient(#a8f0a2,#6fdd66);}
  .l3{background:linear-gradient(#a2d8f0,#66badd);} .l4{background:linear-gradient(#f0b5e6,#e07ad0);}
  /* Legend: a special full-width golden banner, unlocked by beating Champion */
  .legend-btn {
    grid-column:1 / -1;
    background:linear-gradient(120deg,#6a4bd4,#8b5cf6 55%,#b57bff);
    animation:legendglow 2.4s ease-in-out infinite;
  }
  @keyframes legendglow {
    0%,100%{ box-shadow:0 6px 0 rgba(0,0,0,.22), inset 0 2px 0 rgba(255,255,255,.3), 0 0 12px 1px #ffd34d55; }
    50%{ box-shadow:0 6px 0 rgba(0,0,0,.22), inset 0 2px 0 rgba(255,255,255,.3), 0 0 24px 6px #ffd34daa; }
  }
  .legend-btn .name { color:#fff; text-shadow:0 2px 0 rgba(60,40,120,.5); }
  .legend-btn .desc { color:#ffe6a8; }
  .legend-btn .emoji { filter:drop-shadow(0 3px 4px rgba(0,0,0,.4)); }

  /* way back out to the arcade — every game has one, styled the same */
  .arcade-link {
    border:none; cursor:pointer; font-family:inherit; font-weight:800;
    font-size:clamp(13px,3.4vw,16px);
    padding:9px 18px; border-radius:999px;
    background:rgba(255,255,255,.35); color:#fff;
    display:flex; align-items:center; gap:7px;
    transition:transform .1s, background .15s;
  }
  .arcade-link:active { transform:scale(.95); background:rgba(255,255,255,.5); }
  .arcade-link svg.ic { width:1.1em; height:1.1em; }
  .arcade-link svg.ic path { stroke:#fff; }

  /* ---------- GAME ---------- */
  #game { justify-content:space-between; }
  .topbar {
    width:min(94vw, 640px);
    display:flex; align-items:center; justify-content:space-between;
    gap:8px;
  }
  #level-wrap {
    flex:1; display:flex; align-items:center; justify-content:center; gap:10px;
    min-width:0;
  }
  .tb-group { display:flex; gap:8px; }
  /* reserve the top-right corner for the always-visible settings button */
  .tb-spacer { width:clamp(44px,10vw,54px); flex:none; }
  #mascot {
    font-size:clamp(26px,7vw,38px);
    display:inline-block;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));
  }
  #mascot.bounce { animation:mascotbounce .6s; }
  @keyframes mascotbounce { 0%,100%{transform:scale(1)} 30%{transform:scale(1.35) rotate(-8deg)} 60%{transform:scale(.95) rotate(6deg)} }
  .round-btn {
    border:none; cursor:pointer;
    width:clamp(46px,11vw,58px); height:clamp(46px,11vw,58px);
    border-radius:50%;
    background:#ffffffee;
    font-size:clamp(20px,5vw,26px);
    box-shadow:0 4px 0 rgba(0,0,0,.15), inset 0 2px 0 rgba(255,255,255,.9);
    transition:transform .1s;
    font-family:inherit;
  }
  .round-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.15); }
  .round-btn { display:flex; align-items:center; justify-content:center; }
  svg.ic { width:1em; height:1em; vertical-align:-0.12em; }
  .style-btn svg.ic, .big-btn svg.ic { margin-right:3px; }
  #level-label {
    font-size:clamp(18px,4.5vw,26px); font-weight:800; color:#fff;
    text-shadow:0 2px 0 rgba(80,60,180,.3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #board-area { display:flex; flex-direction:column; align-items:center; gap:min(2vh,14px); }
  /* the board frame doubles as the grid lines: thin gaps between cells,
     wide gaps between boxes — the sudoku box rule made visible */
  #board {
    display:grid;
    background:#b7a8ec;
    border-radius:22px;
    padding:8px;
    box-shadow:0 12px 28px rgba(60,40,150,.28), inset 0 2px 0 rgba(255,255,255,.35);
  }
  .cell {
    display:flex; align-items:center; justify-content:center;
    background:#fff;
    border-radius:18%;
    position:relative;
    cursor:pointer;
    font-weight:800;
    transition:background .15s;
  }
  .cell.alt { background:#f4efff; }
  .cell.hole { background:#e9e3fa; box-shadow:inset 0 3px 7px rgba(96,70,200,.22); }
  .cell.alt.hole { background:#e0d8f7; }
  /* priority chain: rc < match < flashm < erasable < sel < conflict < explain —
     all !important so alt/hole variants can never mask a highlight */
  .cell.rc { background:#fff3c9 !important; }
  .cell.match { background:#d9f6bd !important; box-shadow:inset 0 0 0 2px #9ade6d; }
  .cell.flashm { background:#d9f6bd !important; box-shadow:inset 0 0 0 2px #9ade6d; }
  /* eraser is active: pink-tinted, gently pulsing "you can rub me out" cells */
  .cell.erasable { background:#ffe3f0 !important; animation:erasepulse 1.4s ease-in-out infinite; }
  @keyframes erasepulse { 0%,100%{box-shadow:inset 0 0 0 2px #ff9ec4} 50%{box-shadow:inset 0 0 0 3px #ff5fa2} }
  .cell.sel { background:#ffe063 !important; box-shadow:inset 0 0 0 3px #ffc21d; animation:selpulse 1.2s ease-in-out infinite; z-index:2; }
  @keyframes selpulse { 0%,100%{box-shadow:inset 0 0 0 3px #ffc21d} 50%{box-shadow:inset 0 0 0 5px #ffae00} }
  .cell .sym { line-height:1; pointer-events:none; }
  /* spotlight candidate pencil-marks, shown only during a hint's derivation */
  .cell .cands {
    position:absolute; inset:0; pointer-events:none;
    display:flex; align-items:center; justify-content:center; gap:.06em;
    animation:markpop .25s ease-out;
  }
  @keyframes markpop { from{opacity:0; transform:scale(.6)} to{opacity:1; transform:scale(1)} }
  .cell .cands span { font-size:.55em; font-weight:800; color:#7c5cff; line-height:1; }
  .cell .cands.multi span { font-size:.4em; }
  .cell .cands span.focus { color:#e67e22; }
  .cell .cands span.crossed { color:#ff8a8a; position:relative; }
  .cell .cands span.crossed::after {
    content:''; position:absolute; left:-6%; right:-6%; top:46%; height:2.5px;
    background:#ff5b6b; transform:rotate(-16deg); border-radius:2px;
  }
  .cell.pop .sym { animation:pop .35s; }
  @keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.3)} 100%{transform:scale(1)} }
  .cell.wrong { animation:shake .4s; }
  .cell.wrong .sym { animation:fadeout .5s forwards; }
  .cell.shake { animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
  @keyframes fadeout { to{opacity:0; transform:scale(.3);} }
  .cell.hintglow { animation:glow 1s ease-in-out 2; }
  @keyframes glow { 0%,100%{background:#fff} 50%{background:#fff3ad} }
  .cell.conflict { background:#ffdede !important; box-shadow:inset 0 0 0 3px #ff8080; }
  .cell.conflict .sym { animation:confwob .9s ease-in-out infinite; }
  @keyframes confwob { 0%,100%{transform:rotate(-7deg)} 50%{transform:rotate(7deg)} }
  .cell.explain { background:#fff3ad !important; box-shadow:inset 0 0 0 3px #ffd34d; }
  /* the cell a hint says is misplaced: orange ring + gentle wiggle */
  .cell.hintwrong { box-shadow:inset 0 0 0 3px #ff8a3d !important; }
  .cell.hintwrong .sym { animation:confwob .9s ease-in-out infinite; }
  .cell.cellwin { animation:cellwin .55s both; z-index:1; }
  @keyframes cellwin {
    0%{transform:scale(1)}
    45%{transform:scale(1.28); background:#ffe063; box-shadow:0 0 14px 2px #ffd34dcc;}
    100%{transform:scale(1)}
  }

  #pwrap {
    height:16px; border-radius:999px;
    background:#ffffff66;
    box-shadow:inset 0 2px 4px rgba(60,40,150,.2);
    position:relative;
    overflow:visible;
  }
  #pfill {
    height:100%; border-radius:999px;
    background:linear-gradient(90deg,#ffd34d,#ff9d5c);
    box-shadow:0 1px 3px rgba(0,0,0,.2);
    width:0%;
    transition:width .4s cubic-bezier(.34,1.56,.64,1);
    position:relative;
  }
  #pstar {
    position:absolute; right:-11px; top:50%;
    transform:translateY(-54%);
    font-size:22px;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));
  }

  /* fixed column count from layoutSizes() — the tray never has to guess where
     to wrap, so it always ends up the shape the geometry was solved for */
  #tray {
    display:grid;
    grid-template-columns:repeat(var(--tray-cols, 5), var(--tray-size));
    gap:var(--tray-gap, 10px);
    justify-content:center;
    padding:8px;
  }
  .tray-btn {
    border:none; cursor:pointer;
    width:var(--tray-size); height:var(--tray-size);
    border-radius:26%;
    background:#ffffffee;
    box-shadow:0 5px 0 rgba(0,0,0,.15), inset 0 2px 0 rgba(255,255,255,.9);
    font-size:calc(var(--tray-size) * .58);
    font-weight:800;
    line-height:1;
    transition:transform .12s, box-shadow .12s, background .12s, opacity .2s;
    font-family:inherit;
  }
  .tray-btn:active { transform:scale(.92); }
  .tray-btn { position:relative; }
  .tray-btn.selected {
    background:#ffe063;
    transform:translateY(-6px) scale(1.08);
    box-shadow:0 10px 0 rgba(0,0,0,.15), 0 0 16px 2px #ffd34d88;
  }
  .tray-btn.done { opacity:.3; transform:scale(.85); }
  /* how many of this symbol are still missing */
  .tray-btn .cnt {
    position:absolute; top:-7px; right:-7px;
    min-width:22px; height:22px; padding:0 5px;
    border-radius:999px;
    background:#7c5cff; color:#fff;
    font-size:13px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 4px rgba(0,0,0,.25);
    pointer-events:none;
  }
  .tray-btn.done .cnt { display:none; }
  .tray-btn.eraser.selected { background:#ffd0e6; box-shadow:0 10px 0 rgba(0,0,0,.15), 0 0 16px 2px #ff9ecb88; }
  .tray-btn.hintpulse { animation:traypulse .8s ease-in-out 4; }
  @keyframes traypulse {
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-9px) scale(1.12); box-shadow:0 12px 0 rgba(0,0,0,.15), 0 0 18px 4px #ffd34daa;}
  }

  /* floating praise words + sparkles */
  .praise {
    position:fixed; z-index:45; pointer-events:none;
    font-weight:800; color:#fff;
    text-shadow:0 2px 0 rgba(80,60,180,.45), 0 0 12px rgba(255,255,255,.5);
    animation:rise 1.1s forwards;
    white-space:nowrap;
  }
  @keyframes rise {
    0%{transform:translate(-50%,0) scale(.5); opacity:0}
    20%{opacity:1}
    100%{transform:translate(-50%,-70px) scale(1.2); opacity:0}
  }
  .spark {
    position:fixed; z-index:44; pointer-events:none;
    animation:sparkfly .7s forwards;
  }
  @keyframes sparkfly {
    0%{transform:translate(-50%,-50%) scale(.4); opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1); opacity:0}
  }

  /* hint walkthrough card (user-paced: Next / Got it / close) */
  #hint-bubble {
    position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 74px);
    transform:translateX(-50%) scale(.8);
    z-index:48;
    background:#fff; border-radius:20px;
    padding:14px 18px 12px;
    font-weight:800; color:#5b3fd4;
    font-size:clamp(15px,4.2vw,20px);
    box-shadow:0 10px 28px rgba(60,40,150,.35);
    width:min(92vw,480px); text-align:center;
    opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s;
  }
  #hint-bubble.show { opacity:1; pointer-events:auto; transform:translateX(-50%) scale(1); }
  #hint-bubble::after {
    content:''; position:absolute; left:50%; top:100%;
    transform:translateX(-50%);
    border:10px solid transparent; border-top-color:#fff;
  }
  /* when the card sits below the board, the tail points up instead */
  #hint-bubble.below::after {
    top:auto; bottom:100%;
    border-top-color:transparent; border-bottom-color:#fff;
  }
  #hint-x {
    position:absolute; top:-10px; right:-10px;
    width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
    background:#f1eeff; color:#5b3fd4; font-size:16px; font-weight:800;
    box-shadow:0 3px 8px rgba(60,40,150,.3);
    font-family:inherit;
  }
  #hint-x:active { transform:scale(.9); }
  #hint-text { padding:0 4px; }
  .hint-foot {
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-top:10px;
  }
  #hint-dots { display:flex; gap:6px; padding-left:4px; }
  .hdot { width:9px; height:9px; border-radius:50%; background:#ddd6f8; }
  .hdot.on { background:#7c5cff; transform:scale(1.25); }
  #hint-next {
    border:none; cursor:pointer; font-family:inherit;
    border-radius:999px; padding:9px 20px;
    font-size:clamp(14px,3.8vw,17px); font-weight:800;
    background:linear-gradient(#8de78a,#54c452); color:#0d4d0c;
    box-shadow:0 4px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.5);
    margin-left:auto;
  }
  #hint-next:active { transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.18); }
  /* arrows overlay drawn between cells during a hint step */
  #hint-arrows {
    position:fixed; inset:0; width:100%; height:100%;
    z-index:46; pointer-events:none; display:none;
  }
  /* hint focus states on cells */
  .cell.dim { opacity:.35; filter:saturate(.5); }
  .cell.band { background:#e3f1ff !important; box-shadow:inset 0 0 0 2px #8ec6ff; }
  .cell.ev { background:#d9f6bd !important; box-shadow:inset 0 0 0 2.5px #6cc24a; }
  /* faint gold destination ring: "this is where the whole chain is heading" */
  .cell.goal { box-shadow:inset 0 0 0 2px #ffcf4d; }
  .cell.goal.dim { opacity:.6; }
  /* compact census in the hint bubble: what the golden square still could be */
  .leftstrip { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin:11px 0 2px; }
  .leftstrip .ls {
    width:1.75em; height:1.75em; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:.82em; font-weight:800; position:relative;
  }
  .leftstrip .ls.gone { color:#a79fce; background:#efecfa; }
  .leftstrip .ls.chain { color:#ff5b6b; background:#ffe7ea; }
  .leftstrip .ls.gone::after, .leftstrip .ls.chain::after {
    content:''; position:absolute; left:14%; right:14%; top:50%; height:2.5px;
    background:currentColor; transform:rotate(-13deg); border-radius:2px; opacity:.85;
  }
  .leftstrip .ls.keep {
    color:#0d4d0c; background:linear-gradient(#ffe063,#ffce2c);
    box-shadow:0 0 0 2px #ffc21d; transform:scale(1.12);
  }

  /* ---------- LANDSCAPE: board left, controls right ----------
     Set by layoutSizes() whenever side-by-side buys a bigger board. The board
     gets its own full-height column; the topbar, number keypad and progress
     bar stack beside it. #board-area dissolves (display:contents) so the board
     and the progress bar can land in different grid areas. */
  html.land #game {
    display:grid;
    grid-template-columns:auto auto;
    grid-template-rows:auto 1fr auto;
    grid-template-areas:
      "board top"
      "board tray"
      "board prog";
    align-content:center; justify-content:center;
    column-gap:clamp(10px,2.2vw,26px); row-gap:8px;
    padding:8px max(8px,env(safe-area-inset-right)) 8px max(8px,env(safe-area-inset-left));
  }
  html.land #board-area { display:contents; }
  html.land #board { grid-area:board; align-self:center; }
  html.land .topbar { grid-area:top; width:auto; min-width:min(230px,32vw); }
  html.land #tray { grid-area:tray; align-self:center; }
  /* renderBoard() pins the bar to the board's width; beside the board it
     should track the panel instead */
  html.land #pwrap { grid-area:prog; align-self:end; width:auto !important; }
  /* the panel is narrow — trim the chrome so the keypad keeps the room */
  html.land .round-btn { width:46px; height:46px; font-size:21px; }
  html.land .tb-spacer { width:46px; }
  html.land #mascot { font-size:clamp(20px,3vw,30px); }
  html.land #level-label { font-size:clamp(15px,2.4vw,22px); }
  /* no room above or below the board — float the card over the panel instead */
  html.land #hint-bubble { width:min(46vw,430px); max-height:94vh; overflow-y:auto; }
  html.land #hint-bubble::after { display:none; }

  /* ---------- SETTINGS (always-visible button + panel) ---------- */
  .fab {
    position:fixed; z-index:40;
    top:max(10px, env(safe-area-inset-top)); right:max(10px, env(safe-area-inset-right));
    width:clamp(44px,10vw,54px); height:clamp(44px,10vw,54px);
    border-radius:50%; border:none; cursor:pointer;
    background:#ffffffee;
    box-shadow:0 4px 0 rgba(0,0,0,.15), inset 0 2px 0 rgba(255,255,255,.9);
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(20px,5vw,26px);
    transition:transform .1s;
  }
  .fab:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.15); }
  .fab svg.ic { animation:spin 9s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }

  .modal {
    position:absolute; inset:0; z-index:55;
    display:flex; align-items:center; justify-content:center;
    background:rgba(60,40,150,.45); backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .modal.show { opacity:1; pointer-events:auto; }
  .settings-card {
    background:#fff; border-radius:28px; padding:24px 26px;
    display:flex; flex-direction:column; gap:16px;
    min-width:min(84vw,320px);
    box-shadow:0 14px 40px rgba(0,0,0,.3);
    animation:winpop .4s;
  }
  .settings-title { font-size:clamp(22px,6vw,28px); font-weight:800; color:#5b3fd4; text-align:center; }
  .set-row { display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .set-label { font-size:clamp(17px,4.5vw,20px); font-weight:800; color:#4a3f7a; }
  .switch {
    width:58px; height:32px; border-radius:999px; border:none; padding:0;
    background:#d7cffa; position:relative; cursor:pointer;
    transition:background .2s;
    box-shadow:inset 0 1px 3px rgba(60,40,150,.25);
    flex:none;
  }
  .switch.on { background:#54c452; }
  .switch .knob {
    position:absolute; top:3px; left:3px;
    width:26px; height:26px; border-radius:50%;
    background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.3);
    transition:left .2s;
  }
  .switch.on .knob { left:29px; }

  /* ---------- WIN OVERLAY ---------- */
  #win {
    position:absolute; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:rgba(60,40,150,.45);
    backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .3s;
  }
  #win.show { opacity:1; pointer-events:auto; }
  /* rotating rays of light behind the card */
  .sunburst {
    position:absolute; left:50%; top:50%;
    width:150vmax; height:150vmax; border-radius:50%;
    background:repeating-conic-gradient(from 0deg,
      rgba(255,255,255,.18) 0deg 11deg, transparent 11deg 22deg);
    pointer-events:none; opacity:0;
    transform:translate(-50%,-50%) scale(.4);
    transition:opacity .5s;
  }
  #win.show .sunburst { opacity:1; animation:sunspin 16s linear infinite; }
  @keyframes sunspin {
    from{ transform:translate(-50%,-50%) rotate(0) scale(1); }
    to{ transform:translate(-50%,-50%) rotate(360deg) scale(1); }
  }
  .win-card {
    position:relative; overflow:visible;
    background:#fff; border-radius:30px;
    padding:30px 34px 28px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    box-shadow:0 14px 40px rgba(0,0,0,.3);
    animation:winpop .6s cubic-bezier(.34,1.56,.64,1);
    max-width:88vw;
  }
  @keyframes winpop { 0%{transform:scale(.3) rotate(-8deg)} 65%{transform:scale(1.08)} 100%{transform:scale(1)} }
  .win-mascot {
    position:absolute; top:-32px; left:50%; font-size:58px;
    transform:translateX(-50%);
    animation:winmascot 1s ease-in-out infinite;
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.25));
  }
  @keyframes winmascot {
    0%,100%{ transform:translateX(-50%) translateY(0) rotate(-7deg); }
    50%{ transform:translateX(-50%) translateY(-11px) rotate(7deg); }
  }
  .win-card .big {
    font-size:clamp(48px,13vw,78px);
    margin-top:8px;
    animation:trophyin .7s cubic-bezier(.34,1.6,.5,1) both,
              trophyshine 2.4s .7s ease-in-out infinite;
  }
  @keyframes trophyin { 0%{transform:scale(0) rotate(-40deg)} 60%{transform:scale(1.3) rotate(10deg)} 100%{transform:scale(1) rotate(0)} }
  @keyframes trophyshine {
    0%,100%{ transform:rotate(0) translateY(0); filter:drop-shadow(0 3px 4px rgba(0,0,0,.2)); }
    25%{ transform:rotate(-5deg); }
    50%{ transform:rotate(0) translateY(-6px); filter:drop-shadow(0 8px 10px rgba(255,180,0,.5)); }
    75%{ transform:rotate(5deg); }
  }
  .win-card .msg { font-size:clamp(22px,6vw,34px); font-weight:800; color:#5b3fd4; text-align:center; }
  #win-stars { display:flex; gap:6px; min-height:1.3em; }
  #win-stars span {
    font-size:clamp(26px,7vw,40px);
    opacity:0; transform:scale(0);
    animation:starpop .45s cubic-bezier(.34,1.56,.64,1) forwards;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.2));
  }
  @keyframes starpop { to{opacity:1; transform:scale(1);} }
  .win-sub { font-size:clamp(13px,3.5vw,16px); font-weight:700; color:#5b3fd499; }
  .win-actions { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .big-btn {
    border:none; cursor:pointer;
    border-radius:20px; padding:14px 22px;
    font-size:clamp(17px,4.5vw,22px); font-weight:800;
    font-family:inherit;
    box-shadow:0 5px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.5);
    transition:transform .1s;
  }
  .big-btn:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.18); }
  .primary { background:linear-gradient(#8de78a,#54c452); color:#0d4d0c; }
  .secondary { background:linear-gradient(#c9c2ff,#a394ff); color:#2e1e7a; }
  .secret {
    background:linear-gradient(#5a48a8,#39296e); color:#ffd34d;
    box-shadow:0 5px 0 rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.2), 0 0 14px 2px #ffd34d55;
    animation:secretglow 1.6s ease-in-out infinite;
  }
  @keyframes secretglow {
    0%,100%{box-shadow:0 5px 0 rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.2), 0 0 10px 1px #ffd34d44;}
    50%{box-shadow:0 5px 0 rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.2), 0 0 20px 4px #ffd34d88;}
  }

  .confetti {
    position:fixed; top:-8vh; z-index:60; pointer-events:none;
    display:block;
    animation:fall linear forwards;
  }
  @keyframes fall {
    to { transform:translateY(115vh) rotate(720deg); opacity:.7; }
  }
  /* party-popper cannons from the bottom corners: outer flings sideways,
     inner arcs up then falls, piece spins — a real parabola */
  .cann-x {
    position:fixed; z-index:60; pointer-events:none; bottom:2vh;
    animation:cannX 1.9s cubic-bezier(.15,.5,.5,1) forwards;
  }
  @keyframes cannX { to{ transform:translateX(var(--tx)); } }
  .cann-y { display:block; animation:cannY 1.9s cubic-bezier(.25,.7,.55,1) forwards; }
  @keyframes cannY {
    0%{ transform:translateY(0); opacity:1; }
    40%{ transform:translateY(var(--rise)); opacity:1; }
    100%{ transform:translateY(12vh); opacity:0; }
  }
  .cann-p { display:block; animation:cannSpin .5s linear infinite; }
  @keyframes cannSpin { to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<script>
'use strict';
/* ============================================================

const THEMES = [

const LEVELS = {

const WIN_MSGS = ['Great job!','You did it!','Amazing!','Super star!','Fantastic!','Woohoo!'];
const PRAISES = ['Yay!','Nice!','Wow!','Super!','Cool!','Great!'];

/* ---------------- SVG icons (consistent, kid-friendly, no raw emoji chrome) ---------------- */

const IC='<svg xmlns="http://www.w3.org/2000/svg" class="ic" viewBox="0 0 24 24" width="1em" height="1em"';
const ICONS={

  crown:IC+'><path d="M3.5 16.5 2.5 7l5.3 3.4L12 4.2l4.2 6.2L21.5 7l-1 9.5z" fill="#ffd34d" stroke="#e0a80f" stroke-width="1.4" stroke-linejoin="round"/><rect x="4.5" y="17.5" width="15" height="2.6" rx="1.3" fill="#e0a80f"/></svg>',
};
const STAR_PATH='M12 2.6l2.8 5.8 6.4.9-4.6 4.4 1.1 6.3L12 17l-5.7 3 1.1-6.3L2.8 9.3l6.4-.9z';

/* ---------------- SVG mascot with expressions ---------------- */

const M_STROKE='stroke="#7a4a12" stroke-width="1.7" fill="none" stroke-linecap="round"';
const M_EYES={
  dots:'<circle cx="8.7" cy="10" r="1.25" fill="#5c3a00"/><circle cx="15.3" cy="10" r="1.25" fill="#5c3a00"/>',

const M_FACES={
  happy:{eyes:'dots',mouth:'<path d="M8.2 13.8q3.8 3.6 7.6 0" '+M_STROKE+'/>'},
  joy:  {eyes:'dots',mouth:'<path d="M8 13.2a4 4 0 0 0 8 0z" fill="#7a4a12"/>'},
  wow:  {eyes:'big', mouth:'<circle cx="12" cy="15" r="2.1" fill="#7a4a12"/>',
         extra:'<path d="M6.8 7.2q1.6-1.1 3-.5M14.2 6.7q1.4-.6 3 .5" '+M_STROKE+'/>'},
  oops: {eyes:'dots',mouth:'<circle cx="12" cy="15" r="1.5" fill="#7a4a12"/>'},
  think:{eyes:'dots',mouth:'<path d="M9.3 15h4.2" '+M_STROKE+'/>',
         extra:'<path d="M13.9 6.9q1.5-.9 3-.2" '+M_STROKE+'/>'},
  party:{eyes:'arcs',mouth:'<path d="M8 13.2a4 4 0 0 0 8 0z" fill="#7a4a12"/>',
         extra:'<circle cx="3.6" cy="4.4" r="1.1" fill="#ff8fb2"/><circle cx="20.4" cy="5" r="1.2" fill="#54c452"/><circle cx="20" cy="19.4" r="1" fill="#4aa3ff"/><circle cx="3.8" cy="19" r="1" fill="#ffd34d"/>'},
};
function mascotSvg(state){
  const f=M_FACES[state]||M_FACES.happy;
  return IC+'><circle cx="12" cy="12" r="9.6" fill="#ffd76e" stroke="#e8b83a" stroke-width="1.3"/>'+
    M_EYES[f.eyes]+f.mouth+(f.extra||'')+'</svg>';
}

/* ---------------- puzzle generation ---------------- */

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function placeOk(grid,r,c,v,L){
  const n=L.n;
  for(let i=0;i<n;i++){
    if(grid[r*n+i]===v || grid[i*n+c]===v) return false;
  }
  const br=Math.floor(r/L.boxH)*L.boxH, bc=Math.floor(c/L.boxW)*L.boxW;
  for(let rr=br;rr<br+L.boxH;rr++)
    for(let cc=bc;cc<bc+L.boxW;cc++)
      if(grid[rr*n+cc]===v) return false;
  return true;
}

// Find the empty cell with fewest candidates (MRV) — keeps 9x9 search fast.
function bestCell(grid,L){
  const n=L.n;
  let bestPos=-1, bestCands=null;
  for(let p=0;p<n*n;p++){
    if(grid[p]!==0) continue;
    const r=Math.floor(p/n), c=p%n, cands=[];
    for(let v=1;v<=n;v++) if(placeOk(grid,r,c,v,L)) cands.push(v);
    if(cands.length===0) return [p,cands];
    if(!bestCands || cands.length<bestCands.length){ bestPos=p; bestCands=cands; if(cands.length===1) break; }
  }
  return [bestPos,bestCands];
}

function fillGrid(grid,L){
  const [p,cands]=bestCell(grid,L);
  if(p===-1) return true;
  if(cands.length===0) return false;
  for(const v of shuffle(cands)){
    grid[p]=v;
    if(fillGrid(grid,L)) return true;
    grid[p]=0;
  }
  return false;
}

// Returns { puzzle, solution } — puzzle has 0 for blanks, unique solution guaranteed.
// candidates for cell i on grid g under level L
function candsAt(g,i,L){
  const n=L.n, r=Math.floor(i/n), c=i%n, out=[];
  for(let v=1;v<=n;v++) if(placeOk(g,r,c,v,L)) out.push(v);
  return out;
}
// every row / column / box as a list of cell indices, for level L
function unitsForL(L){
  const n=L.n, u=[];
  for(let r=0;r<n;r++) u.push([...Array(n).keys()].map(c=>r*n+c));
  for(let c=0;c<n;c++) u.push([...Array(n).keys()].map(r=>r*n+c));
  for(let br=0;br<n;br+=L.boxH) for(let bc=0;bc<n;bc+=L.boxW){
    const cells=[]; for(let r=br;r<br+L.boxH;r++) for(let c=bc;c<bc+L.boxW;c++) cells.push(r*n+c);
    u.push(cells);
  }
  return u;
}
// Can this puzzle be finished using ONLY naked singles (a cell with one option)
// and hidden singles (a value with one home in a unit)? i.e. never a guess.
// This is exactly the reasoning the hint engine explains, so guaranteeing it
// here means every hint can always walk a real logic chain.
function logicSolvable(grid,L){
  const n=L.n, g=grid.slice(), units=unitsForL(L);
  let changed=true;
  while(changed){
    changed=false;
    for(let i=0;i<n*n;i++){
      if(g[i]!==0) continue;
      const cand=candsAt(g,i,L);
      if(cand.length===0) return false;              // contradiction
      if(cand.length===1){ g[i]=cand[0]; changed=true; }
    }
    if(changed) continue;
    for(const cells of units){
      for(let v=1;v<=n && !changed;v++){
        if(cells.some(p=>g[p]===v)) continue;
        let spot=-1, cnt=0;
        for(const p of cells) if(g[p]===0 && placeOk(g,Math.floor(p/n),p%n,v,L)){ spot=p; if(++cnt>1) break; }
        if(cnt===1){ g[spot]=v; changed=true; }
      }
      if(changed) break;
    }
  }
  return g.every(x=>x!==0);
}

// Build a puzzle that is solvable by pure logic (no guessing). Removing cells
// only while it stays logicSolvable also guarantees a unique solution.
function makePuzzle(L){
  const n=L.n;
  if(L.hard) return makeHardPuzzle(L);
  const solution=new Array(n*n).fill(0);
  fillGrid(solution,L);
  const puzzle=solution.slice();
  let removed=0;
  for(const idx of shuffle([...Array(n*n).keys()])){
    if(removed>=L.blanks) break;
    const saved=puzzle[idx];
    puzzle[idx]=0;
    if(logicSolvable(puzzle,L)) removed++;
    else puzzle[idx]=saved;
  }
  return { puzzle, solution };
}

// count solutions up to `limit` (for uniqueness) — fast backtracking
function countSolutions(grid,L,limit){
  const [p,cands]=bestCell(grid,L);
  if(p===-1) return 1;
  if(cands.length===0) return 0;
  let count=0;
  for(const v of cands){
    grid[p]=v;
    count+=countSolutions(grid,L,limit-count);
    grid[p]=0;
    if(count>=limit) break;
  }
  return count;
}

// Dig as many holes as possible while keeping a UNIQUE solution, then (if it
// needs logic beyond our engine) restore clues until the engine can crack it —
// so it stays hard but every hint can still be derived.
function digUnique(solution,L){
  const n=L.n, puzzle=solution.slice(), removedOrder=[];
  let removed=0;
  for(const idx of shuffle([...Array(n*n).keys()])){
    if(removed>=L.blanks) break;
    const saved=puzzle[idx];
    puzzle[idx]=0;
    if(countSolutions(puzzle.slice(),L,2)===1){ removed++; removedOrder.push(idx); }
    else puzzle[idx]=saved;
  }
  shuffle(removedOrder);
  let gi=0;
  while(!solve(puzzle,L).solved && gi<removedOrder.length){
    puzzle[removedOrder[gi]]=solution[removedOrder[gi]]; gi++;
  }
  return puzzle;
}
/* ---- how hard is this puzzle, really? ----------------------------------
   The solver always reaches for the cheapest technique that works, so its
   trace is the least-effort human path — and what that path costs IS the
   difficulty. Singles are free (you spot them without thinking); everything
   above them is priced by how hard it is to see. `stalls` counts the separate
   moments where the singles dry up and you have to go hunting, which is what
   actually makes a grid feel hard rather than merely long.

   Rating a Legend by its single toughest technique (the old measure) said a
   puzzle needing one pair and fifty naked singles was as hard as one needing
   six wings — which is how 7% of Legends came out solvable by singles alone. */
function difficultyOf(pz,L){
  const r=solve(pz,L);
  if(!r.solved) return -1;                 // beyond the engine: unusable
  let t2=0,t3=0,t4=0,stalls=0,prevAdv=false;
  for(const d of r.trace){
    if(d.tier===2) t2++; else if(d.tier===3) t3++; else if(d.tier===4) t4++;
    if(d.tier>=2){ if(!prevAdv) stalls++; prevAdv=true; } else prevAdv=false;
  }
  return 3*t2 + 9*t3 + 22*t4 + 4*stalls;
}

const LEGEND_TARGET=70;   // comfortably legendary — stop searching once here
const LEGEND_FLOOR=28;    // keep spending seeds until at least this hard
const LEGEND_MIN_TIER=3;  // ...and until a pair-or-harder is genuinely required
const LEGEND_SLICE=130;   // ms of search per starting grid
const LEGEND_BUDGET=260;  // ms after which the floor is all we still chase
const LEGEND_SEEDS=4;     // hard cap on starting grids, so the wait is bounded
const LEGEND_RUIN=12;     // clues handed back per ruin-and-recreate pass

/* Hard puzzle by ruin-and-recreate search.

   Digging at random lands on a singles-only grid ~70% of the time, so the old
   best-of-7 sampling was doing all the work and doing it weakly. But a full
   dig costs ~20ms (uniqueness counting) while a logic solve costs ~0.04ms, so
   *searching* the clue set is 500x cheaper than resampling it: dig once for a
   valid seed, then repeatedly hand a few clues back and greedily re-dig,
   keeping whatever scores higher.

   Every removal here is gated on the logic engine still solving the grid. A
   deductive solve proves the answer is forced, so that single test keeps the
   solution unique AND keeps every step explainable by the hint engine. */
function makeHardPuzzle(L){
  const n=L.n, all=[...Array(n*n).keys()];
  const start=performance.now();
  let best=null, bestSol=null, bestSc=-1, bestTier=0, seeds=0;
  const keep=(pz,sol,sc)=>{ best=pz.slice(); bestSol=sol.slice(); bestSc=sc; bestTier=solve(pz,L).hardestTier; };
  do {
    seeds++;
    const seedEnd=performance.now()+LEGEND_SLICE;
    const solution=new Array(n*n).fill(0);
    fillGrid(solution,L);
    let cur=digUnique(solution,L), curSc=difficultyOf(cur,L);
    if(curSc>bestSc) keep(cur,solution,curSc);
    while(bestSc<LEGEND_TARGET && performance.now()<seedEnd){
      const cand=cur.slice();
      // ruin: hand a handful of clues back, opening up new ways to dig
      for(const h of shuffle(all.filter(i=>cand[i]===0)).slice(0,LEGEND_RUIN))
        cand[h]=solution[h];
      // recreate: pull clues out again, in a fresh order, as deep as logic allows
      for(const i of shuffle(all.slice())){
        if(cand[i]===0) continue;
        const saved=cand[i]; cand[i]=0;
        if(!solve(cand,L).solved) cand[i]=saved;
      }
      const sc=difficultyOf(cand,L);
      if(sc>=curSc){ cur=cand; curSc=sc; }        // sideways moves keep it exploring
      if(sc>bestSc) keep(cand,solution,sc);
    }
    // Out of slice. Take another starting grid if this one still falls short of
    // what Legend promises, or if the budget has room left to chase the target.
  } while(bestSc<LEGEND_TARGET && seeds<LEGEND_SEEDS &&
          (bestSc<LEGEND_FLOOR || bestTier<LEGEND_MIN_TIER ||
           performance.now()-start<LEGEND_BUDGET));
  return { puzzle:best, solution:bestSol };
}

/* ============================================================
   Deductive solver — a human-style logic engine used both to
   generate hard puzzles and to walk the hint derivation chain.
   Works on candidate bitmasks; every deduction records its reason.
   ============================================================ */

function bitcount(m){ let c=0; while(m){ m&=m-1; c++; } return c; }
function bitsOf(m){ const out=[]; let v=1; while(m){ if(m&1) out.push(v); m>>=1; v++; } return out; }
function kcombos(arr,k){
  const res=[], n=arr.length;
  (function rec(start,combo){
    if(combo.length===k){ res.push(combo.slice()); return; }
    for(let i=start;i<n;i++){ combo.push(arr[i]); rec(i+1,combo); combo.pop(); }
  })(0,[]);
  return res;
}

// precomputed geometry for a level
let SCTX=null, SCTX_KEY='';
function solverCtx(L){
  const key=L.n+'-'+L.boxW+'-'+L.boxH;
  if(SCTX && SCTX_KEY===key) return SCTX;
  const n=L.n, bpr=n/L.boxW;
  const rows=[],cols=[],boxes=[];
  for(let r=0;r<n;r++) rows.push([...Array(n)].map((_,c)=>r*n+c));
  for(let c=0;c<n;c++) cols.push([...Array(n)].map((_,r)=>r*n+c));
  for(let b=0;b<n;b++) boxes.push([]);
  const boxOfCell=i=>{ const r=Math.floor(i/n),c=i%n; return Math.floor(r/L.boxH)*bpr+Math.floor(c/L.boxW); };
  for(let i=0;i<n*n;i++) boxes[boxOfCell(i)].push(i);
  const units=[...rows.map(c=>({kind:'row',cells:c})),
               ...cols.map(c=>({kind:'column',cells:c})),
               ...boxes.map(c=>({kind:'little square',cells:c}))];
  const peers=[]; for(let i=0;i<n*n;i++) peers.push(new Set());
  for(const u of units) for(const a of u.cells) for(const b of u.cells) if(a!==b) peers[a].add(b);
  SCTX={n,L,rows,cols,boxes,units,peers,boxOfCell}; SCTX_KEY=key;
  return SCTX;
}

function computeCands(grid,ctx){
  const n=ctx.n, cand=new Array(n*n).fill(0);
  for(let i=0;i<n*n;i++){
    if(grid[i]!==0) continue;
    let m=0;
    for(const q of ctx.peers[i]) if(grid[q]!==0) m|=1<<(grid[q]-1);
    cand[i]=(~m)&((1<<n)-1);
  }
  return cand;
}

function applyDeduction(state,d,ctx){
  if(d.kind==='place'){
    state.grid[d.cell]=d.value; state.cand[d.cell]=0;
    const b=~(1<<(d.value-1));
    for(const q of ctx.peers[d.cell]) state.cand[q]&=b;
  } else {
    for(const e of d.elims) state.cand[e.cell]&=~(1<<(e.value-1));
  }
}

/* ---- techniques: each returns the first deduction it finds, or null ---- */

function tNakedSingle(s,ctx){
  for(let i=0;i<s.cand.length;i++){
    if(s.grid[i]!==0) continue;
    const m=s.cand[i];
    if(bitcount(m)===1) return {tier:1,kind:'place',tech:'naked single',cell:i,value:bitsOf(m)[0]};
  }
  return null;
}
function tHiddenSingle(s,ctx){
  for(const u of ctx.units){
    for(let v=1;v<=ctx.n;v++){
      const b=1<<(v-1);
      if(u.cells.some(p=>s.grid[p]===v)) continue;
      let spot=-1,cnt=0;
      for(const p of u.cells) if(s.grid[p]===0 && (s.cand[p]&b)){ spot=p; if(++cnt>1) break; }
      if(cnt===1) return {tier:1,kind:'place',tech:'hidden single',cell:spot,value:v,unitKind:u.kind,unitCells:u.cells};
    }
  }
  return null;
}
function tPointing(s,ctx){
  for(const box of ctx.boxes){
    for(let v=1;v<=ctx.n;v++){
      const b=1<<(v-1);
      const cells=box.filter(p=>s.grid[p]===0 && (s.cand[p]&b));
      if(cells.length<2) continue;
      const rs=new Set(cells.map(p=>Math.floor(p/ctx.n))), cs=new Set(cells.map(p=>p%ctx.n));
      let lineCells=null,lineKind=null;
      if(rs.size===1){ lineCells=ctx.rows[[...rs][0]]; lineKind='row'; }
      else if(cs.size===1){ lineCells=ctx.cols[[...cs][0]]; lineKind='column'; }
      if(!lineCells) continue;
      const boxSet=new Set(box), elims=[];
      for(const p of lineCells) if(!boxSet.has(p) && s.grid[p]===0 && (s.cand[p]&b)) elims.push({cell:p,value:v});
      if(elims.length) return {tier:2,kind:'elim',tech:'pointing',value:v,elims,patternCells:cells,unitKind:lineKind,lineCells,boxCells:box};
    }
  }
  return null;
}
function tClaiming(s,ctx){
  const lines=[...ctx.rows.map(c=>({kind:'row',cells:c})),...ctx.cols.map(c=>({kind:'column',cells:c}))];
  for(const line of lines){
    for(let v=1;v<=ctx.n;v++){
      const b=1<<(v-1);
      const cells=line.cells.filter(p=>s.grid[p]===0 && (s.cand[p]&b));
      if(cells.length<2) continue;
      const bs=new Set(cells.map(p=>ctx.boxOfCell(p)));
      if(bs.size!==1) continue;
      const box=ctx.boxes[[...bs][0]], lineSet=new Set(line.cells), elims=[];
      for(const p of box) if(!lineSet.has(p) && s.grid[p]===0 && (s.cand[p]&b)) elims.push({cell:p,value:v});
      if(elims.length) return {tier:2,kind:'elim',tech:'claiming',value:v,elims,patternCells:cells,unitKind:line.kind,boxCells:box,lineCells:line.cells};
    }
  }
  return null;
}
function tNakedSubset(s,ctx,k){
  for(const u of ctx.units){
    const empt=u.cells.filter(p=>s.grid[p]===0);
    if(empt.length<=k) continue;
    for(const combo of kcombos(empt,k)){
      let union=0; for(const p of combo) union|=s.cand[p];
      if(bitcount(union)!==k) continue;
      if(combo.some(p=>bitcount(s.cand[p])<2)) continue;
      const elims=[];
      for(const p of empt){ if(combo.includes(p)) continue; const common=s.cand[p]&union; if(common) for(const v of bitsOf(common)) elims.push({cell:p,value:v}); }
      if(elims.length) return {tier:3,kind:'elim',tech:(k===2?'naked pair':'naked triple'),elims,patternCells:combo,values:bitsOf(union),unitKind:u.kind,unitCells:u.cells};
    }
  }
  return null;
}
function tHiddenSubset(s,ctx,k){
  for(const u of ctx.units){
    const vals=[]; for(let v=1;v<=ctx.n;v++) if(!u.cells.some(p=>s.grid[p]===v)) vals.push(v);
    if(vals.length<=k) continue;
    for(const combo of kcombos(vals,k)){
      const mask=combo.reduce((m,v)=>m|(1<<(v-1)),0);
      const cells=u.cells.filter(p=>s.grid[p]===0 && (s.cand[p]&mask));
      if(cells.length!==k) continue;
      if(!combo.every(v=>{ const b=1<<(v-1); return cells.some(p=>s.cand[p]&b); })) continue;
      const elims=[];
      for(const p of cells){ const extra=s.cand[p]&~mask; if(extra) for(const v of bitsOf(extra)) elims.push({cell:p,value:v}); }
      if(elims.length) return {tier:3,kind:'elim',tech:(k===2?'hidden pair':'hidden triple'),elims,patternCells:cells,values:combo,unitKind:u.kind,unitCells:u.cells};
    }
  }
  return null;
}
function tXWing(s,ctx){
  const n=ctx.n;
  for(let v=1;v<=n;v++){
    const b=1<<(v-1);
    const rowCols=[];
    for(let r=0;r<n;r++){ const cs=[]; for(let c=0;c<n;c++){ const p=r*n+c; if(s.grid[p]===0&&(s.cand[p]&b)) cs.push(c); } rowCols[r]=cs; }
    for(let r1=0;r1<n;r1++){ if(rowCols[r1].length!==2) continue;
      for(let r2=r1+1;r2<n;r2++){ if(rowCols[r2].length!==2) continue;
        if(rowCols[r1][0]===rowCols[r2][0] && rowCols[r1][1]===rowCols[r2][1]){
          const [c1,c2]=rowCols[r1], elims=[];
          for(let r=0;r<n;r++){ if(r===r1||r===r2) continue; for(const c of [c1,c2]){ const p=r*n+c; if(s.grid[p]===0&&(s.cand[p]&b)) elims.push({cell:p,value:v}); } }
          if(elims.length) return {tier:4,kind:'elim',tech:'X-Wing',value:v,elims,patternCells:[r1*n+c1,r1*n+c2,r2*n+c1,r2*n+c2],unitKind:'row'};
        }
      }
    }
    const colRows=[];
    for(let c=0;c<n;c++){ const rs=[]; for(let r=0;r<n;r++){ const p=r*n+c; if(s.grid[p]===0&&(s.cand[p]&b)) rs.push(r); } colRows[c]=rs; }
    for(let c1=0;c1<n;c1++){ if(colRows[c1].length!==2) continue;
      for(let c2=c1+1;c2<n;c2++){ if(colRows[c2].length!==2) continue;
        if(colRows[c1][0]===colRows[c2][0] && colRows[c1][1]===colRows[c2][1]){
          const [r1,r2]=colRows[c1], elims=[];
          for(let c=0;c<n;c++){ if(c===c1||c===c2) continue; for(const r of [r1,r2]){ const p=r*n+c; if(s.grid[p]===0&&(s.cand[p]&b)) elims.push({cell:p,value:v}); } }
          if(elims.length) return {tier:4,kind:'elim',tech:'X-Wing',value:v,elims,patternCells:[r1*n+c1,r2*n+c1,r1*n+c2,r2*n+c2],unitKind:'column'};
        }
      }
    }
  }
  return null;
}
function tXYWing(s,ctx){
  const n=ctx.n;
  const bi=[]; for(let i=0;i<n*n;i++) if(s.grid[i]===0 && bitcount(s.cand[i])===2) bi.push({i,m:s.cand[i]});
  const see=(a,b)=>ctx.peers[a].has(b);
  for(const piv of bi){
    for(const p1 of bi){ if(p1.i===piv.i || !see(piv.i,p1.i)) continue;
      const sh1=p1.m&piv.m; if(bitcount(sh1)!==1) continue;
      const z1=p1.m&~piv.m; if(bitcount(z1)!==1) continue;
      for(const p2 of bi){ if(p2.i===piv.i||p2.i===p1.i||!see(piv.i,p2.i)) continue;
        const sh2=p2.m&piv.m; if(bitcount(sh2)!==1 || sh2===sh1) continue;
        if((p2.m&~piv.m)!==z1) continue;              // same z
        const z=bitsOf(z1)[0], elims=[];
        for(let i=0;i<n*n;i++){ if(s.grid[i]!==0||i===piv.i||i===p1.i||i===p2.i) continue;
          if((s.cand[i]&z1) && see(p1.i,i) && see(p2.i,i)) elims.push({cell:i,value:z}); }
        if(elims.length) return {tier:4,kind:'elim',tech:'XY-Wing',value:z,elims,patternCells:[piv.i,p1.i,p2.i],unitKind:null};
      }
    }
  }
  return null;
}

const TECHS=[
  tNakedSingle, tHiddenSingle, tPointing, tClaiming,
  (s,c)=>tNakedSubset(s,c,2), (s,c)=>tHiddenSubset(s,c,2),
  (s,c)=>tNakedSubset(s,c,3), (s,c)=>tHiddenSubset(s,c,3),
  tXWing, tXYWing
];

// Solve as far as pure logic allows, recording the full reasoned trace.
function solve(grid,L){
  const ctx=solverCtx(L);
  const state={grid:grid.slice(), cand:computeCands(grid,ctx)};
  const trace=[]; let hardestTier=0, guard=0;
  while(state.grid.some(v=>v===0)){
    if(++guard>1000) break;
    let d=null;
    for(const t of TECHS){ d=t(state,ctx); if(d) break; }
    if(!d) return {solved:false, trace, hardestTier, state, ctx};
    hardestTier=Math.max(hardestTier,d.tier);
    d.candBefore=state.cand.slice();   // snapshot for the hint's spotlight marks
    applyDeduction(state,d,ctx);
    trace.push(d);
  }
  return {solved:true, trace, hardestTier, state, ctx};
}

/* ---------------- sound (WebAudio, no assets) ---------------- */

let soundOn = localStorage.getItem('sudoku-sound') !== 'off';
let actx = null;
function ac(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); return actx; }
function tone(freq, t0, dur, type='sine', vol=0.18){
  const ctx=ac(), o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0, ctx.currentTime+t0);
  g.gain.linearRampToValueAtTime(vol, ctx.currentTime+t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+t0+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(ctx.currentTime+t0); o.stop(ctx.currentTime+t0+dur+0.05);
}
// Streak climbs a major-pentatonic ladder — always musical, never dissonant.
const PENTA=[1, 9/8, 5/4, 3/2, 5/3, 2, 9/4, 5/2];
function sfx(name){
  if(!soundOn) return;
  try{
    if(name==='tap')   tone(520,0,.08,'triangle',.12);
    if(name==='place'){
      const base=523*PENTA[Math.min(streak,PENTA.length-1)];
      tone(base,0,.1,'triangle',.16);
      tone(base*1.5,.07,.14,'triangle',.14);
    }
    if(name==='wrong'){ tone(220,0,.15,'sine',.1); tone(180,.12,.2,'sine',.1); }
    if(name==='hint') { tone(880,0,.08,'sine',.12); tone(1100,.08,.1,'sine',.12); }
    if(name==='poof') { tone(320,0,.08,'triangle',.12); tone(200,.05,.14,'sine',.1); }
    if(name==='no')   { tone(240,0,.12,'sine',.09); }
    if(name==='unit') { [659,880,1175].forEach((f,i)=>tone(f,i*.08,.14,'triangle',.15)); }
    if(name==='win')  { [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.12,.25,'triangle',.16)); }
  }catch(e){}
}
let vibeOn = localStorage.getItem('sudoku-vibe') !== 'off';
function buzz(ms){ if(vibeOn && navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

/* ---------------- state ---------------- */

let styleKey = localStorage.getItem('sudoku-style')==='animal' ? 'animal' : 'classic';
let levelIdx=0, L=LEVELS[styleKey][0];
let isClassic=false;
let puzzle=[], solution=[], board=[];   // board = current player state
let symbols=[];                          // display strings for values 1..n
let selectedVal=0;                       // selected tray symbol (0 = none) — "stamp" mode
let selectedCell=-1;                     // selected empty cell (-1 = none) — "slot first" mode
let eraserOn=false;                      // eraser tool selected
let solvedFlag=false;
let streak=0;                            // consecutive correct placements

const $=id=>document.getElementById(id);
const boardEl=$('board'), trayEl=$('tray');

/* stars: { animal:[0,0,0,0], classic:[0,0,0,0] } (migrates old flat-array format) */
function stars(){
  const pad=a=>{ a=Array.isArray(a)?a.slice():[]; while(a.length<5) a.push(0); return a; };
  try{
    const raw=JSON.parse(localStorage.getItem('sudoku-stars')||'null');
    if(Array.isArray(raw)) return { animal:pad(raw), classic:pad([]) };
    if(raw && raw.animal) return { animal:pad(raw.animal), classic:pad(raw.classic) };
  }catch(e){}
  return { animal:pad([]), classic:pad([]) };
}
function addStar(){
  const s=stars();
  s[styleKey][levelIdx]=Math.min((s[styleKey][levelIdx]||0)+1,5);
  localStorage.setItem('sudoku-stars',JSON.stringify(s));
  return s[styleKey][levelIdx];
}

// Legend is hidden until the player beats Champion (or has already played it).
function legendUnlocked(){ return localStorage.getItem('sudoku-legend')==='1' || (stars().classic[4]||0)>0; }
function unlockLegend(){ localStorage.setItem('sudoku-legend','1'); }

/* ---------------- rendering ---------------- */

function renderMenu(){
  const s=stars();
  $('subtitle').textContent=SUBTITLES[styleKey];
  $('style-animal').classList.toggle('active',styleKey==='animal');
  $('style-classic').classList.toggle('active',styleKey==='classic');
  LEVELS[styleKey].forEach((lv,i)=>{
    if(!$('emoji'+i)) return;   // hidden levels have no menu card
    $('emoji'+i).textContent = lv.emoji;
    $('name'+i).textContent=lv.name;
    $('desc'+i).textContent=lv.desc;
    $('stars'+i).innerHTML=ICONS.star.repeat(s[styleKey][i]||0);
  });
  // Legend shows only on the Numbers tab, and only once it's unlocked
  $('level-legend').style.display = (styleKey==='classic' && legendUnlocked()) ? '' : 'none';
}

/* Board + tray geometry for the current viewport.

   Two arrangements. Stacked (topbar / board / tray down the page) is the
   natural one and wins on any upright screen. Side-by-side (board left,
   controls right) wins when the screen is wider than it is tall: the stack
   then has to fit the board into ~60% of a short height, which shrinks it to
   a postage stamp and pushes the tray off the bottom edge. We simply build
   both and keep whichever gives the child a bigger board. */
function layoutSizes(){
  const n=L.n;
  const vw=Math.min(window.innerWidth, document.documentElement.clientWidth||1e9);
  const vh=window.innerHeight;
  const gap = n===9?2:3;                 // thin line between cells
  const bgap = n===9?6:8;                // thick line between boxes
  const sx=n/L.boxW-1, sy=n/L.boxH-1;    // box separators per axis
  const cellFor=max=>Math.max(12, Math.floor(Math.min(
    (max-16-sx*bgap-(n+sx-1)*gap)/n,
    (max-16-sy*bgap-(n+sy-1)*gap)/n)));
  const boardWFor=c=>c*n+sx*bgap+(n+sx-1)*gap+16;
  const tgap=Math.min(vw*0.02, 12);
  const nBtn=n+1;                        // +1 for the eraser

  // stacked: board must leave room for topbar + progress + tray below it
  const stackRows = n>6 && vw<560 ? 2 : 1;
  const stackCell=cellFor(Math.min(vw*0.94, vh*(stackRows===2?0.54:0.6), 620));
  // side-by-side: board takes the height, the panel takes a slice of the width
  const sideCell=cellFor(Math.min(vh-22, vw-PANEL_MIN, 620));   // -22 = page padding
  const side = vw>vh && sideCell>stackCell;

  let cell, cols, ts;
  if(side){
    cell=sideCell;
    // Room left for the panel once the board has its column, and the height
    // left once the topbar and progress bar have theirs. The gutter is the
    // page padding, the column gap and the tray's own padding — miss any of
    // it and the grid overflows, shoving the board off the left edge.
    const colGap=Math.min(26,Math.max(10,vw*0.022));
    const restW=vw-boardWFor(cell)-(32+colGap);
    const restH=vh-PANEL_CHROME;
    // Pick the keypad shape. Big buttons matter most (small fingers), but a
    // shape is also better for spanning the panel instead of hugging one edge,
    // worse for a ragged last row, and worse for standing taller than it is
    // wide — a 2x5 strip beside the board reads as a leftover column, not a
    // keypad. Once buttons hit the 84px cap those are all that's left to
    // choose on; on a cramped panel the size term takes over again.
    let bestScore=-1; ts=0; cols=1;
    for(let k=1;k<=nBtn;k++){
      const rows=Math.ceil(nBtn/k);
      const s=Math.floor(Math.min((restW-(k-1)*tgap)/k, (restH-(rows-1)*tgap)/rows, 84));
      const fill=Math.min(1,(k*s+(k-1)*tgap)/restW);
      const score=s+26*fill-5*(k*rows-nBtn)-12*Math.max(0,rows-k);
      if(score>bestScore){ bestScore=score; ts=s; cols=k; }
    }
    ts=Math.max(ts,30);
  } else {
    cell=stackCell;
    cols=Math.ceil(nBtn/stackRows);
    ts=Math.min(Math.floor((vw*0.94-16-tgap*(cols-1))/cols), 84);
  }
  document.documentElement.classList.toggle('land', side);
  document.documentElement.style.setProperty('--tray-size', ts+'px');
  document.documentElement.style.setProperty('--tray-gap', tgap+'px');
  document.documentElement.style.setProperty('--tray-cols', cols);
  return {cell, gap, bgap, sx};
}
const PANEL_MIN=200;      // narrowest the side panel may squeeze the board to
const PANEL_CHROME=124;   // topbar + progress bar + gaps above/below the tray

function symColor(v){ return isClassic ? DIGIT_COLORS[(v-1)%DIGIT_COLORS.length] : ''; }
// symbol as rich text for the hint bubble: colored bold digit, or the emoji piece
function symTag(v){ return isClassic ? '<b style="color:'+symColor(v)+'">'+symbols[v-1]+'</b>' : symbols[v-1]; }
function boxOf(i){ const n=L.n,r=Math.floor(i/n),c=i%n; return Math.floor(r/L.boxH)*100+Math.floor(c/L.boxW); }

function renderBoard(){
  const n=L.n, {cell,gap,bgap,sx}=layoutSizes();
  // spacer tracks between boxes render as thick lines of the board color
  const colTracks=[], rowTracks=[];
  for(let c=0;c<n;c++){ if(c>0&&c%L.boxW===0) colTracks.push(bgap+'px'); colTracks.push(cell+'px'); }
  for(let r=0;r<n;r++){ if(r>0&&r%L.boxH===0) rowTracks.push(bgap+'px'); rowTracks.push(cell+'px'); }
  boardEl.style.gridTemplateColumns=colTracks.join(' ');
  boardEl.style.gridTemplateRows=rowTracks.join(' ');
  boardEl.style.gap=gap+'px';
  boardEl.innerHTML='';
  for(let i=0;i<n*n;i++){
    const r=Math.floor(i/n), c=i%n;
    const d=document.createElement('div');
    const altBox=(Math.floor(r/L.boxH)+Math.floor(c/L.boxW))%2===1;
    d.className='cell'+(altBox?' alt':'')+(board[i]===0?' hole':'')+(i===selectedCell?' sel':'');
    d.style.gridColumn=c+Math.floor(c/L.boxW)+1;
    d.style.gridRow=r+Math.floor(r/L.boxH)+1;
    d.style.width=d.style.height=cell+'px';
    d.style.fontSize=Math.floor(cell*0.62)+'px';
    const s=document.createElement('span');
    s.className='sym';
    if(board[i]){ s.textContent=symbols[board[i]-1]; s.style.color=symColor(board[i]); }
    d.appendChild(s);
    d.addEventListener('click',()=>onCellTap(i,d));
    boardEl.appendChild(d);
  }
  const boardW=cell*n+sx*bgap+(n+sx-1)*gap+16;
  $('pwrap').style.width=boardW+'px';
  updateHighlights();
  updateConflicts();
  updateProgress();
}

function renderTray(){
  trayEl.innerHTML='';
  for(let v=1;v<=L.n;v++){
    const b=document.createElement('button');
    b.className='tray-btn';
    const t=document.createElement('span');
    t.textContent=symbols[v-1];
    t.style.color=symColor(v);
    b.appendChild(t);
    const cnt=document.createElement('span');
    cnt.className='cnt';
    b.appendChild(cnt);
    b.dataset.val=v;
    b.addEventListener('click',e=>{ e.preventDefault(); onTrayTap(v); });
    trayEl.appendChild(b);
  }
  const er=document.createElement('button');
  er.className='tray-btn eraser';
  er.innerHTML=ICONS.eraser;
  er.setAttribute('aria-label','Eraser');
  er.addEventListener('click',e=>{ e.preventDefault(); onEraserTap(); });
  trayEl.appendChild(er);
  updateTray();
}

function updateTray(){
  const counts=new Array(L.n+1).fill(0);
  board.forEach(v=>{ if(v) counts[v]++; });
  trayEl.querySelectorAll('.tray-btn').forEach(b=>{
    if(b.classList.contains('eraser')){ b.classList.toggle('selected',eraserOn); return; }
    const v=+b.dataset.val;
    const done=counts[v]>=L.n;
    b.classList.toggle('done',done);
    b.classList.toggle('selected',v===selectedVal && !done);
    b.querySelector('.cnt').textContent=Math.max(0,L.n-counts[v]);
    if(done && selectedVal===v) selectedVal=0;
  });
  updateHighlights();
}

/* Single source of truth for every persistent cell highlight — driven only
   by state (selectedCell / selectedVal / eraserOn / board). Called after any
   state change so highlights can never get out of sync:
     sel      the chosen empty cell (slot-first mode)
     rc       that cell's row / column / box (teaches the rule)
     match    cells already holding the chosen tray symbol (stamp mode)
     erasable player-placed cells the eraser can rub out (eraser mode) */
function updateHighlights(){
  const n=L.n;
  const selR=selectedCell>=0?Math.floor(selectedCell/n):-1;
  const selC=selectedCell>=0?selectedCell%n:-1;
  const selB=selectedCell>=0?boxOf(selectedCell):-1;
  for(let i=0;i<n*n;i++){
    const el=boardEl.children[i];
    if(!el) continue;
    const r=Math.floor(i/n), c=i%n;
    const isSel = i===selectedCell;
    el.classList.toggle('sel', isSel);
    el.classList.toggle('rc', !isSel && selectedCell>=0 && !hintActive() &&
      (r===selR || c===selC || boxOf(i)===selB));
    el.classList.toggle('match', selectedVal>0 && board[i]===selectedVal);
    el.classList.toggle('erasable', eraserOn && puzzle[i]===0 && board[i]!==0);
  }
}

// Progress tracks only the blanks the player must fill (not the given clues),
// counting correct placements — so the bar starts empty and reaches 100%
// exactly when the puzzle is solved.
function updateProgress(){
  let need=0, done=0;
  for(let i=0;i<board.length;i++){
    if(puzzle[i]===0){ need++; if(board[i]===solution[i]) done++; }
  }
  const pct = need ? Math.round(100*done/need) : 100;
  $('pfill').style.width=pct+'%';
}

// 'sel' is applied by updateHighlights, so this just moves the state + refreshes.
function selectCell(i){ selectedCell=i; updateHighlights(); }

/* ---------------- juicy feedback ---------------- */

let mascotTimer=null;
function mascotReact(state,ms){
  const m=$('mascot');
  m.innerHTML=mascotSvg(state);
  m.classList.remove('bounce'); void m.offsetWidth; m.classList.add('bounce');
  clearTimeout(mascotTimer);
  if(ms) mascotTimer=setTimeout(()=>{ m.innerHTML=mascotSvg('happy'); },ms);
}

const SPARK_COLORS=['#ffd34d','#ff9d5c','#a394ff','#54c452','#4aa3ff'];
function sparkleBurst(el){
  const rect=el.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  for(let k=0;k<6;k++){
    const s=document.createElement('span');
    s.className='spark';
    const sz=Math.max(12,rect.width*0.3);
    s.innerHTML='<svg viewBox="0 0 24 24" width="'+sz+'" height="'+sz+'"><path d="'+STAR_PATH+'" fill="'+SPARK_COLORS[k%SPARK_COLORS.length]+'"/></svg>';
    const ang=Math.PI*2*k/6 + Math.random()*.6;
    const dist=rect.width*(0.8+Math.random()*0.6);
    s.style.setProperty('--dx',Math.cos(ang)*dist+'px');
    s.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    s.style.left=cx+'px'; s.style.top=cy+'px';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),800);
  }
}

function praiseAt(el,text){
  const rect=el.getBoundingClientRect();
  const p=document.createElement('span');
  p.className='praise';
  p.textContent=text;
  p.style.left=(rect.left+rect.width/2)+'px';
  p.style.top=(rect.top-6)+'px';
  p.style.fontSize=Math.max(18,Math.min(30,rect.width*0.5))+'px';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),1200);
}

// When a row, column, or box gets completed, its cells do a golden wave.
function celebrateUnits(i){
  const n=L.n, r=Math.floor(i/n), c=i%n;
  const units=[];
  const rowCells=[...Array(n).keys()].map(k=>r*n+k);
  const colCells=[...Array(n).keys()].map(k=>k*n+c);
  const br=Math.floor(r/L.boxH)*L.boxH, bc=Math.floor(c/L.boxW)*L.boxW;
  const boxCells=[];
  for(let rr=br;rr<br+L.boxH;rr++) for(let cc=bc;cc<bc+L.boxW;cc++) boxCells.push(rr*n+cc);
  for(const cells of [rowCells,colCells,boxCells]){
    if(cells.every(p=>board[p]===solution[p])) units.push(cells);
  }
  if(!units.length) return false;
  const seen=new Set();
  let k=0;
  for(const cells of units){
    for(const p of cells){
      if(seen.has(p)) continue;
      seen.add(p);
      const el=boardEl.children[p];
      el.style.animationDelay=(k*40)+'ms';
      el.classList.remove('cellwin'); void el.offsetWidth; el.classList.add('cellwin');
      k++;
    }
  }
  setTimeout(()=>{ seen.forEach(p=>{ const el=boardEl.children[p]; if(el){ el.classList.remove('cellwin'); el.style.animationDelay=''; } }); },k*40+900);
  sfx('unit'); buzz([40,30,40]);
  return true;
}

/* ---------------- conflicts ---------------- */

// All rows, columns, and boxes as {kind, cells[]}.
function unitList(){
  const n=L.n, units=[];
  for(let r=0;r<n;r++) units.push({kind:'row', cells:[...Array(n).keys()].map(c=>r*n+c)});
  for(let c=0;c<n;c++) units.push({kind:'column', cells:[...Array(n).keys()].map(r=>r*n+c)});
  for(let br=0;br<n;br+=L.boxH)
    for(let bc=0;bc<n;bc+=L.boxW){
      const cells=[];
      for(let r=br;r<br+L.boxH;r++) for(let c=bc;c<bc+L.boxW;c++) cells.push(r*n+c);
      units.push({kind:'box', cells});
    }
  return units;
}

// Cells holding a value that appears twice in some row/column/box.
function computeConflicts(){
  const conf=new Set();
  for(const u of unitList()){
    const byVal={};
    for(const p of u.cells){ const v=board[p]; if(v) (byVal[v]=byVal[v]||[]).push(p); }
    for(const v in byVal) if(byVal[v].length>1) byVal[v].forEach(p=>conf.add(p));
  }
  return conf;
}

function updateConflicts(){
  const conf=computeConflicts();
  for(let i=0;i<board.length;i++){
    const el=boardEl.children[i];
    if(el) el.classList.toggle('conflict',conf.has(i));
  }
  return conf;
}

/* ---------------- interaction ---------------- */

// Placing works in both orders: pick a symbol then stamp cells,
// or pick an empty cell then choose its symbol.
// The number always stays on the board; clashes light up red instead
// of the answer being silently rejected.
function tryPlace(i,v){
  clearHintFx();                  // the player is acting — hint served its purpose
  const el=boardEl.children[i];
  board[i]=v;
  const s=el.querySelector('.sym');
  s.textContent=symbols[v-1]; s.style.color=symColor(v);
  el.classList.remove('hole');
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  if(i===selectedCell) selectCell(-1);
  const conf=updateConflicts();
  updateTray();
  updateProgress();
  saveGame();
  if(conf.has(i)){
    streak=0;
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    setTimeout(()=>el.classList.remove('shake'),500);
    sfx('wrong'); buzz([60,40,60]);
    mascotReact('oops',900);
    return false;
  }
  streak++;
  sfx('place'); buzz(20);
  sparkleBurst(el);
  const unitDone=celebrateUnits(i);
  if(unitDone || streak%3===0){
    praiseAt(el,PRAISES[Math.floor(Math.random()*PRAISES.length)]);
    mascotReact('wow',900);
  } else {
    mascotReact('joy',700);
  }
  if(board.every((x,idx)=>x===solution[idx])) onWin();
  return true;
}

// Remove a symbol the player placed (eraser tool, or tapping a red cell).
function eraseCell(i){
  clearHintFx();
  board[i]=0;
  const el=boardEl.children[i];
  el.querySelector('.sym').textContent='';
  el.classList.add('hole');
  el.classList.remove('pop');
  praiseAt(el,'💨');
  sfx('poof'); buzz(15);
  updateConflicts();
  updateTray();
  updateProgress();
  saveGame();
  if(!selectedVal && !eraserOn) selectCell(i);   // ready to drop a new symbol right in
}

// Tap any filled cell: light up all of its twins for a moment —
// the classic "where are the other 3s?" move from big sudoku apps.
let flashTimer=null;
function flashMatches(v){
  clearTimeout(flashTimer);
  boardEl.querySelectorAll('.flashm').forEach(el=>el.classList.remove('flashm'));
  for(let i=0;i<board.length;i++)
    if(board[i]===v) boardEl.children[i].classList.add('flashm');
  flashTimer=setTimeout(()=>boardEl.querySelectorAll('.flashm').forEach(el=>el.classList.remove('flashm')),1400);
}

function onTrayTap(v){
  eraserOn=false;
  const counts=new Array(L.n+1).fill(0);
  board.forEach(x=>{ if(x) counts[x]++; });
  if(counts[v]>=L.n){ updateTray(); return; }
  if(selectedCell>=0){            // slot-first mode: fill the chosen cell
    tryPlace(selectedCell,v);
    return;
  }
  selectedVal = (selectedVal===v) ? 0 : v;
  sfx('tap');
  updateTray();
}

function onEraserTap(){
  eraserOn=!eraserOn;
  selectedVal=0;
  selectCell(-1);
  sfx('tap');
  updateTray();
}

function onCellTap(i,el){
  if(solvedFlag) return;
  const given=puzzle[i]!==0;
  if(eraserOn){
    if(!given && board[i]!==0){ eraseCell(i); }
    else {                        // can't erase clues or empty spots — gentle "no"
      el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
      setTimeout(()=>el.classList.remove('shake'),450);
      sfx('no');
    }
    return;
  }
  if(board[i]!==0){
    // a red clashing symbol pops right out; any other filled cell —
    // clue or player-placed — shows its twins
    if(!given && el.classList.contains('conflict')){ eraseCell(i); return; }
    flashMatches(board[i]);
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    sfx('tap');
    return;
  }
  if(selectedVal){                // stamp mode: place the chosen symbol
    tryPlace(i,selectedVal);
    return;
  }
  // slot-first mode: highlight this cell, next tray tap fills it
  selectCell(i===selectedCell?-1:i);
  sfx('tap');
}

/* ============================================================
   HINTS v3 — guided, user-paced walkthroughs.
   One deductive engine produces every explanation; the UI walks the
   derivation step by step with a consistent visual language:
     blue band     = the row / column / box we are talking about
     green squares = evidence (the placed numbers doing the blocking)
     arrows        = who blocks whom
     crossed digit = "this value cannot go here"
     gold square   = the answer spot (and the tray pulses the value)
   Everything not part of the step dims out. The player taps
   "Next" through the steps — nothing ever auto-advances.
   ============================================================ */

let hintTimers=[];
let hintStory=null, hintStep=0;
function hintActive(){ return !!hintStory; }

function clearHintFx(){
  hintTimers.forEach(clearTimeout);
  hintTimers=[];
  hintStory=null; hintStep=0;
  $('hint-bubble').classList.remove('show');
  const svg=$('hint-arrows'); if(svg){ svg.style.display='none'; svg.innerHTML=''; }
  boardEl.querySelectorAll('.dim,.band,.ev,.goal,.explain,.hintwrong').forEach(el=>el.classList.remove('dim','band','ev','goal','explain','hintwrong'));
  boardEl.querySelectorAll('.cands').forEach(el=>el.remove());
  trayEl.querySelectorAll('.hintpulse').forEach(el=>el.classList.remove('hintpulse'));
}

/* ---------------- board-reading helpers (pure logic) ---------------- */

// candidates for cell i on an arbitrary grid g
function candList(g,i){
  const n=L.n, r=Math.floor(i/n), c=i%n, out=[];
  for(let v=1;v<=n;v++) if(placeOk(g,r,c,v,L)) out.push(v);
  return out;
}
// a filled peer of i (row/col/box) holding value u — the reason u is blocked at i
function blockerFor(g,i,u){
  for(const [kind,cells] of unitsOf(i))
    for(const p of cells) if(p!==i && g[p]===u) return {cell:p, kind};
  return null;
}
// the three units cell i belongs to, as [kindName, cells[]]
function unitsOf(i){
  const n=L.n, r=Math.floor(i/n), c=i%n;
  const row=[...Array(n).keys()].map(k=>r*n+k);
  const col=[...Array(n).keys()].map(k=>k*n+c);
  const br=Math.floor(r/L.boxH)*L.boxH, bc=Math.floor(c/L.boxW)*L.boxW, box=[];
  for(let rr=br;rr<br+L.boxH;rr++) for(let cc=bc;cc<bc+L.boxW;cc++) box.push(rr*n+cc);
  return [['row',row],['column',col],['little square',box]];
}
// a same-valued neighbour that makes v at i a visible duplicate
function conflictPartner(i,v){
  for(const [kind,cells] of unitsOf(i))
    for(const j of cells) if(j!==i && board[j]===v) return {j, kind, cells};
  return null;
}

// naked single on the live grid, with the blockers as evidence
function findNaked(g, only){
  const list = only!=null ? [only] : [...Array(g.length).keys()];
  for(const i of list){
    if(g[i]!==0) continue;
    const cand=candList(g,i);
    if(cand.length===1){
      const W=cand[0], blockers=[];
      for(let u=1;u<=L.n;u++){ if(u===W) continue; const b=blockerFor(g,i,u); if(b) blockers.push({value:u, cell:b.cell, kind:b.kind}); }
      return {tech:'naked', cell:i, value:W, blockers};
    }
  }
  return null;
}
// hidden single on the live grid, with per-cell blockers as evidence
function findHidden(g, only){
  for(const u of unitList()){
    for(let W=1;W<=L.n;W++){
      if(u.cells.some(p=>g[p]===W)) continue;
      const spots=u.cells.filter(p=>g[p]===0 && placeOk(g,Math.floor(p/L.n),p%L.n,W,L));
      if(spots.length!==1) continue;
      const i=spots[0];
      if(only!=null && i!==only) continue;
      const blocks=[];
      for(const p of u.cells){ if(p===i||g[p]!==0) continue; const b=blockerFor(g,p,W); if(b) blocks.push({cell:p, byCell:b.cell}); }
      return {tech:'hidden', cell:i, value:W, unitKind:u.kind, unitCells:u.cells, blocks};
    }
  }
  return null;
}
// the simplest obvious step (fewest things to point at)
function findStep(g, only){
  const nk=findNaked(g, only), hd=findHidden(g, only);
  if(nk && hd) return (nk.blockers.length <= hd.blocks.length) ? nk : hd;
  return nk || hd;
}

// is cell i a naked or hidden single under candidate grid `cand`?
function singleAt(cand, i, ctx){
  if(bitcount(cand[i])===1) return {tech:'naked single', cell:i, value:bitsOf(cand[i])[0]};
  for(const u of ctx.units){
    if(!u.cells.includes(i)) continue;
    for(const v of bitsOf(cand[i])){
      const b=1<<(v-1);
      let only=true;
      for(const p of u.cells){ if(p!==i && (cand[p]&b)){ only=false; break; } }
      if(only) return {tech:'hidden single', cell:i, value:v, unitKind:u.kind, unitCells:u.cells};
    }
  }
  return null;
}

/* Which candidates a deduction's premise assumes are ALREADY gone — as
   {cell,value} pairs. A technique only works because certain squares can no
   longer take certain numbers; if one of those was ruled out by an earlier
   trick rather than by a number the player can see on the board, that earlier
   trick has to be told too, or the hint asserts something out of thin air
   ("every other empty square here is already ruled out for 7" — says who?). */
const CHAIN_MAX=6;   // keep even a Legend walkthrough finite
function premiseNeeds(d, g){
  const out=[], n=L.n;
  const add=(cell,value)=>{ if(g[cell]===0) out.push({cell,value}); };
  const pat=new Set(d.patternCells||[]);
  switch(d.tech){
    // v fits nowhere else in the home unit
    case 'pointing':
      for(const p of d.boxCells) if(!pat.has(p)) add(p, d.value);
      break;
    case 'claiming':
      for(const p of d.lineCells) if(!pat.has(p)) add(p, d.value);
      break;
    // each pattern cell holds ONLY the pair's/triple's values
    case 'naked pair': case 'naked triple':
      for(const p of d.patternCells)
        for(let v=1;v<=n;v++) if(!d.values.includes(v)) add(p, v);
      break;
    // the pair's/triple's values appear nowhere else in the unit
    case 'hidden pair': case 'hidden triple':
      for(const p of d.unitCells) if(!pat.has(p)) for(const v of d.values) add(p, v);
      break;
    // in each base line, v sits in only the two pattern spots
    case 'X-Wing': {
      const rowMode=d.unitKind==='row';
      const base=[...new Set(d.patternCells.map(c=>rowMode?Math.floor(c/n):c%n))];
      for(const i of base)
        for(const p of (rowMode?rowCellsOf(i):colCellsOf(i))) if(!pat.has(p)) add(p, d.value);
      break;
    }
    // each of the three cells is down to exactly two choices
    case 'XY-Wing':
      for(const p of d.patternCells){
        const m=d.candBefore[p];
        for(let v=1;v<=n;v++) if(!(m&(1<<(v-1)))) add(p, v);
      }
      break;
  }
  return out;
}

// The derivation of the next placement (wantCell=null) or of a specific
// square, as { place, enablers[], cand } — enablers are the advanced
// eliminations (from the solver trace) that unlock the placement, closed
// transitively so every crossed-out number in the story has a reason on
// screen: either a number the player can see, or an earlier beat.
function chainAt(g, wantCell){
  const r=solve(g,L);
  const fp=r.trace.findIndex(d=>d.kind==='place');
  const preElims=(fp<0?r.trace:r.trace.slice(0,fp)).filter(d=>d.kind==='elim');
  const cand = fp>=0 ? r.trace[fp].candBefore : (r.trace.length ? r.state.cand : computeCands(g,r.ctx));
  const build=place=>{
    if(place.tech==='naked single' && !place.unitCells){
      // give naked singles their units too (for banding)
      place.unitCells=null;
    }
    const enablers=[], have=new Set();
    const push=d=>{ if(!have.has(d)){ have.add(d); enablers.push(d); } };
    for(const d of preElims){
      const rel = place.tech==='naked single'
        ? d.elims.some(e=>e.cell===place.cell)
        : d.elims.some(e=>e.value===place.value && place.unitCells.includes(e.cell));
      if(rel) push(d);
    }
    // Pull in whatever justifies each enabler's premise (and then theirs, ...).
    // A premise candidate blocked by a visible number needs no beat — the hint
    // draws an arrow to it. Anything else must come from an earlier elimination.
    for(let i=0;i<enablers.length && enablers.length<CHAIN_MAX;i++){
      for(const need of premiseNeeds(enablers[i], g)){
        if(blockerFor(g, need.cell, need.value)) continue;
        const src=preElims.find(e=>e.elims.some(x=>x.cell===need.cell && x.value===need.value));
        if(src) push(src);
      }
    }
    enablers.sort((a,b)=>preElims.indexOf(a)-preElims.indexOf(b));
    return { place, enablers, cand };
  };
  if(wantCell!=null){
    const place=singleAt(cand, wantCell, r.ctx);
    return place ? build(place) : null;
  }
  if(fp<0) return null;
  // Once the eliminations are in, several squares are usually crackable — and
  // now that a chain carries its own justifications it can get long. Walk the
  // one with the shortest honest derivation, so the child taps Next as few
  // times as possible for the same amount of truth.
  let best=null;
  for(let i=0;i<g.length;i++){
    if(g[i]!==0) continue;
    const p=singleAt(cand, i, r.ctx);
    if(!p) continue;
    const c=build(p);
    if(!best || c.enablers.length<best.enablers.length) best=c;
    if(best.enablers.length<=1) break;
  }
  return best || build(r.trace[fp]);
}

/* ---------------- words ---------------- */

function PIECE(){ return isClassic?'number':'friend'; }
function aSym(v){ return (isClassic && v===8 ? 'an ' : 'a ')+symTag(v); }
function listSyms(vals){ return vals.map(symTag).join(', '); }
function joinAnd(parts){
  parts=parts.filter(Boolean);
  if(parts.length<=1) return parts[0]||'';
  return parts.slice(0,-1).join(', ')+' and '+parts[parts.length-1];
}
function joinOr(parts){
  parts=parts.filter(Boolean);
  if(parts.length<=1) return parts[0]||'';
  return parts.slice(0,-1).join(', ')+' or '+parts[parts.length-1];
}
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function uname(kind){ return kind==='little square' ? 'box' : (kind||'row'); }
// "its row already has 1 and 4, and its box has 3"
function takenAround(blockers){
  const by={row:[], column:[], 'little square':[]};
  blockers.forEach(b=> by[b.kind].push(b.value));
  const parts=[];
  if(by.row.length) parts.push('its row already has '+listSyms(by.row));
  if(by.column.length) parts.push('its column has '+listSyms(by.column));
  if(by['little square'].length) parts.push('its box has '+listSyms(by['little square']));
  return joinAnd(parts);
}

/* ---------------- step visuals ---------------- */

// crossed-out / focused mini-digits inside a cell
function markHtml(items){
  const spans=items.map(it=>{
    const cls=it.cross?'crossed':(it.focus?'focus':'');
    return '<span'+(cls?' class="'+cls+'"':'')+'>'+it.v+'</span>';
  }).join('');
  return '<div class="cands'+(items.length>2?' multi':'')+'">'+spans+'</div>';
}
function setMarks(cell, items){
  const el=boardEl.children[cell]; if(!el) return;
  const old=el.querySelector('.cands'); if(old) old.remove();
  el.insertAdjacentHTML('beforeend', markHtml(items));
}
function groupElims(elims){
  const by={};
  for(const e of elims) (by[e.cell]=by[e.cell]||[]).push(e.value);
  return Object.keys(by).map(c=>({cell:+c, values:by[c]}));
}

function drawArrows(pairs){
  const svg=$('hint-arrows'); if(!svg) return;
  let out='<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4f8b"/></marker></defs>';
  for(const [a,b] of pairs){
    const ea=boardEl.children[a], eb=boardEl.children[b];
    if(!ea||!eb) continue;
    const ra=ea.getBoundingClientRect(), rb=eb.getBoundingClientRect();
    const ax=ra.left+ra.width/2, ay=ra.top+ra.height/2;
    const bx=rb.left+rb.width/2, by=rb.top+rb.height/2;
    const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy)||1;
    const off=ra.width*0.45;
    out+='<line x1="'+(ax+dx/len*off)+'" y1="'+(ay+dy/len*off)+'" x2="'+(bx-dx/len*off)+'" y2="'+(by-dy/len*off)+
      '" stroke="#ff4f8b" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" opacity=".9"/>';
  }
  svg.innerHTML=out; svg.style.display='block';
}

/* A step: { text, band[], ev[], wrongRing[], cross[{cell,values}],
   focus[{cell,values}], arrows[[from,to]], target, goal, pulse, dim }
   goal = the destination square of the whole chain, shown as a faint gold
