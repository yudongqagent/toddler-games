<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Fun educational games for toddlers - numbers, colors, shapes, animals, balloons, memory">
  <meta name="theme-color" content="#667eea">
  <title>Toddler Games 🎮</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container { width: 100vw; height: 100vh; }
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      z-index: 9999;
      transition: opacity 0.5s, visibility 0.5s;
    }
    #loading.hidden { opacity: 0; visibility: hidden; }
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { margin-top: 20px; font-size: 18px; }
    .loading-progress { margin-top: 10px; font-size: 14px; opacity: 0.8; }
  </style>
  <script type="module" crossorigin src="/toddler-games/assets/index-BuS7FOUS.js"></script>
  <link rel="modulepreload" crossorigin href="/toddler-games/assets/rolldown-runtime-BSR9aOTk.js">
  <link rel="modulepreload" crossorigin href="/toddler-games/assets/phaser-C1kYwfq1.js">
</head>
<body>
  <div id="loading" aria-busy="true" aria-label="Loading game">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading Toddler Games...</div>
    <div class="loading-progress" id="loadProgress">0%</div>
  </div>
  <div id="game-container"></div>
  <div id="start-prompt" role="button" tabindex="0" aria-label="Start game">Tap to Start</div>
</body>
