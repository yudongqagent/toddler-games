<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Toddler Games - Educational games for young children">
  <meta name="theme-color" content="#7c3aed">
  <title>Toddler Games 🎮</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #game-container { width: 100%; max-width: 800px; height: 600px; }
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #loading-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text { color: white; font-size: 1.5rem; font-weight: 600; margin-bottom: 10px; }
    #loading-progress { color: rgba(255,255,255,0.8); font-size: 2rem; font-weight: 700; }
    #start-prompt {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50px;
      padding: 16px 40px;
      color: white;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      z-index: 1001;
      display: none;
      transition: background 0.2s, transform 0.1s;
    }
    #start-prompt:hover { background: rgba(255,255,255,0.3); }
    #start-prompt:active { transform: translateX(-50%) scale(0.98); }
    #start-prompt.visible { display: block; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Loading Toddler Games...</div>
    <div id="loading-progress">0%</div>
  </div>
  <button id="start-prompt">Tap to Start</button>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
