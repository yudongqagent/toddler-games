<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#7c5cff">
<title>Sudoku Fun 🐾</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐶</text></svg>">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%;
    overflow:hidden;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
    font-family:-apple-system-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", "Comic Sans MS", sans-serif;
  }
  body {
    background:linear-gradient(160deg,#9d87ff 0%,#74c3ff 45%,#7df5b9 100%);
    display:flex; flex-direction:column; align-items:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* soft drifting bubbles behind everything */
  .bub {
    position:fixed; border-radius:50%; z-index:0; pointer-events:none;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.5), rgba(255,255,255,.08) 70%);
    animation:drift ease-in-out infinite alternate;
  }
  @keyframes drift { from{transform:translate(0,0) scale(1)} to{transform:translate(4vw,-6vh) scale(1.12)} }

  .screen {
    position:absolute; inset:0; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:min(2.5vh,18px);
    padding:max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
    transition:opacity .25s, transform .25s;
  }
  .screen.hidden { opacity:0; pointer-events:none; transform:scale(.96); }

  /* ---------- MENU ---------- */
  /* scroll when the menu doesn't fit (short/landscape screens), center when it does */
  #menu { overflow-y:auto; justify-content:flex-start; }
  #menu > * { flex-shrink:0; }
  #menu > :first-child { margin-top:auto; }
  #menu > :last-child { margin-bottom:auto; }
  #menu h1 {
    font-size:clamp(30px, 8vw, 56px);
    color:#fff;
    text-shadow:0 3px 0 rgba(80,60,180,.35);
    text-align:center;
    animation:bob 2.5s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  #menu .subtitle { font-size:clamp(15px,4vw,22px); color:#ffffffdd; margin-top:-6px; }

  .style-toggle {
    display:flex; gap:0;
    background:#ffffff55;
    border-radius:999px;
    padding:5px;
    box-shadow:inset 0 1px 3px rgba(60,40,150,.15);
  }
  .style-btn {
    border:none; cursor:pointer;
    border-radius:999px;
    padding:10px 22px;
    font-family:inherit; font-weight:800;
    font-size:clamp(15px,4vw,20px);
    background:transparent; color:#ffffffcc;
    transition:background .15s, color .15s;
  }
  .style-btn.active { background:#fff; color:#5b3fd4; box-shadow:0 2px 8px rgba(0,0,0,.15); }

  .levels {
    display:grid; grid-template-columns:repeat(2, minmax(140px, 220px));
    gap:min(3vw,18px); width:min(92vw,500px);
  }
  @media (max-width:360px){ .levels{grid-template-columns:1fr;} }
  .level-btn {
    border:none; cursor:pointer;
    border-radius:26px;
    padding:min(2.6vh,20px) 10px;
    font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    box-shadow:0 6px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.55);
    transition:transform .1s;
  }
  .level-btn:active { transform:translateY(4px) scale(.97); box-shadow:0 2px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.55); }
  .level-btn .emoji { font-size:clamp(32px,8vw,50px); filter:drop-shadow(0 3px 3px rgba(0,0,0,.15)); }
  .level-btn .name { font-size:clamp(17px,4.5vw,24px); font-weight:800; color:#4a3800; }
  .level-btn .desc { font-size:clamp(12px,3vw,15px); font-weight:700; color:#4a380099; }
  .level-btn .stars { font-size:clamp(12px,3vw,16px); min-height:1.2em; letter-spacing:1px; }
  .l1{background:linear-gradient(#ffe98a,#ffd34d);} .l2{background:linear-gradient(#a8f0a2,#6fdd66);}
  .l3{background:linear-gradient(#a2d8f0,#66badd);} .l4{background:linear-gradient(#f0b5e6,#e07ad0);}

  /* ---------- GAME ---------- */
  #game { justify-content:space-between; }
  .topbar {
    width:min(94vw, 640px);
    display:flex; align-items:center; justify-content:space-between;
    gap:8px;
  }
  #level-wrap {
    flex:1; display:flex; align-items:center; justify-content:center; gap:10px;
    min-width:0;
  }
  #mascot {
    font-size:clamp(26px,7vw,38px);
    display:inline-block;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));
  }
  #mascot.bounce { animation:mascotbounce .6s; }
  @keyframes mascotbounce { 0%,100%{transform:scale(1)} 30%{transform:scale(1.35) rotate(-8deg)} 60%{transform:scale(.95) rotate(6deg)} }
  .round-btn {
    border:none; cursor:pointer;
    width:clamp(46px,11vw,58px); height:clamp(46px,11vw,58px);
    border-radius:50%;
    background:#ffffffee;
    font-size:clamp(20px,5vw,26px);
    box-shadow:0 4px 0 rgba(0,0,0,.15), inset 0 2px 0 rgba(255,255,255,.9);
    transition:transform .1s;
    font-family:inherit;
  }
  .round-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.15); }
  #level-label {
    font-size:clamp(18px,4.5vw,26px); font-weight:800; color:#fff;
    text-shadow:0 2px 0 rgba(80,60,180,.3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #board-area { display:flex; flex-direction:column; align-items:center; gap:min(2vh,14px); }
  /* the board frame doubles as the grid lines: thin gaps between cells,
     wide gaps between boxes — the sudoku box rule made visible */
  #board {
    display:grid;
    background:#b7a8ec;
    border-radius:22px;
    padding:8px;
    box-shadow:0 12px 28px rgba(60,40,150,.28), inset 0 2px 0 rgba(255,255,255,.35);
  }
  .cell {
    display:flex; align-items:center; justify-content:center;
    background:#fff;
    border-radius:18%;
    position:relative;
    cursor:pointer;
    font-weight:800;
    transition:background .15s;
  }
  .cell.alt { background:#f4efff; }
  .cell.hole { background:#e9e3fa; box-shadow:inset 0 3px 7px rgba(96,70,200,.22); }
  .cell.alt.hole { background:#e0d8f7; }
  .cell.flashm { background:#d9f6bd !important; box-shadow:inset 0 0 0 2px #9ade6d; }
  .cell.rc { background:#fff3c9; }
  .cell.match { background:#d9f6bd; box-shadow:inset 0 0 0 2px #9ade6d; }
  .cell.sel { background:#ffe063 !important; box-shadow:inset 0 0 0 3px #ffc21d; animation:selpulse 1.2s ease-in-out infinite; z-index:2; }
  @keyframes selpulse { 0%,100%{box-shadow:inset 0 0 0 3px #ffc21d} 50%{box-shadow:inset 0 0 0 5px #ffae00} }
  .cell .sym { line-height:1; pointer-events:none; }
  .cell.pop .sym { animation:pop .35s; }
  @keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.3)} 100%{transform:scale(1)} }
  .cell.wrong { animation:shake .4s; }
  .cell.wrong .sym { animation:fadeout .5s forwards; }
  .cell.shake { animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
  @keyframes fadeout { to{opacity:0; transform:scale(.3);} }
  .cell.hintglow { animation:glow 1s ease-in-out 2; }
  @keyframes glow { 0%,100%{background:#fff} 50%{background:#fff3ad} }
  .cell.conflict { background:#ffdede !important; box-shadow:inset 0 0 0 3px #ff8080; }
  .cell.conflict .sym { animation:confwob .9s ease-in-out infinite; }
  @keyframes confwob { 0%,100%{transform:rotate(-7deg)} 50%{transform:rotate(7deg)} }
  .cell.explain { background:#fff3ad !important; box-shadow:inset 0 0 0 3px #ffd34d; }
  .cell.cellwin { animation:cellwin .55s both; z-index:1; }
  @keyframes cellwin {
    0%{transform:scale(1)}
    45%{transform:scale(1.28); background:#ffe063; box-shadow:0 0 14px 2px #ffd34dcc;}
    100%{transform:scale(1)}
  }

  #pwrap {
    height:16px; border-radius:999px;
    background:#ffffff66;
    box-shadow:inset 0 2px 4px rgba(60,40,150,.2);
    position:relative;
    overflow:visible;
  }
  #pfill {
    height:100%; border-radius:999px;
    background:linear-gradient(90deg,#ffd34d,#ff9d5c);
    box-shadow:0 1px 3px rgba(0,0,0,.2);
    width:0%;
    transition:width .4s cubic-bezier(.34,1.56,.64,1);
    position:relative;
  }
  #pstar {
    position:absolute; right:-11px; top:50%;
    transform:translateY(-54%);
    font-size:22px;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));
  }

  #tray {
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:var(--tray-gap, 10px);
    padding:8px;
    max-width:96vw;
  }
  .tray-btn {
    border:none; cursor:pointer;
    width:var(--tray-size); height:var(--tray-size);
    border-radius:26%;
    background:#ffffffee;
    box-shadow:0 5px 0 rgba(0,0,0,.15), inset 0 2px 0 rgba(255,255,255,.9);
    font-size:calc(var(--tray-size) * .58);
    font-weight:800;
    line-height:1;
    transition:transform .12s, box-shadow .12s, background .12s, opacity .2s;
    font-family:inherit;
  }
  .tray-btn:active { transform:scale(.92); }
  .tray-btn { position:relative; }
  .tray-btn.selected {
    background:#ffe063;
    transform:translateY(-6px) scale(1.08);
    box-shadow:0 10px 0 rgba(0,0,0,.15), 0 0 16px 2px #ffd34d88;
  }
  .tray-btn.done { opacity:.3; transform:scale(.85); }
  /* how many of this symbol are still missing */
  .tray-btn .cnt {
    position:absolute; top:-7px; right:-7px;
    min-width:22px; height:22px; padding:0 5px;
    border-radius:999px;
    background:#7c5cff; color:#fff;
    font-size:13px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 4px rgba(0,0,0,.25);
    pointer-events:none;
  }
  .tray-btn.done .cnt { display:none; }
  .tray-btn.eraser.selected { background:#ffd0e6; box-shadow:0 10px 0 rgba(0,0,0,.15), 0 0 16px 2px #ff9ecb88; }
  .tray-btn.hintpulse { animation:traypulse .8s ease-in-out 4; }
  @keyframes traypulse {
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-9px) scale(1.12); box-shadow:0 12px 0 rgba(0,0,0,.15), 0 0 18px 4px #ffd34daa;}
  }

  /* floating praise words + sparkles */
  .praise {
    position:fixed; z-index:45; pointer-events:none;
    font-weight:800; color:#fff;
    text-shadow:0 2px 0 rgba(80,60,180,.45), 0 0 12px rgba(255,255,255,.5);
    animation:rise 1.1s forwards;
    white-space:nowrap;
  }
  @keyframes rise {
    0%{transform:translate(-50%,0) scale(.5); opacity:0}
    20%{opacity:1}
    100%{transform:translate(-50%,-70px) scale(1.2); opacity:0}
  }
  .spark {
    position:fixed; z-index:44; pointer-events:none;
    animation:sparkfly .7s forwards;
  }
  @keyframes sparkfly {
    0%{transform:translate(-50%,-50%) scale(.4); opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1); opacity:0}
  }

  /* speech bubble for hint explanations */
  #hint-bubble {
    position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 74px);
    transform:translateX(-50%) scale(.8);
    z-index:48;
    background:#fff; border-radius:18px;
    padding:10px 18px;
    font-weight:800; color:#5b3fd4;
    font-size:clamp(15px,4.2vw,21px);
    box-shadow:0 8px 24px rgba(60,40,150,.3);
    max-width:min(88vw,480px); text-align:center;
    opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s;
  }
  #hint-bubble.show { opacity:1; transform:translateX(-50%) scale(1); }
  #hint-bubble::after {
    content:''; position:absolute; left:50%; top:100%;
    transform:translateX(-50%);
    border:10px solid transparent; border-top-color:#fff;
  }

  /* ---------- WIN OVERLAY ---------- */
  #win {
    position:absolute; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:rgba(60,40,150,.45);
    backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .3s;
  }
  #win.show { opacity:1; pointer-events:auto; }
  .win-card {
    background:#fff; border-radius:30px;
    padding:28px 34px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    box-shadow:0 14px 40px rgba(0,0,0,.3);
    animation:winpop .5s;
    max-width:88vw;
  }
  @keyframes winpop { 0%{transform:scale(.4) rotate(-6deg)} 70%{transform:scale(1.1)} 100%{transform:scale(1)} }
  .win-card .big { font-size:clamp(44px,12vw,72px); }
  .win-card .msg { font-size:clamp(22px,6vw,34px); font-weight:800; color:#5b3fd4; text-align:center; }
  #win-stars { display:flex; gap:6px; min-height:1.3em; }
  #win-stars span {
    font-size:clamp(26px,7vw,40px);
    opacity:0; transform:scale(0);
    animation:starpop .45s cubic-bezier(.34,1.56,.64,1) forwards;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.2));
  }
  @keyframes starpop { to{opacity:1; transform:scale(1);} }
  .win-sub { font-size:clamp(13px,3.5vw,16px); font-weight:700; color:#5b3fd499; }
  .win-actions { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .big-btn {
    border:none; cursor:pointer;
    border-radius:20px; padding:14px 22px;
    font-size:clamp(17px,4.5vw,22px); font-weight:800;
    font-family:inherit;
    box-shadow:0 5px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.5);
    transition:transform .1s;
  }
  .big-btn:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.18); }
  .primary { background:linear-gradient(#8de78a,#54c452); color:#0d4d0c; }
  .secondary { background:linear-gradient(#c9c2ff,#a394ff); color:#2e1e7a; }

  .confetti {
    position:fixed; top:-8vh; z-index:60; pointer-events:none;
    animation:fall linear forwards;
  }
  @keyframes fall {
    to { transform:translateY(115vh) rotate(720deg); opacity:.7; }
  }
</style>
</head>
<body>

<div class="bub" style="width:34vmin;height:34vmin;left:-8vmin;top:8vh;animation-duration:14s"></div>
<div class="bub" style="width:22vmin;height:22vmin;right:-4vmin;top:30vh;animation-duration:18s;animation-delay:-6s"></div>
<div class="bub" style="width:28vmin;height:28vmin;left:12vw;bottom:-6vmin;animation-duration:16s;animation-delay:-3s"></div>
<div class="bub" style="width:16vmin;height:16vmin;right:14vw;bottom:12vh;animation-duration:12s;animation-delay:-9s"></div>

<div id="menu" class="screen">
  <h1>🐾 Sudoku Fun 🔢</h1>
  <div class="subtitle" id="subtitle">Every friend once in each row! ✨</div>
  <div class="style-toggle">
    <button class="style-btn active" id="style-animal">🐾 Animals</button>
    <button class="style-btn" id="style-classic">🔢 Numbers</button>
  </div>
  <div class="levels">
    <button class="level-btn l1" data-level="0">
      <span class="emoji" id="emoji0"></span><span class="name" id="name0"></span><span class="desc" id="desc0"></span><span class="stars" id="stars0"></span>
    </button>
    <button class="level-btn l2" data-level="1">
      <span class="emoji" id="emoji1"></span><span class="name" id="name1"></span><span class="desc" id="desc1"></span><span class="stars" id="stars1"></span>
    </button>
    <button class="level-btn l3" data-level="2">
      <span class="emoji" id="emoji2"></span><span class="name" id="name2"></span><span class="desc" id="desc2"></span><span class="stars" id="stars2"></span>
    </button>
    <button class="level-btn l4" data-level="3">
      <span class="emoji" id="emoji3"></span><span class="name" id="name3"></span><span class="desc" id="desc3"></span><span class="stars" id="stars3"></span>
    </button>
  </div>
  <button class="round-btn" id="sound-toggle" aria-label="Toggle sound">🔊</button>
</div>

<div id="game" class="screen hidden">
  <div class="topbar">
    <button class="round-btn" id="back-btn" aria-label="Back to menu">🏠</button>
    <div id="level-wrap">
      <span id="mascot">😊</span>
      <span id="level-label"></span>
    </div>

  <div id="board-area">
    <div id="board"></div>
    <div id="pwrap"><div id="pfill"><span id="pstar">⭐️</span></div></div>
  </div>

</div>

<div id="hint-bubble"></div>

<div id="win">
  <div class="win-card">
    <div class="big" id="win-big">🎉</div>
    <div class="msg" id="win-msg">Great job!</div>
    <div id="win-stars"></div>
    <div class="win-sub" id="win-sub"></div>
    <div class="win-actions">
      <button class="big-btn primary" id="again-btn">Play again 🔁</button>
      <button class="big-btn secondary" id="menu-btn">Menu 🏠</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   Sudoku Fun — picture & number sudoku for kids.
   Single file, no dependencies.
   ============================================================ */

const THEMES = [
  ['🐶','🐱','🐰','🦊','🐼','🐸'],
  ['🍎','🍌','🍇','🍓','🍊','🥝'],
  ['🚗','🚌','🚂','🚁','⛵️','🚀'],
  ['🐙','🐠','🐬','🦀','🐢','🐳'],
  ['🌸','🌻','🌈','⭐️','🍄','🦋'],
];
const DIGIT_COLORS = ['#e74c3c','#e67e22','#c9a218','#27ae60','#16a085','#2980b9','#7d3fc4','#d444a8','#8d6e63'];

// n = grid size, boxW/boxH = sub-box shape, blanks = cells removed
const LEVELS = {
  animal: [
    { name:'Tiny',     emoji:'🐣', desc:'4×4 · super easy', n:4, boxW:2, boxH:2, blanks:4  },
    { name:'Small',    emoji:'🐥', desc:'4×4 · easy',       n:4, boxW:2, boxH:2, blanks:8  },
    { name:'Big',      emoji:'🐯', desc:'6×6 · tricky',     n:6, boxW:3, boxH:2, blanks:10 },
    { name:'Giant',    emoji:'🦁', desc:'6×6 · hard',       n:6, boxW:3, boxH:2, blanks:16 },
  ],
  classic: [
    { name:'Starter',  emoji:'✏️', desc:'4×4 · easy',       n:4, boxW:2, boxH:2, blanks:8  },
    { name:'Junior',   emoji:'📗', desc:'6×6 · medium',     n:6, boxW:3, boxH:2, blanks:16 },
    { name:'Master',   emoji:'📘', desc:'9×9 · hard',       n:9, boxW:3, boxH:3, blanks:35 },
    { name:'Champion', emoji:'🏆', desc:'9×9 · expert',     n:9, boxW:3, boxH:3, blanks:48 },
  ],
};
const SUBTITLES = {
  animal:'Every friend once in each row, column & box! ✨',
  classic:'Every number once in each row, column & box! ✨',
};

const WIN_MSGS = ['Great job!','You did it!','Amazing!','Super star!','Fantastic!','Woohoo!'];
const WIN_BIGS = ['🎉','🏆','🌈','🎈','🥳'];
const PRAISES = ['Yay! 🎈','Nice! ✨','Wow! 🌟','Super! 💪','Cool! 😎','Great! 🎉'];

/* ---------------- puzzle generation ---------------- */

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function placeOk(grid,r,c,v,L){
  const n=L.n;
  for(let i=0;i<n;i++){
    if(grid[r*n+i]===v || grid[i*n+c]===v) return false;
  }
  const br=Math.floor(r/L.boxH)*L.boxH, bc=Math.floor(c/L.boxW)*L.boxW;
  for(let rr=br;rr<br+L.boxH;rr++)
    for(let cc=bc;cc<bc+L.boxW;cc++)
      if(grid[rr*n+cc]===v) return false;
  return true;
}

// Find the empty cell with fewest candidates (MRV) — keeps 9x9 search fast.
function bestCell(grid,L){
  const n=L.n;
  let bestPos=-1, bestCands=null;
  for(let p=0;p<n*n;p++){
    if(grid[p]!==0) continue;
    const r=Math.floor(p/n), c=p%n, cands=[];
    for(let v=1;v<=n;v++) if(placeOk(grid,r,c,v,L)) cands.push(v);
    if(cands.length===0) return [p,cands];
    if(!bestCands || cands.length<bestCands.length){ bestPos=p; bestCands=cands; if(cands.length===1) break; }
  }
  return [bestPos,bestCands];
}

function fillGrid(grid,L){
  const [p,cands]=bestCell(grid,L);
  if(p===-1) return true;
  if(cands.length===0) return false;
  for(const v of shuffle(cands)){
    grid[p]=v;
    if(fillGrid(grid,L)) return true;
    grid[p]=0;
  }
  return false;
}

function countSolutions(grid,L,limit){
  const [p,cands]=bestCell(grid,L);
  if(p===-1) return 1;
  if(cands.length===0) return 0;
  let count=0;
  for(const v of cands){
    grid[p]=v;
    count+=countSolutions(grid,L,limit-count);
    grid[p]=0;
    if(count>=limit) break;
  }
  return count;
}

// Returns { puzzle, solution } — puzzle has 0 for blanks, unique solution guaranteed.
function makePuzzle(L){
  const n=L.n;
  const solution=new Array(n*n).fill(0);
  fillGrid(solution,L);
  const puzzle=solution.slice();
  let removed=0;
  for(const idx of shuffle([...Array(n*n).keys()])){
    if(removed>=L.blanks) break;
    const saved=puzzle[idx];
    puzzle[idx]=0;
    if(countSolutions(puzzle.slice(),L,2)===1) removed++;
    else puzzle[idx]=saved;
  }
  return { puzzle, solution };
}

/* ---------------- sound (WebAudio, no assets) ---------------- */

let soundOn = localStorage.getItem('sudoku-sound') !== 'off';
let actx = null;
function ac(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); return actx; }
function tone(freq, t0, dur, type='sine', vol=0.18){
  const ctx=ac(), o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0, ctx.currentTime+t0);
  g.gain.linearRampToValueAtTime(vol, ctx.currentTime+t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+t0+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(ctx.currentTime+t0); o.stop(ctx.currentTime+t0+dur+0.05);
}
function sfx(name){
  if(!soundOn) return;
  try{
    if(name==='tap')   tone(520,0,.08,'triangle',.12);
    if(name==='place'){
      // pitch climbs with the streak — little wins feel bigger and bigger
      const base=600*(1+0.06*Math.min(streak,6));
      tone(base,0,.09,'triangle'); tone(base*1.35,.07,.12,'triangle');
    }
    if(name==='wrong'){ tone(220,0,.15,'sine',.1); tone(180,.12,.2,'sine',.1); }
    if(name==='hint') { tone(880,0,.08,'sine',.12); tone(1100,.08,.1,'sine',.12); }
    if(name==='poof') { tone(320,0,.08,'triangle',.12); tone(200,.05,.14,'sine',.1); }
    if(name==='no')   { tone(240,0,.12,'sine',.09); }
    if(name==='unit') { [659,880,1175].forEach((f,i)=>tone(f,i*.08,.14,'triangle',.15)); }
    if(name==='win')  { [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.12,.25,'triangle',.16)); }
  }catch(e){}
}
function buzz(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

/* ---------------- state ---------------- */

let styleKey = localStorage.getItem('sudoku-style')==='classic' ? 'classic' : 'animal';
let levelIdx=0, L=LEVELS[styleKey][0];
let isClassic=false;
let puzzle=[], solution=[], board=[];   // board = current player state
let symbols=[];                          // display strings for values 1..n
let selectedVal=0;                       // selected tray symbol (0 = none) — "stamp" mode
let selectedCell=-1;                     // selected empty cell (-1 = none) — "slot first" mode
let eraserOn=false;                      // eraser tool selected
let solvedFlag=false;
let streak=0;                            // consecutive correct placements

const $=id=>document.getElementById(id);
const boardEl=$('board'), trayEl=$('tray');

/* stars: { animal:[0,0,0,0], classic:[0,0,0,0] } (migrates old flat-array format) */
function stars(){
  try{
    const raw=JSON.parse(localStorage.getItem('sudoku-stars')||'null');
    if(Array.isArray(raw)) return { animal:raw, classic:[0,0,0,0] };
    if(raw && raw.animal) return raw;
  }catch(e){}
  return { animal:[0,0,0,0], classic:[0,0,0,0] };
}
function addStar(){
  const s=stars();
  s[styleKey][levelIdx]=Math.min(s[styleKey][levelIdx]+1,5);
  localStorage.setItem('sudoku-stars',JSON.stringify(s));

/* ---------------- rendering ---------------- */

function renderMenu(){
  const s=stars();
  $('subtitle').textContent=SUBTITLES[styleKey];
  $('style-animal').classList.toggle('active',styleKey==='animal');
  $('style-classic').classList.toggle('active',styleKey==='classic');

    $('stars'+i).textContent='⭐️'.repeat(s[styleKey][i]);
  });

function layoutSizes(){
  const n=L.n;
  const vw=Math.min(window.innerWidth, document.documentElement.clientWidth||1e9);
  const vh=window.innerHeight;
  // Board must fit width and leave room for topbar + progress + tray.
  const trayRows = n>6 && vw<560 ? 2 : 1;
  const boardMax=Math.min(vw*0.94, vh*(trayRows===2?0.54:0.6), 620);
  const gap = n===9?2:3;                 // thin line between cells
  const bgap = n===9?6:8;                // thick line between boxes
  const sx=n/L.boxW-1, sy=n/L.boxH-1;    // box separators per axis
  const cell=Math.min(
    Math.floor((boardMax-16-sx*bgap-(n+sx-1)*gap)/n),
    Math.floor((boardMax-16-sy*bgap-(n+sy-1)*gap)/n));
  const tgap=Math.min(vw*0.02, 12);
  const perRow=Math.ceil((n+1)/trayRows);   // +1 for the eraser
  const ts=Math.min(Math.floor((vw*0.94-16-tgap*(perRow-1))/perRow), 84);
  document.documentElement.style.setProperty('--tray-size', ts+'px');
  document.documentElement.style.setProperty('--tray-gap', tgap+'px');
  return {cell, gap, bgap, sx};
}

function symColor(v){ return isClassic ? DIGIT_COLORS[(v-1)%DIGIT_COLORS.length] : ''; }
function boxOf(i){ const n=L.n,r=Math.floor(i/n),c=i%n; return Math.floor(r/L.boxH)*100+Math.floor(c/L.boxW); }

function renderBoard(){
  const n=L.n, {cell,gap,bgap,sx}=layoutSizes();
  // spacer tracks between boxes render as thick lines of the board color
  const colTracks=[], rowTracks=[];
  for(let c=0;c<n;c++){ if(c>0&&c%L.boxW===0) colTracks.push(bgap+'px'); colTracks.push(cell+'px'); }
  for(let r=0;r<n;r++){ if(r>0&&r%L.boxH===0) rowTracks.push(bgap+'px'); rowTracks.push(cell+'px'); }
  boardEl.style.gridTemplateColumns=colTracks.join(' ');
  boardEl.style.gridTemplateRows=rowTracks.join(' ');
  boardEl.style.gap=gap+'px';
  boardEl.innerHTML='';
  for(let i=0;i<n*n;i++){
    const r=Math.floor(i/n), c=i%n;
    const d=document.createElement('div');
    const altBox=(Math.floor(r/L.boxH)+Math.floor(c/L.boxW))%2===1;
    d.className='cell'+(altBox?' alt':'')+(board[i]===0?' hole':'')+(i===selectedCell?' sel':'');
    d.style.gridColumn=c+Math.floor(c/L.boxW)+1;
    d.style.gridRow=r+Math.floor(r/L.boxH)+1;
    d.style.width=d.style.height=cell+'px';
    d.style.fontSize=Math.floor(cell*0.62)+'px';
    const s=document.createElement('span');
    s.className='sym';
    if(board[i]){ s.textContent=symbols[board[i]-1]; s.style.color=symColor(board[i]); }
    d.appendChild(s);
    d.addEventListener('click',()=>onCellTap(i,d));
    boardEl.appendChild(d);
  }
  const boardW=cell*n+sx*bgap+(n+sx-1)*gap+16;
  $('pwrap').style.width=boardW+'px';
  updateHighlights();
  updateConflicts();
  updateProgress();
}

function renderTray(){
  trayEl.innerHTML='';
  for(let v=1;v<=L.n;v++){
    const b=document.createElement('button');
    b.className='tray-btn';
    const t=document.createElement('span');
    t.textContent=symbols[v-1];
    t.style.color=symColor(v);
    b.appendChild(t);
    const cnt=document.createElement('span');
    cnt.className='cnt';
    b.appendChild(cnt);
    b.dataset.val=v;
    b.addEventListener('click',e=>{ e.preventDefault(); onTrayTap(v); });
    trayEl.appendChild(b);
  }
  const er=document.createElement('button');
  er.className='tray-btn eraser';
  er.textContent='🧽';
  er.setAttribute('aria-label','Eraser');
  er.addEventListener('click',e=>{ e.preventDefault(); onEraserTap(); });
  trayEl.appendChild(er);
  updateTray();
}

function updateTray(){
  const counts=new Array(L.n+1).fill(0);
  board.forEach(v=>{ if(v) counts[v]++; });
  trayEl.querySelectorAll('.tray-btn').forEach(b=>{
    if(b.classList.contains('eraser')){ b.classList.toggle('selected',eraserOn); return; }
    const v=+b.dataset.val;
    const done=counts[v]>=L.n;
    b.classList.toggle('done',done);
    b.classList.toggle('selected',v===selectedVal && !done);
    b.querySelector('.cnt').textContent=Math.max(0,L.n-counts[v]);
    if(done && selectedVal===v) selectedVal=0;
  });
  updateHighlights();
}

/* soft guidance: tint the selected cell's row/col/box, and glow cells
   that already hold the selected symbol */
function updateHighlights(){
  const n=L.n;
  const selR=selectedCell>=0?Math.floor(selectedCell/n):-1;
  const selC=selectedCell>=0?selectedCell%n:-1;
  const selB=selectedCell>=0?boxOf(selectedCell):-1;
  for(let i=0;i<n*n;i++){
    const el=boardEl.children[i];
    if(!el) return;
    const r=Math.floor(i/n), c=i%n;
    el.classList.toggle('rc', selectedCell>=0 && i!==selectedCell &&
      (r===selR || c===selC || boxOf(i)===selB));
    el.classList.toggle('match', selectedVal>0 && board[i]===selectedVal);
  }
}

function updateProgress(){
  const total=board.length||1;
  const filled=board.filter(v=>v>0).length;
  $('pfill').style.width=Math.round(100*filled/total)+'%';
}

function selectCell(i){
  if(selectedCell>=0 && boardEl.children[selectedCell]) boardEl.children[selectedCell].classList.remove('sel');
  selectedCell=i;
  if(i>=0) boardEl.children[i].classList.add('sel');
  updateHighlights();
}

/* ---------------- juicy feedback ---------------- */

let mascotTimer=null;
function mascotReact(emo,ms){
  const m=$('mascot');
  m.textContent=emo;
  m.classList.remove('bounce'); void m.offsetWidth; m.classList.add('bounce');
  clearTimeout(mascotTimer);
  if(ms) mascotTimer=setTimeout(()=>{ m.textContent='😊'; },ms);
}

function sparkleBurst(el){
  const rect=el.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  const EMO=['✨','⭐️','🌟'];

    s.style.setProperty('--dx',Math.cos(ang)*dist+'px');
    s.style.setProperty('--dy',Math.sin(ang)*dist+'px');

function praiseAt(el,text){

  document.body.appendChild(p);

// When a row, column, or box gets completed, its cells do a golden wave.
function celebrateUnits(i){
  const n=L.n, r=Math.floor(i/n), c=i%n;
  const units=[];
  const rowCells=[...Array(n).keys()].map(k=>r*n+k);
  const colCells=[...Array(n).keys()].map(k=>k*n+c);
  const br=Math.floor(r/L.boxH)*L.boxH, bc=Math.floor(c/L.boxW)*L.boxW;
  const boxCells=[];
  for(let rr=br;rr<br+L.boxH;rr++) for(let cc=bc;cc<bc+L.boxW;cc++) boxCells.push(rr*n+cc);
  for(const cells of [rowCells,colCells,boxCells]){
    if(cells.every(p=>board[p]===solution[p])) units.push(cells);
  }
  if(!units.length) return false;
  const seen=new Set();
  let k=0;
  for(const cells of units){
    for(const p of cells){
      if(seen.has(p)) continue;
      seen.add(p);
      const el=boardEl.children[p];
      el.style.animationDelay=(k*40)+'ms';
      el.classList.remove('cellwin'); void el.offsetWidth; el.classList.add('cellwin');
      k++;
    }
  }
  setTimeout(()=>{ seen.forEach(p=>{ const el=boardEl.children[p]; if(el){ el.classList.remove('cellwin'); el.style.animationDelay=''; } }); },k*40+900);
  sfx('unit'); buzz([40,30,40]);
  return true;
}

/* ---------------- conflicts ---------------- */

// All rows, columns, and boxes as {kind, cells[]}.
function unitList(){
  const n=L.n, units=[];
  for(let r=0;r<n;r++) units.push({kind:'row', cells:[...Array(n).keys()].map(c=>r*n+c)});
  for(let c=0;c<n;c++) units.push({kind:'column', cells:[...Array(n).keys()].map(r=>r*n+c)});
  for(let br=0;br<n;br+=L.boxH)
    for(let bc=0;bc<n;bc+=L.boxW){
      const cells=[];
      for(let r=br;r<br+L.boxH;r++) for(let c=bc;c<bc+L.boxW;c++) cells.push(r*n+c);
      units.push({kind:'box', cells});
    }
  return units;
}

// Cells holding a value that appears twice in some row/column/box.
function computeConflicts(){
  const conf=new Set();
  for(const u of unitList()){
    const byVal={};
    for(const p of u.cells){ const v=board[p]; if(v) (byVal[v]=byVal[v]||[]).push(p); }
    for(const v in byVal) if(byVal[v].length>1) byVal[v].forEach(p=>conf.add(p));
  }
  return conf;
}

function updateConflicts(){
  const conf=computeConflicts();
  for(let i=0;i<board.length;i++){
    const el=boardEl.children[i];
    if(el) el.classList.toggle('conflict',conf.has(i));
  }
  return conf;
}

/* ---------------- interaction ---------------- */

// Placing works in both orders: pick a symbol then stamp cells,
// or pick an empty cell then choose its symbol.
// The number always stays on the board; clashes light up red instead
// of the answer being silently rejected.
function tryPlace(i,v){
  clearHintFx();                  // the player is acting — hint served its purpose
  const el=boardEl.children[i];
  board[i]=v;
  const s=el.querySelector('.sym');
  s.textContent=symbols[v-1]; s.style.color=symColor(v);
  el.classList.remove('hole');
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  if(i===selectedCell) selectCell(-1);
  const conf=updateConflicts();
  updateTray();
  updateProgress();
  if(conf.has(i)){
    streak=0;
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    setTimeout(()=>el.classList.remove('shake'),500);
    sfx('wrong'); buzz([60,40,60]);
    mascotReact('😯',900);
    return false;
  }
  streak++;
  sfx('place'); buzz(20);
  sparkleBurst(el);
  const unitDone=celebrateUnits(i);
  if(unitDone || streak%3===0){
    praiseAt(el,PRAISES[Math.floor(Math.random()*PRAISES.length)]);
    mascotReact('🤩',900);
  } else {
    mascotReact('😄',700);
  }
  if(board.every((x,idx)=>x===solution[idx])) onWin();
  return true;
}

// Remove a symbol the player placed (eraser tool, or tapping a red cell).
function eraseCell(i){
  clearHintFx();
  board[i]=0;
  const el=boardEl.children[i];
  el.querySelector('.sym').textContent='';
  el.classList.add('hole');
  el.classList.remove('pop');
  praiseAt(el,'💨');
  sfx('poof'); buzz(15);
  updateConflicts();
  updateTray();
  updateProgress();
  if(!selectedVal && !eraserOn) selectCell(i);   // ready to drop a new symbol right in
}

// Tap any filled cell: light up all of its twins for a moment —
// the classic "where are the other 3s?" move from big sudoku apps.
let flashTimer=null;
function flashMatches(v){
  clearTimeout(flashTimer);
  boardEl.querySelectorAll('.flashm').forEach(el=>el.classList.remove('flashm'));
  for(let i=0;i<board.length;i++)
    if(board[i]===v) boardEl.children[i].classList.add('flashm');
  flashTimer=setTimeout(()=>boardEl.querySelectorAll('.flashm').forEach(el=>el.classList.remove('flashm')),1400);
}

function onTrayTap(v){
  eraserOn=false;
  const counts=new Array(L.n+1).fill(0);
  board.forEach(x=>{ if(x) counts[x]++; });
  if(counts[v]>=L.n){ updateTray(); return; }
  if(selectedCell>=0){            // slot-first mode: fill the chosen cell
    tryPlace(selectedCell,v);
    return;
  }
  selectedVal = (selectedVal===v) ? 0 : v;
  sfx('tap');
  updateTray();
}

function onEraserTap(){
  eraserOn=!eraserOn;
  selectedVal=0;
  selectCell(-1);
  sfx('tap');
  updateTray();
}

function onCellTap(i,el){
  if(solvedFlag) return;
  const given=puzzle[i]!==0;
  if(eraserOn){
    if(!given && board[i]!==0){ eraseCell(i); }
    else {                        // can't erase clues or empty spots — gentle "no"
      el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
      setTimeout(()=>el.classList.remove('shake'),450);
      sfx('no');
    }
    return;
  }
  if(board[i]!==0){
    // a red clashing symbol pops right out; anything else shows its twins
    if(!given && el.classList.contains('conflict')){ eraseCell(i); return; }
    flashMatches(board[i]);
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    sfx('tap');
    return;
  }
  if(selectedVal){                // stamp mode: place the chosen symbol
    tryPlace(i,selectedVal);
    return;
  }
  // slot-first mode: highlight this cell, next tray tap fills it
  selectCell(i===selectedCell?-1:i);
  sfx('tap');
}

/* ---------------- hints with explanations ---------------- */

let hintTimers=[];
function clearHintFx(){
  hintTimers.forEach(clearTimeout);
  hintTimers=[];
  $('hint-bubble').classList.remove('show');
  boardEl.querySelectorAll('.explain').forEach(el=>el.classList.remove('explain'));
  trayEl.querySelectorAll('.hintpulse').forEach(el=>el.classList.remove('hintpulse'));
}
function showBubble(text,ms){
  const b=$('hint-bubble');
  b.textContent=text;
  b.classList.add('show');
  // sit just above the board so it never covers the cell it talks about
  const bt=boardEl.getBoundingClientRect().top;
  b.style.top=Math.max(8, bt-b.offsetHeight-16)+'px';
  hintTimers.push(setTimeout(()=>b.classList.remove('show'),ms||3400));
}
function highlightCells(cells,ms){
  cells.forEach(p=>{ const el=boardEl.children[p]; if(el) el.classList.add('explain'); });
  hintTimers.push(setTimeout(()=>{
    cells.forEach(p=>{ const el=boardEl.children[p]; if(el) el.classList.remove('explain'); });
  },ms||2600));
}

function candsOf(i){
  const n=L.n, r=Math.floor(i/n), c=i%n, out=[];
  for(let v=1;v<=n;v++) if(placeOk(board,r,c,v,L)) out.push(v);
  return out;
}

const KIND_NAMES={ row:'row', column:'column', box:'little square' };

// Pick the most teachable next step: fix a misplaced symbol first, then
// "last one in a unit", then "only symbol that fits", then "only spot for
// this symbol", falling back to plain magic.
function findHint(){
  for(let i=0;i<board.length;i++)
    if(puzzle[i]===0 && board[i]!==0 && board[i]!==solution[i])
      return {type:'fix', i};
  const empties=board.map((v,i)=>v===0?i:-1).filter(i=>i>=0);
  if(!empties.length) return null;
  if(selectedCell>=0 && board[selectedCell]===0){
    const i=selectedCell;
    return candsOf(i).length===1 ? {type:'single', i} : {type:'magic', i};
  }
  for(const u of unitList()){
    const em=u.cells.filter(p=>board[p]===0);
    if(em.length===1) return {type:'last', i:em[0], kind:u.kind, cells:u.cells};
  }
  for(const i of empties)
    if(candsOf(i).length===1) return {type:'single', i};
  for(const u of unitList()){
    const have=new Set(u.cells.map(p=>board[p]).filter(v=>v));
    for(let v=1;v<=L.n;v++){
      if(have.has(v)) continue;
      const spots=u.cells.filter(p=>board[p]===0 && placeOk(board,Math.floor(p/L.n),p%L.n,v,L));
      if(spots.length===1) return {type:'only', i:spots[0], kind:u.kind, cells:u.cells};
    }
  }
  return {type:'magic', i:empties[Math.floor(Math.random()*empties.length)]};
}

function pulseTrayBtn(v){
  const b=trayEl.querySelector('.tray-btn[data-val="'+v+'"]');
  if(!b) return;
  b.classList.add('hintpulse');
  hintTimers.push(setTimeout(()=>b.classList.remove('hintpulse'),3300));
}

// Hints teach instead of solving: point at the reasoning, select the spot,
// pulse the right tray symbol — the player makes the move themselves.
function onHint(){
  if(solvedFlag) return;
  clearHintFx();
  const h=findHint();
  if(!h) return;
  sfx('hint');
  mascotReact('🤔',1600);
  if(h.type==='fix'){
    const sym=symbols[board[h.i]-1];
    showBubble(computeConflicts().has(h.i)
      ? 'Oops — two '+sym+' together! Tap the wiggly red '+sym+' to pop it out! 🧹'
      : 'Hmm, '+sym+' is in the wrong spot. Grab the 🧽 and tap it!',9000);
    highlightCells([h.i],9000);
    return;
  }
  const v=solution[h.i], sym=symbols[v-1];
  const kind=KIND_NAMES[h.kind]||'';
  if(h.type==='single'){
    // show the filled row/column/box friends that leave only one choice
    const n=L.n, r=Math.floor(h.i/n), c=h.i%n;
    const peers=new Set();
    for(let k=0;k<n;k++){ peers.add(r*n+k); peers.add(k*n+c); }
    const br=Math.floor(r/L.boxH)*L.boxH, bc=Math.floor(c/L.boxW)*L.boxW;
    for(let rr=br;rr<br+L.boxH;rr++) for(let cc=bc;cc<bc+L.boxW;cc++) peers.add(rr*n+cc);
    h.cells=[...peers].filter(p=>p!==h.i && board[p]>0);
  }
  const MSGS={
    last:  'Look — this '+kind+' needs just one more: '+sym+'! Tap '+sym+', then the sparkly spot!',
    single:'All the neighbors are taken, so only '+sym+' fits here. Your turn! 👉',
    only:  sym+' has only one home left in this '+kind+'. Can you put it there?',
    magic: 'Try this spot! Which friend is missing? 🤔',
  };
  showBubble(MSGS[h.type],9000);
  if(h.cells) highlightCells(h.cells.filter(p=>p!==h.i),6000);
  selectCell(h.i);                 // sparkly target — next tray tap fills it
  if(h.type!=='magic') pulseTrayBtn(v);
}

/* ---------------- flow ---------------- */

function newGame(idx){
  levelIdx=idx; L=LEVELS[styleKey][idx];
  isClassic = styleKey==='classic';
  symbols = isClassic
    ? [...Array(L.n).keys()].map(i=>String(i+1))
    : shuffle(THEMES[Math.floor(Math.random()*THEMES.length)].slice()).slice(0,L.n);
  const p=makePuzzle(L);
  puzzle=p.puzzle; solution=p.solution;
  board=puzzle.slice();
  selectedVal=0; selectedCell=-1; eraserOn=false; solvedFlag=false; streak=0;
  clearHintFx();
  $('level-label').textContent=L.name+' '+L.emoji;
  $('mascot').textContent='😊';
  renderBoard(); renderTray();
  $('menu').classList.add('hidden');
  $('game').classList.remove('hidden');
  $('win').classList.remove('show');
}

function confettiBurst(){
  const EMO=['🎉','⭐️','🌟','💛','💚','💙','🎈','✨'];
  for(let k=0;k<46;k++){
    const s=document.createElement('span');
    s.className='confetti';
    s.textContent=EMO[Math.floor(Math.random()*EMO.length)];
    s.style.left=Math.random()*100+'vw';
    s.style.fontSize=(16+Math.random()*26)+'px';
    s.style.animationDuration=(2.2+Math.random()*2.5)+'s';
    s.style.animationDelay=(Math.random()*0.8)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),6000);
  }
}

function onWin(){
  solvedFlag=true;
  const earned=addStar();
  sfx('win'); buzz([80,60,80,60,160]);
  mascotReact('🥳');
  confettiBurst();
  $('win-big').textContent=WIN_BIGS[Math.floor(Math.random()*WIN_BIGS.length)];
  $('win-msg').textContent=WIN_MSGS[Math.floor(Math.random()*WIN_MSGS.length)];
  const ws=$('win-stars');
  ws.innerHTML='';
  for(let k=0;k<earned;k++){
    const s=document.createElement('span');
    s.textContent='⭐️';
    s.style.animationDelay=(0.9+k*0.25)+'s';
    ws.appendChild(s);
  }
  $('win-sub').textContent=earned>=5?'All 5 stars! You are a champion!':(L.name+' stars: '+earned+' of 5');
  setTimeout(()=>$('win').classList.add('show'),700);
}

function toMenu(){
  clearHintFx();
  renderMenu();
  $('game').classList.add('hidden');
  $('win').classList.remove('show');
  $('menu').classList.remove('hidden');
}

function setStyle(key){
  styleKey=key;
  localStorage.setItem('sudoku-style',key);
  sfx('tap');
  renderMenu();
}

/* ---------------- wire up ---------------- */

document.querySelectorAll('.level-btn').forEach(b=>{
  b.addEventListener('click',()=>{ sfx('tap'); newGame(+b.dataset.level); });
});
$('style-animal').addEventListener('click',()=>setStyle('animal'));
$('style-classic').addEventListener('click',()=>setStyle('classic'));
$('back-btn').addEventListener('click',()=>{ sfx('tap'); toMenu(); });
$('menu-btn').addEventListener('click',()=>{ sfx('tap'); toMenu(); });
$('hint-btn').addEventListener('click',onHint);
$('again-btn').addEventListener('click',()=>{ sfx('tap'); newGame(levelIdx); });
$('sound-toggle').addEventListener('click',()=>{
  soundOn=!soundOn;
  localStorage.setItem('sudoku-sound',soundOn?'on':'off');
  $('sound-toggle').textContent=soundOn?'🔊':'🔇';
  sfx('tap');
});
$('sound-toggle').textContent=soundOn?'🔊':'🔇';

window.addEventListener('resize',()=>{ if(!$('game').classList.contains('hidden')) { renderBoard(); } });
// block pinch zoom on iOS (double-tap zoom is disabled via touch-action:manipulation)
document.addEventListener('gesturestart',e=>e.preventDefault());

renderMenu();
</script>
